                    11: `<b>11 дом (Водолей) — Свободное дружеское взаимодействие</b><br>В кругу единомышленников человек выступает как абсолютно понятный товарищ. Он не строит из себя гуру или сноба. Для него все друзья равны. Он спокойно наблюдает за общим потоком (Уэйт) и легко, без стеснения вливается в любые коллективные активности (Манара), демонстрируя свободу от ханжества и ложных условностей.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание</b><br>Сфера кармы, скрытых итогов, иллюзий и потери границ. Полная потеря адекватности. Естественный импульс человека тонет в иллюзиях. То, что казалось ему простым и понятным, приводит к непредсказуемым, часто разрушительным последствиям. Человек слепо упирается в свой жезл (Уэйт), не замечая, что почва уходит из-под ног, и продолжает пытаться примитивно использовать партнера (Манара) в ситуациях, требующих глубочайшей эмпатии и духовного слияния. Его прямолинейность здесь неуместна и приводит к тому, что он становится изгоем, так как не чувствует тонких граней чужой души.`
                }
            },
            39: {
                name: "3 Кубков",
                general: `В системе астрологического Таро Юрия Хана младший аркан <b>3 кубков (Тройка Воды)</b> относится к третьей зоне зодиакального круга (знак Близнецы, третий дом, стихия Воздуха) и управляется планетой <b>Меркурий</b>. Эта карта описывает естественное, врожденное поведение человека, но выраженное через водную стихию — сферу эмоций, состояний и комфорта.<br><br>Для составления глубокого натального портрета личности (рассматривая 3 кубков как базовую прошивку, аналог Асцендента) необходимо синтезировать три различных проявления этого аркана, которые встречаются в лекциях и практике раскладов:<br><br><b>1. Естественная, неподдельная радость и братство:</b> В прямом проявлении это искренняя способность радоваться простому общению без социальных масок, пафоса и скрытых мотивов. Это поведение по принципу «все мы люди, все мы равны», когда человек организует вокруг себя комфортную среду, не требуя от окружающих ничего, кроме искренности.<br><b>2. Тотальное погружение в свои состояния (Отдача процессу):</b> На поведенческом уровне в отношениях (особенно интимных) человек отдается не столько самому партнеру, сколько собственному эмоциональному и физическому состоянию комфорта. Он погружается в процесс, интуитивно снимая все телесные и психологические напряжения, позволяя процессу «нести» себя.<br><b>3. Неуместная простота и страх осуждения (в негативе/раскладах):</b> Если эта база искажена (в перевернутом положении или в раскладах на проблемы), естественность превращается в вульгарность или бескультурье, когда человек лезет с простыми и панибратскими реакциями туда, где требуется соблюдение субординации. Либо, наоборот, это глубокий страх того, что твое естественное эмоциональное расслабление шокирует партнера, что приводит к закомплексованности и невозможности расслабиться.<br><br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 3 кубков — это личность, чьим главным жизненным мотивом является поиск естественного эмоционального комфорта и непринужденного, радостного взаимодействия с миром. В фундаменте его психики неразрывно слиты два образа: <b>три девы, искренне и на равных поднимающие кубки в праздничном танце (по Уэйту)</b>, и <b>женщина, беззаботно и с полным доверием отдающаяся водной стихии своих эмоций (по Манаре)</b>.<br><br>Суперсила такого человека — феноменальная способность создавать атмосферу уюта, где каждый чувствует себя «своим», и умение снимать любое напряжение через простое, искреннее удовольствие (например, дружеское застолье или телесный релакс). В раскладах это часто означает ситуацию, где «нет камня за пазухой» и все идет легко. Перенесенная на натал, эта черта делает человека абсолютно понятным и эмоционально прозрачным. Однако его главная уязвимость заключается в неумении играть сложные социальные роли. Столкнувшись с жесткой иерархией, долгом или необходимостью скрывать свои чувства, он либо теряется, либо его искренняя попытка «просто порадоваться» воспринимается окружающими как грубость, пошлость и неуместное панибратство.`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br>Естественный эмоциональный старт. Человек начинает любые дела или отношения с открытым забралом и ожиданием радости. Его первичный импульс лишен агрессии; он просто предлагает миру разделить с ним позитив (Уэйт) и сразу же, без оглядки, погружается в океан новых эмоций (Манара), наивно полагая, что мир ответит ему такой же простотой.`,
                    2: `<b>2 дом (Телец)</b><br>Радостное потребление ресурсов. К материальным благам и собственному телу человек относится без накопительства, ценя их лишь как источник сиюминутного комфорта. Заработанные деньги легко тратятся на застолья и приятное времяпрепровождение в кругу своих (Уэйт), а физиологические нужды удовлетворяются с глубоким, расслабленным погружением в процесс получения удовольствия (Манара).`,
                    3: `<b>3 дом (Близнецы) — Первая обитель</b><br>Здесь базовая прошивка находится в своей идеальной, естественной среде. Человек идеально синхронизирован со своим внутренним состоянием радости и умеет транслировать его окружающим. Его повседневное общение лишено напряжения и интриг. Он легко и непринужденно создает праздник из любого рутинного контакта, объединяя людей в равное братство (девы с кубками Уэйта). Входя в интимные или дружеские отношения, он абсолютно естественно и без страха погружается в свои эмоции, позволяя себе тотально расслабиться в воде своих чувств (Манара). Это самое здоровое, незакомплексованное проживание эмоционального комфорта.`,
                    4: `<b>4 дом (Рак)</b><br>Беззаботная домашняя гавань. Семья и дом воспринимаются как единственное место, где можно полностью снять социальное напряжение. Здесь не нужно играть ролей: человек выстраивает быт как бесконечный, тихий праздник взаимного принятия (Уэйт), где он может абсолютно безопасно отдаться своим слабостям, комплексам и самым глубоким, беззащитным эмоциональным состояниям (Манара).`,
                    5: `<b>5 дом (Лев) — Падение</b><br>Сфера радости, сознательного эгоизма, творчества и игры. Паралич естественной простоты из-за желания выделиться, стать уникальным и получить личные аплодисменты. Как только человек влюбляется или пытается проявить свое творческое Эго, его естественная способность радоваться вместе со всеми (Уэйт) ломается. Ему становится мало быть «как все», он начинает требовать особого внимания. В результате он не может искренне расслабиться и отдаться своим чувствам (Манара), так как постоянно контролирует, насколько хорошо и по-царски он выглядит со стороны.`,
                    6: `<b>6 дом (Дева) — Вторая обитель</b><br>Сфера рутины, служения, здоровья и методичного выбора. Человек умеет интегрировать свою эмоциональную потребность в комфорте в повседневные рабочие процессы и быт, делая их приятными. Даже выполняя скучную работу, он находит повод для тихой, простой радости в кругу коллег (Уэйт). Свое здоровье и быт он выстраивает так, чтобы избегать физических и моральных напряжений, мягко погружаясь в рутину, как в теплую воду, и получая удовольствие от правильно организованного, комфортного процесса (Манара).`,
                    7: `<b>7 дом (Весы)</b><br>Поиск простого партнерства. Вступая в брак или заключая договоры, человек избегает сложных дипломатических схем. Он ищет в супруге прежде всего «своего парня» или подругу для совместной радости и равного общения (Уэйт). Если партнер пытается усложнить отношения претензиями, обладатель 3 кубков теряется, так как он хочет лишь одного — мирно плыть по течению чувств без напряжения и конфликтов (Манара).`,
                    8: `<b>8 дом (Скорпион)</b><br>Стихийное проживание кризиса. Столкнувшись с тяжелыми трансформациями, экстримом или чужими ресурсами, человек спасается тем, что ищет простое эмоциональное утешение. Он может пытаться снять боль через коллективное празднование (Уэйт) или же тотально, без сопротивления отдается пучине экстремальных переживаний (Манара), растворяясь в кризисе, чтобы выйти из него обновленным через катарсис.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание</b><br>Сфера идеологии, авторитетов, высшего образования и социального статуса. Острый конфликт между естественной человеческой простотой и требованиями соблюдать иерархию, пафос или сложный ритуал. Человек пытается принести свой «простой праздник» и панибратство (Уэйт) туда, где от него ждут почтения к гуру или соблюдения светского этикета. Его попытка просто расслабиться и отдаться потоку своих незамысловатых чувств (Манара) в высоком обществе воспринимается как откровенная вульгарность и невоспитанность. В негативе он сам боится проявить свою простую природу, постоянно ожидая осуждения за свою "неидеальность".`,
                    10: `<b>10 дом (Козерог)</b><br>Попытка очеловечить систему. В сфере карьеры, амбиций и жестких социальных обязательств человек совершенно не умеет быть суровым начальником или холодным функционером. Он пытается перенести атмосферу дружеского корпоратива на рабочее место (Уэйт). Столкнувшись с давлением объективной реальности, он ищет лазейки, чтобы расслабиться и плыть по течению (Манара), из-за чего часто теряет статус в глазах более жестких и амбициозных коллег.`,
                    11: `<b>11 дом (Водолей) — Экзальтация</b><br>Сфера свободы, коллективов, будущего и форс-мажоров. Высший пик проявления дружеской эмпатии и способности находить радость в абсолютной независимости и равенстве с единомышленниками. В кругу свободных людей человек становится душой компании. Он виртуозно организует коллективную радость, где стираются все социальные границы (братание по Уэйту). При столкновении с непредсказуемым будущим он не паникует, а с полным доверием ныряет в этот новый водоворот эмоций (Манара), находя в новизне источник невероятного эмоционального комфорта и обновления.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание</b><br>Сфера кармы, скрытых итогов, иллюзий и потери границ. Полная потеря адекватности в попытках найти утешение. Простое желание комфорта оборачивается погружением в иллюзии или зависимости. Столкнувшись с одиночеством или кармическим кризисом, человек пытается снять стресс самым примитивным способом (например, банально напиться с сомнительными личностями по Уэйту). Его естественное желание отдаться своим эмоциям (Манара) выходит из-под контроля, превращаясь в слепое барахтанье в болоте саможаления, где он полностью теряет связь с реальностью.`
                }
            },
            53: {
                name: "3 Мечей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>3 мечей (Тройка воздуха в Манаре)</b> относится к третьему дому гороскопа (знак Близнецов), стихии Воздуха первой (подсознательной) зоны и управляется планетой <b>Меркурий</b>. Третий дом отвечает за конкретные, естественные действия человека, его базовые навыки, коммуникацию и привычное функционирование организма, которые происходят на автоматическом уровне до вмешательства социальных программ.<br><br>Для формирования детального натального портрета (если рассматривать 3 мечей как базовую прошивку личности или Асцендент), необходимо синтезировать <b>четыре ключевые версии</b> проявления этого аркана из колод Уэйта и Манары:<br><br><b>1. Прямое и естественное действие (по Уэйту):</b> Человек действует максимально просто, эффективно и прямолинейно. Главный девиз этой карты — «просто попади в мишень». Личность делает то, что необходимо сделать, по кратчайшей траектории, без интриг, задних мыслей и лишних эмоций. В общении это кристальная откровенность: человек говорит именно то, что думает, без обиняков и сложных подтекстов.<br><b>2. Искренняя естественная скромность (по Манаре):</b> На карте Тройка воздуха изображена девушка, прикрывающая свою половую сферу. Это символизирует естественную, природную скромность, которая не продиктована социальными табу или комплексами. Человек открыт для контакта, но сохраняет свои личные границы закрытыми до момента наступления подлинной близости, после чего полностью раскрывается.<br><b>3. Скрытая инициатива и провокация (синтез Манары):</b> В контексте интимных отношений карта описывает поведение, при котором женщина не берет на себя грубую инициативу, а лишь обозначает проблему или потребность, привлекая к ней внимание. Это готовность откликнуться на действия партнера, пойти ему навстречу и мягко направить его усилия в нужное русло, чтобы процесс был естественным и комфортным.<br><b>4. Утрата базовых навыков и неадекватность (в негативе):</b> При перевернутом положении аркана человек теряет способность совершать даже самые элементарные, привычные действия (метафора: «не попадает ложкой в рот»). Естественность заменяется неадекватным, искусственным поведением, а в речи появляется неспособность ясно выразить свою мысль.`,
                houses: {
                    1: `<b>1 дом (Овен) — Прямолинейный старт</b><br>В зоне базового животного импульса человек начинает любые новые дела без раскачки. Его инициатива лишена агрессивного завоевания (свойственного Марсу), она просто технична. Он видит цель и делает первый шаг навстречу без лишних эмоций и раздумий. В знакомствах это проявляется как открытый, честный и быстрый контакт без романтических прелюдий.`,
                    2: `<b>2 дом (Телец) — Прагматичное использование естества</b><br>В сфере денег, тела и ресурсов человек использует свои природные навыки исключительно для достижения комфорта. Он не придумывает сложных схем заработка, а монетизирует то, что умеет делать легко и на автомате. К своему телу и физиологическим потребностям относится без стеснения, считая, что удовлетворение естественных нужд — это база, не требующая извинений.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель</b><br>Здесь базовая прошивка находится в своей идеальной, естественной среде. Человек максимально адекватен своей природе. Его действия точны, речь ясна, а поведение абсолютно гармонично и не вызывает отторжения у окружающих. Он общается с миром «на ты», демонстрируя здоровую откровенность без вульгарности. В отношениях не пытается произвести искусственное впечатление, а ведет себя так, как ему свойственно, и это оказывается самым правильным и привлекательным решением.`,
                    4: `<b>4 дом (Рак) — Простая домашняя безопасность</b><br>В интимном пространстве семьи и дома человек полностью сбрасывает любые маски. Для него безопасность заключается в возможности говорить с близкими максимально прямо и откровенно. Родной дом воспринимается как место, где не нужно стесняться своей природы, где можно свободно ходить без одежды и не фильтровать свою речь.`,
                    5: `<b>5 дом (Лев) — Падение</b><br>Сфера эгоизма, радости, творчества и игры. Здесь Меркурий находится в падении. Крах естественности из-за раздутого эго и желания блистать. Как только человек пытается продемонстрировать себя, влюбиться или сыграть яркую роль, его врожденная простота исчезает. Он начинает переигрывать, его действия становятся искусственными и вычурными. Попытка вести себя «просто и естественно» на публике выглядит фальшиво, так как истинный мотив здесь — привлечь к себе восхищенное внимание, что несовместимо со скромностью 3 мечей.`,
                    6: `<b>6 дом (Дева) — Вторая обитель</b><br>Сфера повседневного труда, служения, здоровья и методичного выбора. Естественные действия человека здесь осознанно оптимизируются и доводятся до уровня мастерства. Прямолинейность Близнецов трансформируется в умение совершать идеальные рутинные действия. Человек использует свою врожденную простоту для того, чтобы наладить быт, работу или вылечить тело, отбрасывая все неэффективные методы и оставляя только те инструменты, которые бьют точно в цель.`,
                    7: `<b>7 дом (Весы) — Естественность в партнерстве</b><br>В сфере брака и открытых договоров человек отказывается от сложной дипломатии. Он выстраивает отношения с супругом или деловым партнером на основе кристальной честности и ясных договоренностей. Он ожидает, что партнер будет таким же понятным и предсказуемым, предпочитая решать все семейные кризисы через прямой диалог и обсуждение фактов.`,
                    8: `<b>8 дом (Скорпион) — Техническое преодоление кризиса</b><br>Сталкиваясь с экстримом, трансформацией или опасностью, человек не впадает в панику, а действует как робот или хирург. Он отключает эмоции и выполняет четкие, выверенные спасательные действия (перевязывает рану, отрезает лишнее). В сфере глубокой сексуальности он концентрируется на физиологической точности процесса, порой игнорируя глубокий энергетический обмен.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание</b><br>Сфера мировоззрения, социальных авторитетов, согласования мнений и чужих желаний. Острый конфликт между желанием человека действовать просто и необходимостью подстраиваться под социальные нормы или партнера. Естественное поведение блокируется смущением или страхом обидеть собеседника. Человек не может сказать прямое «нет», начинает ходить вокруг да около, вынужденно переходит на «Вы» и использует сложные иносказания там, где требовалась бы элементарная прямота.`,
                    10: `<b>10 дом (Козерог) — Автоматизм в профессии</b><br>В карьере, социальной иерархии и при выполнении своих обязанностей человек функционирует как хорошо отлаженный механизм. Он не строит коварных карьерных планов, а просто делает свою работу четко, методично и точно в срок. Взаимодействие с начальством строится на передаче сухих фактов: он отчитывается о проделанных действиях без страха, но и без лишнего энтузиазма.`,
                    11: `<b>11 дом (Водолей) — Экзальтация</b><br>Сфера форс-мажоров, друзей, будущего и интеллектуальной свободы. Сверхнапряжение меркурианской энергии. Столкнувшись с шокирующими переменами или непредсказуемым поведением коллектива, человек гениально включает самую простую, голую логику. В хаосе одиннадцатого дома он умудряется отсечь все лишнее и совершить то единственное, невероятно меткое действие (или сказать точное слово), которое мгновенно разрешает ситуацию и освобождает его от чужого давления.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание</b><br>Сфера скрытых кармических итогов, изоляции и размытия границ. Полная потеря ориентации в пространстве и утрата четкости действий. Человек попадает в мутную, непонятную ситуацию, где его привычные, прямые методы (выстрел в мишень) абсолютно не работают, так как мишень скрыта в тумане. Привычная логика разрушается мистицизмом или иллюзиями, что приводит к хаотичным, нецелесообразным поступкам и неспособности ясно выразить свои потребности.`
                }
            },
            67: {
                name: "3 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>3 пентаклей (Тройка земли в колоде Манара)</b> относится к третьему дому гороскопа (знак Близнецов), который отвечает за базовые функциональные возможности, естественное поведение и повседневные контакты. Масть пентаклей (земля) переводит эту энергию в материальную плоскость: это создание конкретных форм, выбор слов, физические действия и умение облечь свою природу в правильную форму. Поскольку Тройки управляются планетой <b>Меркурий</b>, их особые положения в гороскопе строго соответствуют астрологическим достоинствам этой планеты.<br><br><b>Общая трактовка базовой прошивки (по Уэйту и Манаре) включает 4 ключевые версии:</b><br><br><b>1. Оптимальное и естественное действие (по Уэйту):</b> Это самая выгодная, наименее затратная и оптимальная форма нормального действия. Человек действует, используя ровно те ресурсы и методы, которые необходимы для достижения результата, без излишеств и перерасхода. Это трезвое выполнение инструкций (как работа мастера по чертежу инженера).<br><b>2. Абсолютная адекватность формы и слова (Синтез):</b> В плане коммуникации Тройка пентаклей означает высокую культуру языка. Человек подбирает именно те слова, смысл которых абсолютно точно и прямо отражает его идею, без вульгарности или скрытого двойного дна.<br><b>3. Разделение социального и сексуального (по Манаре):</b> На карте Тройка Земли (в Таро Манара) показано четкое разделение двух сфер: формального (внешнего) поведения в обществе и реального личного (интимного) контакта. Для культурного человека эти две вещи разделены: он умеет вести себя в обществе подобающим образом, не смешивая это с личными сексуающими отношениями, где действуют другие правила.<br><b>4. Творчество человеческой природы (по Уэйту):</b> Это способность создавать истинно «человеческие» вещи, отличающие нас от животных. Это реализация своего предназначения «по образу и подобию», когда человек вкладывает свое естество в материальный труд, создание гармоничных физических или социальных форм.`,
                houses: {
                    1: `<b>1 дом (Овен) — Базовый старт</b><br>На старте новых проектов или при первом знакомстве человек избегает агрессии. Его первый импульс — это конкретное, материальное предложение или ясное, простое слово. Он сразу демонстрирует свои базовые навыки и форму («вот что я умею, вот как я выгляжу»), закладывая фундамент для дальнейших отношений без задних мыслей.`,
                    2: `<b>2 дом (Телец) — Практичное потребление</b><br>В сфере финансов, ресурсов и физиологии человек использует свои навыки строго по назначению — для заработка и обеспечения комфорта. Он монетизирует те простые умения, которыми владеет в совершенстве. К партнеру относится прагматично, оценивая его как материальный ресурс, с которым можно выстроить понятный и взаимовыгодный быт.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель. Идеальная адекватность формы</b><br>Самое гармоничное и естественное положение для карты. Человек гениально и просто формулирует свои мысли, его слова и физические действия абсолютно точно соответствуют его природе. Он действует оптимально, не перерасходует энергию и четко разграничивает свое поведение на публике и в интимной обстановке (по Манаре). В отношениях это открытый, прямой и культурный контакт, где партнеры понимают друг друга буквально, без сложных манипуляций.`,
                    4: `<b>4 дом (Рак) — Безопасность через норму</b><br>В интимном пространстве дома и семьи человек опирается на устоявшиеся культурные и материальные традиции. Дом для него — это место, где все функционирует "как положено", где соблюдаются простые человеческие правила. Чувство безопасности возникает от того, что быт налажен оптимально, без лишних затрат и эмоциональных потрясений.`,
                    5: `<b>5 дом (Лев) — Падение. Провал естественности в игре</b><br>Сфера эгоизма, творчества, игры и влюбленности. Пытаясь продемонстрировать свою яркость, харизму или пылкие чувства, человек использует слишком сухие, заученные и шаблонные формы. Искренняя радость и флирт подменяются «рабочим» выполнением инструкций. Влюбленность выглядит скучно, так как человек не может выйти за рамки привычного поведения и пытается выстроить романтику «по чертежу», что полностью убивает страсть и праздник.`,
                    6: `<b>6 дом (Дева) — Вторая обитель. Прагматичное мастерство</b><br>Зона служения, повседневного труда и здоровья. Здесь навыки доводятся до автоматизма. Человек блестяще применяет свои практические умения в рутине. Он выступает как идеальный исполнитель, который методично, точно по чертежу (как мастер на карте Уэйта) выполняет свою работу. В отношениях это способность выстроить совместный быт и распределить материальные обязанности максимально удобным и рациональным образом.`,
                    7: `<b>7 дом (Весы) — Понятное партнерство</b><br>Вступая в брак или заключая открытые договоры, личность ожидает равноправия, основанного на прозрачности. Отношения строятся как параллельное сосуществование двух людей, где каждый четко и ясно формулирует свои материальные потребности. Здесь нет манипуляций; партнеры договариваются "словами через рот", распределяя обязанности просто и честно.`,
                    8: `<b>8 дом (Скорпион) — Техничность в кризисе</b><br>Сталкиваясь с экстримом, опасностью или глубокой трансформацией, человек отключает панику и действует как хладнокровный мастер. Он преодолевает кризис (или решает проблемы с чужими ресурсами), опираясь исключительно на свои отточенные физические навыки и строгий расчет, минимизируя потери и расходуя энергию максимально экономно.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание. Неуместная простота</b><br>Сфера мировоззрения, социальных авторитетов и глобальных целей (Юпитер). Здесь простые, базовые навыки Тройки пентаклей терпят крах. Попытка общаться с высокопоставленными людьми, начальством или авторитетными партнерами на «ты», используя слишком простые слова или примитивные формы поведения, выглядит как вульгарность и бескультурье. Человек не учитывает социальную иерархию и пытается применить банальные бытовые навыки там, где требуется сложная дипломатия или идеологический такт.`,
                    10: `<b>10 дом (Козерог) — Исполнительность в профессии</b><br>В сфере карьеры, социального статуса и взаимодействия с государственной машиной человек выступает в роли идеального, надежного винтика. Он не строит коварных планов захвата власти, а просто качественно, по четким инструкциям делает свою материальную работу. Его статус в обществе базируется на его репутации хорошего, безотказного специалиста-практика.`,
                    11: `<b>11 дом (Водолей) — Экзальтация. Гениальная точность в хаосе</b><br>Высшая точка напряжения для планеты Меркурий. В зоне форс-мажоров, свободы и непредсказуемых коллективных энергий человек умудряется проявить невероятную адаптивность. Попадая в стрессовую, нешаблонную ситуацию, он мгновенно находит самые точные, простые слова и совершает единственно верное физическое или материальное действие, которое спасает положение. Это способность оставаться абсолютно вменяемым, культурным и техничным мастером даже в эпицентре революции.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание. Утрата адекватности формы</b><br>В сфере мистики, кармы, изоляции и размытия границ конкретика земной стихии теряется. Столкнувшись с непонятной, тайной или кармической ситуацией, человек теряет способность ясно выражать свои мысли и действовать оптимально. Его привычные физические навыки и слова здесь не работают. В контексте Манары — это катастрофическое смешение социального и интимного: человек теряет культурные рамки и может вести себя публично так, как следовало бы только наедине с партнером.`
                }
            },
            26: {
                name: "4 Жезлов",
                general: `В системе астрологического Таро Юрия Хана числовые карты-четверки относятся к первой зоне (подсознание) и символизируют окончание естественных физиологических процессов, остановку действий и погружение в безопасную среду четвертого дома (знак Рака). Младший аркан <b>4 жезлов</b> описывает огненную, энергетическую сторону этого процесса.<br><br>Чтобы составить объемный натальный портрет личности (если рассматривать 4 жезлов как базовую прошивку, аналог Асцендента), необходимо выделить <b>три различных проявления этого аркана</b>, присутствующих в текстах:<br><b>1. Естественный релакс и гашение избыточной энергии.</b> Это подсознательный механизм, который принудительно останавливает активность человека, когда цикл завершен или энергия исчерпана, заставляя его отдыхать и восстанавливать силы, чтобы не «перегореть».<br><b>2. Симбиотическое слияние и взаимная «батарейка».</b> В контексте отношений это абсолютно ресурсное, спокойное состояние, где партнеры восполняют энергию друг друга одним своим присутствием, не требуя активных действий или сексуальных подвигов.<br><b>3. Инфантильное избегание и страх истощения.</b> В негативном ключе это нежелание покидать зону комфорта, патологическая боязнь растратить свои силы и попытка спрятаться от любых внешних проблем за детской позицией «я в домике».<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 4 жезлов — это личность, чьим главным жизненным мотивом является создание фундаментального, непоколебимого <b>места силы и безопасности</b>. В его психике сливаются два архетипа: с одной стороны, он стремится прочно вкопать свои огненные жезлы в землю, построив надежный каркас для отдыха после завершения трудов (по Уэйту). С другой стороны, внутри этого каркаса он выстраивает глубоко интимный, закрытый от посторонних ритуал парного взаимодействия, где он и его партнер становятся идеальными «зарядными устройствами» друг для друга (по Манаре). Его суперсила — способность инстинктивно отключаться от внешнего шума, погружаться в тотальный релакс и накапливать колоссальный резерв энергии. Однако его главная уязвимость (особенно в перевернутом виде) заключается в парализующем страхе потерять этот ресурс, что ведет к хронической лени, отказу взрослеть и попыткам спрятаться от реальной жизни в искусственном анабиозе.<br><br>Ниже представлен детальный разбор проявления этой энергетики во всех 12 домах гороскопа с обязательным указанием астрологических достоинств (особых и не особых положений), так как четверки подчиняются планете Луна (управителю Рака).`,
                houses: {
                    1: `<b>1 дом (Овен) — Не особое положение</b><br><b>Суть и специфика:</b> Базовая инициатива и жизненный импульс человека сильно приглушены. Вместо агрессивного старта (Мага), он начинает любые дела с поиска безопасного укрытия. Его личная энергия направлена не на завоевание мира, а на организацию своего интимного пространства. В отношениях он сразу позиционирует себя не как охотника, а как человека, ищущего уютную гавань и партнера-батарейку (Манара).`,
                    2: `<b>2 дом (Телец) — Экзальтация (Особое положение)</b> Сфера личных ресурсов, денег, комфорта и формы. Луна здесь экзальтирует.<br><b>Суть и специфика:</b> Гипертрофированная потребность в накоплении энергии и создании комфорта. <b>Синтез образов:</b> Человек вкладывает колоссальные усилия в то, чтобы его «место силы» было обеспечено материально. Он жадно потребляет энергию (Манара), стремясь создать из своего дома полную чашу. Идеальный праздник урожая (Уэйт) здесь воспринимается как главная жизненная цель: заработать столько, чтобы больше никогда не напрягаться.`,
                    3: `<b>3 дом (Близнецы) — Не особое положение</b><br><b>Суть и специфика:</b> В сфере общения и повседневных контактов человек избегает суеты. Он общается только с теми, кто не нарушает его энергетический баланс. Его коммуникация носит ритуальный, успокаивающий характер. Он не любит спорить; его слова — это заземленные жезлы (Уэйт), направленные на то, чтобы уладить любой конфликт и вернуть ситуацию в русло домашнего комфорта.`,
                    4: `<b>4 дом (Рак) — Первая обитель (Особое положение)</b> Здесь базовая прошивка находится в своей идеальной, естественной среде.<br><b>Суть и специфика:</b> Человек обладает идеальным механизмом саморегуляции. Его дом — это настоящая крепость и энергохранилище. Возвращаясь домой, он мгновенно отключается от рабочих проблем. <b>Синтез образов:</b> Вступая в отношения, он создает закрытый союз (венец Уэйта), где оба партнера находятся в гармоничном симбиозе (Манара). Им не нужно постоянно развлекать друг друга; достаточно просто обняться на диване, чтобы усталость ушла. В негативе — застойная энергетика, когда человек вообще отказывается выходить из дома, превращая свое логово в болото.`,
                    5: `<b>5 дом (Лев) — Второе изгнание (Особое положение)</b> Сфера радости, сознательного эгоизма, творчества и игры.<br><b>Суть и специфика:</b> Замена активного творческого горения (пятерок) на пассивное ничегонеделание. <b>Синтез образов:</b> В ситуациях, где нужно блистать, праздновать и развлекаться, человек-4 жезлов предпочитает остаться на диване. Он глушит свои сознательные порывы, пряча их глубоко в подсознание. В отношениях это партнеры, которые вместо романтических безумств и страсти предлагают лишь скучное «совместное лежание», лишая любовь искры и превращая ее в обыденный ритуал (Манара), отгораживаясь от внешнего мира частоколом (Уэйт).`,
                    6: `<b>6 дом (Дева) — Не особое положение</b><br><b>Суть и специфика:</b> В повседневном труде и рутине человек строго дозирует свои силы. Он не будет перерабатывать. Его рабочее место должно напоминать дом — с тапочками, чаем и полным отсутствием стресса. Если работа требует чрезмерной отдачи, его организм мгновенно включает психосоматическую защиту (усталость, сонливость), заставляя его остановиться и подзарядиться от внутренних резервов (Манара).`,
                    7: `<b>7 дом (Весы) — Не особое положение</b><br><b>Суть и специфика:</b> В сфере социального партнерства и открытых договоров человек ищет абсолютного покоя. Брак для него — это не светский союз, а закрытая от всех секта для двоих. Он ожидает, что партнер будет полностью разделять его ритм жизни, став его энергодонором (Манара). Конфликты здесь недопустимы: пара просто прячется за четырьмя жезлами от социума, игнорируя внешние обязательства.`,
                    8: `<b>8 дом (Скорпион) — Падение (Особое положение)</b> Сфера кризиса, экстрима и трансформации. Луна здесь падает.<br><b>Суть и специфика:</b> Абсолютный блок на необходимые жизненные изменения. Столкнувшись с кризисом, человек цепенеет и отказывается трансформироваться. <b>Синтез образов:</b> Его психологическая служба безопасности срабатывает как бетонная стена: «этого не может быть, я ничего не буду менять». Он пытается удержать старую энергетическую конструкцию (Уэйт) и старые привязанности (Манара) даже тогда, когда они уже разрушаются Скорпионом. В позитиве — это железобетонная психика, которую не может пробить ни один внешний кризис.`,
                    9: `<b>9 дом (Стрелец) — Не особое положение</b><br><b>Суть и специфика:</b> В сфере мировоззрения, идеалов и глобальных планов человек крайне консервативен. Его идеалы не выходят за пределы семейных ценностей. Он не мечтает о заграничных путешествиях или духовных подвигах; его "религия" — это культ домашнего очага. Совместное будущее с партнером он видит исключительно как бесконечное продление спокойного, симбиотического релакса.`,
                    10: `<b>10 дом (Козерог) — Первое изгнание (Особое положение)</b> Сфера карьеры, социального статуса, взрослой ответственности и суровой реальности. Луна (и четверки) здесь в изгнании.<br><b>Суть и специфика:</b> Катастрофа для профессионального роста. Сталкиваясь с тяжелыми внешними задачами (10 дом), человек инстинктивно пытается включить энергосберегающий режим. <b>Синтез образов:</b> Вместо того чтобы нести крест карьерной ответственности, человек мечтает лишь о том, как бы скорее пойти поспать или уйти на больничный. Он тащит детскую инфантильность в рабочий кабинет, заявляя: «я маленький, я ни в чем не виноват» (укрываясь под венком Уэйта). Партнерские (деловые) отношения воспринимаются не как общий труд, а как попытка найти кого-то, кто станет для него уютной «батарейкой» прямо на рабочем месте (Манара).`,
                    11: `<b>11 дом (Водолей) — Вторая обитель (Особое положение)</b> Сфера свободы, будущего и неформальных связей.<br><b>Суть и специфика:</b> Человек умудряется находить точки абсолютного спокойствия в ситуациях хаоса и свободы. <b>Синтез образов:</b> Это способность сознательно создать свою собственную базу и аксиомы в абсолютно непредсказуемой среде. Опираясь на жезлы (Уэйт), человек создает новый фундамент будущего. В отношениях (Манара) он способен стать энергоресурсом для единомышленников, не требуя при этом жесткого подчинения или ограничения их свободы.`,
                    12: `<b>12 дом (Рыбы) — Не особое положение</b><br><b>Суть и специфика:</b> В зоне скрытых итогов, тайн и кармы человек черпает свои силы. Одиночество для него — не наказание, а высший способ восстановить энергетический баланс. Он способен мистическим образом подключаться к родовым корням или коллективному бессознательному, черпая оттуда ресурсы (Манара). В негативном варианте это глубокий уход в себя, когда человек буквально хоронит свои амбиции в тайных убежищах психики, отказываясь выходить на свет.`
                }
            },
            40: {
                name: "4 Кубков",
                general: `В системе астрологического Таро Юрия Хана числовые карты-четверки относятся к первой (подсознательной) зоне, соответствуют четвертому дому гороскопа (знак Рака) и управляются планетой <b>Луна</b>. Младший аркан <b>4 кубков (Четверка воды)</b> описывает водную, эмоциональную сторону базовой потребности в безопасности, когда процесс взаимодействия с миром завершен и наступает стадия пресыщения.<br><br>Для создания глубокого натального портрета личности (если рассматривать 4 кубков как базовую прошивку, аналог Асцендента), необходимо синтезировать <b>три различных проявления этого аркана</b>, описанных в текстах лекций и практике раскладов:<br><b>1. Эмоциональное пресыщение и остановка реакций:</b> Это естественный механизм защиты психики. Человек «напился», его эмоции переполнены, и он больше не реагирует на новые раздражители, потому что его внутренний резервуар заполнен. Для него цикл завершен, «часы пробили 12», и организм требует релакса.<br><b>2. Тотальное погружение в себя и поиск изоляции:</b> Потребность спрятаться в своей интимной зоне, чтобы переварить полученный опыт. Человек сознательно отгораживается от партнера и социума, выстраивая вокруг себя невидимый эмоциональный панцирь, чтобы восстановить силы в тишине и одиночестве.<br><b>3. Инфантильная апатия и бегство от реальности (в негативе):</b> При искажении этой энергии защита превращается в тупое игнорирование шансов. Человек впадает в ступор, капризничает, отвергает любую помощь или новые предложения, предпочитая жаловаться и «бежать к маме на грудь поплакать» вместо того, чтобы начать новый жизненный этап.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 4 кубков живет ради достижения состояния абсолютного эмоционального покоя и безопасности. В его психике сливаются два архетипа. С одной стороны, это <b>человек, сидящий под деревом со скрещенными руками, который равнодушно взирает на три стоящих кубка и полностью игнорирует четвертый, протянутый ему из облака (по Уэйту)</b>. С другой стороны, это <b>женщина, которая находится в полном одиночестве, погруженная в воду собственных переживаний и отгороженная от внешнего мира (по Манаре)</b>.<br><br>Суперсила такого человека — это феноменальная психологическая устойчивость. Его психика работает как идеальный скафандр: он умеет отключаться от внешнего шума, не поддается на провокации и может найти глубокое умиротворение в самом себе, легко останавливаясь там, где другие перегорают. Однако его главная уязвимость — склонность к затяжной апатии и эмоциональной глухоте. В попытках сохранить свою «нору», он часто отказывается от даров Вселенной, упускает уникальные возможности и впадает в депрессивное безразличие, игнорируя реальных людей вокруг ради сохранения своего иллюзорного покоя.<br><br>Ниже представлен детальный разбор проявления этой энергетики во всех 12 домах гороскопа с учетом астрологических достоинств по Луне.`,
                houses: {
                    1: `<b>1 дом (Овен) Пассивный эмоциональный старт.</b> Человек начинает любые новые дела или отношения без энтузиазма. Его базовый импульс — это не действие, а усталое ожидание или пресыщенность. На старте проекта он уже выглядит так, будто ему всё надоело (Уэйт), и вместо активных шагов навстречу партнеру он уходит в глухую эмоциональную оборону (Манара), требуя, чтобы мир сам оставил его в покое.<br>`,
                    2: `<b>2 дом (Телец) — Экзальтация</b> Сфера ресурсов, физического комфорта, денег и потребления. Луна здесь экзальтирует.<br><b>Суть и специфика:</b> Гипертрофированная, напряженная фиксация на материальном комфорте как на единственном способе достичь эмоционального покоя. <b>Описание положения:</b> Для такого человека состояние «я в домике» напрямую зависит от количества накопленных ресурсов. Он агрессивно охраняет свой материальный покой, категорически отказываясь от новых предложений заработка (Уэйт), так как боится рисковать тем, что уже имеет. Его погружение в себя (Манара) сопровождается острой потребностью физиологического уюта (вкусная еда, мягкая постель), ради которого он отгораживается от всего мира.`,
                    3: `<b>3 дом (Близнецы) Эмоциональная глухота контактов.</b> В повседневном общении, обучении и переписках человек демонстрирует отчужденность. Он быстро пресыщается любой информацией или разговором, отказываясь слушать собеседника или воспринимать новые идеи (отвергает кубок по Уэйту). Его коммуникация сводится к минимуму: он погружен в свои мысли (Манара), отвечая односложно и создавая вокруг себя вакуум нежелания общаться.<br>`,
                    4: `<b>4 дом (Рак) — Первая обитель</b> Здесь базовая прошивка находится в своей идеальной, родной среде.<br><b>Суть и специфика:</b> Человек обладает идеальным механизмом психологического самосохранения. Его дом и семья — это непробиваемая эмоциональная крепость. <b>Описание положения:</b> Сталкиваясь со стрессом, он легко возвращается в свое интимное пространство, чтобы полностью отключиться. Он садится под своим «родовым деревом» (Уэйт) и погружается в спасительную ванну своих эмоций (Манара), не пуская туда посторонних. Он абсолютно доволен тем, что имеет, и не ищет от добра добра. В негативе (перевернутая карта) — это капризный отказ от предложенной поддержки близких и бесконечное пережевывание старых семейных обид.`,
                    5: `<b>5 дом (Лев) — Второе изгнание</b> Сфера любви, радости, эгоизма, творчества и игры.<br><b>Суть и специфика:</b> Полная блокировка естественной радости и спонтанности. Замена активного праздника жизни на скуку и пассивное пережевывание прошлого. <b>Описание положения:</b> В ситуациях влюбленности или творчества, где нужно блистать и радоваться, человек впадает в эмоциональный ступор. Вместо того чтобы принять новый «кубок любви» (Уэйт), он отворачивается, испытывая пресыщение и скуку. Любовные отношения для него — это повод залезть в свою раковину (Манара) и пожаловаться на то, как он устал. Он использует свободное время не для самовыражения, а для того, чтобы «бежать к маме поплакать» или просто тупо лежать на диване.`,
                    6: `<b>6 дом (Дева) Усталость от рутины.</b> Ежедневный труд, обязанности и вопросы здоровья вызывают быстрое эмоциональное истощение. Человек не хочет служить или методично работать; он ищет любой повод для перерыва. На рабочем месте он садится в угол, игнорируя новые поручения (Уэйт), и полностью уходит в свои внутренние переживания (Манара), воспринимая рутину как досадную помеху своему покою.<br>`,
                    7: `<b>7 дом (Весы) Дистанция в партнерстве.</b> В браке и открытых договорах человек выстраивает непреодолимую стену. Он не интересуется потребностями супруга и отказывается от любых предложений по улучшению отношений (Уэйт). Партнерство превращается в сосуществование двух одиночеств: человек физически находится в браке, но эмоционально заперт в своей комнате (Манара), игнорируя партнера ради сохранения своего личного статус-кво.<br>`,
                    8: `<b>8 дом (Скорпион) — Падение</b> Сфера кризиса, экстрима, трансформации и чужих ресурсов. Луна здесь падает.<br><b>Суть и специфика:</b> Тотальный паралич психики перед лицом неизбежных изменений. Отказ трансформироваться. <b>Описание положения:</b> Столкнувшись с кризисом, опасностью или глубоким сексуальным взаимодействием, человек намертво застывает в своей старой скорлупе. Он не принимает новый «кубок трансформации» (Уэйт), отворачиваясь от реальности. Его защитный механизм дает сбой: он прячется в иллюзорную воду своих эмоций (Манара), надеясь, что кризис пройдет сам собой, если просто сидеть с закрытыми глазами. Это глухое сопротивление переменам, делающее его уязвимым перед ударами судьбы.`,
                    9: `<b>9 дом (Стрелец) Идеологическое пресыщение.</b> В сфере мировоззрения, дальних планов и социальных идеалов человек абсолютно закрыт для нового. Ему не нужны новые философии, религии или авторитеты. Он сидит под деревом своих устоявшихся догм, отказываясь от божественного или социального «кубка» (Уэйт). Будущее его не интересует; он изолирует себя в привычных эмоциональных рамках (Манара), не желая никуда двигаться и ни во что верить.<br>`,
                    10: `<b>10 дом (Козерог) — Первое изгнание</b> Сфера карьеры, социальной ответственности и амбиций. Луна (и четверки) здесь в первом изгнании.<br><b>Суть и специфика:</b> Острый конфликт между необходимостью выполнять взрослые обязанности и желанием спрятаться в детскую инфантильность. <b>Описание положения:</b> Столкнувшись с карьерным давлением или требованиями социума, человек включает саботаж. Вместо работы он хочет лишь одного — чтобы его оставили в покое. Он отворачивается от предложенных социальных «кубков» (Уэйт), отгораживается от коллег и руководства глухой эмоциональной стеной (Манара), демонстрируя полнейшую апатию. Он тащит свое желание спать и релаксировать прямо на рабочее место, что ведет к остановке любых профессиональных процессов.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель</b> Сфера свободы, будущего, независимости и дружеских связей.<br><b>Суть и специфика:</b> Способность находить глубокий эмоциональный покой в состоянии абсолютной свободы и оторванности от тесных привязанностей. <b>Описание положения:</b> В кругу друзей или сталкиваясь с непредсказуемым будущим, человек не паникует. Он остается внутренне непротиворечивым и расслабленным. Он спокойно сидит под своим деревом, предоставляя свободу другим и не втягиваясь в чужие драмы (Уэйт). Его уединение в воде эмоций (Манара) не несет травмы — это дружелюбная, независимая самодостаточность, когда ему комфортно быть одному среди многих.`,
                    12: `<b>12 дом (Рыбы) Тотальная кармическая изоляция.</b> В зоне тайн, одиночества и подведения кармических итогов человек находит абсолютное убежище. Сталкиваясь с последствиями прошлого, он не пытается ничего исправить. Он полностью сдается, принимая позу глубокой медитации или отрешенности (Уэйт). Это окончательное погружение на самое дно своего бессознательного (Манара), где мир перестает для него существовать, растворяясь в тишине и фатальной апатии.<br>`
                }
            },
            54: {
                name: "4 Мечей",
                general: `В астрологической системе Таро Юрия Хана числовые карты-четверки относятся к первой (подсознательной) зоне гороскопа, соответствуют четвертому дому (знак Рака, стихия Воды) и управляются планетой <b>Луна</b>. Они символизируют подсознательное завершение процесса, остановку действий для восстановления сил, поиск безопасности и уход в защищенную интимную зону. Младший аркан <b>4 мечей (Четверка Воздуха)</b> описывает ментальную и физическую остановку — прекращение любых действий и коммуникаций ради сохранения энергии.<br><br>Для формирования детального натального портрета (рассматривая 4 мечей как базовую прошивку личности или реакцию на жизненные ситуации), необходимо синтезировать <b>четыре ключевые версии</b> проявления этого аркана из колод Уэйта и Манары:<br><b>1. Принудительная остановка и бессилие (по Уэйту):</b> Человек физически или ментально истощен. Природа буквально «отключает» его способность действовать, лишает координации и сил. Мечи висят на стене, а человек лежит в позе рыцаря на надгробии, что означает вынужденное согласие с тем, что сейчас он ни на что не способен. Это может проявляться как сильная усталость, сон или болезнь.<br><b>2. Осознанный релакс и доверие интуиции (позитив):</b> Это сознательное состояние «недеяния». Человек добровольно вешает мечи на стену, ложится в удобную кровать и дает мозгу отдохнуть. Включается принцип «утро вечера мудренее»: вместо того чтобы вхолостую гонять тревожные мысли, личность засыпает, позволяя интуиции (ночи и бессознательному) самой найти правильное решение к утру.<br><b>3. Жесткий плен сценария (по Манаре):</b> В колоде Манара Четверка Воздуха (Мечей) указывает на жесткую фиксацию в иллюзиях или подсознательных сценариях. Человек намертво застревает в своих фантазиях, игнорируя реальные действия партнера. Он отключается от объективной реальности, погружаясь в собственные переживания, и категорически отказывается менять свое поведение.<br><b>4. Инфантильное снятие ответственности (в негативе):</b> Человек прячется в «домик», требуя, чтобы окружающие оставили его в покое. Это позиция ребенка, который отказывается решать внешние задачи, надеясь, что его защитят другие (родители, муж, государство), и использует свою пассивность как щит от социальных обязательств.<br><br>Поскольку четверки управляются Луной, их особые положения распределены по классическим астрологическим достоинствам этой планеты в Зодиаке (Обитель в Раке, Изгнание в Козероге, Экзальтация в Тельце, Падение в Скорпионе).`,
                houses: {
                    1: `<b>1 дом (Овен) — Блокировка личной инициативы</b>  На самом старте любого проекта или при знакомстве базовая марсианская энергия внезапно гасится потребностью в покое. Человек не проявляет агрессивной инициативы; он занимает выжидательную, пассивную позицию. Вместо того чтобы завоевывать, он ложится и ждет, пока партнер или обстоятельства сами сделают первый шаг.<br>`,
                    2: `<b>2 дом (Телец) — Экзальтация. Физиологический ступор</b>  В сфере физиологии, формы и личных ресурсов отдых достигает высшей точки напряжения (экзальтации). Человек настолько боится растратить свои физические или материальные ресурсы, что буквально впадает в ступор. Он замораживает любые действия, направленные на партнера, сохраняя энергию внутри себя. В сексуальных отношениях это может проявляться как бревноподобная пассивность, когда тело отключается от процесса ради энергосбережения.<br>`,
                    3: `<b>3 дом (Близнецы) — Отказ от коммуникации</b>  В сфере повседневного общения, обучения и рутинных контактов человек уходит в режим радиомолчания. Мозг перегружен информацией, поэтому личность прерывает разговоры, перестает отвечать на звонки и отказывается усваивать новые знания. Это необходимый информационный детокс и остановка бессмысленной социальной суеты.<br>`,
                    4: `<b>4 дом (Рак) — Первая обитель. Абсолютный базовый релакс</b>  Это идеальная, родная среда для карты. Человек легитимно позволяет себе абсолютно ничего не делать в своей зоне комфорта. Он может лечь отдохнуть, встать поесть и снова лечь, полностью распоряжаясь своим правом на бездействие без чувства вины. В этом состоянии психика идеально восстанавливается. В перевернутом (негативном) виде это превращается в тотальную стагнацию, когда человек делает свой дом склепом и отказывается возвращаться к активной жизни.<br>`,
                    5: `<b>5 дом (Лев) — Изоляция от радости</b>  В сфере творчества, влюбленности и праздника человек заменяет яркие эмоции тупым ничегонеделанием. Свободное время, которое можно было бы потратить на развлечения или романтику, он тратит на сон и лежание на диване. В негативе это означает полную апатию и отказ от права на личное счастье, когда человек запирает своего внутреннего ребенка в комнате.<br>`,
                    6: `<b>6 дом (Дева) — Пауза в рутине</b>  Столкнувшись с ежедневными бытовыми обязанностями, служением партнеру или вопросами здоровья, человек физически откладывает инструменты в сторону. Это состояние, когда организм отказывается продолжать монотонную работу. Человек может уснуть среди немытой посуды или недоделанных отчетов, потому что его тело требует немедленного отдыха от рутины.<br>`,
                    7: `<b>7 дом (Весы) — Отстранение от партнера</b>  В сфере брака и открытых договоренностей человек уходит в глухую оборону и разрывает социальные связи. Находясь в отношениях, он занимает абсолютно пассивную позицию ребенка, который не принимает никаких решений. Он физически присутствует рядом с супругом, но ментально отключен от диалога, ожидая, что партнер будет обслуживать его нужды.<br>`,
                    8: `<b>8 дом (Скорпион) — Падение. Оцепенение перед кризисом</b>  Столкнувшись с экстремальной ситуацией, чужими ресурсами или необходимостью глубокой трансформации, человек использует отказ от действий как форму психологической защиты. Вместо того чтобы бороться с кризисом (по Марсу), он притворяется мертвым, надеясь, что опасность пройдет мимо. Это паралич воли в момент экстрима, который блокирует возможность изменить себя и адаптироваться к новым жестким условиям.<br>`,
                    9: `<b>9 дом (Стрелец) — Отказ от перспектив</b>  Столкнувшись с необходимостью планировать далекое будущее, расширять мировоззрение или следовать за социальными авторитетами, человек отказывается двигаться вперед. Он замораживает свои идеалы и категорически не желает выходить из уютной ментальной раковины, отсекая любые амбициозные проекты и предложения извне.<br>`,
                    10: `<b>10 дом (Козерог) — Первое изгнание. Уход от обязательств</b>  Сфера социальной ответственности, статуса и карьеры, где Луна находится в изгнании. Человек воспринимает чужие дела и рабочие обязанности как блокировку своих личных потребностей. Столкнувшись с давлением, он «вешает мечи» и самоустраняется. В прямом (оправданном) варианте это официальный больничный, уход в декретный отпуск или работа на дому, когда человек легально ставит карьеру на паузу по состоянию здоровья. В негативе — инфантильный саботаж и безответственность.<br>`,
                    11: `<b>11 дом (Водолей) — Игнорирование непредсказуемости</b>  В зоне форс-мажоров, друзей и непредсказуемого будущего человек использует тактику страуса. Столкнувшись с хаосом одиннадцатого дома, он ложится на дно, дистанцируется от коллектива и отказывается генерировать новые идеи. Он надеется переждать турбулентность в неподвижности, полностью исключая себя из социальных реформ.<br>`,
                    12: `<b>12 дом (Рыбы) — Погружение в бессознательное</b>  В сфере тайны, изоляции и скрытых кармических последствий человек демонстрирует абсолютное спокойствие перед лицом неизбежного. Он перестает барахтаться в потоке и полностью сдается на волю судьбы. Это мистический релакс, когда личность осознанно отключает интеллект и позволяет бессознательному (или Высшим силам) самому проработать кармические долги во время метафорического или реального сна.<br>`
                }
            },
            68: {
                name: "4 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана числовые карты-четверки относятся к первой (подсознательной) зоне гороскопа, соответствуют четвертому дому (знак Рака, стихия Воды) и управляются планетой <b>Луна</b>. Они символизируют остановку действий, подсознательное формирование психической базы, родительские программы и ощущение безопасности. Масть пентаклей (земля) придает этой остановке характер материального накопления, удержания форм и зафиксированных представлений о себе.<br><br>Общая трактовка базовой прошивки (или реакции на ситуацию) по <b>4 пентаклей (Четверке Земли в колоде Манара)</b> синтезирует <b>четыре ключевые версии</b>:<br><b>1. Материальная база и неприкосновенный запас (по Уэйту):</b> Карта символизирует сохранение ресурсов, удержание недвижимости и создание фундамента для выживания. Это намеренная фиксация средств и мыслей, когда человек прекращает траты и прячет свои ценности в «сундук» на случай кризиса.<br><b>2. Родительские шаблоны и комплексы (Синтез):</b> В психологическом плане это зафиксированное, незыблемое представление человека о себе, которое было внушено ему родителями в детстве (например, «ты — принцесса» или «ты — неудачник»). Личность слепо держится за эти старые образы, отказываясь формировать собственное сознание.<br><b>3. Демонстрация слабости и нужды в партнере (по Манаре):</b> На карте Четверка Земли изображена женщина, ползущая за уходящим мужчиной. Это открытая, инстинктивная демонстрация своей беспомощности и зависимости с целью удержать партнера, чтобы он обеспечил ей безопасность и опеку.<br><b>4. Стагнация и дефолт ресурсов (в негативе):</b> При искажении энергии (перевернутая карта) жадность и страх перемен приводят к тому, что накопленные ресурсы «гниют» без циркуляции (дефолт). Человек цепляется за то, что уже обесценилось, панически боясь лишиться своей зоны комфорта.<br><br>Поскольку все четверки управляются Луной, их особые положения строго распределены по астрологическим достоинствам Луны (1-я Обитель в Раке, 2-я Обитель во Льве, 1-е Изгнание в Козероге, 2-е Изгнание в Водолее, Экзальтация в Тельце, Падение в Скорпионе).`,
                houses: {
                    1: `<b>1 дом (Овен) — Заморозка личной инициативы</b>  На самом старте новых проектов или знакомств мощная марсианская энергия гасится страхом потерять имеющуюся базу. Человек не проявляет агрессивной инициативы; он крепко держится за свой привычный образ и материальный статус, ожидая, что партнер сам обратит внимание на его нужды и продемонстрированную беспомощность.<br>`,
                    2: `<b>2 дом (Телец) — Экзальтация. Физиологический страх бедности</b>  В сфере накоплений, физического тела и личных ресурсов Луна достигает высшей точки напряжения. Человек испытывает острую, порой навязчивую потребность в гарантиях выживания. Это приводит к гипертрофированному накопительству: ощущение нехватки средств заставляет его цепляться за каждую копейку и рассматривать любые отношения исключительно через призму обеспечения своего телесного и материального комфорта.<br>`,
                    3: `<b>3 дом (Близнецы) — Стандартные заученные фразы</b>  В повседневной коммуникации, обучении и поверхностных контактах личность использует жесткие, заложенные в детстве ментальные шаблоны. Человек отказывается гибко воспринимать новую информацию, общаясь исключительно готовыми штампами ради сохранения своего внутреннего покоя и интеллектуальной безопасности.<br>`,
                    4: `<b>4 дом (Рак) — Первая обитель. Абсолютная материальная безопасность</b>  Это самая гармоничная, родная среда для карты. Человек обладает надежным домом, крепким фундаментом и неприкосновенным запасом ресурсов, которые обеспечивают ему полное психическое и материальное спокойствие,. В отношениях (по Манаре) женщина позволяет себе безопасно демонстрировать свою нужду в мужчине в рамках семьи, зная, что партнер её не бросит и защитит. В негативном варианте это отказ обновлять свои запасы, что ведет к их обесцениванию и порче в закрытом пространстве.<br>`,
                    5: `<b>5 дом (Лев) — Вторая обитель. Эгоистичное удержание старого</b>  Сфера личной свободы, радости и творчества (Солнце). Вместо того чтобы генерировать новые идеи и жить своей судьбой, человек подменяет свободное время тупым материальным потреблением или цепляется за старые родительские шаблоны поведения,. Он не способен развлекаться самостоятельно, боится выйти из зоны комфорта и ведет себя как инфантильный ребенок, держащийся за свои старые игрушки из страха перед новизной,.<br>`,
                    6: `<b>6 дом (Дева) — Рутина ради сохранения</b>  В вопросах ежедневного труда, быта и здоровья человек действует крайне консервативно. Он механически выполняет свои рутинные обязанности, стараясь максимально сэкономить физические и материальные ресурсы. Труд воспринимается не как развитие, а лишь как средство не растратить свой базовый неприкосновенный запас,.<br>`,
                    7: `<b>7 дом (Весы) — Отстранение в партнерстве</b>  В сфере брака и открытых договоренностей человек выстраивает глухую ментальную и финансовую оборону. Он рассматривает супружество через призму жестких материальных границ («это мое, а это твое»), отказываясь от полного слияния с партнером из-за страха потерять контроль над своими личными ценностями и устоявшимися привычками.<br>`,
                    8: `<b>8 дом (Скорпион) — Падение. Паралич перед трансформацией</b>  В зоне экстремальных кризисов, чужих ресурсов и необратимых перемен,. Столкнувшись с необходимостью радикально измениться или заплатить высокую цену, человек впадает в ступор. Он категорически отказывается отдавать свои ресурсы и менять зафиксированные представления о мире, пытаясь искусственно удержать рушащуюся ситуацию (сделать вид, что ничего не происходит), что чревато полным крахом в экстриме,.<br>`,
                    9: `<b>9 дом (Стрелец) — Догматичность старых идеалов</b>  При формировании глобального мировоззрения или планировании далекого будущего человек намертво фиксируется на консервативных ценностях своего рода. Он отвергает новые идеологии и авторитеты, если они угрожают его привычному, домашнему укладу жизни, возводя свой родительский шаблон в ранг абсолютной истины.<br>`,
                    10: `<b>10 дом (Козерог) — Первое изгнание. Саботаж рабочих обязанностей</b>  Сфера карьерного долга, статуса и социальной ответственности, где Луна изгоняется,. Сталкиваясь с чужими (рабочими) задачами, человек воспринимает их как угрозу своему личному комфорту. Он не может выбросить из головы домашние или финансовые проблемы, находясь на рабочем месте. В худшем случае это безответственное использование чужих или корпоративных ресурсов (государственных денег) в своих личных, корыстных интересах.<br>`,
                    11: `<b>11 дом (Водолей) — Второе изгнание. Игнорирование коллективной свободы</b>  Зона непредсказуемого будущего, реформ и коллективной независимости,. Сталкиваясь с хаосом одиннадцатого дома, человек испытывает глубокий страх и наглухо закрывается в своей материальной «раковине». Он отказывается участвовать в социальных переменах, судорожно удерживая свои сбережения и консервативные представления, надеясь переждать турбулентность в неподвижности.<br>`,
                    12: `<b>12 дом (Рыбы) — Иллюзия материальной стабильности</b>  Столкнувшись со скрытыми кармическими итогами, тайнами или изоляцией, человек пытается защититься своей материальной базой. Он цепляется за отжившие формы и накопленные средства, наивно веря, что физическое имущество или старый образ себя способны спасти его от неизбежного растворения в мистических процессах двенадцатого дома,.<br>`
                }
            },
            27: {
                name: "5 Жезлов",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>5 жезлов (Пятерка Огня в колоде Манара)</b> открывает вторую (сознательную) зону гороскопа, соответствует пятому дому (знак Льва) и управляется планетой <b>Солнце</b>. Огненная стихия (жезлы) указывает на то, что это идеи, импульсы, неструктурированные мысли и абстрактные желания человека.<br><br><b>Общая трактовка базовой прошивки (по Уэйту и Манаре) включает 4 ключевые версии:</b><br><b>1. Творческий хаос идей (по Уэйту):</b> Пятерка жезлов символизирует "броуновское движение" мыслей, первые искренние, но еще не причесанные и хаотичные сознательные желания. Человек направляет свое внимание во все стороны, он еще не знает точно, чего хочет в итоге, но ему всё интересно, как ребенку, который познает мир через игру.<br><b>2. Сепарация и бунт (Синтез):</b> Это осознанный отказ от шаблонов поведения, навязанных родителями (четверками) или социумом. Человек позволяет себе думать самостоятельно и действовать по-своему, даже если это выглядит как подростковый протест или глупость.<br><b>3. Эгоистичный азарт и кокетство (по Манаре):</b> В Пятерке Огня (в Таро Манара) изображена ситуация, где женщина хочет получить всё, до чего может дотянуться. Это стадия откровенного кокетства, когда партнер воспринимается как игрушка, а отношения строятся на азарте и желании "покрутить" мужчиной. Здесь нет мыслей о постоянном союзе, важен лишь личный эмоциональный драйв.<br><b>4. Распыление энергии (в негативе):</b> При перекосе эти хаотичные идеи начинают противоречить друг другу. Человек перескакивает с одной мысли на другую, ничего не доводя до конца, и в итоге истощает себя внутренними противоречиями и метаниями.<br>Поскольку пятерки управляются Солнцем, их особые положения распределены по астрологическим достоинствам этой планеты (Обитель во Льве, Вторая обитель в Раке, Изгнание в Водолее, Второе изгнание в Козероге, Экзальтация в Овне, Падение в Весах).`,
                houses: {
                    1: `<b>1 дом (Овен) — Экзальтация. Форсированное эго</b><br>Высшая точка напряжения для солнечной энергии. Здесь желание быть собой и реализовывать свои идеи становится не просто игрой, а острой необходимостью. Человек с самого старта заявляет: "я хочу это сделать именно так", даже если до конца не продумал последствия. Это мощный азарт и энтузиазм, при котором личность буквально форсирует проявление своей индивидуальности, навязывая миру свой хаос и свои желания.`,
                    2: `<b>2 дом. Спонтанное потребление</b><br>В сфере материальных накоплений, формы и тела энергия направляется на удовлетворение личных сиюминутных капризов. Ресурсы, время и деньги воспринимаются как инструмент для получения ярких эмоций и удовольствий, без мыслей о практической выгоде. Человек может спустить капитал на хобби или развлечения ради самого процесса.`,
                    3: `<b>3 дом. Хаотичная коммуникация</b><br>В повседневном общении и передаче информации человек использует слова исключительно для самовыражения. Его речь путана, он перескакивает с темы на тему, не пытаясь донести структурированную мысль, а лишь стремясь высказать всё, что спонтанно приходит ему в голову в данный момент.`,
                    4: `<b>4 дом (Рак) — Вторая обитель. Индивидуальность в интимном</b><br>В сфере интимного, семейного пространства и подсознательных программ (где Солнце является внутренним управителем) энергия пятерок выступает как инструмент индивидуализации. Человек привносит свои личные, нешаблонные желания в "теплое болотце" семейных традиций, наводя там шороху. Это творческая, креативная позиция подростка, который ломает устоявшиеся родовые правила ради проявления своего собственного характера.`,
                    5: `<b>5 дом (Лев) — Первая обитель. Свободное проявление желаний</b><br>Естественная и самая гармоничная среда для карты. Человек абсолютно свободен в своих мыслях и не связан никакими обязательствами перед социумом или семьей. Он позволяет себе искренне желать, творить и радоваться настоящему моменту без оглядки на чужое мнение. В отношениях это период яркой влюбленности и игры, где партнеры наслаждаются собой, не думая о серьезных последствиях.`,
                    6: `<b>6 дом. Творчество в рутине</b><br>Столкнувшись с бытовыми задачами или рутинным трудом, личность отказывается действовать по унылым инструкциям. Человек привносит в работу хаос и импровизацию. Он выполняет повседневные обязанности только при наличии вдохновения, пытаясь превратить рутину в игру, что часто раздражает более прагматичных коллег.`,
                    7: `<b>7 дом (Весы) — Падение. Провал эгоистичной романтики</b><br>Зона брака, договоров и равноправного партнерства. Искренний эгоизм и спонтанность Пятерки жезлов здесь полностью проваливаются. В серьезном союзе нельзя действовать только по личному хаотичному хотению. Попытка остаться непредсказуемым любовником, который думает лишь о своих меняющихся желаниях, ведет к краху партнерских обязательств, так как романтическая игра неуместна там, где требуются учет интересов другого человека.`,
                    8: `<b>8 дом. Поиск экстремальных искр</b><br>В зоне кризисов, глубоких трансформаций и чужих ресурсов человек ищет адреналин. Львиный азарт толкает тестировать отношения и ситуации на прочность. Сексуальные контакты воспринимаются как увлекательный квест, где хаотичные желания реализуются в условиях экстрима.`,
                    9: `<b>9 дом. Юношеский энтузиазм идеалов</b><br>При формировании мировоззрения и далеких перспектив человек загорается множеством новых идеологий с пылкостью неофита. У него в голове роится масса грандиозных, но совершенно сырых абстрактных планов на будущее, которые он с жаром обсуждает, но редко доводит до системной реализации.`,
                    10: `<b>10 дом (Козерог) — Второе изгнание. Дилетантство в профессии</b><br>Сфера карьерного долга, статуса и объективной реальности. Сталкиваясь с необходимостью выполнять жесткие профессиональные обязанности, человек ведет себя безответственно, превращая работу в игру. Он хочет трудиться только тогда, когда у него есть настроение ("свободный художник"), что для серьезной системы Козерога выглядит как абсолютное дилетантство и инфантилизм.`,
                    11: `<b>11 дом (Водолей) — Первое изгнание. Неуместный эгоцентризм</b><br>Зона коллективов, независимого будущего и неформальных отношений. Естественный, наивный хаос мыслей Пятерки жезлов здесь выглядит подозрительно. Попытка вести себя эгоистично и капризно в коллективе воспринимается окружающими не как милая шалость, а как намеренное запутывание ("пудрение мозгов") или осознанное введение в заблуждение. Искренность льва здесь не работает, она разрушает коллективные связи.`,
                    12: `<b>12 дом. Фантазии без реализации</b><br>В сфере изоляции, скрытых итогов и кармы личные творческие импульсы оказываются запертыми внутри. Это бурлящий хаос желаний, который человек переживает исключительно в своей голове, не находя способа выразить их во внешнем мире, что может вести к эмоциональному выгоранию от нереализованности.`
                }
            },
            41: {
                name: "5 Кубков",
                general: `В астрологической системе Таро Юрия Хана числовые карты-пятерки открывают вторую, сознательную зону гороскопа (пятый дом, знак Льва) и управляются Солнцем. Они символизируют личное творчество, эгоизм, формирование индивидуальности и сепарацию от родительских программ. Младший аркан <b>5 кубков (Пятерка воды)</b> описывает эмоциональную реакцию на результаты этих сознательных действий.<br><br>Для формирования детального натального портрета (при рассмотрении 5 кубков как базовой «прошивки» личности или Асцендента) синтезируем три ключевых проявления этого аркана из практики раскладов и лекций:<br><b>1. Театральная меланхолия и «светлая печаль»:</b> Это осознанное, во многом игровое погружение в негативные эмоции. Человек испытывает эстетическое наслаждение от своих страданий (как герой романа), намеренно укутываясь в минорную тональность для привлечения к себе внимания. Это не фатальное горе, а юношеское огорчение, которое быстро проходит.<br><b>2. Эгоцентричное эмоциональное утопление:</b> Состояние, при котором человек по уши погружен в собственные страсти, сексуальность или комплексы. Он абсолютно теряет контакт с реальностью партнера, не видит его как личность, а использует исключительно как инструмент, «спасательный круг», чтобы не захлебнуться в собственных эмоциях.<br><b>3. Юношеский идеализм и фиксация на потере:</b> Болезненное столкновение ожиданий с реальностью. Человек концентрирует всё своё внимание на том, что безвозвратно ушло или пролилось (упущенные шансы, детская беззаботность), категорически отказываясь замечать ресурсы и возможности, которые всё ещё остались в его распоряжении.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 5 кубков — это крайне ранимая, эгоцентричная и глубоко чувствующая личность. В его психике неразрывно связаны два архетипических образа: <b>фигура в черном плаще, оплакивающая три разлитых кубка и игнорирующая два полных (по Уэйту)</b>, и <b>женщина, барахтающаяся в бурных водах собственных страстей, слепо тянущая руку к мужчине (по Манаре)</b>. Его суперсила — колоссальная эмоциональная восприимчивость и способность проживать катарсис, используя печаль как инструмент самопознания. Главная уязвимость — склонность драматизировать, впадать в роль жертвы и игнорировать реальных людей вокруг. Он тонет в океане своих настроений, требуя от мира немедленного спасения, но при этом отворачивается от объективной реальности, упиваясь своей личной, театральной трагедией.<br><br>Пятерки подчиняются планете Солнце, поэтому их астрологические достоинства (особые положения) распределяются в соответствии с эссенциальными достоинствами Солнца (Обитель во Льве, Изгнание в Водолее, Экзальтация в Овне, Падение в Весах). Все остальные дома являются не особыми.`,
                houses: {
                    1: `<b>1 дом (Овен) — Экзальтация</b><br>Сфера базовой инициативы и импульса. Солнце (и пятерки) здесь экзальтируют. Колоссальное эмоциональное перенапряжение на самом старте любого процесса. Человек начинает отношения или новые дела не из здорового инстинкта, а на пике аффекта. Он бросается во взаимодействие, уже заранее оплакивая возможные потери (разлитые кубки Уэйта), и с первых же секунд топит партнера в своих неконтролируемых переживаниях, требуя спасения (Манара). Это старт, продиктованный надрывом, где жажда острой эмоции подменяет собой реальную потребность.`,
                    2: `<b>2 дом (Телец)</b><br><b>Эмоциональное обесценивание ресурсов.</b> Материальные блага, деньги и физический комфорт воспринимаются сквозь призму неудовлетворенности. Человеку всегда кажется, что он потерял больше, чем приобрел (смотрит на разлитые кубки Уэйта). Он может бездумно растрачивать свои ресурсы под влиянием эмоционального шторма, ожидая, что мир или партнер компенсируют эти потери и спасут его от финансового или физиологического утопления (Манара).`,
                    3: `<b>3 дом (Близнецы)</b><br><b>Драматизация повседневного общения.</b> В рутинных контактах, переписках и повседневном общении человек транслирует сплин. Любую банальную фразу он может перевернуть так, чтобы найти повод для светлой печали или обиды (плащ Уэйта). В диалоге он не слышит собеседника, так как оглушен шумом собственной эмоциональной бури (Манара), превращая простое информационное взаимодействие в театр одного актера.`,
                    4: `<b>4 дом (Рак)</b><br><b>Поиск домашнего спасателя.</b> В семье и в родных стенах человек не умеет спокойно отдыхать. Он приносит свою меланхолию домой, требуя, чтобы домочадцы стали зрителями его личной драмы (Уэйт). Родной дом воспринимается как водоем, в котором можно безопасно барахтаться в своих комплексах и капризах, вынуждая родителей или близких постоянно играть роль спасателей, вытаскивающих его из пучины саможаления (Манара).`,
                    5: `<b>5 дом (Лев) — Первая обитель</b><br>Здесь базовая прошивка находится в своей абсолютно естественной, родной среде. Человек имеет полное право на свои эмоциональные капризы. Его театральная грусть и слезы — это естественный процесс познания своей чувственности. Он искренне тонет в водовороте своих страстей (Манара), позволяя себе картинно кутаться в плащ меланхолии (Уэйт), чтобы прочувствовать жизнь во всей ее остроте. Окружающие обычно прощают ему этот эгоцентризм, воспринимая его как милую юношескую непосредственность. Партнер здесь выступает естественным громоотводом и спасателем, помогая человеку не захлебнуться в эмоциях.`,
                    6: `<b>6 дом (Дева)</b><br><b>Капризы в рутине.</b> Выполнение профессиональных обязанностей, служение или забота о здоровье регулярно саботируются плохим настроением. Человек не может методично работать, если у него «нет вдохновения». Мелкие рабочие неудачи воспринимаются как фатальное крушение надежд (три разбитых кубка Уэйта). В коллективе он требует к себе особого, бережного отношения, ожидая, что коллеги будут вытаскивать его из пучины ипохондрии или лени (Манара).`,
                    7: `<b>7 дом (Весы) — Падение</b><br>Сфера социального партнерства, договоров и брака. Солнце здесь падает. Тотальный крах равноправного партнерства из-за эгоцентризма. В браке человек не способен договариваться или учитывать интересы супруга. Он полностью фиксируется на разочаровании от отношений (смотрит на опрокинутые кубки Уэйта). Супруг перестает восприниматься как личность и становится либо средством для «откачивания» человека из его депрессий, либо причиной этих депрессий, в которых человек бесконечно барахтается (Манара). Отношения разрушаются, так как один постоянно требует жалости, забывая о взаимности.`,
                    8: `<b>8 дом (Скорпион)</b><br><b>Экстремальное эмоциональное погружение.</b> В кризисных ситуациях или в глубоком сексуальном контакте человек ищет запредельной, надрывной чувственности. Обычный секс его не удовлетворяет — ему нужен катарсис через боль потерь (Уэйт). Он сознательно провоцирует ситуации, где можно потерять контроль и тотально утонуть в страстях (Манара), используя партнера как якорь в бушующем океане адреналина и экстрима.`,
                    9: `<b>9 дом (Стрелец)</b><br><b>Идеализация личных страданий.</b> Мировоззрение и идеалы строятся на культе пессимизма. Человек искренне верит, что его эмоциональные страдания делают его духовно выше остальных. Он выступает в роли непонятого философа-изгнанника (Уэйт). Сталкиваясь с чужими культурами или идеологиями, он не расширяет кругозор, а с головой уходит в свои ортодоксальные переживания, ожидая, что авторитеты или социум признают глубину его внутренних вод (Манара).`,
                    10: `<b>10 дом (Козерог)</b><br><b>Эмоциональный саботаж обязательств.</b> Человек абсолютно не способен нести взрослую социальную ответственность из-за потакания своим детским обидам. Сталкиваясь с карьерными задачами, он публично оплакивает свои неудачи (Уэйт), заражая унынием весь процесс. Он перекладывает тяжесть объективной реальности на систему или начальника, барахтаясь в своих личных переживаниях (Манара) и отказываясь достигать практических результатов.`,
                    11: `<b>11 дом (Водолей) — Первое изгнание</b><br>Сфера независимости, коллектива, будущего и холодного интеллекта. Солнце здесь в изгнании. Острый конфликт между требованием социума вести себя разумно и желанием оставаться капризным эгоистом. В коллективе этот человек раздражает всех своим нытьем. Он отказывается трезво смотреть в будущее, предпочитая публично страдать об упущенных возможностях (плащ Уэйта). Его попытки затянуть друзей или единомышленников в свое эмоциональное болото и заставить их играть роль спасателей (Манара) отвергаются. В итоге он культивирует образ обиженной «белой вороны», которую никто не понимает.`,
                    12: `<b>12 дом (Рыбы)</b><br><b>Глубокая внутренняя тоска.</b> Изоляция, одиночество или подведение жизненных итогов превращаются для такого человека в бесконечное оплакивание прошлого. Он не способен сделать правильные кармические выводы, так как зациклен на том, что было утрачено (Уэйт). Его скрытая жизнь — это бурлящий океан подавленных инстинктов и невыплаканных слез, в котором он медленно захлебывается, тщетно надеясь на мистическое избавление (Манара).`
                }
            },
            23: {
                name: "Туз Жезлов",
