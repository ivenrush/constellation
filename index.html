                    6: `<b>6 дом (Дева) — Прекращение служения</b><br><i></i> В зоне ежедневного труда, подчинения и методичного быта человек слагает с себя все обязательства. Это резкий отказ выполнять рутинную работу или обслуживать партнера. Человек осознает, что его навыки здесь больше не нужны, бросает инструменты и навсегда уходит с позиции «подчиненного» или домработницы.`,
                    7: `<b>7 дом (Весы) — Экзальтация</b><br><i></i> Сфера открытого партнерства и брака, где Сатурн достигает высшего напряжения (экзальтации). Это тотальное ограничение личной свободы ради сохранения союза. Отношения (или брачный договор) становятся жесткой стеной из мечей. Человек не может сделать ни одного самостоятельного шага: «я не могу никуда пойти, я замужем». При прямом положении человек принимает это принуждение как норму, при перевернутом — испытывает жесточайшее угнетение от того, что партнер полностью парализовал его волю.`,
                    8: `<b>8 дом (Скорпион) — Экстремальный финал</b><br><i></i> Сталкиваясь с кризисом, экстримом или глубокой сексуальной трансформацией, человек выбирает радикальное «убийство» ситуации. Чтобы не погибнуть в трансформации самому, он хладнокровно и мгновенно уничтожает изжившую себя экстремальную связь. Сексуальные отношения обрываются резко, как удар ножом, без долгих прощаний.`,
                    9: `<b>9 дом (Стрелец) — Крушение перспектив</b><br><i></i> В сфере совместного будущего, идеологии и мировоззрения наступает абсолютный крах надежд. Человек понимает, что у пары нет никаких совместных планов. Мечты разбиваются об объективную реальность, и личность категорически отказывается верить в светлое будущее с этим партнером, обрубая все долгосрочные перспективы на корню.`,
                    10: `<b>10 дом (Козерог) — Первая обитель</b><br><i></i> Естественная среда для карты. Человек адекватно и правильно прекращает свои личные действия ради того, чтобы заняться внешними задачами или потому, что процесс объективно исчерпан. В отношениях это своевременная, понятная обоим точка, которая ставится без истерик. В негативном варианте (если человек не хочет взрослеть) — это принудительная остановка, увольнение или социальное давление, которое буквально пригвождает его к земле, заставляя смириться с концом определенного жизненного этапа.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель</b><br><i></i> Сфера независимости, будущего и форс-мажоров. Сатурн здесь — второй управитель. Это состояние «сломленного Водолея». Человек, столкнувшись с непредсказуемой свободой или давлением коллектива, полностью сдается. Вместо независимого, интеллектуального поведения он демонстрирует абсолютную пассивность, соглашаясь с тем, что ему всё запрещено, и отказываясь совершать даже малейшие попытки изменить свое будущее.`,
                    12: `<b>12 дом (Рыбы) — Кармическая точка</b><br><i></i> В зоне скрытых итогов, тайн и изоляции это окончательное подведение баланса. Человек принимает кармические последствия разрыва. Именно здесь отыгрывается сценарий «потерянной туфельки» Манары: формально отношения убиты, человек ушел в неизвестность, оставив за собой лишь тайный кармический след в надежде (или страхе), что судьба когда-нибудь запустит этот цикл заново, но в текущей реальности процесс мертв.`
                }
            },
            65: {
                name: "Туз Пентаклей",
                general: `В астрологической системе Таро Юрия Хана Тузы относятся к первому дому гороскопа (знак Овна), символизируя самый первичный, досознательный животный импульс и изначальную потенцию, и управляются планетой <b>Марс</b>. Масть пентаклей (земля) придает этой марсианской энергии характер конкретной материальной формы, ресурса и телесности.<br><br>Общая трактовка Туза пентаклей (Туза земли в колоде Манара) объединяет <b>четыре ключевые версии</b>, синтезирующие классический символизм Уэйта и психологию Манары:<br><b>1. Самая простая, неделимая форма (по Уэйту):</b> Туз пентаклей олицетворяет первый элемент, базу, то, из чего состоит любой материальный предмет. Это наиболее простая, цельная форма мира, лишенная граней и внутренних противоречий, которая не требует сложного осмысления.<br><b>2. Абсолютное принятие своей женской (животной) природы (по Манаре):</b> На карте Манары мужское начало отсутствует полностью; объектом отношений выступает сама женщина как часть природы. Карта означает абсолютное принятие своего физического естества и уверенность в своем теле. Это самодостаточность, когда личность остается цельным существом (единицей) даже при отсутствии партнера.<br><b>3. Внутренняя целостность и самоощущение (Синтез):</b> На глубинном психологическом уровне Туз пентаклей — это досознательная самоидентичность, базовая внутренняя опора. В позитивном проявлении это осознание собственной ценности («за меня боролись, я важен для этого мира»), а в негативном (перевернутом) — серьезно поврежденное ощущение права на жизнь, когда само существование далось слишком дорогой ценой.<br><b>4. Бескомпромиссная однозначность потребности (Синтез):</b> Овну (первому дому) по Тузу пентаклей необходимо что-то одно, предельно конкретное. Это безапелляционное желание получить ту форму, которая изначально сидит в голове, без готовности выбирать из множества предложенных вариантов (в отличие от восьмерок).<br>Поскольку все Тузы управляются Марсом, их особые положения в гороскопе строго соответствуют астрологическим достоинствам этой планеты (Обители в Овне и Скорпионе, Изгнания в Весах и Тельце, Экзальтация в Козероге, Падение в Раке).`,
                houses: {
                    1: `<b>1 дом — Первая обитель</b><br><b>Абсолютная гармония естества</b> Самое естественное и гармоничное положение для карты. Личность находится в полном контакте со своей животной природой и физиологическими потребностями. Женщина (или мужчина) полностью принимает себя, не сомневается в своей привлекательности и транслирует в мир абсолютную уверенность в своем теле. Это проявление чистого основного инстинкта, направленного на взаимодействие без страхов и сомнений.`,
                    2: `<b>2 дом — Второе изгнание</b><br><b>Автономная материальная голодовка</b> Зона личных накоплений и потребления (Телец). Здесь Туз пентаклей проявляется как парадоксальный отказ от потребления из внешнего мира. Человек переходит в режим жесткой экономии, рассчитывая исключительно на свои внутренние резервы. Это своеобразная «голодовка», когда личность существует полностью за свой счет, дистанцируясь от чужих благ и ресурсов.`,
                    3: `<b>3 дом — Простая, конкретная коммуникация</b><br>В зоне повседневного общения, братьев/сестер и передачи информации человек выражает свои нужды максимально просто и буквально. Он не использует сложных словесных конструкций (в отличие от троек или девяток) и говорит о материальных или телесных потребностях прямо. Это коммуникация, направленная на констатацию базовых фактов без поиска скрытого смысла.`,
                    4: `<b>4 дом — Падение</b><br><b>Паника потери идентичности</b> Зона базовой безопасности, семьи и внутреннего комфорта (Рак). Тотальное схлопывание внимания внутрь себя. Человек теряет ориентиры внешнего мира и полностью концентрируется на ощущении своего тела и самоидентичности. В негативном варианте (перевернутая карта) это приводит к панике несуществования, потере контроля над своим физическим состоянием и психическим расстройствам. В позитивном варианте — у личности достаточно собственной энергии, чтобы обойтись без внешней защиты (дома), формируя свой фундамент исключительно на личной потенции.`,
                    5: `<b>5 дом — Демонстрация своей природы</b><br>В сфере влюбленности, радости, эгоизма и творчества природное естество выставляется напоказ. Человек использует свою телесную привлекательность и материальную форму как главный инструмент флирта и самовыражения. Влюбленность здесь носит ярко выраженный физиологический оттенок, когда искренность граничит с детской, первобытной непосредственностью.`,
                    6: `<b>6 дом — Базовый физический ресурс</b><br>Выполняя повседневные обязанности, подчиняясь рутине или заботясь о здоровье, человек опирается на свою «лошадиную» выносливость. Это выполнение тяжелой и монотонной работы исключительно за счет врожденного, богатырского запаса сил. Человек воспринимает свое тело как надежный инструмент для служения и преодоления бытовых нагрузок.`,
                    7: `<b>7 дом — Первое изгнание</b><br><b>Диктат идеальной формы</b> Сфера брака и партнерства. Вступая в союз, человек не готов подстраиваться. Он требует, чтобы партнер полностью соответствовал его изначальным представлениям: «Ты — именно то, что мне надо, и всё будет в той форме, которую я хочу». В негативном варианте это эгоистичная манипуляция, превращение партнера в свою собственность. В позитивном (прямая карта) — это быстрое, спонтанное узнавание «своего» человека без агрессивного принуждения, но с твердой уверенностью в выборе.`,
                    8: `<b>8 дом — Вторая обитель</b><br><b>Экстремальная плата ресурсом</b> Сфера глубокой трансформации, кризиса и чужих средств (Скорпион). Здесь человек сталкивается с необходимостью отдать свои собственные, базовые средства ради получения какого-то важного результата. Это буквально ситуация оформления кредита: вы расплачиваетесь своими ресурсами (или телом) в экстремальных условиях. Трансформация происходит за счет тотального физического и материального вовлечения.`,
                    9: `<b>9 дом — Фундаментальная личная идеология</b><br>Сталкиваясь с далекими перспективами, авторитетами и вопросами мировоззрения, личность возводит свои материальные или физиологические потребности в ранг религии. Идеальным будущим для такого человека является абсолютное сохранение своей природной формы. Чужие социальные учения отторгаются, если они противоречат его телесному и материальному комфорту.`,
                    10: `<b>10 дом — Экзальтация</b><br><b>Осознание объективной стоимости</b> Сфера социальной реальности, статуса и ответственности. Марс и Тузы здесь достигают точки высшего напряжения. Столкнувшись с внешней задачей, человек должен понять свою истинную цену. Главный девиз этого положения — трезвое и жесткое понимание того, «чего я стою на самом деле» в профессиональном или социальном плане, лишенное иллюзий и фантазий.`,
                    11: `<b>11 дом — Отстраненная самодостаточность</b><br>В зоне форс-мажоров, водолейской независимости и непредсказуемых социальных перемен человек спасается полной физической автономией. Сталкиваясь с хаосом в коллективе, он не пытается подстроиться под новые правила, а просто дистанцируется, сохраняя свою изначальную форму и опираясь на те базовые материальные ресурсы, которые невозможно у него отнять.`,
                    12: `<b>12 дом — Изолированная материальная суть</b><br>Сфера кармы, глубоких тайн, изоляции и скрытых итогов. Здесь человек остается один на один с последствиями своих физических и материальных действий. Это мистическое проживание результатов своего пути через собственное тело. В позитивном ключе это полное телесное слияние с окружающим миром; в негативном — тяжелые психосоматические последствия за отказ от своей истинной природы в прошлом.`
                }
            },
            69: {
                name: "5 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>5 пентаклей (Пятерка Земли в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует пятому дому (знак Льва) и управляется планетой <b>Солнце</b>. Пятерки символизируют пробуждение личного сознания, свободы воли, сепарацию от родительских или общественных шаблонов и формирование индивидуальности. Земная масть (пентакли) переводит эту энергию в сферу материальных форм, телесности, ресурсов и базовых представлений о жизни.<br><br>Общая трактовка базовой прошивки (или реакции на ситуацию) по 5 пентаклей синтезирует <b>четыре ключевые версии</b>, объединяя классический символизм Уэйта и психологию Манары:<br><b>1. Осознанная трата и радость (по Уэйту):</b> Несмотря на традиционно негативный образ (нищие в снегу), в системе Хана это позитивная карта сознательного расходования ресурсов. Человек тратит накопленные средства, силы или здоровье исключительно на свои личные желания, творчество и радость. Это готовность «гулять на свои», потратить последнее на то, что приносит истинное счастье, даже если со стороны это выглядит как разорение.<br><b>2. Разрушение старых шаблонов (Синтез):</b> Это болезненный, но необходимый этап разрушения закостенелых представлений о жизни (четверок), которые были навязаны родителями или обществом. Человек добровольно отказывается от старого фундамента, чтобы методом проб и ошибок сформировать свой собственный взгляд на мир и обрести самостоятельность.<br><b>3. Искренняя самопрезентация без оглядки (по Манаре):</b> На карте Пятерка Земли женщина сидит на корточках в разорванной одежде, не обращая внимания на толпу. Это абсолютная свобода от чужого мнения. Человек искренне и без стеснения демонстрирует себя в любой, даже самой «непрезентабельной» форме. Ему плевать, что о нем подумают окружающие, его волнует только собственное состояние и свобода быть собой.<br><b>4. Бездумное расточительство и инфантилизм (В негативе):</b> При искажении энергии (перевернутая карта) свобода превращается в слепой подростковый бунт или каприз. Человек бессмысленно транжирит ресурсы, проигрывает имущество, эпатирует публику маргинальным поведением или разрушает свое тело и психику, не создавая при этом никаких новых смыслов.<br>Поскольку пятерки управляются Солнцем, их особые положения строго распределены по астрологическим достоинствам этой планеты (Обитель во Льве, Экзальтация в Овне, Изгнание в Водолее, Падение в Весах, а также вторые обители/изгнания в Раке и Козероге).`,
                houses: {
                    1: `<b>1 дом (Овен) — Экзальтация</b><br><i>Оправданный стартовый риск</i> Высшая точка напряжения для солнечной энергии. На старте новых проектов или отношений человек действует решительно, ставя на кон все свои ресурсы («идет ва-банк»). Вместо того чтобы опираться на имеющуюся форму, он сразу же тратит ее, чтобы мощно и ярко заявить о своем желании. В негативном варианте (перевернутая карта) старт любого дела сопровождается бессмысленным материальным скандалом или буквальным битьем посуды.`,
                    2: `<b>2 дом (Телец)</b><br><i>Экстравагантное потребление</i> В сфере личных накоплений, формы и физиологии ресурсы тратятся не на создание финансовой подушки, а на сиюминутные, эгоистичные «хотелки». Человек монетизирует свои таланты или использует свое тело исключительно ради получения личного, творческого кайфа, безжалостно расходуя природный запас сил на яркие развлечения.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Свобода в коммуникации</i> В повседневных контактах и передаче информации человек выражает свои мысли максимально независимо, разрушая привычные речевые шаблоны. Он не стесняется выглядеть «необразованным» или странным собеседником. Его слова и бытовые действия продиктованы только его текущим настроением, а не правилами вежливости.`,
                    4: `<b>4 дом (Рак) — Вторая обитель</b><br><i>Разрушение базовых устоев</i> Сфера родительского дома, интимного пространства и фундаментальной безопасности. Здесь энергия пятерки разрушает комфорт ради сепарации. Человек (особенно в молодости) бунтует против семейных традиций, тратит родительские деньги или ломает устоявшийся быт, чтобы заявить о своей независимости. В позитиве — это сознательный отказ от ограничивающих родовых комплексов и страхов ради построения собственной, уникальной формы жизни.`,
                    5: `<b>5 дом (Лев) — Первая обитель</b><br><i>Идеальная трата ресурсов</i> Естественная и самая гармоничная среда для карты. Человек легко и с удовольствием вкладывает материальные средства, время и телесные силы в свои увлечения, романтику или детей. Он позволяет себе роскошь быть непрактичным ради счастья. По Манаре, он абсолютно не комплексует по поводу своей внешности или статуса, наслаждаясь моментом «здесь и сейчас», создавая свой уникальный образ без оглядки на социальные стандарты.`,
                    6: `<b>6 дом (Дева)</b><br><i>Творчество в рутине</i> Столкнувшись с повседневными обязанностями, служением и вопросами здоровья, личность отказывается действовать по проверенным методикам. Человек тратит массу энергии на то, чтобы изобрести свой собственный, ни на что не похожий способ выполнения работы, даже если это экономически невыгодно и ведет к потере времени и средств.`,
                    7: `<b>7 дом (Весы) — Падение</b><br><i>Разрыв материальных договоров</i> Сфера брака и партнерских обязательств, где Солнце (и пятерки) падает. Катастрофа для равноправного союза. Человек ведет себя крайне эгоистично в материальном плане, отказываясь учитывать потребности супруга. Это демонстративный разрыв финансовых связей по принципу: «Мне от тебя ничего не надо, я ухожу голым». Поведение, при котором партнерские договоренности приносятся в жертву личным, часто маргинальным прихотям.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Риск в кризисе</i> В моменты экстремальных трансформаций, опасности или глубоких сексуальных контактов человек без сожаления сжигает старые материальные привязанности. Он готов пожертвовать всем своим имуществом или телесным комфортом ради того, чтобы выжить в кризисе и выйти из него полностью обновленным и независимым.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Трата на идеалы</i> В сфере мировоззрения, социальных авторитетов и далеких перспектив человек готов вкладывать последние деньги в свое уникальное, неформальное образование или идеологию. Это образ «бедного студента», который отказывается от материального благополучия ради путешествий, духовного поиска или отстаивания своей личной философии.`,
                    10: `<b>10 дом (Козерог) — Второе изгнание</b><br><i>Оплата собственной свободы</i> В сфере объективной реальности, карьеры и жестких обязательств. Сталкиваясь с необходимостью нести ответственность перед государством или начальством, человек предпочитает заплатить штраф из собственного кармана, лишь бы сохранить независимость. Это сознательный выбор быть «свободным художником» без гроша в кармане, чем подчиняться корпоративным правилам. В негативе — использование чужих, казенных денег для личных развлечений.`,
                    11: `<b>11 дом (Водолей) — Первое изгнание</b><br><i>Рациональная независимость</i> Зона коллективов, независимого будущего и форс-мажоров. Возникает конфликт: человек использует форму нищеты (Уэйт) или эпатажной растрепанности (Манара) намеренно, чтобы освободиться от социальных ожиданий. Это позиция «юродивого», который сознательно отказывается от материальных благ и респектабельности, чтобы никто в коллективе не мог им управлять. Трата ресурсов здесь подчинена не столько радости, сколько холодному желанию сохранить свою тотальную свободу.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Изолированное самопознание</i> В зоне тайн, кармы и скрытых итогов материальные лишения и разрушение старых форм становятся инструментом для мистического или глубоко психологического прозрения. Человек осознанно уходит в изоляцию, лишая себя внешнего комфорта, чтобы в тишине и лишениях (как нищие на снегу) обрести подлинное понимание своей внутренней сути.`
                }
            },
            70: {
                name: "6 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>6 пентаклей (Шестерка Земли в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует шестому дому (знак Девы) и управляется планетой <b>Прозерпина</b> (внутренний управитель — Меркурий). Шестерки символизируют конкретный, осознанный выбор формы своей жизни, умение анализировать детали и распределять имеющиеся ресурсы. Земная масть (пентакли) переводит эту энергию в плоскость практической пользы, физиологической формы, денег и материального обеспечения своих нужд.<br><br>Общая базовая трактовка 6 пентаклей синтезирует <b>четыре ключевые версии</b>, объединяя прагматизм Уэйта и психологию формы из Манары:<br><b>1. Рациональное распределение ресурсов (по Уэйту):</b> На карте изображен состоятельный человек с весами, раздающий монеты нищим. Это сознательное, взвешенное вложение средств, времени или сил. Человек не раздает всё огульно, а делит ресурсы пропорционально: тому, кто больше нуждается или заслужил, — больше, другому — меньше. Это умение трезво рассчитать, что ты можешь себе позволить без ущерба для себя.<br><b>2. Работа над собственной формой и имиджем (по Манаре):</b> На карте Шестерка Земли женщина находится в будуаре и приводит себя в порядок. Это сознательная работа над своим внешним видом, физиологией и социальным образом. Личность оценивает себя: «Достаточно ли у меня средств и данных, чтобы решить свои проблемы самостоятельно, не впадая в зависимость от партнера?». Это наведение лоска для конкретной задачи.<br><b>3. Исправление ошибок и починка (Синтез):</b> Шестой дом — это сфера ремонта, служения и медицины. Шестерка пентаклей символизирует инвентаризацию: анализ своих сильных и слабых сторон, исправление недочетов, восстановление баланса (например, лечение болезни через распределение ресурсов организма или починка сломанного механизма в жизни).<br><b>4. Эгоистичная избирательность (в негативе):</b> При искажении энергии (перевернутая карта) рациональность превращается в жесткую корысть, жадность или неспособность оценить свои возможности. Человек либо экономит на необходимом, либо вкладывает ресурсы в тех, кто этого не заслуживает, совершая ошибки из-за сбитых «внутренних весов».<br>Поскольку шестерки управляются Прозерпиной, их особые положения связаны с уникальными астрологическими достоинствами этой планеты (Обитель в Деве, Изгнание в Рыбах, а также двойные достоинства: Вторая обитель и Падение в Близнецах, Второе изгнание и Экзальтация в Стрельце).`,
                houses: {
                    1: `<b>1 дом — Конкретная стартовая инициатива</b><br>На самом старте новых проектов или отношений человек избегает слепых, инстинктивных марсианских порывов. Его первый импульс — это прагматичная оценка ситуации и демонстрация своих возможностей. Он сразу дает понять партнеру, какими ресурсами обладает и на что готов их тратить, выступая в роли человека, который с первых секунд общения включает взвешенный анализ вместо агрессивного напора.`,
                    2: `<b>2 дом — Финансовый прагматизм</b><br>В сфере личных накоплений, физического тела и базового комфорта ресурсы тратятся не на спонтанные эгоистичные желания (как в пятерках), а исключительно на поддержание функциональной формы. Человек методично вкладывает средства в свое здоровье, питание и материальную подушку безопасности. Партнер здесь оценивается через призму того, насколько он вписывается в этот выверенный, рациональный бюджет.`,
                    3: `<b>3 дом (Вторая обитель и Падение) — Адаптивная коммуникация</b><br>В зоне повседневного общения Прозерпина находится в двойном положении. <i>Как вторая обитель:</i> человек блестяще умеет распределять информацию, объясняя сложные вещи разным людям на их уровне (одним дает больше деталей, другим — меньше, как монеты на весах). <i>Как падение:</i> возникает ступор, когда привычная схема общения дает сбой. Попытка применить сухой, расчетливый анализ к простым приятельским беседам лишает контакт естественности, делая человека скучным и излишне критичным собеседником.`,
                    4: `<b>4 дом — Обустройство личной базы</b><br>В интимном пространстве дома и семьи личность выступает в роли рачительного хозяина. Дом воспринимается как механизм, требующий постоянной починки, инвестиций и наведения порядка (по Манаре — создание идеального «будуара»). Человек распределяет семейные обязанности и бюджет строго по справедливости, требуя от домочадцев вносить соразмерный вклад в поддержание бытового комфорта.`,
                    5: `<b>5 дом — Дозированная радость</b><br>В сфере любви, творчества и чистого эгоизма стихийная радость подвергается жесткой бухгалтерии. Человек выделяет на развлечения, флирт или детей строго определенный лимит времени и денег. Ухаживания строятся не на безумных страстях, а на конкретных, просчитанных вложениях (подарки, помощь). В негативе это убивает романтику, превращая влюбленность в сухое спонсирование партнера по графику.`,
                    6: `<b>6 дом (Первая обитель) — Идеальное распределение ресурсов</b><br>Абсолютно естественная и родная среда для аркана. Человек гениально управляет своим образом жизни. Он трезво анализирует свои возможности, занимается здоровьем, оттачивает профессиональные навыки и содержит свое тело и быт в идеальном порядке. Здесь личность не распыляется на иллюзии, а методично, шаг за шагом выстраивает ту материальную реальность, которая ей нужна, опираясь только на себя.`,
                    7: `<b>7 дом — Взаимовыгодное партнерство</b><br>Вступая в брак или открытые договоренности, человек приносит с собой свои «весы». Отношения строятся как деловой контракт, где четко прописано, кто, кому и сколько должен. Личность готова инвестировать в партнера и помогать ему, но только при условии равноценной отдачи. Если баланс нарушается, человек без эмоций перекрывает канал финансирования или заботы.`,
                    8: `<b>8 дом — Анализ в кризисе</b><br>Сталкиваясь с глубокими трансформациями, экстримом или чужими ресурсами, человек отключает панику. Он преодолевает опасность за счет скрупулезного расчета и правильного распределения оставшихся сил. В кризисной ситуации (или при оформлении сложных кредитов) он действует как хирург или кризис-менеджер: хладнокровно отсекает всё лишнее, вкладывая ресурсы только в те направления, которые гарантируют выживание.`,
                    9: `<b>9 дом (Второе изгнание и Экзальтация) — Оценка социальных авторитетов</b><br>В сфере мировоззрения и далекого будущего Прозерпина находится в двойном напряжении. <i>Как экзальтация:</i> жизнь вынуждает человека масштабировать свои узкие, бытовые навыки до уровня социальной программы, заставляя его выступать спонсором или авторитетным экспертом для широких масс. <i>Как второе изгнание:</i> личность судорожно прячется за своей повседневной рутиной («моя хата с краю»), отказываясь расширять кругозор и отвергая любые глобальные идеи, если они не приносят сиюминутной материальной пользы.`,
                    10: `<b>10 дом — Профессиональное мастерство</b><br>В зоне карьеры, социального статуса и взаимодействия с государственной машиной человек делает ставку на свой профессионализм. Он не рвется к абстрактной власти, а требует, чтобы его квалифицированный труд адекватно оплачивался. Это статус высококлассного наемного специалиста или инвестора, чье положение в обществе незыблемо именно благодаря умению грамотно распределять корпоративные или государственные средства.`,
                    11: `<b>11 дом — Рациональность в хаосе</b><br>Столкнувшись с форс-мажорами, коллективной независимостью или водолейской непредсказуемостью, человек пытается сохранить контроль через материальный прагматизм. Находясь в группе друзей или в гуще социальных реформ, он остается внутренне отстраненным, дозируя свою помощь окружающим так, чтобы чужая свобода не пробила брешь в его личном кошельке и стабильности.`,
                    12: `<b>12 дом (Первое изгнание) — Иллюзия спасателя</b><br>В сфере изоляции, скрытых итогов и глубокой кармы точный расчет 6 пентаклей терпит крах (Прозерпина изгоняется в Рыбах). Пытаясь применить свои весы там, где требуется безусловное принятие или мистическое слияние, человек совершает фатальные ошибки. В негативе это синдром «токсичной благотворительности»: личность вкладывает ресурсы в откровенных паразитов или безнадежные кармические ситуации, слепо веря, что деньгами и расчетом можно откупиться от судьбы, но в итоге лишь опустошает себя.`
                }
            },
            71: {
                name: "7 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>7 пентаклей (Семерка Земли в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует седьмому дому (знак Весов) и управляется планетой <b>Хирон</b> (внутренний управитель — Венера). Семерки открывают верхнюю полусферу гороскопа и символизируют первый осознанный контакт с внешним миром и конкретным партнером, где человек учится фильтровать свое поведение и договариваться. Масть пентаклей (земля) указывает на то, что это взаимодействие касается конкретных форм, материальных ресурсов, телесности и устоявшихся мыслей.<br><br><b>Общая трактовка базовой прошивки (по Уэйту и Манаре) включает 4 ключевые версии:</b><br><b>1. Осознанное ожидание созревания (по Уэйту):</b> На карте человек опирается на мотыгу и смотрит на куст с пентаклями. Это означает осознанную паузу: человек сделал предложение партнеру и теперь деликатно ждет, пока в голове у партнера «созреет» понимание того, в какой форме будет происходить их взаимодействие. Вы не торопите события, а даете партнеру время на осмысление.<br><b>2. Дипломатия и отсечение лишнего (по Уэйту):</b> Вы понимаете, что ваши абстрактные желания должны обрести конкретную, приемлемую для обоих форму. Человек придерживает свои действия и делится мыслями только тогда, когда видит, что партнер готов их принять, избегая конфликтов.<br><b>3. Искусственное возбуждение и супружеский долг (по Манаре):</b> На карте Семерка Земли женщина занимается самоудовлетворением в дверях, ожидая мужчину. Психологически это ситуация, когда секс или взаимодействие происходит не от спонтанного желания, а потому что «надо» удовлетворить партнера. Женщина искусственно доводит себя до нужной кондиции, чтобы выполнить свою роль в паре, превращая естественный процесс в «обязательную программу».<br><b>4. Пассивное не-взаимодействие (по Манаре):</b> В паре наступает момент, когда прямого контакта нет. Мужчина отвернулся и занят своими делами, а женщина предоставлена сама себе. Это умение оставить друг друга в покое: отношения вызревают сами по себе, без активного давления друг на друга.<br>Поскольку семерки управляются Хироном и Венерой, их особые положения распределены по астрологическим достоинствам этих планет.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первое изгнание</b><br><i>Нетерпение и навязывание формы.</i> Сфера животного импульса и личной инициативы (Марс). Здесь дипломатия и ожидание семерки вытесняются нетерпеливым Тузом пентаклей. Человек отказывается ждать, пока партнер «созреет». Он агрессивно заявляет: «Ты — именно то, что мне нужно, и всё будет так, как я хочу». Это эгоистичное навязывание своей формы отношений без учета мнения и готовности второй стороны, что неизбежно ведет к разрыву контакта.`,
                    2: `<b>2 дом (Телец) — Вторая обитель</b><br><i>Ожидание материального ресурса.</i> Зона личных накоплений, физиологии и комфорта, где Венера находится в своей обители. Здесь ожидание партнера сводится к вполне конкретным материальным или физическим благам. Человек выстраивает отношения, ожидая, что партнер обеспечит его ресурсами. Если ожидание затягивается (перевернутая карта), личность компенсирует это тем, что начинает использовать собственные средства, но все равно остается в пассивной, ждущей позиции.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация</b><br><i>Вынужденное вербальное ожидание.</i> Высшая точка напряжения для планеты Хирон. Сфера повседневного общения, обучения и рутинных контактов. Человек вынужден делать паузу в общении и напряженно ждать, пока собеседник переварит переданную ему информацию. Это ситуация, когда вы объяснили что-то партнеру и теперь вынуждены сидеть как на иголках, ожидая, поймет он вас или нет, потому что от его ответа зависят ваши дальнейшие шаги.`,
                    4: `<b>4 дом (Рак)</b><br><i>Пассивное сохранение фундамента.</i> В интимном пространстве дома и семьи человек подавляет свои истинные желания ради сохранения покоя. Он переходит в режим искусственного самовозбуждения (по Манаре) или бесконечного ожидания (по Уэйту), лишь бы не разрушить семейный уклад. Дом становится местом, где супруги живут рядом, но не пересекаются, пассивно ожидая, что ситуация наладится сама собой.`,
                    5: `<b>5 дом (Лев)</b><br><i>Искусственная влюбленность.</i> В зоне радости, эгоизма, творчества и чистого праздника спонтанность полностью блокируется. Вместо того чтобы искренне радоваться или влюбляться, человек начинает «отрабатывать программу». Он искусственно заводит себя, чтобы сыграть роль идеального влюбленного, подстраиваясь под партнера и лишая процесс естественной львиной страсти и креатива.`,
                    6: `<b>6 дом (Дева)</b><br><i>Ожидание в рутине.</i> В сфере повседневных трудовых обязанностей, здоровья и служения человек действует строго по регламенту. Он не проявляет лишней инициативы на работе, предпочитая выполнить свою часть обязанностей и отступить в сторону, ожидая, пока коллеги или начальство выполнят свою часть. Это позиция аккуратного, но безынициативного исполнителя.`,
                    7: `<b>7 дом (Весы) — Первая обитель</b><br><i>Идеальное партнерское ожидание.</i> Естественная и самая комфортная среда для карты. Человек гениально выстраивает парные отношения. Он абсолютно точно чувствует, когда нужно остановиться и подождать ответа от партнера. Это идеальная дипломатия: личность не давит, не проявляет эгоизма, а спокойно позволяет идеям или отношениям созреть естественным путем. По Манаре — это способность дать партнеру личное пространство, при этом сохраняя собственную готовность к контакту.`,
                    8: `<b>8 дом (Скорпион) — Второе изгнание</b><br><i>Отказ отдавать ресурс.</i> Зона экстремальных кризисов, глубоких трансформаций и чужих ресурсов. Сталкиваясь с необходимостью кардинально меняться или отдавать свои ресурсы партнеру, человек понимает, что у него просто нет того, что от него требуют. Это жесткий отказ вкладываться в партнера (например, отказ дать деньги в долг из-за других обязательств). В негативном варианте личность ставит свое состояние в полную зависимость от действий партнера, перекладывая на него всю ответственность за результат.`,
                    9: `<b>9 дом (Стрелец) — Падение</b><br><i>Крах совместных перспектив.</i> Сфера идеологии, мировоззрения и далекого будущего, где дипломатия Хирона падает. Катастрофа для договорных отношений. Пытаясь выстроить масштабные планы на будущее, человек использует мелкую дипломатию или пассивное ожидание там, где нужно глобальное, духовное единение (по Юпитеру). В результате партнерство лишается смысла, так как люди не могут согласовать свои фундаментальные взгляды на жизнь, а тактика «подождем, пока всё само утрясется» приводит к полному отчуждению.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Карьерная выдержка.</i> В зоне социального статуса, жесткой реальности и взаимодействия с государственными структурами человек проявляет колоссальное терпение. Столкнувшись с бюрократией или жестким начальством, он не лезет на рожон. Личность понимает, что для достижения социального успеха нужно долго и методично ждать результатов своего труда, подстраиваясь под требования системы.`,
                    11: `<b>11 дом (Водолей)</b><br><i>Отстраненная пауза.</i> Сталкиваясь с форс-мажорами, коллективной свободой и водолейской непредсказуемостью, человек полностью прекращает активные действия. Он занимает позицию стороннего наблюдателя. Понимая, что контролировать хаотичное будущее невозможно, он откладывает свои решения на потом, ожидая, когда коллектив или обстоятельства сами проявят свою конечную форму.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармическая задержка.</i> В сфере скрытых итогов, тайн, изоляции и кармы ожидание становится мистическим или иллюзорным. Человек может годами ждать изменений в отношениях, не говоря партнеру ни слова, наивно полагая, что судьба или карма всё решат за него. Это тайная надежда на то, что «виноград созреет сам», ведущая к глубокому уходу в иллюзии и оторванности от реального партнерства.`
                }
            },
            72: {
                name: "8 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана 8 пентаклей (Восьмерка Земли в колоде Манара) относится к восьмому дому гороскопа, знаку Скорпиона и управляется планетой Плутон. Эта карта символизирует промежуточные итоги, трансформацию и результат сознательных действий человека во второй зоне гороскопа. Масть пентаклей переводит эту энергию в материальное, практическое и ментальное русло.<br><br>Общая трактовка базовой прошивки личности по 8 пентаклей включает 4 ключевые версии:<br><b>1. Конвейер и отдел технического контроля (по Уэйту):</b> Человек методично обрабатывает поступающие к нему ситуации или новые идеи, оценивая их качество. Это анализ и диагностика своих действий постфактум, когда человек решает, какие «пентакли» (формы, результаты) стоит оставить, а какие отбросить как бракованные. Человек готов справиться с любыми жизненными вариантами и объемами работы.<br><b>2. Работа с имиджем и смущение (по Манаре):</b> На карте Восьмерка Земли женщина осознает свою привлекательность (например, демонстрируя глубокий разрез платья), но может внутренне смущаться своего поведения. При позитивном развитии это уверенная «матерая львица», которая точно знает, какое влияние она оказывает на партнера своими формами, и использует это как инструмент.<br><b>3. Объемное решение и переоценка (Синтез):</b> В результате завершенного события или кризиса на человека обрушивается шквал новых образов и мыслей, которых не было в процессе самого действия. Возникает потребность пересмотреть старые взгляды и выбрать из бесконечного числа вариантов те, что действительно работают.<br><b>4. Перегруз и саморазрушение (В негативе):</b> Человек берет на себя слишком много ситуаций, о которых его не просили, и оказывается загружен и придавлен чужими проблемами. В психологии Манары это может проявляться как потребность в деструкции — желание найти «страшного серого волка», который тебя «сожрет», намеренное саморазрушение в отношениях.<br>Поскольку восьмерки управляются Плутоном, их особые положения строго распределены по астрологическим достоинствам этой планеты в зодиакальном круге.<br><br>### Особые положения 8 пентаклей<br><br><b>8 дом (Скорпион) — Первая обитель. Идеальная диагностика</b> Естественная среда для аркана. Человек блестяще анализирует реальные результаты своих поступков и оценивает, что с ним произошло после контакта с внешним миром. Он не цепляется за старое, а методично отсеивает негодные формы и иллюзии, оставляя только тот практический опыт, который позволяет ему стать сильнее и трансформироваться. В отношениях это трезвое понимание цены, которую пришлось заплатить, и грамотное извлечение ресурса из ситуации.<br><br><b>1 дом (Овен) — Вторая обитель. Искушение разнообразием</b> Базовая природа Овна — это однозначное, прямое желание (по Тузам), но восьмерка пентаклей обрушивает на него целую конвейерную ленту вариантов. Возникает растерянность перед изобилием: вместо одного четкого пути человеку предлагают множество чужих сценариев. Изначальная целостность размывается, и личность может впасть в авантюризм, пытаясь ухватить всё и сразу, например, влезая в невыгодные кредиты или связи.<br><br><b>2 дом (Телец) — Первое изгнание. Отказ от трансформации</b> В сфере личных накоплений, формы и физиологии человек сопротивляется переменам. Он оценивает любые изменения через призму того, не потерял ли он свою базу. Возникает жесткая упертость: «принимай меня таким, какой я есть». Личность отказывается пересматривать свои взгляды и меняться ради партнера, агрессивно защищая свой изначальный ресурс и комфорт.<br><br><b>7 дом (Весы) — Второе изгнание. Навязанный пересмотр</b> В сфере брака и открытого партнерства человек сталкивается с тем, что супруг или социум спускает на него чужие представления о жизни. Это тяжелый процесс, когда приходится ломать свои привычные рамки ради сохранения связи. В перевернутом (негативном) варианте это превращается в жесткие претензии к партнеру: человек становится беспощадным инспектором ОТК, бракуя все идеи партнера и обвиняя его в своих бедах.<br><br><b>5 дом (Лев) — Экзальтация. Высшая цель изменений</b> Высшая точка напряжения Плутона. Сфера радости, любви и чистого эгоизма. Сталкиваясь с валом чужих представлений о мире (которые спускаются на него, как пентакли), человек вынужден активно отстаивать свои личные, уникальные идеи. Это глубокое осознание того, ради чего строилась любовь или творчество. Человек трезво понимает реальную выгоду своих действий и использует экстремальную ситуацию для тотального совершенствования своей судьбы.<br><br><b>11 дом (Водолей) — Падение. Откровения иных миров</b> Сфера форс-мажоров, друзей и непредсказуемого будущего. Для свободного интеллекта Водолея это глубокий шок: на него внезапно обрушиваются формы и образы реальности, которые он не создавал и не заказывал. Это похоже на мистическое откровение (как Апокалипсис Иоанна Богослова), когда человеку открываются совершенно чуждые миры. Его независимый ум парализуется обилием чужеродной информации, требующей длительной и сложной обработки.`,
                houses: {
                    1: `<b>1 дом (Овен) — Вторая обитель. Искушение разнообразием</b><br>Базовая природа Овна — это однозначное, прямое желание (по Тузам), но восьмерка пентаклей обрушивает на него целую конвейерную ленту вариантов. Возникает растерянность перед изобилием: вместо одного четкого пути человеку предлагают множество чужих сценариев. Изначальная целостность размывается, и личность может впасть в авантюризм, пытаясь ухватить всё и сразу, например, влезая в невыгодные кредиты или связи.`,
                    2: `<b>2 дом (Телец) — Первое изгнание. Отказ от трансформации</b><br>В сфере личных накоплений, формы и физиологии человек сопротивляется переменам. Он оценивает любые изменения через призму того, не потерял ли он свою базу. Возникает жесткая упертость: «принимай меня таким, какой я есть». Личность отказывается пересматривать свои взгляды и меняться ради партнера, агрессивно защищая свой изначальный ресурс и комфорт.`,
                    3: `<b>3 дом (Близнецы). Рутинный анализ контактов</b><br>В сфере повседневного общения, обучения и рутинных связей человек применяет методичный подход конвейера. Он без эмоций обрабатывает поступающую информацию, отбрасывая бесполезные сплетни и пустые разговоры, оставляя лишь сухие факты и те связи, которые могут принести практическую пользу в быту.`,
                    4: `<b>4 дом (Рак). Ремонт семейного фундамента</b><br>В интимном пространстве дома, семьи и базовой безопасности личность выступает в роли оценщика. Человек анализирует состояние своего жилья или внутрисемейных отношений, занимаясь их последовательной «починкой». Он может методично устранять бытовые поломки или психологические травмы детства, отсеивая те родовые сценарии, которые больше не работают.`,
                    5: `<b>5 дом (Лев) — Экзальтация. Высшая цель изменений</b><br>Высшая точка напряжения Плутона. Сфера радости, любви и чистого эгоизма. Сталкиваясь с валом чужих представлений о мире (которые спускаются на него, как пентакли), человек вынужден активно отстаивать свои личные, уникальные идеи. Это глубокое осознание того, ради чего строилась любовь или творчество. Человек трезво понимает реальную выгоду своих действий и использует экстремальную ситуацию для тотального совершенствования своей судьбы.`,
                    6: `<b>6 дом (Дева). Профессиональный конвейер</b><br>В зоне ежедневного служения, быта и здоровья человек доводит свои навыки до автоматизма. Это идеальный исполнитель, который скрупулезно проверяет каждую деталь своей работы на предмет брака. В вопросах здоровья это может быть методичное лечение, когда человек последовательно избавляется от вредных привычек ради поддержания идеальной физиологической формы.`,
                    7: `<b>7 дом (Весы) — Второе изгнание. Навязанный пересмотр</b><br>В сфере брака и открытого партнерства человек сталкивается с тем, что супруг или социум спускает на него чужие представления о жизни. Это тяжелый процесс, когда приходится ломать свои привычные рамки ради сохранения связи. В перевернутом (негативном) варианте это превращается в жесткие претензии к партнеру: человек становится беспощадным инспектором ОТК, бракуя все идеи партнера и обвиняя его в своих бедах.`,
                    8: `<b>8 дом (Скорпион) — Первая обитель. Идеальная диагностика</b><br>Естественная среда для аркана. Человек блестяще анализирует реальные результаты своих поступков и оценивает, что с ним произошло после контакта с внешним миром. Он не цепляется за старое, а методично отсеивает негодные формы и иллюзии, оставляя только тот практический опыт, который позволяет ему стать сильнее и трансформироваться. В отношениях это трезвое понимание цены, которую пришлось заплатить, и грамотное извлечение ресурса из ситуации.`,
                    9: `<b>9 дом (Стрелец). Прагматичная оценка идеалов</b><br>Сталкиваясь с масштабными философиями, авторитетами и планами на далекое будущее, человек не верит ничему на слово. Любые высокие идеологии и социальные нормы пропускаются через фильтр практической пользы. Личность безжалостно бракует те убеждения и моральные догмы, которые не способны дать реального, ощутимого результата в настоящем.`,
                    10: `<b>10 дом (Козерог). Инвентаризация статуса</b><br>В сфере карьерных достижений, взаимодействия с государством и объективной реальности человек проводит жесткий технический контроль своих амбиций. Он оценивает свои профессиональные ошибки и отбрасывает нереалистичные карьерные пути, понимая, что любой высокий статус требует постоянной, кропотливой шлифовки навыков и исправления недочетов.`,
                    11: `<b>11 дом (Водолей) — Падение. Откровения иных миров</b><br>Сфера форс-мажоров, друзей и непредсказуемого будущего. Для свободного интеллекта Водолея это глубокий шок: на него внезапно обрушиваются формы и образы реальности, которые он не создавал и не заказывал. Это похоже на мистическое откровение (как Апокалипсис Иоанна Богослова), когда человеку открываются совершенно чуждые миры. Его независимый ум парализуется обилием чужеродной информации, требующей длительной и сложной обработки.`,
                    12: `<b>12 дом (Рыбы). Анализ скрытых итогов</b><br>В зоне кармы, тайн и скрытых последствий человек пытается рационализировать мистический опыт. Сталкиваясь с непонятными, хаотичными следствиями своих прошлых поступков, он разбирает их по частям, пытаясь отделить реальные кармические уроки от надуманных иллюзий и страхов, наводя порядок в собственном бессознательном.`
                }
            },
            73: {
                name: "9 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младшие арканы-девятки относятся к третьей (социальной) зоне гороскопа, открывают девятый дом (знак Стрельца) и управляются планетой <b>Юпитер</b> (внутренний управитель — Нептун),. Девятки символизируют выход во внешний социум, согласование мнений, амбиции, перспективы и многовариантность будущего,. Масть пентаклей (земля) придает этим устремлениям максимально конкретный, материальный и статусный характер,.<br><br>Общая трактовка базовой прошивки (или реакции на ситуацию) по <b>9 пентаклей (Девятке Земли в колоде Манара)</b> синтезирует <b>четыре ключевые версии</b>:<br><b>1. Идеальная многовариантность и пирамида ценностей (позитив Уэйта):</b> Девятка пентаклей символизирует пирамиду или иерархию. Человек трезво оценивает множество вариантов развития событий и выстраивает для себя систему приоритетов. Он предполагает самый лучший материальный исход (верхний пентакль), но готов к тому, что могут реализоваться и другие, промежуточные сценарии. Это социальный компромисс, при котором личность гармонично находит свое место под солнцем, получая заслуженные дивиденды,.<br><b>2. Беспринципная меркантильность (негатив Уэйта):</b> Желание извлечь сиюминутную прибыль любой ценой, пренебрегая будущим. Девиз этой карты: «После нас хоть потоп». Человек эгоистично эксплуатирует ресурсы (природу, партнера, связи) исключительно ради наживы и статуса, продавая свои идеалы за материальные блага,.<br><b>3. Социальное программирование и превосходство (по Манаре):</b> На карте Девятка Земли изображена женщина, несоразмерно огромная по сравнению с мужчиной, который от нее шарахается. Это поведение, продиктованное коллективным бессознательным и социальными штампами: человек пытается самоутвердиться через отношения, подавляя партнера своим статусом. Для мужчины это проигрывается как высокомерный взгляд на женщину сверху вниз, потому что у него «большой карман» и финансовая власть.<br><b>4. Тестирование партнера и дрессировка (Синтез):</b> В отношениях девятки — это начало манипуляций и «дрессировки» партнера,. Человек проверяет, насколько партнер пригоден для совместного стабильного будущего, и использует материальные рычаги, чтобы заранее занять лидирующую позицию в паре,.<br>Поскольку девятки управляются Юпитером, их особые положения строго распределены по астрологическим достоинствам этой планеты в зодиакальном круге.<br><br>### Особые положения 9 пентаклей<br><br><b>9 дом (Стрелец) — Первая обитель</b> <i>Идеальная иерархия ценностей</i> Естественная и гармоничная среда для карты. Человек грамотно и адекватно выстраивает систему приоритетов в социуме, понимая многовариантность будущего,. Он находит идеальный компромисс между своими материальными запросами и социальными ожиданиями, не навязывая свою волю агрессивно, а находя свое «место в иерархии», которое устраивает всех,. В партнерстве это этап, когда люди без иллюзий договариваются о совместных материальных перспективах и принимают решения, обеспечивающие их стабильность,.<br><br><b>12 дом (Рыбы) — Вторая обитель</b> <i>Иллюзия материального спасения</i> Сфера скрытых итогов, тайн и кармы, где Юпитер выступает вторым управителем. Здесь материальный статус возводится в ранг мистической веры. Личность может слепо поклоняться авторитетам или деньгам, наивно надеясь, что материальное богатство способно откупить ее от кармических долгов и последствий прошлого,. В контексте Манары (несоразмерная женщина) это попытка скрыть свои глубокие психологические травмы или одиночество за фасадом гипертрофированного социального успеха.<br><br><b>3 дом (Близнецы) — Первое изгнание</b> <i>Неуместный пафос</i> Сфера повседневного общения, братьев/сестер и рутинных контактов. Возникает жесткий конфликт: простые, естественные формы поведения подменяются амбициозными штампами девяток. Человек использует лексику и формы, не свойственные его реальной культуре, пытаясь изображать из себя аристократа или демонстрировать статус там, где это совершенно неуместно. Это выглядит как откровенная пошлость — неестественные, высокомерные манеры разрушают простую человеческую коммуникацию,.<br><br><b>6 дом (Дева) — Второе изгнание</b> <i>Отказ от рутины</i> Зона повседневного труда, медицины и служения, где Юпитер изгоняется. Прагматичная потребность Девы в методичной починке и детальном анализе разбивается об амбиции Девятки пентаклей,. Человек отказывается выполнять черновую работу, считая себя созданным для великих целей. Он сразу требует для себя высокой зарплаты и должности, не желая постепенно оттачивать мастерство, что делает его неуживчивым и неэффективным в коллективе.<br><br><b>4 дом (Рак) — Экзальтация</b> <i>Завышенные домашние стандарты</i> Высшая точка напряжения для Юпитера. Сфера базовой безопасности, семьи и интимного пространства. Человек агрессивно тащит социальные амбиции в свой дом. Базовый уют разрушается завышенными критериями: мебель, одежда и уровень жизни семьи должны строго соответствовать высоким (и часто надуманным) брендовым или общественным стандартам. Это постоянное напряжение от попыток доказать миру свой статус через домашнее имущество,.<br><br><b>10 дом (Козерог) — Падение</b> <i>Крах социальных амбиций</i> Зона жесткой объективной реальности, карьеры и государства, где Юпитер падает. Катастрофа для иллюзорных ожиданий. Человек рассчитывал занять высокое положение в иерархии, получить сверхприбыли или статус, но реальность возвращает его на землю. Вместо ожидаемых миллионов он получает мизерную пенсию, вместо кресла директора — увольнение или понижение,,. Это столкновение с суровой действительностью, где неадекватный позитив (перевернутая девятка) становится социально опасным.`,
                houses: {
                    1: `<b>1 дом (Овен) — Статусная инициатива</b><br>На самом старте отношений или проектов человек блокирует естественную животную агрессию и страсть, заменяя ее демонстрацией своего социального веса,. Он сразу обозначает свое место в иерархии, пытаясь привлечь партнера не личной харизмой, а своим кошельком или громким именем.`,
                    2: `<b>2 дом (Телец) — Меркантильное потребление</b><br>В сфере личных накоплений, физического комфорта и тела партнер оценивается исключительно как статусный или финансовый ресурс. Человек готов потреблять блага, используя свое внешнее превосходство (по Манаре) для установления жесткого материального контроля над ресурсами партнера,.`,
                    3: `<b>3 дом (Близнецы) — Первое изгнание</b><br><i>Неуместный пафос</i> Сфера повседневного общения, братьев/сестер и рутинных контактов. Возникает жесткий конфликт: простые, естественные формы поведения подменяются амбициозными штампами девяток. Человек использует лексику и формы, не свойственные его реальной культуре, пытаясь изображать из себя аристократа или демонстрировать статус там, где это совершенно неуместно. Это выглядит как откровенная пошлость — неестественные, высокомерные манеры разрушают простую человеческую коммуникацию,.`,
                    4: `<b>4 дом (Рак) — Экзальтация</b><br><i>Завышенные домашние стандарты</i> Высшая точка напряжения для Юпитера. Сфера базовой безопасности, семьи и интимного пространства. Человек агрессивно тащит социальные амбиции в свой дом. Базовый уют разрушается завышенными критериями: мебель, одежда и уровень жизни семьи должны строго соответствовать высоким (и часто надуманным) брендовым или общественным стандартам. Это постоянное напряжение от попыток доказать миру свой статус через домашнее имущество,.`,
                    5: `<b>5 дом (Лев) — Демонстративная роскошь</b><br>В зоне любви, радости, творчества и эгоизма искренние чувства вытесняются потребностью «пустить пыль в глаза». Влюбленность превращается в аукцион: человек инвестирует огромные суммы в показушные, дорогие жесты, стремясь купить восхищение и подтвердить свою социальную уникальность,.`,
                    6: `<b>6 дом (Дева) — Второе изгнание</b><br><i>Отказ от рутины</i> Зона повседневного труда, медицины и служения, где Юпитер изгоняется. Прагматичная потребность Девы в методичной починке и детальном анализе разбивается об амбиции Девятки пентаклей,. Человек отказывается выполнять черновую работу, считая себя созданным для великих целей. Он сразу требует для себя высокой зарплаты и должности, не желая постепенно оттачивать мастерство, что делает его неуживчивым и неэффективным в коллективе.`,
                    7: `<b>7 дом (Весы) — Неравноправный договор</b><br>Вступая в открытое партнерство или брак, личность категорически отказывается от равноправия. Союз выстраивается по принципу строгой иерархии, где один (с большим капиталом или социальным статусом) диктует условия, а второй вынужден подчиняться, превращаясь в обслуживающий персонал,.`,
                    8: `<b>8 дом (Скорпион) — Ресурсный экстрим</b><br>Столкнувшись с глубоким кризисом, трансформацией или опасностью, человек пытается выжить, опираясь исключительно на свой финансовый и социальный арсенал. В сексуальных отношениях это проигрывается как полный диктат: партнер с ресурсами грубо навязывает свою волю, требуя абсолютного послушания в постели,.`,
                    9: `<b>9 дом (Стрелец) — Первая обитель</b><br><i>Идеальная иерархия ценностей</i> Естественная и гармоничная среда для карты. Человек грамотно и адекватно выстраивает систему приоритетов в социуме, понимая многовариантность будущего,. Он находит идеальный компромисс между своими материальными запросами и социальными ожиданиями, не навязывая свою волю агрессивно, а находя свое «место в иерархии», которое устраивает всех,. В партнерстве это этап, когда люди без иллюзий договариваются о совместных материальных перспективах и принимают решения, обеспечивающие их стабильность,.`,
                    10: `<b>10 дом (Козерог) — Падение</b><br><i>Крах социальных амбиций</i> Зона жесткой объективной реальности, карьеры и государства, где Юпитер падает. Катастрофа для иллюзорных ожиданий. Человек рассчитывал занять высокое положение в иерархии, получить сверхприбыли или статус, но реальность возвращает его на землю. Вместо ожидаемых миллионов он получает мизерную пенсию, вместо кресла директора — увольнение или понижение,,. Это столкновение с суровой действительностью, где неадекватный позитив (перевернутая девятка) становится социально опасным.`,
                    11: `<b>11 дом (Водолей) — Покупка независимости</b><br>В сфере непредсказуемого будущего, свободы и коллективов человек спасается от хаоса за стеной своих сбережений,. Он участвует в жизни социума только до тех пор, пока это поддерживает его персональную пирамиду ценностей, и легко дистанцируется от группы, если коллективная свобода начинает угрожать его кошельку.`,
                    12: `<b>12 дом (Рыбы) — Вторая обитель</b><br><i>Иллюзия материального спасения</i> Сфера скрытых итогов, тайн и кармы, где Юпитер выступает вторым управителем. Здесь материальный статус возводится в ранг мистической веры. Личность может слепо поклоняться авторитетам или деньгам, наивно надеясь, что материальное богатство способно откупить ее от кармических долгов и последствий прошлого,. В контексте Манары (несоразмерная женщина) это попытка скрыть свои глубокие психологические травмы или одиночество за фасадом гипертрофированного социального успеха.`
                }
            },
            74: {
                name: "10 Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>10 пентаклей (Десятка Земли в колоде Манара)</b> завершает социальную (третью) зону гороскопа, соответствует десятому дому (знак Козерога) и управляется планетой <b>Сатурн</b>. Десятки символизируют абсолютный предел, окончание процессов и подведение итогов во внешнем мире, за которыми уже невозможно ничего изменить. Масть пентаклей (земля) придает этому финалу предельно материальную, статусную и оформленную природу.<br><br>Общая базовая трактовка 10 пентаклей синтезирует <b>четыре ключевые версии</b>, объединяющие классику Уэйта и психологию Манары:<br><b>1. Оправданный материальный финал и опыт (позитив Уэйта):</b> На карте изображен старик в богатом окружении. Это успешная фиксация форм, когда человек сделал всё, что мог, и больше ничего создать не в силах. Это заслуженная пенсия, передача наследства или имущества, достижение профессионального предела, за которым следует покой и уверенность в оставленном после себя материальном следе.<br><b>2. Столкновение с чужой жизнью и сожаления (негатив Уэйта):</b> Человек живет в среде, которая ему не принадлежит («всё кругом чужое»). Он подчинился социальным штампам и чужим правилам игры, так и не пожив <i>своей</i> личной жизнью. Это горькое сожаление старика в конце пути о бессмысленно потраченном времени и нереализованном истинном «Я».<br><b>3. Предел независимости в партнерстве (по Манаре):</b> Десятка Земли переводит отношения из романтической плоскости в суровую реальность быта и совместных обязательств. Отношения достигают стадии, где партнеры связаны общими внешними проблемами (ипотека, дети, бюджет). Это конец легкости и начало жестких взаимных ограничений, где никто не вправе распоряжаться общим ресурсом единолично.<br><b>4. Абсолютная граница и власть времени (Синтез):</b> Это точка, где ваши действия жестко лимитируются объективной реальностью (Сатурном). Ситуация оформлена окончательно. Вы больше не властны над временем и результатом; остается лишь принять сухой остаток того, что сформировал социум.<br>Поскольку десятки подчиняются Сатурну, их особые положения распределены по астрологическим достоинствам этой планеты в Зодиаке.`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение</b><br><i>Потеря личной инициативы</i> Зона базового старта и личной энергии (Марс), где Сатурн падает. Инициатива и индивидуальные замыслы полностью раздавлены необходимостью служить социуму. Человек приносит в жертву свои собственные желания и идеи ради коллективных нужд. Это полный паралич личной воли: вместо того чтобы действовать «как я хочу» по Овну, личность механически выполняет то, что ей диктует внешняя социальная машина.`,
                    2: `<b>2 дом (Телец)</b><br><i>Замороженные ресурсы</i> В сфере личных финансов, комфорта и тела наступает стагнация. Ресурсы больше не работают на личное потребление — они зафиксированы социальными обстоятельствами. Это деньги, которые есть, но которые нельзя потратить на себя (например, они отложены на оплату чужих долгов, налогов или нужд старшего поколения).`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Сухие социальные штампы</i> В повседневной коммуникации и обучении исчезает живость. Человек общается заученными, бюрократическими и консервативными клише. Контакты с окружением строятся исключительно на формальных протоколах и строгой социальной субординации, исключающей простое человеческое понимание.`,
                    4: `<b>4 дом (Рак) — Первое изгнание</b><br><i>Вторжение социума в дом</i> Зона интимности, эмоций и семьи, где Сатурн изгоняется. Жесткая социальная и материальная реальность вторгается в личное убежище. Это физические ограничения внутри дома: жизнь в съемной квартире, долги по ипотеке, отсутствие прав на свою же недвижимость. Отдых и психологический покой блокируются тяжелыми мыслями о материальных и профессиональных проблемах, которые человек «притащил» с работы домой.`,
                    5: `<b>5 дом (Лев) — Второе изгнание</b><br><i>Отказ от личной жизни</i> Сфера радости, эгоизма и творчества. Здесь 10 пентаклей безжалостно уничтожает любую спонтанность. Человек сознательно или вынужденно отказывается от своих личных интересов, хобби или любви ради служения фирме, обществу или обязанностям. Вся энергия и время уходят на «чужую жизнь». Это корпоративный фанатизм или превращение молодой женщины в «деловую машину», забывшую о себе ради работы.`,
                    6: `<b>6 дом (Дева)</b><br><i>Механический профессионализм</i> В зоне ежедневной рутины, служения и быта работа доводится до абсолютного автоматизма, но лишается всякого смысла развития. Человек действует как старый, безотказный механизм. Он идеально знает свои обязанности, но выполняет их без энтузиазма, превратив служение в тяжелую, безжизненную повинность.`,
                    7: `<b>7 дом (Весы) — Экзальтация</b><br><i>Жесткие общие ограничения</i> Сфера открытого партнерства и брака, где Сатурн экзальтирует (достигает высшего напряжения). Союз становится местом абсолютных ограничений. Это совместное имущество или средства, которыми супруги могут пользоваться, но никто не имеет права распоряжаться ими по своему усмотрению. Отношения связывают партнеров по рукам и ногам финансовыми и бытовыми обязательствами, лишая их личной свободы.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Экстремальное материальное давление</i> Столкнувшись с кризисом, экстримом или глубокими трансформациями, человек упирается в глухую стену обстоятельств непреодолимой силы. Это тяжелые кредиты, жесткие требования кредиторов или партнеров, которые лишают личность шанса на маневр. Трансформация блокируется отсутствием прав на ресурсы.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Консерватизм идеалов</i> В сфере мировоззрения, амбиций и совместного будущего человек отказывается от новых перспектив. Идеология кристаллизуется, превращаясь в старческий догматизм. Любые планы строятся исключительно на основе сурового материального расчета, отвергая духовность, веру и риск в пользу унылой синицы в руках.`,
                    10: `<b>10 дом (Козерог) — Первая обитель</b><br><i>Оправданный материальный финал</i> Естественная среда для аркана. Идеальное и своевременное завершение материального процесса. Человек адекватно оценивает реальность, выполняет свои профессиональные обязанности и фиксирует результат. Он создал всё, что мог во внешнем мире, никуда не лезет и спокойно пожинает плоды (наследство, статус, пенсию). В отношениях это надежная, взрослая пара, которая успешно справляется с совместными трудностями без иллюзий.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель</b><br><i>Смирение с системой</i> Сфера непредсказуемого будущего и свободы, где Сатурн выступает вторым управителем. Человек смиряется с тем, что его жизнь и материальные ресурсы полностью подчинены государству, социуму или фирме. Он отказывается от личного бунта (свойственного Водолею) и принимает навязанные социальные штампы. В негативе это старик, ожидающий подачек (пенсии) от мира, полностью утративший собственную индивидуальность и инициативу.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармический сухой остаток</i> В сфере изоляции, скрытых итогов и тайн человек сталкивается с неизбежными последствиями всей своей материальной и социальной жизни. Это глубокое мистическое или психологическое одиночество среди нажитого имущества. Личность осознает, что материальные достижения не спасают от кармы, и вынуждена холодно подводить баланс своей земной жизни.`
                }
            }
        ,
            1: {
                name: "Маг",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Маг</b> (знак Овна, планета Марс) является главной картой <b>первого дома</b> гороскопа. Он символизирует изначальную жизненную энергию, чистую природную потенцию, животный инстинкт и базовый мотив «я хочу, я могу, я делаю». Маг — это чистая, автономная инициатива, которая направлена на самореализацию и совершенно не учитывает окружающий мир.<br><br>Если мы рассматриваем Мага как <b>натальное положение</b> (базовую психологическую прошивку, аналог Асцендента в классической астрологии или доминирующую модель поведения человека), перед нами предстает личность с абсолютным, первобытным эгоцентризмом. Главный принцип такого человека: «Я сам по себе, моя воля и моя энергия первичны, а все окружающие люди и обстоятельства — лишь фон или инструменты для моей реализации».<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Мага во всех 12 домах гороскопа (жизненных ситуациях), с переносом логики ситуативных раскладов на базовую структуру личности.<br><br>### Особые положения Мага (Астрологические достоинства)<br><br><b>1 дом (Овен) — Первая обитель (Своя среда)</b> Здесь Маг абсолютно гармоничен, так как находится в родной стихии.<br><br><b>Натальная суть:</b> Человек действует максимально естественно, опираясь на свои колоссальные природные силы и животные инстинкты. Ему не нужны внешние стимулы или чье-то разрешение, чтобы начать действовать. Его инициатива рождается внутри него. Это личность, которая смело заявляет о своем праве на существование.<br><br><b>Специфика:</b> Человек не боится проявлять себя. Если он чего-то хочет, он просто берет и делает. Это здоровый, природный эгоизм, который обеспечивает выживание и жизненную активность.<br><br><b>7 дом (Весы) — Первое изгнание (Отказ от партнерства)</b> Седьмой дом — сфера дипломатии, брака и учета чужих интересов. Маг (Марс) здесь находится в изгнании, полностью противореча сути дома.<br><br><b>Натальная суть:</b> Вступая в любые партнерские (в том числе брачные) отношения, человек психологически остается героем-одиночкой. Для него не существует понятия «мы». Его девиз: «Ничего личного, просто у меня взыграла потенция».<br><br><b>Специфика:</b> Партнер воспринимается не как живой человек с чувствами, а исключительно как <b>инструмент или средство для удовлетворения своих потребностей</b> (вплоть до использования партнера как «вибратора» или механизма, который нужно просто правильно «подкрутить отверткой»). Человек с такой прошивкой будет глух к эмоциям спутника, продавливая свою инициативу и делая в паре только то, что хочет сам.<br><br><b>8 дом (Скорпион) — Вторая обитель (Индивидуальный результат)</b> Восьмой дом — это кризис, экстрим и результаты, которые должны быть получены от взаимодействия с партнером.<br><br><b>Натальная суть:</b> Базовая прошивка человека заставляет его достигать любых, даже совместных результатов, <b>исключительно индивидуальным путем</b>. Человек не умеет или не хочет брать чужую энергию, он тратит только свои силы и получает ровно тот результат, на который рассчитывал изначально, лишая себя магии и сюрпризов партнерского энергообмена. В сексуальном или психологическом плане это позиция «мастурбатора»: человек сам себя доводит до нужного состояния и сам себя удовлетворяет, а партнер присутствует лишь номинально.<br><br><b>Высший уровень:</b> В позитивном проживании такой человек обладает способностью трансформировать любой свой опыт обратно в чистую энергию. После любых жизненных кризисов он не истощается, а выходит в новую жизнь с сохраненным сознанием и обновленной потенцией (Магом), готовый начать новый цикл.<br><br><b>2 дом (Телец) — Второе изгнание (Отрыв от формы)</b> Второй дом — это материя, ресурсы, физический комфорт и форма.<br><br><b>Натальная суть:</b> Человек пытается применить свою дикую, импульсивную силу Мага к сферам, где требуются накопление и прагматизм. В результате его базовая энергия растрачивается впустую: он вкладывает огромный потенциал в зарабатывание денег или обустройство быта, но делает это рывками, не понимая реальной стоимости вещей и не умея удерживать ресурс. Это инициатива ради инициативы, не приносящая стабильного материального результата.<br><br><b>10 дом (Козерог) — Экзальтация (Мобилизация перед реальностью)</b> Десятый дом — суровые рамки социума, долг, карьера и объективная реальность.<br><br><b>Натальная суть:</b> Сталкиваясь с тяжелыми профессиональными или жизненными задачами, человек демонстрирует колоссальную степень напряжения и гиперкомпенсации. Его психология: «Если не я, то никто. Я должен сделать это сам».<br><br><b>Специфика:</b> Человек не ищет помощи и не делегирует полномочия. Он борется с давлением внешнего мира исключительно своей личной силой. Это делает его превосходным кризис-менеджером или «пробивным» карьеристом, но ценой огромного истощения, так как он постоянно живет на пределе возможностей, отказываясь использовать внешние системы.<br><br><b>4 дом (Рак) — Падение (Блокировка инициативы)</b> Четвертый дом — зона базовой безопасности, семьи, корней и подсознания.<br><br><b>Натальная суть:</b> Энергия и инициатива Мага здесь падают, сталкиваясь с материнской гиперопекой или страхами. В детстве инициатива и активность такого человека жестко подавлялись родителями.<br><br><b>Специфика:</b> Вырастая, человек имеет травмированный импульс к действию. Его природная сила работает на «внутренних батарейках». Он боится проявлять открытую инициативу во внешнем мире, реализуя свое эго и активность исключительно внутри своего дома, в безопасности четырех стен. Во внешней среде он кажется пассивным, так как любая спонтанная активность подсознательно воспринимается им как угроза его выживанию.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель (Своя среда)</b><br>Здесь Маг абсолютно гармоничен, так как находится в родной стихии. <b>Натальная суть:</b> Человек действует максимально естественно, опираясь на свои колоссальные природные силы и животные инстинкты. Ему не нужны внешние стимулы или чье-то разрешение, чтобы начать действовать. Его инициатива рождается внутри него. Это личность, которая смело заявляет о своем праве на существование. <b>Специфика:</b> Человек не боится проявлять себя. Если он чего-то хочет, он просто берет и делает. Это здоровый, природный эгоизм, который обеспечивает выживание и жизненную активность.`,
                    2: `<b>2 дом (Телец) — Второе изгнание (Отрыв от формы)</b><br>Второй дом — это материя, ресурсы, физический комфорт и форма. <b>Натальная суть:</b> Человек пытается применить свою дикую, импульсивную силу Мага к сферам, где требуются накопление и прагматизм. В результате его базовая энергия растрачивается впустую: он вкладывает огромный потенциал в зарабатывание денег или обустройство быта, но делает это рывками, не понимая реальной стоимости вещей и не умея удерживать ресурс. Это инициатива ради инициативы, не приносящая стабильного материального результата.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации, общения и повседневности</b><br><b>Суть:</b> Человек с врожденной прошивкой Мага в зоне общения абсолютно не умеет слушать. Его коммуникация — это монолог. Он использует общение (и собеседника) лишь как площадку для демонстрации своего интеллектуального превосходства и навязывания своих идей. Его контакт с миром агрессивен, резок и всегда инициируется им самим.`,
                    4: `<b>4 дом (Рак) — Падение (Блокировка инициативы)</b><br>Четвертый дом — зона базовой безопасности, семьи, корней и подсознания. <b>Натальная суть:</b> Энергия и инициатива Мага здесь падают, сталкиваясь с материнской гиперопекой или страхами. В детстве инициатива и активность такого человека жестко подавлялись родителями. <b>Специфика:</b> Вырастая, человек имеет травмированный импульс к действию. Его природная сила работает на «внутренних батарейках». Он боится проявлять открытую инициативу во внешнем мире, реализуя свое эго и активность исключительно внутри своего дома, в безопасности четырех стен. Во внешней среде он кажется пассивным, так как любая спонтанная активность подсознательно воспринимается им как угроза его выживанию.`,
                    5: `<b>5 дом (Лев) — Сфера игры, творчества, любви и эгоизма</b><br><b>Суть:</b> Столкновение природного инстинкта с зоной сознательных желаний. В любви и творчестве такой человек руководствуется голым инстинктом. Ухаживания и романтика (5 дом) сводятся к примитивному, напористому завоеванию. Он искренне не понимает сложных эмоциональных игр: его творчество и его любовь — это грубый, но мощный выброс энергии. Это психология альфа-самца (или альфа-самки), демонстрирующего свою витальность.`,
                    6: `<b>6 дом (Дева) — Сфера рутины, служения, здоровья и подчинения</b><br><b>Суть:</b> Энергия самостоятельного творца оказывается в зоне подчинения и методологии. На работе такой человек совершенно не умеет быть «винтиком в механизме». Он все делает по-своему, никого не слушая и нарушая алгоритмы. Это «мастер-одиночка», который предпочитает работать автономно, используя в качестве главного инструмента только самого себя.`,
                    7: `<b>7 дом (Весы) — Первое изгнание (Отказ от партнерства)</b><br>Седьмой дом — сфера дипломатии, брака и учета чужих интересов. Маг (Марс) здесь находится в изгнании, полностью противореча сути дома. <b>Натальная суть:</b> Вступая в любые партнерские (в том числе брачные) отношения, человек психологически остается героем-одиночкой. Для него не существует понятия «мы». Его девиз: «Ничего личного, просто у меня взыграла потенция». <b>Специфика:</b> Партнер воспринимается не как живой человек с чувствами, а исключительно как <b>инструмент или средство для удовлетворения своих потребностей</b> (вплоть до использования партнера как «вибратора» или механизма, который нужно просто правильно «подкрутить отверткой»). Человек с такой прошивкой будет глух к эмоциям спутника, продавливая свою инициативу и делая в паре только то, что хочет сам.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель (Индивидуальный результат)</b><br>Восьмой дом — это кризис, экстрим и результаты, которые должны быть получены от взаимодействия с партнером. <b>Натальная суть:</b> Базовая прошивка человека заставляет его достигать любых, даже совместных результатов, <b>исключительно индивидуальным путем</b>. Человек не умеет или не хочет брать чужую энергию, он тратит только свои силы и получает ровно тот результат, на который рассчитывал изначально, лишая себя магии и сюрпризов партнерского энергообмена. В сексуальном или психологическом плане это позиция «мастурбатора»: человек сам себя доводит до нужного состояния и сам себя удовлетворяет, а партнер присутствует лишь номинально. <b>Высший уровень:</b> В позитивном проживании такой человек обладает способностью трансформировать любой свой опыт обратно в чистую энергию. После любых жизненных кризисов он не истощается, а выходит в новую жизнь с сохраненным сознанием и обновленной потенцией (Магом), готовый начать новый цикл.`,
                    9: `<b>9 дом (Стрелец) — Сфера социума, идеологии, морали и будущего</b><br><b>Суть:</b> Человек агрессивно и безапелляционно несет в общество свою правду. Он не соблазняет (как Дьявол) и не договаривается. Он врывается в социум со своими догмами и проповедует их с позиции силы. Его идеология проста: «Прав тот, у кого больше жизненной энергии».`,
                    10: `<b>10 дом (Козерог) — Экзальтация (Мобилизация перед реальностью)</b><br>Десятый дом — суровые рамки социума, долг, карьера и объективная реальность. <b>Натальная суть:</b> Сталкиваясь с тяжелыми профессиональными или жизненными задачами, человек демонстрирует колоссальную степень напряжения и гиперкомпенсации. Его психология: «Если не я, то никто. Я должен сделать это сам». <b>Специфика:</b> Человек не ищет помощи и не делегирует полномочия. Он борется с давлением внешнего мира исключительно своей личной силой. Это делает его превосходным кризис-менеджером или «пробивным» карьеристом, но ценой огромного истощения, так как он постоянно живет на пределе возможностей, отказываясь использовать внешние системы.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы, друзей и коллектива</b><br><b>Суть:</b> В зоне непредсказуемости и коллективных процессов человек ведет себя как анархист. Он использует группу людей (друзей, коллектив) исключительно как полигон для обкатки своей личной независимости. Он готов в любой момент разорвать социальные связи, если они хоть немного ограничивают его личную свободу действий, предпочитая остаться в будущем в полном одиночестве, но со своими силами.`,
                    12: `<b>12 дом (Рыбы) — Сфера кармы, итогов, тайн и изоляции</b><br><b>Суть:</b> Чистая марсианская энергия тонет в нептунианском болоте. Природная инициатива человека направлена на борьбу с ветряными мельницами, невидимыми врагами или фантомами подсознания. Человек тратит огромные силы на тайные, скрытые от посторонних глаз действия. В позитиве — это человек, который в полном одиночестве и изоляции способен стать хозяином своего внутреннего мира, опираясь только на свою волю. <b>Резюме:</b> Натальный Маг формирует личность, для которой независимость, прямолинейность и личная потенция возведены в абсолют. Такие люди не умеют подстраиваться, их главный козырь — действие от первого лица, а их главная проблема — неспособность признать ценность и субъектность окружающего мира.`
                }
            },
            2: {
                name: "Жрица",
