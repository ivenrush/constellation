                    11: `<b>11 дом (Водолей) — Дружеское кудахтанье</b><br>В кругу друзей и единомышленников человек выступает в роли «матери полка». Столкнувшись с непредсказуемым будущим или форс-мажорами, он пытается спрятать весь свой коллектив под свое крыло. Он кормит друзей пирожками и пытается контролировать их свободу через заботу, лишая водолейскую среду ее независимости и интеллектуальной легкости.`,
                    12: `<b>12 дом (Рыбы) — Скрытая жертвенность</b><br>В условиях социальной изоляции, одиночества или кармических кризисов человек находит утешение в тайной заботе о ком-либо. Он может посвятить себя спасению больных, слабых или отвергнутых обществом (например, работа в хосписах или приютах). Это полное растворение в роли безусловной матери, когда собственная жизнь приносится в жертву ради сохранения чужого покоя.`
                }
            },
            49: {
                name: "Королева Кубков",
                general: `В системе астрологического Таро Юрия Хана фигурные карты (карты двора) описывают не столько врожденный характер или внутренние желания, сколько <b>социальные роли</b> и шаблоны поведения, которые человек вынужден принимать в ответ на требования ситуации.<br><br>Младший аркан <b>Королева Кубков (Королева Воды)</b> соответствует восьмому дому гороскопа (знак Скорпиона, вода второй зоны) и управляется планетой <b>Плутон</b> (и внутренне Марсом). Эта карта описывает роль человека, который сталкивается с реальными результатами своих действий и взаимодействий с другими людьми.<br><br>Общая трактовка этой базовой прошивки (или актуальной социальной роли) синтезирует 4 ключевые версии, объединяющие символизм Уэйта и Манары:<br><b>1. «Хранитель кассы» и собиратель опыта (по Уэйту):</b> В отличие от других кубков, кубок этой Королевы закрыт крышкой. Это роль человека, который скрупулезно собирает и аккумулирует все результаты своих действий (энергию, деньги, опыт). Ее главная задача — ничего не упустить и ничего не растратить («ни капли врагу»). Это стадия подведения итогов.<br><b>2. Жесткий и честный суд над собой (по Уэйту):</b> Это необходимость предельно честно и трезво взглянуть на то, кем ты являешься на самом деле, без иллюзий пятого дома. В свой кубок Королева собирает как позитивные, так и негативные плоды своих поступков. Скорпион требует осуждения самого себя прежде, чем судить других.<br><b>3. Сокрытие истинной цели (по Манаре):</b> На карте Манары женщина прикрывает руками промежность, обнажая всё остальное. Это поведение, при котором человек демонстрирует партнеру всё что угодно, кроме своего <i>главного</i> результата или истинного мотива (например, желания зачатия или использования партнера). Главная цель прячется за показной застенчивостью в чем-то одном.<br><b>4. Неудовлетворенность, вампиризм и «Стерва» (негативный полюс):</b> Если человек не справляется с этой ролью (перевернутая карта), он отказывается принимать неприятные результаты. В нем скапливается столько негативной энергии, что она начинает отравлять и его самого, и окружающих. В отношениях это выливается в претензии, «высасывание соков» из партнера (вампиризм) и манипулятивную стервозность, когда связь есть, а пользы или радости от нее нет.<br>Ниже представлен детальный разбор проявления этой социальной роли во всех 12 домах гороскопа (особые положения распределены по астрологическим достоинствам Плутона).`,
                houses: {
                    1: `<b>1 дом (Овен) — Вторая обитель</b><br>Плутон является вторым (внутренним) управителем Овна. На высоком уровне (прямая карта) человек способен сделать гораздо больше, чем от него требуют, добавляя к своей природной силе огромный накопленный резерв энергии. На низком уровне (перевернутая карта) — это попытка «откупиться» от личных проблем. Вместо того чтобы проявить марсианскую инициативу и решить вопрос самостоятельно, человек использует свои материальные или энергетические запасы (платит за решение проблемы).`,
                    2: `<b>2 дом (Телец) — Первое изгнание</b><br>Сфера личных ресурсов (Венера). Плутон здесь изгоняется. Внимание человека смещается со своих собственных средств на ресурсы партнера. Входя в отношения, личность рассматривает их через призму того, что можно материально или энергетически вытянуть из другого, чтобы закрыть свои собственные дефициты. Оценка партнера идет не по его человеческим качествам, а по его «кошельку» или потенциалу.`,
                    3: `<b>3 дом (Близнецы) — Тайный сбор информации</b><br>В сфере повседневного общения, обучения и поверхностных контактов человек исполняет роль внимательного слушателя. Он использует коммуникацию не для того, чтобы раскрыться, а чтобы аккумулировать нужные ему сведения. Все чужие секреты и слова складываются в его «закрытый кубок» для последующего анализа и скрытого использования.`,
                    4: `<b>4 дом (Рак) — Консервация семейного ресурса</b><br>В интимном пространстве, семье и вопросах безопасности человек выступает хранителем базовых ценностей. Все добытые во внешнем мире результаты (деньги, связи, эмоции) приносятся в дом и надежно там прячутся. Это защита своего «гнезда» через полное сокрытие внутренних процессов семьи от посторонних глаз.`,
                    5: `<b>5 дом (Лев) — Экзальтация</b><br>Сфера сознательного эгоизма, творчества и влюбленности, где Плутон достигает наивысшего напряжения. Человек вкладывает всю свою накопленную глубинную энергию и чувственность в романтическую или творческую самореализацию. Это жажда тотального признания и трансформации через любовь, где партнер подвергается жесточайшему тестированию на способность выдержать эту концентрированную энергетику.`,
                    6: `<b>6 дом (Дева) — Терпение в рутине</b><br>В вопросах здоровья, быта и методичного труда человек проявляет колоссальную выносливость. Повседневная работа воспринимается как необходимый этап для накопления ресурса. Личность готова скрупулезно, шаг за шагом собирать плоды своих усилий, скрывая усталость и переваривая внутренний дискомфорт ради конечной практической выгоды.`,
                    7: `<b>7 дом (Весы) — Второе изгнание</b><br>Сфера партнерства и договоров. Роль Королевы Кубков здесь ставит человека в позицию зависимости от чужих желаний и падения спроса на него. В негативном варианте это позиция «терпилы», когда человек соглашается на неравноправные условия, низкую оплату труда или тяжелые отношения только ради того, чтобы эта связь продолжала существовать.`,
                    8: `<b>8 дом (Скорпион) — Первая обитель</b><br>Здесь роль находится в своей идеальной и самой естественной среде. Человек адекватно принимает любые результаты своих действий (и хорошие, и плохие) и абсолютно ими доволен. Он не боится заглянуть вглубь себя, использует полученный опыт для самосовершенствования и способен на глубочайшую трансформацию, извлекая пользу из любых кризисов без самообмана.`,
                    9: `<b>9 дом (Стрелец) — Идеологическая манипуляция</b><br>Выходя в большой социум, человек использует свой глубокий психологический опыт (и свои тайные намерения) для авторитетного влияния на умы. Истинные эгоистичные или животные мотивы прячутся за фасадом философии, морали или религии. Это тонкое управление чужим будущим, где реальные цели остаются скрытыми.`,
                    10: `<b>10 дом (Козерог) — Устойчивость к ударам</b><br>В зоне жесткой социальной реальности, карьеры и испытаний человек демонстрирует поразительную психическую неуязвимость. Срабатывает «принцип айкидо»: любая агрессия, давление или стресс со стороны начальства и системы впитываются в огромный резервуар Королевы. Чем больше на человека давят, тем больше опыта и стойкости он аккумулирует, становясь только сильнее.`,
                    11: `<b>11 дом (Водолей) — Падение</b><br>Сфера свободы, независимости и будущего. Тотальный паралич для закрытой и контролирующей Королевы Кубков. Сталкиваясь с непредсказуемыми форс-мажорами или интеллектуальной, холодной средой Водолея, человек теряет способность удерживать свои накопленные результаты и тайны. Опыт обнуляется, а попытки утаить скрытые мотивы разбиваются о независимость и отстраненность партнера или коллектива.`,
                    12: `<b>12 дом (Рыбы) — Глубокое кармическое принятие</b><br>В сфере изоляции, подведения итогов и скрытых кармических процессов человек остается наедине со всем накопленным негативом и позитивом. Это роль полного погружения в свое бессознательное, где личность переваривает самые тяжелые психологические травмы в тишине и одиночестве, мистическим образом принимая последствия своих прошлых действий.`
                }
            },
            50: {
                name: "Король Кубков",
                general: `В системе астрологического Таро Юрия Хана фигурная карта <b>Король кубков (Король воды)</b> относится к третьей, социальной зоне гороскопа, соответствует двенадцатому дому (знак Рыб) и управляется планетой <b>Нептун</b> (внутренний управитель — Юпитер). Фигурные карты описывают не врожденный характер, а осознанные социальные роли и шаблоны поведения, которые человек принимает в ответ на требования среды или выстраивает сам на высоком уровне духовного развития.<br><br>Общая трактовка этой роли синтезирует <b>четыре ключевые версии</b>, объединяющие философский символизм Уэйта и психологию Манары:<br><b>1. Тайный стратег и миротворец (по Уэйту):</b> Это наивысшая стадия мужского социального развития. Человек принимает самостоятельные решения, влияющие на других, но, в отличие от Короля мечей (который действует открыто), Король кубков действует скрытно. Он себе на уме, его мотивы неочевидны, он не вступает в открытое противостояние, но при этом виртуозно направляет ситуацию. Он выступает тайным миротворцем, сглаживающим углы в обход официальных правил.<br><b>2. Создатель незыблемого романтического образа (по Манаре):</b> В интимных отношениях эта роль описывает способность партнера (чаще мужчины) преодолеть потерю физической страсти и увядание тела. Человек сознательно формирует в своей голове устойчивый, иллюзорный и прекрасный романтический образ партнерши, который вытесняет стареющую реальность. Этот "остров" любви и нежности остается с парой до самой старости, позволяя им видеть друг в друге ангелов.<br><b>3. Кармический учитель-целитель (Синтез):</b> Это человек, который обладает глубочайшей эмпатией и видит кармические ошибки и повторяющиеся паттерны других людей. Он не использует эти знания во вред, а выступает в роли хирурга или "Доктора Хауса": вскрывает гнойник проблемы, чтобы исцелить человека, давая ему ровно столько испытаний, сколько тот способен вынести.<br><b>4. Иллюзорный спасатель и "мутный" манипулятор (Негативный полюс):</b> В перевернутом или искаженном виде человек становится совершенно непонятным для окружающих. Он задает вопросы, скрывая свои мотивы, затягивает в пустые разговоры или выполняет простейшие обязанности с таким пафосом, словно спасает человечество (играет в жертвенного спасителя ради корыстных выгод).<br>Ниже представлен детальный отчет по проявлению роли Короля кубков во всех 12 домах гороскопа (особые положения распределены по астрологическим достоинствам Нептуна).`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br><i>Тайная личная инициатива.</i> Человек начинает новые дела или отношения не с агрессивного напора, а с мягкого, интуитивного погружения. Он действует крайне осторожно, держа свои истинные мотивы в тайне. Личная инициатива здесь не бросается в глаза; человек предпочитает направлять ситуацию из-за кулис, создавая вокруг себя ауру загадочности и абсолютного спокойствия, сбивая с толку конкурентов.`,
                    2: `<b>2 дом (Телец)</b><br><i>Иллюзорность материальных ресурсов.</i> В сфере финансов и тела человек относится к ресурсам философски. Он может зарабатывать деньги не вполне прозрачными или тайными путями. В отношениях ценит партнера не за физическую форму или материальный достаток, а за ту глубокую эмоциональную отдачу, которую тот может предоставить. В негативе — полное неумение управлять бюджетом, утечка средств "сквозь пальцы" или жизнь в иллюзиях о своем богатстве.`,
                    3: `<b>3 дом (Близнецы) — Второе изгнание</b><br>Сфера повседневных контактов, братьев/сестер и простого общения. Нептун здесь изгоняется. Естественный обмен информацией подменяется ролью "мутного товарища". Вступая в разговор, человек не говорит о себе, ведет себя предельно уклончиво, но при этом активно выпытывает личную информацию у собеседника. Окружающие не понимают, чего он от них хочет, к чему клонит и зачем вообще завел этот разговор. В негативе это "потерянный собеседник", который делает вид, что слушает, но на самом деле витает в собственных фантазиях.`,
                    4: `<b>4 дом (Рак)</b><br><i>Идеализированное душевное убежище.</i> Дом и семья воспринимаются как сакральное место, полностью закрытое от социума. Человек выстраивает в своей семье атмосферу мистического доверия, где все понимают друг друга без слов. Однако он может слишком идеализировать домочадцев, закрывая глаза на их реальные недостатки. Он играет роль сказочного принца или идеального отца, не желая замечать суровых бытовых проблем.`,
                    5: `<b>5 дом (Лев) — Падение</b><br>Сфера радости, сознательного эгоизма, творчества и влюбленности. Нептунианские карты здесь падают. Тотальный крах в попытках сыграть роль яркого, классического любовника или творца. Человек в этой роли оказывается маргиналом, непризнанным гением или уличным музыкантом, у которого нет ни гроша за душой, но есть богатый внутренний мир. Женщина, заводя такого любовника, сталкивается с тем, что он абсолютно неспособен на яркие, царственные поступки. Он мутный, странный, непредсказуемый и часто требует жертвенности от самой женщины, становясь для нее обузой.`,
                    6: `<b>6 дом (Дева) — Первое изгнание</b><br>Сфера рутины, бытовых обязанностей и служения. Для Нептуна это изгнание. Человек пытается применить свою мистическую, жертвенную роль там, где требуется простая и четкая работа. В отношениях (особенно мужских) это проявляется как комичный пафос: мужчина моет за собой посуду или стирает белье, но делает это с таким видом, будто спасает мир или делает великое одолжение. Это формальная, искаженная "помощь", которая больше похожа на манипуляцию чувством вины, чем на реальное партнерское разделение обязанностей.`,
                    7: `<b>7 дом (Весы)</b><br><i>Кармический брачный союз.</i> Вступая в брак или подписывая договоры, человек не признает формальных юридических рамок. Для него партнерство — это глубокая духовная связь. Он готов прощать супругу многое, оправдывая его поступки кармической необходимостью или Высшей волей. Если роль искажена, партнер по браку оказывается "тайным любовником" для других или человеком, который годами ведет двойную жизнь, искусно скрывая это от супруга.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Тайная сексуальная трансформация.</i> Столкнувшись с кризисом или вступая в глубокий сексуальный контакт, человек действует как алхимик. Он способен перевести животную страсть в высшую форму духовного экстаза. В социальном плане эта позиция часто отыгрывается как роль "тайного любовника" (или любовницы), о существовании которого никто не подозревает, но который оказывает колоссальное влияние на трансформацию и энергетику партнера.`,
                    9: `<b>9 дом (Стрелец) — Вторая обитель</b><br>Нептун является вторым управителем девятого дома. Роль кармического учителя здесь выходит на социальный уровень. Человек использует свою интуицию и знание человеческих слабостей, чтобы стать духовным или идеологическим наставником. Он не диктует правила жестко, а создает систему ценностей, в которую люди верят добровольно. Он способен исцелять чужие души, помогая окружающим осознать свои глобальные жизненные цели.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Скрытый социальный статус.</i> В сфере карьеры и жизненных целей человек достигает вершин не прямым путем, а через серые схемы, тайную дипломатию или работу в закрытых структурах (например, спецслужбы, психиатрия, закрытые фонды). Это "серый кардинал", чья реальная власть огромна, но социальный статус может выглядеть скромно. На работе он руководствуется интуицией и высшим опытом, часто принимая решения, логику которых невозможно объяснить системе.`,
                    11: `<b>11 дом (Водолей) — Экзальтация</b><br>Сфера независимости, коллективов и будущего. Для Нептуна это зона сверхнапряжения. Человек вынужден включить всю свою эмпатию и интуицию ради сохранения дружбы или коллектива. Он жертвует собственным эгоизмом, чтобы глубоко понять страхи и нужды партнера, давая ему чувство абсолютной безопасности перед лицом непредсказуемого будущего. Это высшая форма дружеской и духовной синхронизации. В негативе — создание иллюзии свободы, когда за маской дружеской отрешенности скрываются тайные, мстительные и далеко идущие планы.`,
                    12: `<b>12 дом (Рыбы) — Первая обитель</b><br>Здесь роль находится в своей идеальной, родной среде. Человек гениально выстраивает тайные социальные или семейные процессы, полностью контролируя ситуацию без видимого давления. В отношениях это создание того самого уникального "острова" (по Манаре), где пара живет по своим глубоко интимным, мистическим правилам, непонятным социуму. Партнеры относятся друг к другу с абсолютным принятием, прощая недостатки и сохраняя романтический трепет до глубокой старости. В негативе — тотальный уход от реальности, тайные измены или алкогольные иллюзии, когда человек скрывает правду даже от себя.`
                }
            },
            61: {
                name: "Паж Мечей",
                general: `В астрологической системе Таро Юрия Хана фигурные карты (карты двора) описывают не столько врожденную психологию, сколько осознанные социальные роли и шаблоны поведения, которые человек принимает в зависимости от ситуации,. Младший аркан <b>Паж мечей (Паж воздуха в колоде Манара)</b> относится к первой зоне гороскопа (подсознательной) и стихии воздуха, соответствуя третьему дому (знак Близнецов) и управляясь планетой <b>Меркурий</b>,.<br><br>Общая трактовка этой социальной маски (или базовой прошивки личности) синтезирует <b>четыре ключевые версии</b>, опирающиеся на логику Уэйта и Манары:<br><b>1. Компетентность среднего уровня (по Уэйту):</b> Это социальная роль ученика или молодого специалиста, который хорошо умеет делать то, что умеют все подобные ему люди. Человек получил базовое образование в своей области и способен качественно выполнять свои функции на начальном уровне, выступая надежным рядовым исполнителем, а не «тупым генералом»,.<br><b>2. Естественный поведенческий автоматизм (Синтез):</b> Карта описывает наши самые обычные, привычные действия, доведенные до автоматизма. В бытовом плане это естественная реакция организма: например, когда человек после еды автоматически встает и уходит (в примитивном варианте) или машинально моет за собой посуду (в более развитом), не акцентируя на этом внимания и не считая это подвигом.<br><b>3. Роль аутсайдера и некомпетентность (в негативе):</b> При перевернутом или искаженном положении аркан указывает на жесткую роль неудачника. Это человек, который «ниже среднего уровня», не дотягивает до нормальной среднестатистической планки. Окружающие или система транслируют ему, что он ни на что не способен, что у него «руки из одного места», превращая его в социального изгоя.<br><b>4. Поверхностный контакт и позиция неопытности (по Манаре):</b> В межличностных отношениях человек надевает маску молодого, неопытного персонажа, который вступает в общение ради сбора информации или любопытства. Он не готов брать на себя взрослую ответственность, свойственную рыцарям или королям, ограничиваясь легким информационным взаимодействием и обучением.<br>Поскольку Паж мечей подчиняется Меркурию, его особые положения распределены по астрологическим достоинствам этой планеты.`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br><i>Интеллектуальный старт.</i> На старте новых проектов или при знакомстве человек избегает агрессивного марсианского напора. Он примеряет на себя роль вежливого ученика или информатора. Его первый шаг — это сбор данных, разговор или сообщение, лишенное сильного лидерского давления. Личная инициатива здесь сводится к установлению поверхностного ментального контакта.`,
                    2: `<b>2 дом (Телец)</b><br><i>Базовый заработок.</i> В сфере финансов, тела и накопления ресурсов личность предлагает рынку свои среднестатистические навыки. Человек зарабатывает ровно столько, сколько стоит его стандартное образование и рядовой труд. К партнеру он относится с практичной позиции, предлагая себя как надежного, но не выдающегося спутника, лишенного претензий на элитарный статус.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель</b><br><i>Естественная компетентность.</i> Идеальная и родная среда для этой роли. Человек находится абсолютно на своем месте, выступая в роли адекватного собеседника или грамотного специалиста базового уровня. Он обладает нужными знаниями, говорит просто и по делу, его действия логичны и понятны окружающим. В отношениях это легкое интеллектуальное общение, где партнер предстает интересным учеником или приятным компаньоном без лишнего пафоса.`,
                    4: `<b>4 дом (Рак)</b><br><i>Простая домашняя роль.</i> В интимном пространстве семьи и безопасности человек ведет себя крайне безыскусно, опираясь на усвоенные с детства привычки. Он может играть роль послушного (или капризного) ребенка, который выполняет базовые указания родителей или партнера. В быту преобладает поведенческий автоматизм без глубокого погружения в переживания окружающих.`,
                    5: `<b>5 дом (Лев) — Падение</b><br><i>Провал уникальности.</i> Сфера творчества, яркого эгоизма, радости и любви, где Меркурий (и Паж мечей) падает. Пытаясь продемонстрировать свою яркость, харизму или пылкую влюбленность, человек выглядит банально и неинтересно. Его воспринимают как "серость", не дотягивающую до королевских амбиций Льва. Желание выделиться разбивается о недостаток творческой энергии, превращая романтический флирт в сухое, сухое ученическое общение.`,
                    6: `<b>6 дом (Дева) — Вторая обитель</b><br><i>Методичный исполнитель.</i> Сфера служения, здоровья и рутины, где Меркурий выступает управителем. Здесь роль исполнителя доводится до практического автоматизма. Человек воспринимает повседневную работу как естественную необходимость: он скрупулезно, без лишних амбиций делает свое дело. В партнерстве это готовность брать на себя понятные бытовые функции, опираясь на логику и методичность, не требуя за это особых наград.`,
                    7: `<b>7 дом (Весы)</b><br><i>Поверхностное партнерство.</i> Вступая в брак или официальный договор, человек воспринимает свои обязательства через призму логики и общения, но ему не хватает взрослой, солидной ответственности (в отличие от Королей). Партнерство строится на уровне "студенческого союза" — много слов, легкий обмен информацией, но при серьезных кризисах роль простого исполнителя может оказаться слишком слабой для сохранения пары.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Анализ кризиса.</i> Столкнувшись с экстримом, трансформацией или опасностью, личность блокирует животную панику рациональным умом. Человек изучает сложную ситуацию как студент на лабораторной работе, собирая факты вместо того, чтобы глубоко вовлекаться эмоционально. В сфере секса это акцент на технику, чтение литературы и разговоры, что часто заменяет подлинную страсть.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание</b><br><i>Дефицит авторитета.</i> Сфера социальных идеалов, высшего образования и авторитетов. Катастрофическое положение, где мелкая и конкретная роль Пажа мечей вступает в острый конфликт с масштабными требованиями Стрельца. Пытаясь выступать в роли гуру или идеолога, человек выглядит как некомпетентный выскочка, чьи знания не дотягивают до уровня. Социум транслирует ему, что у него «руки растут не из того места» для таких глобальных задач.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Роль рядового подчиненного.</i> В зоне карьеры, жесткой иерархии и социальной ответственности человек занимает начальную ступень. Это позиция рядового сотрудника, клерка или стажера, который четко выполняет должностные инструкции, не претендуя на кресло начальника. В негативном варианте это жалоба на то, что "свободных мест наверху нет" и отказ брать на себя ответственность за взрослую карьерную жизнь.`,
                    11: `<b>11 дом (Водолей) — Экзальтация</b><br><i>Сверхинтеллектуальная адаптация.</i> Зона свободы, форс-мажоров и будущего. Здесь ментальная энергия аркана достигает высшей точки напряжения. Сталкиваясь с непредсказуемым коллективом или шокирующими переменами, человек виртуозно использует маску молодого, неопытного ученика. Он гениально быстро усваивает новую информацию, находит нестандартные логические связки и легко адаптируется к любым водолейским странностям, не боясь показаться смешным.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание</b><br><i>Информационный тупик.</i> Сфера мистики, кармы, тайн и подведения итогов. Логика, слова и базовая эрудиция здесь полностью обесцениваются. Пытаясь разобраться в мутной, запутанной ситуации с помощью простых алгоритмов и привычного общения, человек заходит в тупик. Его рациональная маска ученика терпит крах перед лицом неконтролируемого бессознательного, делая его наивным и потерянным аутсайдером.`
                }
            },
            62: {
                name: "Рыцарь Мечей",
                general: `В системе астрологического Таро Юрия Хана фигурные карты описывают не внутренний характер человека, а социальные роли и шаблоны поведения, которые он вынужден принимать под давлением внешней ситуации,. Младший аркан Рыцарь мечей (Всадница воздуха в колоде Манара) относится к седьмому дому гороскопа (знак Весов), управляется планетами Венера и Хирон, и символизирует вступление в договорные, партнерские отношения,.<br><br>Общая трактовка этой базовой социальной роли включает 4 ключевые версии, синтезирующие колоды Уэйта и Манары:<br><b>1. Исполнитель чужих приказов (по Уэйту).</b> Это роль человека (часто силовика, полицейского или военного), у которого есть средства и оружие, но нет права принимать самостоятельные решения,. Он действует строго в рамках закона или приказа, исходящего от вышестоящих инстанций (Королев), не имея свободы распоряжаться судьбами других людей по своему усмотрению,.<br><b>2. Готовность к договору и Жених (по Уэйту).</b> Рыцарь мечей описывает человека, который активно предлагает сотрудничество или брак. Это стадия «договора о намерениях», когда личность еще не взяла на себя окончательные обязательства (как Королева мечей), но уже демонстрирует полную готовность стать партнером. В межличностных отношениях это классическая роль жениха, делающего официальное предложение.<br><b>3. Мирное сосуществование и подстройка (по Манаре).</b> На карте Всадница воздуха женщина спокойно едет на коне, больше ни к чему его не принуждая. Это этап, когда агрессивная борьба между полами закончена, война прекращена, и начинается мирное сосуществование пары,. Женщина учится подстраиваться под партнера, привыкает к нему и начинает управлять им без насилия, не ломая его изначальную природу,.<br><b>4. Агрессивный протест и конфликт (в негативе).</b> В перевернутом положении или при сильном искажении роли человек категорически не согласен со своим зависимым статусом или законами коллектива. Он становится резким, конфликтным, агрессивно отстаивает личные интересы в ущерб партнерству и часто выступает инициатором разрыва отношений или супружеского развода,.<br>Поскольку Рыцарь мечей управляется Венерой и Хироном, его особые положения распределяются по астрологическим достоинствам этих планет в зодиакальном круге.<br><br>### Особые положения Рыцаря мечей<br><br><b>7 дом (Весы) — Первая обитель. Идеальный переговорщик.</b> Естественная, родная среда для аркана, где человек гениально выполняет роль партнера. Он открыто демонстрирует готовность к договору и ведет себя как идеальный «жених» или надежный переговорщик. Даже в перевернутом виде эта карта в своем доме означает позитивный посыл: человек искренне хочет освоить правильную роль партнера и вступить в союз, просто делает это пока неуклюже, поспешно или смущаясь,.<br><br><b>2 дом (Телец) — Вторая обитель. Прагматичное партнерство.</b> В сфере личных ресурсов, тела и материи навыки переговорщика используются исключительно для достижения материального комфорта. Человек применяет дипломатию и готовность договариваться ради сохранения или преумножения своей финансовой стабильности. Он готов подстраиваться под партнера (как Всадница воздуха Манары) ровно до тех пор, пока этот союз гарантирует ему ощутимую физиологическую и имущественную выгоду.<br><br><b>1 дом (Овен) — Первое изгнание. Поиск помощника.</b> В сфере личной инициативы и старта человек сталкивается с глубокой проблемой: он понимает, что в одиночку ни за что не справится со своей задачей,. Ситуация требует обязательного привлечения сторонних сил. По прямому Рыцарю мечей человек стремительно носится в поисках партнера или помощника, с которым можно объединиться («я один не потяну, но сейчас найду того, с кем мы это сделаем»),. В перевернутом виде — это парализующий страх и бессилие от невозможности найти нужную связь для старта.<br><br><b>8 дом (Скорпион) — Второе изгнание. Вынужденное повторение.</b> В зоне экстрима, глубокой трансформации и чужих ресурсов дипломатичная партнерская роль проходит суровую проверку. Сталкиваясь с кризисом, человек не получает желаемого результата с первого раза. Перевернутый Рыцарь мечей здесь говорит о том, что для продолжения отношений или спасения ситуации придется искать совершенно новые, нестандартные подходы, так как старые привычные методы взаимодействия потерпели крах и повторять их бессмысленно.<br><br><b>3 дом (Близнецы) — Экзальтация. Виртуозный контакт (НЛП).</b> Высшая точка напряжения для планеты Хирон. В сфере повседневного общения и информации человек использует энергетику Рыцаря мечей для стремительного, виртуозного захвата чужого внимания. Это техника мощного «пикапа» или психологического НЛП: человек гениально находит нужные слова и темы, чтобы мгновенно зацепить собеседника и привязать его к себе, не давая даже шанса на отказ,. Цель любой болтовни здесь — предельно быстро установить партнерскую связь.<br><br><b>9 дом (Стрелец) — Падение. Крах субординации.</b> Сфера идеологии, социальных авторитетов и далеких перспектив, где мелкая дипломатия Хирона терпит тотальный крах. Пытаясь выстроить масштабные планы на совместное будущее или выступая в роли авторитетного наставника, человек по привычке использует модель поведения подчиненного исполнителя. Это приводит к потере уважения: социум не воспринимает всерьез партнера, который мыслит мелкими должностными договоренностями там, где от него требуется глобальная мудрость, идеологическая независимость и масштабное видение.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первое изгнание. Поиск помощника</b><br>В сфере личной инициативы и старта человек сталкивается с глубокой проблемой: он понимает, что в одиночку ни за что не справится со своей задачей,. Ситуация требует обязательного привлечения сторонних сил. По прямому Рыцарю мечей человек стремительно носится в поисках партнера или помощника, с которым можно объединиться («я один не потяну, но сейчас найду того, с кем мы это сделаем»),. В перевернутом виде — это парализующий страх и бессилие от невозможности найти нужную связь для старта.`,
                    2: `<b>2 дом (Телец) — Вторая обитель. Прагматичное партнерство</b><br>В сфере личных ресурсов, тела и материи навыки переговорщика используются исключительно для достижения материального комфорта. Человек применяет дипломатию и готовность договариваться ради сохранения или преумножения своей финансовой стабильности. Он готов подстраиваться под партнера (как Всадница воздуха Манары) ровно до тех пор, пока этот союз гарантирует ему ощутимую физиологическую и имущественную выгоду.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация. Виртуозный контакт (НЛП)</b><br>Высшая точка напряжения для планеты Хирон. В сфере повседневного общения и информации человек использует энергетику Рыцаря мечей для стремительного, виртуозного захвата чужого внимания. Это техника мощного «пикапа» или психологического НЛП: человек гениально находит нужные слова и темы, чтобы мгновенно зацепить собеседника и привязать его к себе, не давая даже шанса на отказ,. Цель любой болтовни здесь — предельно быстро установить партнерскую связь.`,
                    4: `<b>4 дом (Рак)</b><br><i>Охрана семейных границ.</i> В интимном пространстве дома человек играет роль бдительного стража. Он не стремится устанавливать глубокую душевную или родственную близость, а действует как официальный партнер, защищающий свою базовую территорию. Он четко следует установленным семейным регламентам, охраняя покой домочадцев от внешнего вмешательства исключительно формальными методами.`,
                    5: `<b>5 дом (Лев)</b><br><i>Демонстративное предложение связи.</i> В сфере эгоизма, любви, радости и творчества человек использует партнерские навыки как элемент яркой публичной игры. Он активно и напористо демонстрирует свою готовность к романтическим отношениям, превращая ухаживания в театральный спектакль, где главная цель — потешить свое эго через быстрое и успешное соблазнение.`,
                    6: `<b>6 дом (Дева)</b><br><i>Служебное подчинение.</i> Выполняя рутинную работу или занимаясь тяжелым бытом, личность ведет себя как идеальный, но полностью лишенный самостоятельной инициативы исполнитель. Человек строго и буквально следует должностным инструкциям работодателя или бытовым просьбам супруга, выполняя свою часть договора абсолютно сухо и без лишних эмоций.`,
                    7: `<b>7 дом (Весы) — Первая обитель. Идеальный переговорщик</b><br>Естественная, родная среда для аркана, где человек гениально выполняет роль партнера. Он открыто демонстрирует готовность к договору и ведет себя как идеальный «жених» или надежный переговорщик. Даже в перевернутом виде эта карта в своем доме означает позитивный посыл: человек искренне хочет освоить правильную роль партнера и вступить в союз, просто делает это пока неуклюже, поспешно или смущаясь,.`,
                    8: `<b>8 дом (Скорпион) — Второе изгнание. Вынужденное повторение</b><br>В зоне экстрима, глубокой трансформации и чужих ресурсов дипломатичная партнерская роль проходит суровую проверку. Сталкиваясь с кризисом, человек не получает желаемого результата с первого раза. Перевернутый Рыцарь мечей здесь говорит о том, что для продолжения отношений или спасения ситуации придется искать совершенно новые, нестандартные подходы, так как старые привычные методы взаимодействия потерпели крах и повторять их бессмысленно.`,
                    9: `<b>9 дом (Стрелец) — Падение. Крах субординации</b><br>Сфера идеологии, социальных авторитетов и далеких перспектив, где мелкая дипломатия Хирона терпит тотальный крах. Пытаясь выстроить масштабные планы на совместное будущее или выступая в роли авторитетного наставника, человек по привычке использует модель поведения подчиненного исполнителя. Это приводит к потере уважения: социум не воспринимает всерьез партнера, который мыслит мелкими должностными договоренностями там, где от него требуется глобальная мудрость, идеологическая независимость и масштабное видение.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Исполнение приказов системы.</i> В сфере социальной реализации, карьеры и взаимодействия с государственной машиной человек вынужденно принимает позицию рядового «солдата». Он становится слепым инструментом системы, беспрекословно исполняя законы и приказы сверху, совершенно не имея полномочий на личную инициативу или принятие глобальных стратегических решений,,.`,
                    11: `<b>11 дом (Водолей)</b><br><i>Дружеский поверхностный договор.</i> Сталкиваясь с форс-мажорами, коллективами и водолейской независимостью, человек выстраивает отношения на основе абсолютной свободы от претензий. Партнерство заключается легко и быстро, носит характер ни к чему не обязывающего дружеского соглашения и может быть расторгнуто в любой момент при первом же изменении обстоятельств.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Тайные договоренности.</i> В сфере изоляции, кармы и скрытых итогов человек заключает неформальные, часто невидимые для общества союзы. Он действует закулисно, опираясь на интуицию, и играет роль тайного кулуарного переговорщика, чьи истинные мотивы, связи и пункты соглашений остаются полной загадкой для окружающего мира.`
                }
            },
            63: {
                name: "Королева Мечей",
                general: `В системе астрологического Таро Юрия Хана фигурные карты описывают осознанные социальные роли и шаблоны поведения, которые человек принимает в ответ на требования ситуации. Младший аркан <b>Королева мечей (Королева Воздуха в колоде Манара)</b> относится ко второй, социальной зоне гороскопа, соответствует седьмому дому (знаку Весов) и управляется планетами Хирон и Венера.<br><br>Общая трактовка этой социальной маски объединяет <b>четыре ключевые версии</b>, синтезирующие классический символизм Уэйта и психологию Манары:<br><b>1. Миротворец и удержание баланса (по Уэйту).</b> Это роль человека, чья главная задача — сохранять равновесие и избегать открытой войны. Королева мечей транслирует статику и неизменность; она сдерживает давление и стабилизирует ситуацию, даже если для этого приходится игнорировать личные чувства.<br><b>2. Администратор-исполнитель (Синтез).</b> Это стадия старшего офицерского состава или управленца. Королева мечей уже имеет право распоряжаться действиями других людей (в отличие от Рыцаря мечей), но делает это в рамках приказа, спущенного свыше «королями». Она не принимает глобальных стратегических решений, но выбирает средства для удержания контроля.<br><b>3. Умная жена и правильное партнерство (по Манаре).</b> Королева Воздуха описывает женщину, которая идеально и правильно исполняет роль супруги. Она привлекает внимание партнера к себе, предлагает взаимодействие, но не настаивает и не навязывается, готовая открыться лишь тогда, когда мужчина сам будет к этому готов.<br><b>4. Холодный диктат и угроза разрыва (В негативе).</b> При искажении энергии (перевернутая карта) неспособность удержать баланс приводит к прямому диктату. Человек перестает договариваться, начинает навязывать свои правила партнеру в одностороннем порядке, что в семейной жизни часто является прямым указанием на развод и разрушение союза.<br>Ниже представлен детальный анализ проявления роли Королевы мечей во всех 12 домах гороскопа.`,
                houses: {
                    1: `<b>1 дом — Первое изгнание</b><br><b>Привлечение помощника</b> Зона личной инициативы и базовой энергетики. Здесь Королева мечей находится в изгнании, что означает неспособность или нежелание человека решать свои проблемы в одиночку. Сталкиваясь с вызовом, личность не действует сама, а использует уже имеющиеся у нее связи и договоренности, чтобы привлечь к решению вопроса партнера или специалиста («у меня есть с кем это сделать»).`,
                    2: `<b>2 дом — Вторая обитель</b><br><b>Материальный договор</b> Сфера личных ресурсов, тела и финансов. Человек применяет свои партнерские, дипломатические навыки исключительно для удержания материального комфорта. Роль «правильной жены» или надежного партнера используется как инструмент для обеспечения финансовой стабильности и получения ресурсов от союза, где все взаимные обязательства четко оговорены.`,
                    3: `<b>3 дом — Экзальтация</b><br><b>Культурная дистанция</b> Сфера повседневных контактов и рутинного общения. Здесь энергия партнерства достигает высшего напряжения. Человек демонстрирует подчеркнуто вежливую, дипломатичную, но при этом требовательную манеру общения. Это мастерское выстраивание дистанции, при котором к собеседнику обращаются крайне культурно («Извините, можно ли к вам обратиться»), но в негативном варианте это перерастает в снобизм и высокомерный диктат правил ведения диалога.`,
                    4: `<b>4 дом</b><br><b>Регламентированный уют</b> В интимном пространстве дома и семьи человек избегает глубокого эмоционального слияния. Он ведет себя как строгий администратор своей территории: устанавливает для домочадцев и гостей четкие правила поведения, следит за порядком и формально выполняет обязанности хозяйки (или хозяина) дома, сохраняя внутреннюю холодность и психологическую дистанцию.`,
                    5: `<b>5 дом</b><br><b>Серьезный фасад</b> Сфера радости, эгоизма, творчества и влюбленности. Сталкиваясь с романтическими чувствами, человек не способен на спонтанную, детскую игру. Он сразу же надевает на себя серьезную маску постоянного партнера или «строгой жены». Это блокировка естественного творческого импульса сухой статикой: флирт превращается в формальность, а влюбленность лишается радости из-за попыток сразу всё регламентировать.`,
                    6: `<b>6 дом</b><br><b>Стабильное служение</b> Выполняя повседневные обязанности, бытовую или профессиональную рутину, личность действует как надежный и неизменный винтик системы. Человек готов работать очень долго на одном месте, четко соблюдая условия контракта. Он никуда не спешит, не требует быстрого карьерного роста, но безупречно выполняет свою часть договора, воспринимая труд как стационарную обязанность.`,
                    7: `<b>7 дом — Первая обитель</b><br><b>Идеальное партнерство</b> Естественная и самая гармоничная среда для Королевы мечей. Человек гениально выстраивает парные отношения. Он абсолютно четко понимает свои права и обязанности в союзе, умеет удерживать баланс интересов и не позволяет конфликтам разрушить брак. Это роль идеального переговорщика и правильного супруга, который сохраняет стабильность пары, даже если личные эмоции пытаются взять верх.`,
                    8: `<b>8 дом — Второе изгнание</b><br><b>Искусственное затягивание</b> В зоне глубоких трансформаций, экстрима и получения результатов Королева мечей дает сбой. Вместо того чтобы пережить кризис, трансформироваться и получить окончательный итог (смерть старого ради нового), человек пытается заморозить ситуацию. Он искусственно продолжает процесс выяснения отношений, делая вид, что всё нормально, чтобы избежать болезненного, но необходимого разрыва или радикальной трансформации.`,
                    9: `<b>9 дом — Падение</b><br><b>Неуместный диктат</b> В сфере формирования долгосрочного будущего, идеологии и социальных авторитетов дипломатия Королевы мечей терпит крах. Там, где необходимо находить искреннее взаимное согласие и духовное единение (по Дьяволу), человек включает административный диктат. Это поведение по принципу «мы посовещались, и я решила», когда один партнер навязывает другому свои правила игры, полностью разрушая идею равноправного союза.`,
                    10: `<b>10 дом</b><br><b>Административный контроль</b> При столкновении с объективной реальностью, государством или в вопросах высшей карьеры, человек занимает позицию уверенного управленца среднего звена. Он не формирует законы сам, но мастерски распоряжается подчиненными для выполнения спущенных сверху планов. Это роль системного администратора, который обеспечивает бесперебойную работу структуры и удерживает коллектив в жестких рамках субординации.`,
                    11: `<b>11 дом</b><br><b>Отстраненное наблюдение</b> Находясь в кругу друзей, коллективов или сталкиваясь с водолейским форс-мажором, личность использует маску партнерства для сохранения собственной независимости. Отношения выстраиваются корректно, но подчеркнуто формально. Человек дистанцируется от непредсказуемого хаоса, защищая свои личные границы правилами и договоренностями, чтобы не стать жертвой чужой свободы.`,
                    12: `<b>12 дом</b><br><b>Скрытое равновесие</b> В сфере изоляции, тайн и кармических последствий человек играет роль тайного регулятора. Он негласно и незаметно для окружающих управляет процессами, удерживая баланс в самых запутанных и мистических ситуациях. Свои обязательства перед миром или партнером он выполняет за кулисами, хладнокровно неся свой крест кармических договоренностей без жалоб и демонстративности.`
                }
            },
            64: {
                name: "Король Мечей",
                general: `В системе астрологического Таро Юрия Хана фигурные карты описывают осознанные социальные роли и шаблоны поведения, которые человек принимает в ответ на требования среды, а не его врожденный характер. Младший аркан <b>Король мечей (Король Воздуха в колоде Манара)</b> относится к третьей (социальной) зоне гороскопа, соответствует одиннадцатому дому (знак Водолея) и управляется планетой <b>Уран</b> (внутренний управитель — Сатурн). Эта карта символизирует высочайший уровень мужской интеллектуальной ответственности и стратегического планирования.<br><br>Общая трактовка этой социальной роли синтезирует <b>четыре ключевые версии</b>, объединяя классический символизм Уэйта и психологию Манары:<br><b>1. Независимый интеллектуал и стратег (по Уэйту).</b> Это роль человека холодного разума, который полностью освобожден от власти природных инстинктов, физиологических проблем и сиюминутных эмоций. Он смотрит на суету со стороны, блестяще анализирует реальность и способен принимать абсолютно самостоятельные, новаторские решения ради будущего, часто жертвуя ради него комфортом настоящего.<br><b>2. Тайный манипулятор под маской простака (по Манаре).</b> Король Воздуха понимает, что его нестандартный интеллект делает его «белой вороной». Чтобы избежать давления толпы, он намеренно играет роль простака или друга, дезинформируя окружающих о своих истинных планах. Он обходит препятствия с помощью хитрости, НЛП и манипуляций, не вступая в открытый конфликт.<br><b>3. Реформатор и спаситель (Синтез).</b> Высшая стадия мужского социального развития. В отличие от Короля пентаклей, который просто терпит тяжесть обстоятельств, Король мечей предлагает нестандартные выходы из кризиса. Он берет на себя ответственность за пару или социум, придумывая решения, которые спасут всех от краха, выступая истинным товарищем и стратегом.<br><b>4. Криминальный циник (В негативе).</b> При искажении энергии (перевернутая карта) интеллект отрывается от реальности. Человек отказывается выполнять свои базовые обязанности, становится безответственным теоретиком или манипулятором, который преследует криминальные или корыстные цели, оправдывая их «особым» взглядом на мир.<br>Поскольку Король мечей управляется Ураном, его особые положения строго распределяются по астрологическим достоинствам этой планеты в Зодиаке.`,
                houses: {
                    1: `<b>1 дом (Овен) — Ментальная инициатива</b><br>На старте любых проектов или отношений человек категорически избегает слепой марсианской агрессии. Его первый импульс — это всегда холодный расчет и сбор информации. Он инициирует контакт не через напор, а через интеллектуальное позиционирование, сразу демонстрируя партнеру свои правила игры и стратегическое видение.`,
                    2: `<b>2 дом (Телец) — Падение. Интеллектуальный паралич</b><br>Уран падает в Тельце. Зона материального накопления, физиологии и комфорта. Гениальный стратег оказывается парализован сытой, ленивой стабильностью. Обладая всем необходимым, человек отказывается планировать будущее или внедрять реформы. Острый интеллект затупляется обилием ресурсов, и личность выбирает деградацию в комфорте вместо свободного, независимого полета мысли.`,
                    3: `<b>3 дом (Близнецы) — Виртуозный собеседник</b><br>В сфере повседневного общения, обучения и рутинных контактов человек общается предельно осознанно. Он использует коммуникацию для тонкого нейролингвистического программирования (НЛП) и манипуляций. Разговоры ведутся дружелюбно, но собеседник всегда держится на дистанции, выполняя роль шахматной фигуры в многоходовках Короля мечей.`,
                    4: `<b>4 дом (Рак) — Второе изгнание. Искусственная дистанция</b><br>Сфера интимной безопасности, семьи и релакса. Уран здесь изгоняется. В кругу семьи человек отказывается от душевной близости и глубокого родственного слияния. Он устанавливает с домочадцами подчеркнуто дружеские, но холодные отношения. Дом превращается в место интеллектуальных экспериментов, где под маской дружбы скрывается тонкая манипуляция и категорическое нежелание впускать кого-либо в свою душу.`,
                    5: `<b>5 дом (Лев) — Первое изгнание. Холодная игра</b><br>Сфера радости, эгоизма, творчества и влюбленности, где Уран находится в изгнании. Острый конфликт между необходимостью проявлять искреннюю страсть и водолейским холодным разумом. Вступая в романтические отношения, человек ведет себя не как пылкий любовник, а как отстраненный друг или холодный аналитик. Он блокирует естественную радость ментальными конструкциями, что партнер воспринимает как обидную дистанцию и отсутствие настоящей любви.`,
                    6: `<b>6 дом (Дева) — Инновационная рутина</b><br>В повседневном труде, вопросах быта и здоровья человек отказывается быть слепым исполнителем. Он подходит к рутине как реформатор: автоматизирует процессы, внедряет новые технологии и оптимизирует служение. Его работа лишена эмоций, это чистый, холодный профессионализм, граничащий с научной деятельностью.`,
                    7: `<b>7 дом (Весы) — Договорное свободомыслие</b><br>В сфере брака и открытых конфликтов человек выстраивает союз на основе взаимной интеллектуальной свободы. Он предлагает партнеру модель «брака-дружбы», где нет места ревности и слиянию. Это равноправное партнерство двух независимых личностей, которые четко соблюдают личные границы и синхронизируют свои планы на будущее без эмоционального давления.`,
                    8: `<b>8 дом (Скорпион) — Экзальтация. Экстремальное планирование</b><br>Уран экзальтирует в Скорпионе. Сфера глубочайших кризисов, чужих ресурсов и сексуальной трансформации. Сталкиваясь с тяжелым испытанием или страстью, человек экстренно отключает панику и включает холодный рассудок. Вместо того чтобы просто проживать результат или наслаждаться им, его мозг на пике напряжения начинает молниеносно планировать будущее: «Что мы будем делать с этим дальше?».`,
                    9: `<b>9 дом (Стрелец) — Идеологический архитектор</b><br>Выходя в широкий социум или формируя мировоззрение, человек становится интеллектуальным авторитетом. Он не просто верит в идеалы, он их логически обосновывает и конструирует. Это позиция независимого мыслителя или ученого, чьи взгляды и философии опережают время и способны радикально изменить социальные нормы и законы.`,
                    10: `<b>10 дом (Козерог) — Вторая обитель. Ответственный стратег</b><br>Уран выступает вторым управителем Козерога. В зоне жесткой реальности и карьеры человек не просто несет крест обязательств, но и включает новаторский подход. Он становится тем руководителем или мужем, который в самую тяжелую минуту способен предложить гениальный план спасения. Это декларация: «Я не просто с тобой в горе, я придумаю, как нам из него выбраться и выжить».`,
                    11: `<b>11 дом (Водолей) — Первая обитель. Свободный интеллектуал</b><br>Здесь роль находится в своей идеальной, естественной среде. Человек выступает как абсолютно независимая личность и верный друг. Он выстраивает отношения на основе равенства и свободы от жестких обязательств. Его интеллект работает на опережение: он гениально предвидит варианты будущего и принимает решения, которые синхронизируются с реальностью, не нарушая личных границ партнера или коллектива.`,
                    12: `<b>12 дом (Рыбы) — Тайный стратег</b><br>В зоне изоляции, скрытой кармы и тайн независимый интеллект уходит в глубокое подполье. Человек управляет ситуацией или анализирует свое прошлое абсолютно незаметно для окружающих. Это «серый кардинал», который, находясь в тени, трезво оценивает кармические последствия чужих действий и плетет тончайшие интеллектуальные сети для подготовки к новому жизненному циклу.`
                }
            },
            75: {
                name: "Паж Пентаклей",
                general: `В астрологической системе Таро Юрия Хана фигурные карты символизируют осознанные социальные роли и модели поведения, которые человек выбирает или вынужден играть в зависимости от ситуации. Паж пентаклей (в колоде Манара — Паж Земли) относится ко второму дому гороскопа (знак Тельца) и управляется планетой Венера,. Эта масть переводит энергию в сферу конкретных материальных форм, тела, ресурсов и имущества.<br><br>Общая трактовка этой роли (по колодам Уэйта и Манара) включает <b>четыре ключевые версии</b>:<br><b>1. Независимый обладатель ресурса (по Уэйту):</b> Это социальная роль человека, у которого в наличии есть некая конкретная материальная ценность, навык или капитал. Он действует как свободный торговец: предлагает свои ресурсы социуму только тогда, когда ему самому нужны деньги или выгода, и не берет на себя лишних социальных обязательств.<br><b>2. Женщина, обладающая только телом (по Манаре):</b> В контексте сексуальных отношений (по колоде Манара) Паж Земли описывает женщину (или мужчину), чьим главным и единственным капиталом в социуме является ее физическое тело. Личность абсолютно адекватно оценивает свои природные данные и без комплексов пользуется ими для достижения целей,.<br><b>3. Откуп от проблем (Синтез):</b> Готовность потратить уже накопленные материальные или физические ресурсы ради того, чтобы решить надвигающуюся проблему, не применяя личную агрессию или инициативу,.<br><b>4. Эгоистичное потребление (В негативе):</b> При искажении энергии человек демонстрирует пренебрежительное отношение к собственному здоровью, телу или вещам, слепо и бездумно эксплуатируя то, что дано ему от природы, не заботясь об обслуживании и сохранении этого ресурса.<br>Поскольку Паж пентаклей управляется Венерой, его особые положения строго распределены по астрологическим достоинствам этой планеты в зодиакальном круге.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание</b><br><i>Материальный откуп от инициативы.</i> В зоне животного старта и марсианской активности человек подменяет естественную инициативу материальным вложением. Столкнувшись с необходимостью действовать лично, он предпочитает заплатить. При прямой карте у личности есть на это средства, и она успешно покупает решение проблемы (или откупается натурой). В негативном варианте (перевернутая карта) цена за откуп оказывается непомерно высокой, либо у человека просто не хватает денег и физических сил, чтобы закрыть эту проблему.`,
                    2: `<b>2 дом (Телец) — Первая обитель</b><br><i>Адекватное владение ресурсом.</i> Идеальная и естественная среда для карты. Человек абсолютно трезво и без иллюзий понимает, кто он такой, как он выглядит и какими материальными или физиологическими ресурсами обладает. В отношениях это позиция человека, который не обманывается насчет своей внешности или кошелька: он знает свою цену и предлагает партнеру ровно то, что у него есть, наслаждаясь своей венерианской природой без лишних комплексов,.`,
                    3: `<b>3 дом (Близнецы) — Прагматичный контакт</b><br>В зоне повседневного общения, обучения и поверхностных связей личность использует свои ресурсы для установления выгодных знакомств. Коммуникация лишена глубокой философии: человек общается только тогда, когда это приносит конкретную материальную пользу или физиологический комфорт, предлагая себя или свои навыки в качестве предмета для простого торга.`,
                    4: `<b>4 дом (Рак) — Телесная безопасность</b><br>В интимном пространстве семьи и дома человек опирается на свою форму и накопления как на гарант выживания. Он не склонен к глубокой эмпатии, предпочитая обеспечивать свою защищенность через наличие конкретных вещей, комфортной еды и телесного расслабления в своей «норе».`,
                    5: `<b>5 дом (Лев) — Демонстрация формы</b><br>В сфере влюбленности, радости, эгоизма и творчества природное естество выставляется напоказ. Человек использует свою телесную привлекательность, молодость или материальные возможности как главный инструмент флирта и игры. Это яркая, но поверхностная презентация своего "товара" ради получения сиюминутного удовольствия и восхищения.`,
                    6: `<b>6 дом (Дева) — Падение</b><br><i>Отказ от обслуживания.</i> В сфере рутины, служения и заботы о здоровье эта карта блокирует необходимость трудиться. Человек падает в состояние лени из-за наличия ресурсов: он наотрез отказывается убирать за собой, мыть посуду или лечиться, потому что у него много денег, чтобы оплатить прислугу, или пока еще много природного здоровья, чтобы игнорировать болезни,. В негативе это демонстративное пренебрежение своим организмом и порча здоровья. При прямой карте — это естественный здоровый образ жизни, который пока не требует медицинских вмешательств или таблеток.`,
                    7: `<b>7 дом (Весы) — Вторая обитель</b><br><i>Эгоистичное партнерство.</i> Вступая в брак или открытые договоренности, человек преследует исключительно свои личные интересы. В негативном варианте (перевернутая карта) это демонстративное игнорирование жизни партнера: человек живет рядом, но совершенно не интересуется делами супруга, используя его как фон для собственного удобства,. В позитивном проявлении личность показывает, что союз полностью удовлетворяет ее потребности, при этом ее личные интересы реализуются не в ущерб партнеру, но фокус все равно остается на собственной выгоде.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание</b><br><i>Заморозка ресурса в кризисе.</i> Сфера глубокой трансформации, экстрима и чужих денег. Здесь Паж пентаклей пытается сохранить свою форму. При прямой карте человек выходит из кризисной ситуации "при своих": он не тратит деньги на невыгодные сделки и сохраняет свое тело в неприкосновенности (секс или обмен не состоялся, но ресурс сохранен),. При перевернутой карте ресурс пропадает впустую: товар портится, деньги сгорают без пользы, а физическое взаимодействие не приносит никакого удовлетворения.`,
                    9: `<b>9 дом (Стрелец) — Материальный авторитет</b><br>Сталкиваясь с далекими перспективами, социальными авторитетами и мировоззрением, личность оценивает любые идеи строго через призму своего кошелька или тела. Высшее образование или духовный поиск признаются только в том случае, если они могут быть монетизированы или приносят ощутимое улучшение физического уровня жизни.`,
                    10: `<b>10 дом (Козерог) — Оплата за статус</b><br>В сфере карьеры, амбиций и взаимодействия с государственной системой человек занимает позицию наемника-прагматика. Он не рвется к абстрактной власти, а предлагает свои конкретные, измеримые навыки или свое тело ровно за ту цену, которую они объективно стоят, четко осознавая свои материальные границы в профессиональной иерархии.`,
                    11: `<b>11 дом (Водолей) — Финансовая независимость</b><br>В зоне форс-мажоров, реформ и коллективной свободы человек спасается от водолейского хаоса через опору на личный кошелек. Сталкиваясь с непредсказуемостью социума, он не ввязывается в идейные бунты, а просто отстраняется, сохраняя автономию за счет своих личных, неприкосновенных ресурсов, которыми он волен распоряжаться без оглядки на коллектив.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация</b><br><i>Жертвенность формы.</i> В сфере тайн, изоляции и кармических итогов (где Венера экзальтирует) телесные и материальные ресурсы достигают наивысшего напряжения. Человек готов пожертвовать своим телом, капиталом или физическим комфортом ради иллюзорного, мистического спасения или кармической отдачи. Ресурс здесь используется как инструмент для абсолютного слияния с ситуацией, когда материальное отдается ради духовного или тайного.`
                }
            },
            76: {
                name: "Рыцарь Пентаклей",
                general: `В астрологической системе Таро Юрия Хана фигурные карты описывают осознанные социальные роли и шаблоны поведения, которые человек принимает в ответ на требования среды или обстоятельств. Младший аркан <b>Рыцарь пентаклей (Всадница Земли в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует шестому дому (знак Девы) и управляется планетой <b>Прозерпина</b> (внутренний управитель — Меркурий). Эта карта символизирует практический выбор образа жизни, детализацию, профессионализм и холодный анализ.<br><br>Общая трактовка базовой социальной роли Рыцаря пентаклей синтезирует <b>четыре ключевые версии</b>, объединяя классический подход Уэйта и психологию Манары:<br><b>1. Хладнокровный аналитик и врач (по Уэйту):</b> Это роль специалиста, который исследует явление или человека, разделяя его на составные части, чтобы найти недостатки. В отличие от других карт, Рыцарь пентаклей абстрагируется от эмоций; он критичен, брезглив и замечает «кривой левый глаз», даже если человек в целом прекрасен. Это профессиональная позиция доктора или диагноста, обязанного видеть изъяны для их исправления.<br><b>2. Осознанное служение себе (Синтез):</b> Человек методично и практично делает свою работу, обслуживая свои собственные интересы и организуя свой быт. Это выбор конкретного, удобного для себя образа жизни. Человек не геройствует и не бросается в крайности (как Рыцарь жезлов), а спокойно «пашет» на своем участке, понимая, что это необходимо для его комфорта.<br><b>3. Предъявление материальной базы (Синтез):</b> В контексте социальных и парных отношений эта роль отвечает на вопрос: «Кто ты по масти и на что ты живешь?». Рыцарь пентаклей демонстрирует партнеру свои навыки, источник дохода и способы достижения материальных благ, заявляя о своей практической состоятельности.<br><b>4. Тестирование бытом и пользой (по Манаре):</b> Переход от романтической иллюзии к суровой проверке реальностью. В отношениях женщина (или мужчина) начинает оценивать партнера не по вспышке влюбленности, а с точки зрения его полезности, умения решать бытовые задачи и вписываться в повседневную рутину. Это трезвый, иногда циничный аудит партнера перед тем, как перейти к постоянному союзу.<br>Поскольку Рыцарь пентаклей управляется Прозерпиной (и Меркурием), его особые положения распределены по астрологическим достоинствам этих планет в Зодиаке.`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br><b>Прагматичная стартовая инициатива</b> Вместо агрессивного марсианского напора человек начинает проекты или знакомства с трезвого расчета. Личность сразу предлагает свои практические навыки или оценивает нового партнера как полезный инструмент. Инициатива здесь лишена горячей страсти, она сугубо функциональна: «Что мы с тобой будем делать и какая от этого польза?».`,
                    2: `<b>2 дом (Телец)</b><br><b>Телесная и финансовая инвентаризация</b> В зоне накоплений, формы и физиологии навыки аналитика направлены на скрупулезный подсчет своих ресурсов. Человек относится к своему телу и кошельку как к механизму, который нужно постоянно диагностировать и обслуживать. Потребление благ лишается слепого гедонизма, заменяясь жестким расчетом и диетой.`,
                    3: `<b>3 дом (Близнецы) — Вторая обитель и Падение</b><br><b>Повседневная едкая критика</b> В сфере рутинных контактов и поверхностного общения эта роль двойственна. Как <i>вторая обитель</i>, человек умело сортирует бытовую информацию, применяя профессиональные знания для адаптации в среде. Однако, переходя в <i>падение</i>, это превращается в невыносимое занудство и неуместный критицизм. Человек «грузит» знакомых своими бытовыми проблемами или превращает легкую дружескую беседу в холодный медицинский осмотр, хладнокровно выискивая недостатки в собеседнике.`,
                    4: `<b>4 дом (Рак)</b><br><b>Сухой бытовой контроль</b> В интимной сфере семьи и дома человек отключает душевную эмпатию. Он ведет себя не как мягкий родитель, а как строгий врач или прораб, который следит за распорядком, чистотой и здоровьем домочадцев. Домашний уют превращается в стерильную операционную, где малейшая пылинка вызывает шквал критики.`,
                    5: `<b>5 дом (Лев)</b><br><b>Анатомия романтических чувств</b> В сфере радости, влюбленности и творчества спонтанность полностью уничтожается. Сталкиваясь со страстью или флиртом, человек начинает холодно анализировать партнера по частям. Влюбленность подменяется брезгливой оценкой внешних изъянов, что на корню убивает любой романтический праздник и легкость.`,
                    6: `<b>6 дом (Дева) — Первая обитель</b><br><b>Закономерный профессионализм</b> Естественная и самая гармоничная среда для этой роли. Человек находится на своем месте, выполняя свою работу спокойно, методично и ответственно. Это естественное обслуживание своего организма (здоровый образ жизни) и своего быта без принуждения. В отношениях личность трезво понимает, что из себя представляет, осознает свои достоинства и недостатки, не строит иллюзий и выстраивает комфортное сосуществование с партнером на базе практической пользы.`,
                    7: `<b>7 дом (Весы)</b><br><b>Брачная техническая экспертиза</b> Вступая в открытое партнерство или брак, человек относится к союзу как к деловому контракту. Партнер подвергается постоянному аудиту на предмет его практической полезности. Отношения существуют, но лишены тепла — это работа двух людей, где один постоянно выполняет роль контролера отдела технического контроля (ОТК) для другого.`,
                    8: `<b>8 дом (Скорпион)</b><br><b>Кризисный хирург-прагматик</b> Сталкиваясь с экстримом, трансформацией или опасностью, человек отключает животную панику и действует предельно хладнокровно. Это спасительная роль хирурга, который способен без эмоций отсечь все гниющее и неработающее, чтобы выжить в кризисной ситуации, минимизировать потери и перестроить свою материальную базу.`,
                    9: `<b>9 дом (Стрелец) — Экзальтация</b><br><b>Предъявление статусных гарантий</b> Зона социальных перспектив, мировоззрения и заключения масштабных союзов. Здесь роль Рыцаря пентаклей становится принудительной (экзальтирует). Для того чтобы договориться с партнером о совместном проекте или долгосрочном будущем, человек обязан продемонстрировать свою реальную материальную и профессиональную базу. Нельзя просто пообещать «золотые горы»; партнер требует показать «декларацию о доходах» и доказать, что вы практически способны потянуть совместную жизнь.`,
                    10: `<b>10 дом (Козерог)</b><br><b>Безотказный винтик системы</b> В сфере социальной реализации, карьеры и подчинения законам человек занимает позицию высококлассного наемного специалиста. Он не претендует на власть короля, но безупречно и методично выполняет должностные инструкции. Это профессионал, который подчиняет свои личные интересы корпоративным планам ради заработка.`,
                    11: `<b>11 дом (Водолей)</b><br><b>Скептичный практик-одиночка</b> В зоне форс-мажоров, реформ и независимых коллективов человек дистанцируется от идейных бунтов. Он остается скептиком-прагматиком, который оценивает любые водолейские революции исключительно по их конкретной бытовой пользе, выступая голосом сухого разума среди хаотичных социальных процессов.`,
                    12: `<b>12 дом (Рыбы) — Первое изгнание</b><br><b>Крах сухого анализа</b> Сфера мистики, кармы, безусловного принятия и подведения итогов. Здесь холодная критика Девы терпит катастрофу. Пытаясь разложить на логические детали то, что требует интуитивного и тотального слияния (например, глубокий духовный или сексуальный контакт), человек заходит в тупик. Чрезмерная брезгливость и фокус на недостатках партнера в 12 доме могут довести отношения до «ручки» (или шизофрении), так как человек пытается препарировать живую душу хирургическим скальпелем там, где нужно прощение.`
                }
            },
            77: {
                name: "Королева Пентаклей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>Королева пентаклей (в Таро Манара — Королева Земли)</b> относится к десятому дому гороскопа (знак Козерога) и управляется планетой <b>Сатурн</b>. Эта карта завершает женские социальные роли и символизирует переход к мужскому, тяжелому социальному функционированию, где природные инстинкты отступают на задний план ради чувства долга и сохранения стабильности.<br><br>Общая трактовка Королевы пентаклей объединяет <b>четыре ключевые версии</b>, синтезирующие подходы Уэйта и Манары:<br><b>1. Идеальный заместитель и соратник (по Уэйту):</b> Это социальная роль человека, который является доверенным лицом или «правой рукой» руководителя (Короля). Королева пентаклей в курсе реального положения дел, она знает всю неприглядную правду жизни, но сама не принимает финальных стратегических решений. В семье это позиция настоящей «супруги», которая вместе с мужем тянет общую лямку быта, ипотеки и воспитания детей, являясь надежным тылом.<br><b>2. Переход к деловой жизни и утрата женственности (Синтез):</b> Аркан описывает период (часто связанный с возрастом или климаксом), когда программа размножения и животный магнетизм выключаются. Женщина перестает использовать мужчин для своих природных целей и переключается на карьеру, работу или жесткое администрирование семьи, принимая на себя мужские задачи.<br><b>3. «Сухое» терпение и уступка (по Манаре):</b> В интимных отношениях женщина (Королева Земли) уже не испытывает личного сексуального желания, её природа "отдыхает". Однако, чтобы не разрушить союз и не обидеть партнера, она плавно переключает его внимание, позволяя ему удовлетворять свои потребности, но сама при этом терпит "в сухую", выполняя супружеский долг из чувства обязательства.<br><b>4. Роль «старой карги» (в негативе):</b> При искажении энергии женщина, потерявшая природную привлекательность, отказывается переходить в мудрую стадию партнера. Она пытается тиранить окружающих, превращаясь во властную и вредную «бабу-ягу», которая использует контроль над бытом для компенсации своей утраченной женственности.<br>Поскольку Королева пентаклей управляется Сатурном, ее особые положения в раскладе жестко привязаны к астрологическим достоинствам этой планеты (Обитель в Козероге и Водолее, Изгнание в Раке и Льве, Экзальтация в Весах, Падение в Овне).`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение</b><br><i>Отпуск за свой счет.</i> В зоне личной активности и старта проектов Королева пентаклей дает прямое падение. Это ситуация, когда человек получает возможность (или вынужден) временно освободиться от своих внешних профессиональных или семейных обязательств, чтобы решить личные проблемы. Однако это отпуск "за свой счет": дела за него никто не сделает, и по возвращении придется наверстывать упущенное. В перевернутом варианте (искажение) попытка заняться собой приведет к тому, что ваше место заместителя просто «подсидят» конкуренты.`,
                    2: `<b>2 дом (Телец)</b><br><i>Прагматичный контролер.</i> В сфере финансов, тела и личного имущества человек действует как строгий бухгалтер. Средства расходуются исключительно на самые необходимые, базовые вещи. В отношениях партнер оценивается через призму его материальной состоятельности, а собственное тело воспринимается как инструмент, который требует регламентированного ухода без излишеств и гедонизма.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Деловая коммуникация.</i> В повседневном общении и при передаче информации личность сводит контакты к сухой конкретике. Разговоры ведутся строго по делу, без эмоций и пустой болтовни. Человек позиционирует себя как авторитетный администратор в ближнем кругу, требуя от собеседников соблюдения субординации и четких правил взаимодействия.`,
                    4: `<b>4 дом (Рак) — Первое изгнание</b><br><i>Вторжение социума в дом.</i> Сфера интимности, семьи и внутреннего комфорта, где Сатурн изгоняется. Привычный домашний уют подменяется суровым администрированием. В этой роли человек выступает не как заботливая, мягкая мать, а как строгий комендант. Он устанавливает для домочадцев и гостей жесткие правила («туда не ходи, сюда садись»). В отношениях природные инстинкты задавлены социальным статусом: это карьеристка, которой сложно расслабиться в собственной постели.`,
                    5: `<b>5 дом (Лев) — Второе изгнание</b><br><i>Деловой подход к любви.</i> Зона радости, влюбленности и эгоизма. Сталкиваясь с романтическими чувствами или появлением любовника, женщина напрочь отключает игривость и спонтанность. Она подходит к новому мужчине абсолютно по-деловому, с чувством и расстановкой, оценивая его как кандидата на совместную материальную жизнь. Влюбленность лишается праздника, так как человек наступает на горло собственным эмоциям ради строгого планирования будущего.`,
                    6: `<b>6 дом (Дева)</b><br><i>Методичное служение.</i> Выполняя повседневные рабочие обязанности или занимаясь бытом, человек безупречно тянет лямку заместителя. Он механически и без жалоб выполняет огромный объем рутинной работы, взваливая на себя ответственность за порядок. Труд здесь воспринимается не как творчество, а как тяжелая, но неизбежная обязанность по поддержанию жизни механизма.`,
                    7: `<b>7 дом (Весы) — Экзальтация</b><br><i>Вынужденное партнерство.</i> В сфере брака и открытых договоров Сатурн и Королева пентаклей создают огромное напряжение. Это возникновение непредвиденных внешних помех или тяжелых обязательств, которые внезапно ложатся на плечи пары. Брак сохраняется не за счет легкости или романтики, а потому что партнеры вынуждены сцепить зубы и вместе преодолевать суровые внешние трудности, становясь заложниками общего долга.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Кризисное администрирование.</i> Столкнувшись с глубокими трансформациями, экстримом или чужими деньгами, личность отключает панику и берет на себя ответственность. Это позиция человека, который хладнокровно управляет семейным или корпоративным бюджетом в период дефолта, осознанно оформляя кредиты или долги ради выживания структуры, взваливая последствия на свои плечи.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Статусный авторитет.</i> Выходя в широкий социум или формируя мировоззрение, человек пытается закрепить свой имидж незаменимого и мудрого профессионала. Он транслирует консервативные ценности и требует уважения к своему солидному жизненному опыту, отвергая любые непрактичные идеалы или рискованные перспективы в пользу проверенного, стационарного статуса.`,
                    10: `<b>10 дом (Козерог) — Первая обитель</b><br><i>Закономерная ответственность.</i> Естественная и гармоничная среда для этой роли. Женщина абсолютно адекватно принимает на себя обязанности по содержанию семьи или руководству бизнес-процессами на позиции заместителя. Она осознает реальность, не строит романтических иллюзий и успешно помогает Королю пентаклей удерживать материальный каркас их совместной жизни. Это надежная, взрослая партнерша, с которой можно решать любые бытовые и социальные проблемы.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель</b><br><i>Социальное смирение.</i> Зона непредсказуемого будущего и коллективной свободы, где Сатурн выступает вторым управителем. Человек смиряется с тем, что его жизнь и материальные ресурсы подчинены требованиям социума или коллектива. В этой позиции личность отказывается от индивидуального бунта и добровольно встраивается в жесткую систему общественных или корпоративных правил, жертвуя своей свободой ради выполнения долга.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармическая усталость.</i> В зоне тайн, кармы и скрытых итогов человек сталкивается с последствиями своего выбора в пользу долга и карьеры. Это глубокое внутреннее одиночество женщины, которая всю жизнь была слишком деловой, несла на себе бремя "заместителя" и отказалась от природной мягкости. На этом этапе приходит суровое осознание цены, уплаченной за социальную стабильность.`
                }
            },
            78: {
                name: "Король Пентаклей",
                general: `В системе астрологического Таро Юрия Хана фигурные карты описывают осознанные социальные роли и шаблоны поведения, которые человек принимает в ответ на требования социума или обстоятельств. Младший аркан <b>Король пентаклей (Король Земли в колоде Манара)</b> относится к третьей (социальной) зоне гороскопа, соответствует десятому дому (знак Козерога) и управляется планетой <b>Сатурн</b>. Это высшая стадия мужского социального функционирования, где заканчиваются природные инстинкты и начинается суровая объективная реальность.<br><br>Общая трактовка этой базовой социальной роли объединяет 4 ключевые версии, синтезирующие подходы Уэйта и Манары:<br><b>1. Гарант внешней безопасности и объективной реальности (по Уэйту).</b> Это роль высшего руководителя, который единолично видит истинное положение дел и берет на себя тяжелую ответственность за выживание структуры (семьи, фирмы, государства) во внешнем мире. Он выстраивает внешний каркас безопасности, удерживая мир в рамках стабильности, и в критической ситуации имеет право на жесткие, порой непопулярные решения.<br><b>2. Истинный Профессионал и Отец (Синтез).</b> Завершение природной программы «альфа-самца» и бабника. Мужчина начинает цениться не за животную сексуальность, а за профессионализм и реальную пользу, которую он приносит людям. В этой роли мужчина выступает как надежный супруг, который вместе с партнершей тащит общую лямку быта, и как отец, выводящий повзрослевших детей в социум.<br><b>3. Суровое столкновение с бытом (по Манаре).</b> Переход от любовной романтики и иллюзий к жесткой рутине. Отношения в паре проверяются совместными обязательствами (ипотеки, дети, бюджет). Мужчина здесь не развлекает женщину, а становится сухим, но надежным «товарищем по упряжке», требуя от партнерши такого же взрослого и ответственного подхода.<br><b>4. Беспринципный делец и диктатор (в негативе).</b> При искажении энергии (перевернутая карта) профессионализм подменяется работой исключительно ради денег
