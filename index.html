                general: `В системе астрологического Таро Юрия Хана младший аркан <b>Туз Жезлов (Туз Огня)</b> является фундаментальной, корневой картой <b>первого дома</b> гороскопа (знак Овна) и управляется <b>Марсом</b> (и внутренне Плутоном). Эта карта описывает самую чистую, беспримесную суть человеческих импульсов, абсолютное начало любого действия и базовый жизненный инстинкт.<br><br>Для составления детального натального портрета личности (рассматривая Туз Жезлов как базовую прошивку, аналог Асцендента), мы синтезируем <b>три различных проявления этого аркана</b>, выделяемых в лекциях и практике раскладов:<br><b>1. Абсолютный источник изначальной энергии.</b> Это потенциал, который не имеет предыстории и не опирается на прошлый опыт. Энергия возникает как бы «ниоткуда», сама являясь своим корнем и источником жизни,. В раскладах это часто проигрывается как сиюминутный, мощный всплеск сил, который хорош для старта, но сам по себе не гарантирует долгосрочности,. В натале это дает личности колоссальную витальность и способность начинать всё с чистого листа.<br><b>2. Базовый животный инстинкт и сексуальная потенция.</b> Это неконтролируемая, подсознательная тяга к действию или к противоположному полу. Человек ощущает острую физиологическую потребность («я хочу/мне надо»), которая требует немедленного выхода,.<br><b>3. Безапелляционность и неспособность к адаптации.</b> Изначальный импульс абсолютно категоричен. Человек не предполагает, что его желание может быть видоизменено в процессе или что нужно учитывать обстоятельства. Он действует по принципу: «я хочу именно это и не предполагаю изменений».<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> В фундаменте психики такого человека неразрывно слиты два образа. С одной стороны, это <b>божественная рука, появляющаяся из облака и твердо сжимающая цветущий, живой жезл (по Уэйту)</b> — символ того, что человек сам по себе является неиссякаемым источником энергии, не обусловленным никакими родовыми или кармическими травмами прошлого,. С другой стороны, это <b>раскованная женщина, излучающая чистую, почти хищную сексуальную и жизненную потенцию (по Манаре)</b>, которая подсознательно формирует мощнейший запрос на взаимодействие с миром,.<br><br>Такой человек (с Тузом Жезлов в качестве базы) — это сгусток спонтанной, искренней инициативы. Его суперсила заключается в феноменальной способности генерировать энергию, бесстрашно стартовать в любых условиях и выживать за счет чистой жажды жизни. Его главная уязвимость — эгоцентричная слепота. Он настолько поглощен своим импульсом, что часто действует «в лоб», игнорируя реакцию окружающих, не умея вовремя остановиться или перестроиться. Если его природная энергия подавляется (аркан перевернут), личность сталкивается с глубочайшей апатией, ощущением тотального бессилия и невозможностью сделать даже первый шаг,.<br><br>Ниже представлен детальный анализ проявления этой натальной энергетики во всех 12 домах гороскопа.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель</b><br>** Идеальное, естественное состояние. Базовые потребности человека находятся в абсолютной гармонии с его действиями. ** Человек действует только тогда, когда внутренне «созрел» и ощутил подлинную потребность. Его инициатива не является защитной реакцией или агрессией от страха — это здоровая, спокойная уверенность в своем праве на проявление себя. Он опирается на свою искреннюю, живую энергию (цветущий жезл) и транслирует в мир естественную притягательность.`,
                    2: `<b>2 дом (Телец) — Второе изгнание</b><br>** Подмена пассивного восприятия и накопления ресурсов активной, неуместной инициативой. ** Там, где от человека требуется восприимчивость, спокойствие или адекватная оценка своих средств, он начинает слепо действовать и «продавливать» ситуацию. Он пытается заменить нехватку реальных ресурсов или материального фундамента голым энтузиазмом и животной энергией. Это приводит к быстрому истощению, так как чистый импульс (Огонь) не может заменить стабильную форму (Землю).`,
                    3: `<b>3 дом (Близнецы) — Слепая, импульсивная коммуникация</b><br>Повседневное общение и обучение строятся не на логике, а на спонтанных порывах. Человек говорит первое, что приходит в голову, и вступает в контакты под влиянием сиюминутного желания. Он не подстраивается под собеседника, а просто «вываливает» свою энергию в информационное пространство, часто забывая о манерах и правилах приличия ради удовлетворения своего социального инстинкта.`,
                    4: `<b>4 дом (Рак) — Падение</b><br>** Паралич базовой безопасности и отказ от интимного убежища ради иллюзии собственной неуязвимости. ** Человек настолько ослеплен своей марсианской энергией, что искренне считает: «Мне не нужна защита, я сам по себе абсолютная сила». Он игнорирует потребность в отдыхе, семье или «норе», полагая, что его внутреннего огня хватит навсегда. В результате он может проявлять крайнюю агрессию на любого, кто пытается подойти к нему слишком близко или предложить заботу, разрушая собственный тыл.`,
                    5: `<b>5 дом (Лев) — Эгоистичная вспышка страсти</b><br>Любовь, игра и творчество воспринимаются не как сложный сознательный процесс, а как прямой выброс адреналина. Влюбленность вспыхивает мгновенно, базируясь на голом животном инстинкте, без какой-либо романтической или интеллектуальной надстройки. Человек «горит» своим увлечением, но эта искра может быстро погаснуть, если не найдет немедленной физической или эмоциональной реализации, так как Тузы не умеют играть в долгие игры.`,
                    6: `<b>6 дом (Дева) — Хаотичная, взрывная рутина</b><br>В вопросах быта, службы и заботы о здоровье человек абсолютно не способен к методичности. Он выполняет рутинные обязанности лишь тогда, когда на него находит внезапный прилив сил (порыв). Как только первичная энергия иссякает, работа бросается. К своему здоровью он относится по принципу «само заживет», полагаясь на врожденный запас прочности своего организма и игнорируя профилактику.`,
                    7: `<b>7 дом (Весы) — Первое изгнание</b><br>** Одностороннее, безапелляционное действие в партнерстве. Замещение диалога личной инициативой. ** Вступая в отношения, человек совершенно не учитывает встречных условий. Его позиция: «я так решил, возражения не принимаются»,. Он не способен на классическое партнерство (где «один за всех и все за одного»), поэтому часто берет всю ответственность на себя, действуя по принципу одностороннего разоружения или диктата,. Это попытка решить проблемы пары исключительно своей личной силой.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель</b><br>** Подключение скрытых резервов и получение энергии через трансформацию. ** Попадая в экстремальные ситуации или вступая в глубокий интимный контакт, человек не истощается, а, напротив, открывает в себе «второе дыхание» и мощнейший дополнительный ресурс. Однако, действуя по Тузам во второй обители, человек может проявлять крайнюю эгоцентричность: он бежит туда, куда ему «приспичило», абсолютно игнорируя обратную связь от среды или партнера, используя их лишь как топливо для своего импульса.`,
                    9: `<b>9 дом (Стрелец) — Безапелляционная экспансия</b><br>Столкновение с новыми идеологиями, образованием или иностранными культурами происходит по принципу агрессивного завоевания. Человек не изучает чужой авторитет, он сразу бросается доказывать свою правоту и навязывать свою животную волю. Его мировоззрение строится на слепой уверенности в собственном импульсе: «я так чувствую, значит, это истина», что часто приводит к конфликтам с общепринятой моралью.`,
                    10: `<b>10 дом (Козерог) — Экзальтация</b><br>** Высшая цель амбиций и социальной реализации через осознание собственного всемогущества. ** Вся профессиональная и социальная нагрузка, которую человек берет на себя, служит одной глубинной цели — доказать себе: «Я всё могу»,. Человек вкладывает колоссальную животную энергию в преодоление препятствий, чтобы на вершине успеха обрести абсолютную, объективную уверенность в своей силе и ценности. В негативе это надрыв, когда человек бросается на карьерные амбразуры с голой шашкой, не имея плана.`,
                    11: `<b>11 дом (Водолей) — Спонтанный, неконтролируемый бунт</b><br>В кругу единомышленников или при столкновении с форс-мажорами будущего человек реагирует диким, инстинктивным выбросом энергии. Вместо того чтобы проявить водолейский интеллект и трезво оценить новые условия, он просто ломает рамки силой. Это абсолютно непредсказуемый товарищ, который в любой непонятной ситуации начинает размахивать своей «дубиной», пытаясь пробить стену лбом вместо поиска обходных путей.`,
                    12: `<b>12 дом (Рыбы) — Инстинктивное проживание кармы</b><br>Попадая в ситуации социальной изоляции, тайны или столкновения с неизбежными последствиями прошлого, человек отказывается от эмпатии и мистического растворения. Он встречает своих «кармических призраков» с кулаками, пытаясь выжить в абстрактном болоте за счет чистой марсианской энергетики. Это слепое барахтанье в темноте, где базовая жизненная сила тратится на борьбу с ветряными мельницами, не принося должного духовного очищения.`
                }
            },
            28: {
                name: "6 Жезлов",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>6 жезлов (Шестерка Огня в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует шестому дому (знак Девы) и управляется планетой <b>Прозерпина</b> (внутренний управитель — Меркурий). Шестерки в целом символизируют сознательный выбор образа жизни, инвентаризацию себя и трезвый подход к своим возможностям. Масть жезлов (огонь) переводит эту энергию в сферу личных желаний, амбиций, энергетики и идей.<br><br>Общая трактовка этой социальной роли (базовой прошивки) синтезирует <b>четыре ключевые версии</b>, объединяющие классику Уэйта и психологию Манары:<br><b>1. Заслуженный триумф и уверенность в себе (по Уэйту).</b> Человек (герой в лавровом венке на белом коне) утвердился в своем выборе и успешно реализовал свои желания. Он разбивает большую задачу на посильные части, берет ситуацию под уздцы (учится управлять своей животной природой) и добивается успеха, обретая внутреннее самоуважение.<br><b>2. Зависимость от чужого одобрения (в негативе Уэйта).</b> Искажение аркана превращает человека в того, кто ждет обязательной похвалы и "рецензии" от внешнего мира. Без предварительного разрешения или восхищения окружающих такой "триумфатор" боится сделать шаг, страдая от хронической застенчивости или страха осуждения.<br><b>3. Тотальное управление партнером (по Манаре).</b> На карте Шестерка Огня женщина полностью рулит поведением партнера ("держит его за член"), добиваясь его полного и добровольного подчинения. Это абсолютная манипуляция, при которой партнер рассматривается как удобный инструмент для обустройства повседневной жизни, а его природная энергия подчинена воле наездника.<br><b>4. Крах контроля и бунт инстинктов (Синтез).</b> При перевернутой карте человек теряет контроль над "лошадью" (своей природой или партнером). Возникают внутренние противоречия: животные инстинкты перестают служить сознанию, инструмент выходит из-под контроля, а уверенность в своих силах сменяется сомнениями и провалом планов.<br>Поскольку шестерки управляются Прозерпиной, их особые положения распределены по астрологическим достоинствам этой планеты (Обитель в Деве, Изгнание в Рыбах, двойные положения: 2-я Обитель/Падение в Близнецах, 2-е Изгнание/Экзальтация в Стрельце).`,
                houses: {
                    1: `<b>1 дом</b><br><b>Уверенная самопрезентация</b> На старте новых проектов или отношений человек с первых секунд уверенно берет инициативу в свои руки. Он демонстрирует себя как победителя, сразу показывая партнеру, что намерен управлять ситуацией. Это проявление личной энергии через абсолютную самоуверенность: человек действует так, словно его триумф — это неоспоримый природный факт, ожидая, что партнер без сопротивления признает его лидерство и авторитет.`,
                    2: `<b>2 дом</b><br><b>Прагматичное укрощение</b> В сфере финансов, физиологии и личных накоплений навыки управления применяются для извлечения конкретной выгоды. Партнер или ситуация рассматриваются исключительно как ресурс. Человек направляет всю пылкость и энергию (огонь) на то, чтобы "объездить" окружающую среду ради своего материального комфорта, виртуозно манипулируя чужими инстинктами для удовлетворения собственных базовых нужд.`,
                    3: `<b>3 дом — Вторая обитель и Падение</b><br><b>Искусственная коммуникация</b> Двойственное особое положение (Прозерпина в Близнецах). Как <i>Вторая обитель</i>: человек мастерски использует свою речь и интеллект для управления собеседником. Он находит идеальные слова, чтобы доказать свою правоту и получить одобрение. Как <i>Падение</i>: возникает болезненная потребность в постоянном подтверждении своих мыслей. Человек не может просто общаться; он превращает любой контакт в трибуну, навязчиво требуя от слушателей аплодисментов и согласия со своими идеями, что лишает общение естественности.`,
                    4: `<b>4 дом</b><br><b>Домашняя дрессировка</b> В интимном пространстве семьи и фундаментальной безопасности человек устанавливает свой абсолютный диктат. Дом воспринимается как территория его личного триумфа, где домочадцы обязаны подчиняться его правилам. Природная теплота подменяется жестким администрированием: "наездник" подавляет любые неконтролируемые эмоции близких, превращая семью в послушный механизм, обслуживающий его комфорт.`,
                    5: `<b>5 дом</b><br><b>Эгоистичный триумф</b> Сфера радости, влюбленности и эгоизма. Сталкиваясь с романтическими чувствами, человек не растворяется в страсти, а использует ее для самоутверждения. Влюбленность превращается в процесс "дрессировки", где партнер — это скакун, подчеркивающий величие всадника. Искренняя радость заменяется гордыней от осознания того, что ты смог полностью подчинить себе чужое сердце и энергию.`,
                    6: `<b>6 дом — Первая обитель</b><br><b>Идеальное управление</b> Естественная и самая гармоничная среда для карты. Человек гениально разбивает сложные задачи на посильные шаги, идеально распределяет свои силы и достигает заслуженного успеха, обретая внутреннее уважение к себе. В отношениях это сознательный выбор и виртуозное управление партнером: личность трезво понимает свои желания и без конфликтов добивается от партнера того поведения, которое делает их совместный быт максимально комфортным.`,
                    7: `<b>7 дом</b><br><b>Неравноправный договор</b> Вступая в открытое партнерство или брак, человек категорически отвергает идею равноправия. Союз выстраивается по принципу строгой субординации: один всегда наездник, другой — послушный конь. Лидер использует свои достижения и уверенность (или сексуальные манипуляции по Манаре), чтобы заставить партнера добровольно отказаться от своих амбиций ради обслуживания интересов "героя-триумфатора".`,
                    8: `<b>8 дом</b><br><b>Контроль над кризисом</b> Сталкиваясь с экстримом, чужими ресурсами или глубокими трансформациями, человек не впадает в панику. Он использует свою волю и навыки манипуляции, чтобы "оседлать" кризис. Это способность хладнокровно управлять чужой (или разрушительной) энергией, направляя ее в нужное русло, выходя из самых опасных и напряженных ситуаций победителем в лавровом венке.`,
                    9: `<b>9 дом — Второе изгнание и Экзальтация</b><br><b>Борьба за авторитет</b> Сфера мировоззрения и далекого будущего (двойное положение Прозерпины в Стрельце). Как <i>Второе изгнание</i>: человек отказывается подстраиваться под чужие социальные правила, пытаясь навязать партнеру или обществу роль своей личной "шестерки" (обслуги) для обеспечения своего будущего. Как <i>Экзальтация</i>: это форсированная, напряженная попытка доказать свою идеологическую правоту. Человеку жизненно необходимо, чтобы его идеи были признаны истиной в последней инстанции, что часто ведет к агрессивной демонстрации своего превосходства и манипуляциям с чужим сознанием.`,
                    10: `<b>10 дом</b><br><b>Карьерный пьедестал</b> В зоне социального статуса, карьеры и объективной реальности человек стремится занять место единоличного победителя. Он использует свои аналитические способности и умение управлять людьми для достижения вершин в профессии. Это статус признанного мастера, который почивает на лаврах, жестко контролируя своих подчиненных и требуя от системы официального подтверждения своих заслуг.`,
                    11: `<b>11 дом</b><br><b>Свобода через контроль</b> Столкнувшись с форс-мажорами, коллективными энергиями и водолейским хаосом, человек защищает свою независимость через тотальный расчет. Находясь в группе, он не сливается с ней, а ловко держит дистанцию, манипулируя настроениями толпы или коллектива. Он управляет ситуацией скрыто, используя чужую свободу так, чтобы она работала на его личный, независимый триумф.`,
                    12: `<b>12 дом — Первое изгнание</b><br><b>Крах манипуляций</b> В сфере кармы, скрытых итогов и глубоких тайн (где Прозерпина находится в изгнании) попытка контролировать всё и вся терпит сокрушительный провал. Привычные схемы дрессировки партнера или эгоистичного самоутверждения здесь больше не работают. Жизнь (или карма) наказывает человека за то, что он использовал других как инструменты: "конь" сбрасывает наездника, оставляя его один на один с последствиями своего эгоизма, заставляя переосмыслить цену своего триумфа.`
                }
            },
            29: {
                name: "7 Жезлов",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>7 жезлов (Семерка Огня в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует седьмому дому (знаку Весов) и управляется планетой <b>Хирон</b> (внутренний управитель — Венера). Семерки символизируют начало сознательного партнерского взаимодействия, где человек учится фильтровать свое поведение, а масть жезлов (огонь) добавляет к этому процессу энергию, личные идеи, абстрактные желания и инициативу.<br><br>Общая трактовка базовой прошивки (или реакции на ситуацию) по 7 жезлов синтезирует <b>четыре ключевые версии</b>, объединяя классику Уэйта и психологию Манары:<br><b>1. Заявление о своих желаниях и проверка реакции (по Уэйту):</b> На карте персонаж с одним жезлом противостоит шести жезлам. Это не агрессивная битва, а ситуация, когда человек заявляет о своих новых интересах или предложениях и ждет ответной реакции партнера. Это проверка и согласование новых идей: «я хочу вот этого, а что скажешь ты?».<br><b>2. Отстаивание права на собственное мнение (Синтез):</b> Это защита своего сознания и индивидуальности в паре. Человек не отступает от своих мыслей, не боится того, что его идеи отличаются от мнения окружающих, и отстаивает свое право думать самостоятельно, не скатываясь при этом в примитивную агрессию. Это позиция: «ты считаешь так, а я иначе, давай останемся при своем мнении».<br><b>3. Многовариантность ролей ради партнера (по Манаре):</b> На карте Семерка Огня женщина демонстрирует колоссальную гибкость. Это поведение, при котором партнерша готова быть для мужчины кем угодно («хочешь — буду мамой, хочешь — маленькой девочкой»), предлагая многовариантность отношений. Женщина берет на себя отработку самых разных ролей, чтобы удовлетворить мужчину и закрепить с ним устойчивую связь.<br><b>4. Бескомпромиссный конфликт (в негативе):</b> При искажении энергии (перевернутая карта) назойливая потребность человека перестает учитывать конкретные обстоятельства и партнера. Человек агрессивно размахивает своим «жезлом», превращая деликатное согласование в тупую конфронтацию и навязывание своей воли без оглядки на чужие интересы.<br>Поскольку семерки управляются Хироном, их особые положения распределены по астрологическим достоинствам этой планеты в зодиакальном круге (Обитель в Весах и Тельце, Изгнание в Овне и Скорпионе, Экзальтация в Близнецах, Падение в Стрельце).`,
                houses: {
                    1: `<b>1 дом (Овен) — Первое изгнание. Блокировка личной инициативы</b><br><i></i> Зона старта и животной энергии, где семерки находятся в изгнании. Человек чувствует острую потребность начать действовать, но прямая карта сигнализирует: партнер к этому энергетически или физически не готов,. Личность вынуждена притормозить свои порывы, понимая, что ее инициатива не найдет отклика. В негативном (перевернутом) варианте это агрессивное навязывание своих желаний спящему или несогласному партнеру.`,
                    2: `<b>2 дом (Телец) — Вторая обитель. Животная защита своих границ</b><br><i></i> В сфере физиологии, тела и накоплений дипломатия Весов уступает место жесткому отстаиванию своей природы. Это здоровая животная защита своих телесных границ от чужого вмешательства. Человек категорически не уступает в своих базовых, физических привычках, заявляя: «мы с таким полом не спим» или «я это не ем». Это упертость в сохранении своего природного естества.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация. Форсированные словесные баталии</b><br><i></i> В сфере повседневного общения, братьев/сестер и обучения (где Хирон достигает высшего напряжения) потребность отстоять свои идеи становится навязчивой. Человек использует слова как оружие, вступая в бесконечные и напряженные бытовые споры. Ему жизненно необходимо каждую минуту доказывать окружению свою правоту, превращая легкую коммуникацию в бесконечное согласование мелких мнений.`,
                    4: `<b>4 дом (Рак) — Оборона домашнего уюта</b><br><i></i> В интимном пространстве дома, психики и семьи человек активно защищает свой покой. Любое вмешательство в его базовую безопасность или родовые программы встречается жестким идеологическим отпором. Личность устанавливает строгие правила для домочадцев, требуя согласовывать с ней любые бытовые изменения.`,
                    5: `<b>5 дом (Лев) — Защита эгоистичных желаний</b><br><i></i> В сфере радости, влюбленности и творчества человек ревностно отстаивает свой личный «праздник». Он не готов делиться вниманием и требует, чтобы романтический партнер полностью подстраивался под его сценарий. Влюбленность превращается в перетягивание каната: кто чьи капризы будет обслуживать первым.`,
                    6: `<b>6 дом (Дева) — Споры о рутине и труде</b><br><i></i> Сталкиваясь с повседневными обязанностями, медициной и служением, человек начинает бороться за свои условия работы. Он не отказывается трудиться, но вступает в жаркие дискуссии с коллегами или партнером о методах и графиках, стремясь оптимизировать рутину так, чтобы она не ущемляла его личных идей и комфорта.`,
                    7: `<b>7 дом (Весы) — Первая обитель. Идеальное согласование идей</b><br><i></i> Естественная и родная среда для аркана. Человек деликатно и тактично выносит свои желания и идеи на обсуждение с партнером. Он не давит, а ищет компромисс, проверяя, насколько его инициатива (один жезл) вписывается в представления партнера (шесть жезлов). В контексте Манары это идеальное применение женской гибкости, когда партнерша умело меняет роли, гармонизируя союз и не теряя при этом своего достоинства.`,
                    8: `<b>8 дом (Скорпион) — Второе изгнание. Крах идейного компромисса</b><br><i></i> В сфере экстрима, глубоких трансформаций и чужих ресурсов дипломатичный диалог становится невозможным. Столкнувшись с кризисом, человек либо пасует, полностью отдавая свою волю на растерзание деструктивному партнеру, либо начинает неуместно и истерично махать своим «жезлом» там, где нужно было кардинально меняться. Попытка договориться в зоне Плутона ведет к энергетическому истощению и провалу.`,
                    9: `<b>9 дом (Стрелец) — Падение. Провал мелкой дипломатии</b><br><i></i> В зоне далеких перспектив, социальных идеалов и мировоззрения тактика семерок терпит крах. Человек пытается использовать мелкие тактические договоренности или примерять на себя разные интимные роли (по Манаре) там, где от него требуют глобальной идеологической зрелости. Его личные капризы и предложения игнорируются авторитетами, а мелкие компромиссы не работают при построении масштабного будущего.`,
                    10: `<b>10 дом (Козерог) — Конфликт с системой и статусом</b><br><i></i> В зоне карьерных достижений, власти и объективной реальности человек пытается отстоять свою индивидуальность перед лицом государственной машины или жесткого начальства. Он сопротивляется слепому подчинению приказам, требуя, чтобы его профессиональные инициативы были услышаны и учтены руководством.`,
                    11: `<b>11 дом (Водолей) — Отстаивание свободы в коллективе</b><br><i></i> В сфере коллективной независимости и форс-мажоров человек борется за право быть белой вороной. Находясь в группе друзей или единомышленников, он отказывается сливаться с толпой. Личность активно и аргументированно защищает свои нестандартные идеи, даже если они идут вразрез с планами коллектива.`,
                    12: `<b>12 дом (Рыбы) — Скрытое идеологическое сопротивление</b><br><i></i> В сфере изоляции, скрытых кармических итогов и подведения баланса человек ведет внутреннюю борьбу. Внешне он может казаться подчинившимся обстоятельствам, но внутри он крепко держится за свой «жезл» — свои сокровенные убеждения. Это молчаливое, но упорное несогласие с происходящим и тайная защита своих истинных желаний от растворения в хаосе.`
                }
            },
            30: {
                name: "8 Жезлов",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>8 жезлов (Восьмерка Огня в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, жестко привязан к восьмому дому (знак Скорпиона) и управляется планетой <b>Плутон</b>,. Восьмерки описывают реальные результаты наших сознательных действий, а огненная масть (жезлы) символизирует приходящую энергию, абстрактные идеи и новые направления внимания,.<br><br>Общая трактовка базовой прошивки (реакции на ситуацию) по 8 жезлов объединяет <b>четыре ключевые версии</b>, синтезируя классику Уэйта и психологию Манары:<br><b>1. Внезапные инсайты и голос интуиции (по Уэйту):</b> На карте Уэйта изображены летящие жезлы, которые никто не держит в руках,. Это идеи, которые приходят внезапно, как следствие результата ваших действий, и которые нужно успеть уловить, пока они не пролетели мимо. Человек интуитивно (по «голосу Бога») находит правильное направление для жизни даже в экстремальных условиях.<br><b>2. Эйфория и реакция на стимул (по Манаре):</b> На карте Восьмерка Огня женщина радостно реагирует на прилетевшую стрелу. В отношениях это ситуация, когда человек (или его организм) моментально откликается на внимание партнера. Это состояние эйфории, драйва или оргазма, когда человек осознает, что его «поймали», и получает от этого колоссальное удовольствие,,.<br><b>3. Вскрытие скрытых энергетических резервов (Синтез):</b> В результате завершенного события или экстремальной ситуации у человека открывается доступ к колоссальной внутренней силе, которой он раньше не пользовался,. Эта внезапная энергия дает толчок для перехода на следующий уровень жизни.<br><b>4. Бессонная бомбардировка мыслями (В негативе):</b> При искажении энергии летящие жезлы превращаются в падающие на голову кирпичи. Человек страдает от «мыслительной жвачки» — он всю ночь прокручивает в голове результаты конфликта или события, что приводит к бессоннице, энергетическому сбою и полному физическому истощению,.<br>Поскольку восьмерки управляются Плутоном, их особые положения распределены по астрологическим достоинствам этой планеты (Обитель в Скорпионе и Овне, Изгнание в Тельце и Весах, Экзальтация во Льве, Падение в Водолее),.`,
                houses: {
                    1: `<b>1 дом (Овен) — Вторая обитель. Ожидаемый приток силы</b><br>Зона личной инициативы, животного старта и базовой энергетики. Здесь Плутон является вторым управителем. Полученный результат (в виде идей или адреналина) мгновенно встраивается в стартовый потенциал человека. Личность заряжается произошедшим: внезапная мысль или всплеск эмоций тут же переводится в готовность действовать заново. Это мощный энергетический подъем, когда результат прошлого шага становится топливом для нового рывка.`,
                    2: `<b>2 дом (Телец) — Первое изгнание. Блокировка новых идей</b><br>Сфера физиологической формы, комфорта и накоплений ресурсов. Здесь внезапный поток огненной энергии Плутона (восьмерки) блокируется, так как Телец стремится к стабильности. Человек сопротивляется озарениям и новым идеям, потому что они грозят нарушить его привычный материальный или телесный комфорт. Внезапно пришедшая страсть партнера по Манаре воспринимается не как праздник, а как угроза покою, от которой хочется отгородиться ради сохранения своей формы,.`,
                    3: `<b>3 дом (Близнецы). Спонтанный поток слов</b><br>В зоне повседневного общения, обучения и поверхностных контактов внезапные озарения превращаются в неудержимую болтливость. Человек, поймав новую мысль, не успевает ее структурировать и тут же вываливает на собеседника. Это хаотичная, но искренняя передача внезапных идей окружающим, где слова опережают логический анализ.`,
                    4: `<b>4 дом (Рак). Тревожный домашний фон</b><br>В интимном пространстве дома, психики и базовой безопасности прилетевшие жезлы лишают человека покоя. Вместо того чтобы отдыхать, личность переваривает впечатления от внешнего мира. Это состояние бессонницы, когда новые идеи или последствия дневных конфликтов не дают расслабиться в собственной постели, вызывая внутреннюю психологическую тревогу.`,
                    5: `<b>5 дом (Лев) — Экзальтация. Экстремальный творческий азарт</b><br>Высшая точка напряжения Плутона. В сфере чистого эгоизма, радости, любви и творчества внезапно нахлынувшие мысли и энергия возводятся в абсолют. Человека буквально разрывает от творческого инсайта или любовной эйфории. Он готов сжечь все мосты ради реализации внезапно пришедшей гениальной идеи или страсти. Это мощный, но опасный перерасход резервных сил, когда человек искренне верит, что его озарения имеют божественную природу.`,
                    6: `<b>6 дом (Дева). Энергия для рутины</b><br>В сфере ежедневных рабочих обязанностей, служения и быта человек использует внезапно открывшееся «второе дыхание» для переработки колоссального объема рутины. Хаотичные мысли быстро сортируются и применяются как полезный инструмент для оптимизации своего образа жизни или профессиональных навыков.`,
                    7: `<b>7 дом (Весы) — Второе изгнание. Энергетический спад в паре</b><br>Зона брака, договоров и равноправного партнерства. Вместо того чтобы направить внезапные идеи на развитие, партнеры начинают обстреливать друг друга претензиями,. В негативном варианте это тяжелый энергетический упадок, апатия и бессилие, наступающие сразу после контакта с партнером («энергетическое похмелье»). В позитиве — это деликатное, но прямое информирование партнера о том, что текущий формат отношений забирает слишком много сил.`,
                    8: `<b>8 дом (Скорпион) — Первая обитель. Идеальная энергетическая трансформация</b><br>Самая естественная среда для аркана. Человек абсолютно адекватно воспринимает приходящую к нему новую энергию и идеи как результат своих действий. В отношениях это момент яркой взаимной эйфории или сильного сексуального импульса, когда личность не просто получает разрядку, но и заряжается силой для дальнейших свершений. Человек успевает уловить «летящие стрелы» внимания партнера и блестяще переводит эту энергию в конструктивное русло развития,.`,
                    9: `<b>9 дом (Стрелец). Внезапное идеологическое озарение</b><br>В зоне социальных авторитетов, далекого будущего и мировоззрения внезапный поток мыслей формирует новые перспективы. Человек ловит инсайт, который заставляет его резко поменять свои идеалы или увидеть совершенно новый смысл в партнерских отношениях. Это импульс к созданию новой философии на базе только что пережитого опыта.`,
                    10: `<b>10 дом (Козерог). Внезапная ответственность</b><br>В сфере социальных достижений, объективной реальности и карьеры летящие жезлы воспринимаются как внезапные, непредвиденные приказы или вызовы от руководства (или судьбы). Человек мобилизует все свои скрытые резервы, чтобы оперативно и в сжатые сроки закрыть возникшую рабочую проблему, используя пришедшую энергию сугубо для достижения статуса.`,
                    11: `<b>11 дом (Водолей) — Падение. Крах независимой отстраненности</b><br>Сфера форс-мажоров, коллективной независимости и рационального планирования будущего. Здесь Плутон падает. Поток неконтролируемых, спонтанных огненных мыслей полностью разрушает трезвые, прохладные планы Водолея. Человек теряет свою независимую отстраненность, когда в него внезапно «попадает стрела» влюбленности или хаотичной идеи. Интеллектуальные схемы разбиваются о внезапный, не поддающийся логике энергетический приход.`,
                    12: `<b>12 дом (Рыбы). Тайные мистические откровения</b><br>В зоне скрытых кармических итогов, тайн и изоляции внезапные мысли не выносятся наружу. Это глубокое, внутреннее озарение или мистический опыт, который человек переживает в одиночестве. Летящие «стрелы» здесь становятся ключом к пониманию своей судьбы и скрытых мотивов окружающего мира, но эта энергия остается тайной для всех остальных.`
                }
            },
            32: {
                name: "10 Жезлов",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>10 жезлов (Десятка Огня в колоде Манара)</b> относится к десятому дому гороскопа (знак Козерога) и управляется планетой Сатурн. Десятки символизируют объективную реальность, фиксацию результатов и социальную ответственность, за пределы которой выйти невозможно. Масть жезлов (огонь) переводит это состояние в сферу энергии, абстрактных идей, мыслей о будущем и концентрации жизненных сил.<br><br><b>Общая трактовка базовой прошивки (по Уэйту и Манаре) включает 4 ключевые версии:</b><br><b>1. Осознанная социальная ответственность (Позитив Уэйта):</b> Человек берет на себя ответственность за чужую жизнь, взваливая на свои плечи проблемы, которые не являются его личными. Это позиция настоящего профессионала или зрелого семьянина, который осознает, что ради общего блага необходимо отбросить эгоизм и полностью погрузиться в решение коллективных задач, оптимистично глядя в будущее.<br><b>2. Надрыв и физическое истощение (Негатив Уэйта):</b> Ситуацию блестяще описывает фраза «брось комиссара, не донесёшь». Человек берется за ношу, которую его организм выдержать не в состоянии. Энергия иссякает, что неминуемо ведет к жестокому слому: инфарктам, инсультам или полному энергетическому параличу. Человек загибается от груза своей прошлой жизни, так и не дойдя до светлого будущего.<br><b>3. Агрессия, принуждение и насилие (По Манаре):</b> В интимных отношениях Десятка Огня обнажает жесткий конфликт. Отношения воспринимаются не как праздник, а как принуждение, где секс происходит исключительно вынужденно, а мужчина воспринимается как насильник. Партнеры агрессивно подавляют инициативу друг друга, что ложится в основу любой крупной ссоры или скандала.<br><b>4. Подавление личных идей (Синтез):</b> Сталкиваясь с жестким давлением общества или партнера, человек отказывается от своих убеждений. Из страха перед последствиями он берет свои умные оппозиционные мысли и «уносит их подальше», хороня их в себе и работая «в стол».<br>Поскольку десятки подчиняются Сатурну, их особые положения распределены по астрологическим достоинствам этой планеты в зодиакальном круге.<br><br>### Особые положения 10 жезлов<br><br><b>10 дом (Козерог) — Первая обитель. Осознанная рабочая ноша.</b> Естественная и самая комфортная среда для аркана. Человек адекватно принимает давление внешнего мира и успешно тащит на себе коллективный или профессиональный груз. В этой позиции личность не смешивает свои эгоистичные потребности с чувством долга. В партнерстве это идеальное товарищество: супруги мужественно и сообща решают тяжелые жизненные задачи (например, выплата ипотеки, воспитание детей), видя в этом смысл и стабильность своего будущего.<br><br><b>11 дом (Водолей) — Вторая обитель. Принудительное социальное согласие.</b> Зона форс-мажоров и непредсказуемого коллективного будущего, где Сатурн выступает вторым управителем. Человек смиряется с давлением толпы и полностью теряет собственную инициативу. Он «хоронит» свои творческие идеи и мысли, боясь их высказать, чтобы не спровоцировать конфликт. В контексте Манары это тягостное ощущение вакуума и принуждения: женщина отдает свое тело как повинность, испытывая отвращение к сексуальному процессу.<br><br><b>4 дом (Рак) — Первое изгнание. Разрушение домашнего покоя.</b> Сфера интимного пространства, отдыха и базовой безопасности, где Сатурн изгоняется. Ноша социума бесцеремонно вламывается в дом. Вместо того чтобы отдыхать, человек тащит в семью производственные конфликты или взваливает на себя непомерный груз бытовой ответственности (готовка, уборка за всеми родственниками), лишая себя шанса на восстановление сил. В доме создается атмосфера постоянного тяжелого переутомления и стресса.<br><br><b>5 дом (Лев) — Второе изгнание. Тотальный отказ от себя.</b> Зона эгоизма, любви, радости и чистого творчества. Естественное стремление человека жить для себя здесь полностью уничтожается. Личность сознательно или вынужденно перечеркивает свою личную жизнь ради служения другим. Влюбленность и праздник заменяются сухим выполнением долга: это женщина, превратившаяся в «бизнес-машину», или бабушка, которая ставит крест на своей судьбе, чтобы круглосуточно тянуть лямку заботы о внуках.<br><br><b>7 дом (Весы) — Экзальтация. Тяжесть брачных обязательств.</b> Сфера открытых договоров и равноправного партнерства, где энергия Сатурна и десяток достигает наивысшего напряжения. Брак превращается в тяжелейшую упряжку. Человек тянет на себе партнера, испытывая колоссальный надрыв и усталость. Вы больше не можете позволить себе личной свободы или индивидуальной радости, так как скованы жесткими обязательствами перед семьей. В негативе партнерство становится невыносимым бременем, высасывающим все ресурсы.<br><br><b>1 дом (Овен) — Падение. Физический надрыв энергии.</b> Зона животного старта, базовой инициативы и личной энергии (Марс), где Сатурн падает. Абсолютно катастрофическое положение. Личная индивидуальность полностью раздавлена неподъемными обязательствами. Стремление «я всё могу» оборачивается тотальным энергетическим крахом. Человек берет вес, который ломает ему позвоночник, что на событийном уровне ведет к тяжелым болезням, выгоранию и потере способности совершать даже самые простые самостоятельные действия.`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение. Физический надрыв энергии</b><br>Зона животного старта, базовой инициативы и личной энергии (Марс), где Сатурн падает. Абсолютно катастрофическое положение. Личная индивидуальность полностью раздавлена неподъемными обязательствами. Стремление «я всё могу» оборачивается тотальным энергетическим крахом. Человек берет вес, который ломает ему позвоночник, что на событийном уровне ведет к тяжелым болезням, выгоранию и потере способности совершать даже самые простые самостоятельные действия.`,
                    2: `<b>2 дом (Телец). Материальное истощение</b><br>В сфере физиологии, телесного комфорта и накоплений человек тратит все свои физические и финансовые ресурсы на обслуживание чужого долга или социальных обязательств. Его имущество и тело работают на износ, подчиняясь требованиям внешней среды и лишая организм естественной материальной подпитки.`,
                    3: `<b>3 дом (Близнецы). Подавление личного мнения</b><br>В сфере повседневного общения, обучения и поверхностных контактов живая коммуникация уничтожается. Человек вынужден транслировать тяжелые, догматичные или навязанные обществом инструкции. Общение теряет легкость и искренность, превращаясь в механическое повторение суровых штампов и бюрократических приказов.`,
                    4: `<b>4 дом (Рак) — Первое изгнание. Разрушение домашнего покоя</b><br>Сфера интимного пространства, отдыха и базовой безопасности, где Сатурн изгоняется. Ноша социума бесцеремонно вламывается в дом. Вместо того чтобы отдыхать, человек тащит в семью производственные конфликты или взваливает на себя непомерный груз бытовой ответственности (готовка, уборка за всеми родственниками), лишая себя шанса на восстановление сил. В доме создается атмосфера постоянного тяжелого переутомления и стресса.`,
                    5: `<b>5 дом (Лев) — Второе изгнание. Тотальный отказ от себя</b><br>Зона эгоизма, любви, радости и чистого творчества. Естественное стремление человека жить для себя здесь полностью уничтожается. Личность сознательно или вынужденно перечеркивает свою личную жизнь ради служения другим. Влюбленность и праздник заменяются сухим выполнением долга: это женщина, превратившаяся в «бизнес-машину», или бабушка, которая ставит крест на своей судьбе, чтобы круглосуточно тянуть лямку заботы о внуках.`,
                    6: `<b>6 дом (Дева). Профессиональное выгорание</b><br>В зоне рутины, служения, здоровья и ежедневного труда работа превращается в рабскую повинность. Человек методично и безропотно взваливает на себя колоссальный объем черновой работы, которая не приносит радости, а лишь методично разрушает его здоровье. Это механическое исполнение чужих требований на пределе физических возможностей.`,
                    7: `<b>7 дом (Весы) — Экзальтация. Тяжесть брачных обязательств</b><br>Сфера открытых договоров и равноправного партнерства, где энергия Сатурна и десяток достигает наивысшего напряжения. Брак превращается в тяжелейшую упряжку. Человек тянет на себе партнера, испытывая колоссальный надрыв и усталость. Вы больше не можете позволить себе личной свободы или индивидуальной радости, так как скованы жесткими обязательствами перед семьей. В негативе партнерство становится невыносимым бременем, высасывающим все ресурсы.`,
                    8: `<b>8 дом (Скорпион). Экстремальное кризисное давление</b><br>Столкнувшись с глубокой трансформацией, опасностью или чужими ресурсами, личность пытается в одиночку вытянуть на себе смертельный груз. Это кризис колоссального перенапряжения, когда человек выжимает из своего организма последние скрытые резервы ради того, чтобы выжить в экстремальных условиях или расплатиться по тяжелейшим счетам.`,
                    9: `<b>9 дом (Стрелец). Догматичная идеологическая ноша</b><br>В сфере мировоззрения, далеких перспектив и авторитетов амбиции кристаллизуются в тяжелую догму. Человек становится заложником закостенелых убеждений, фанатично таща на себе груз чужих или устаревших идеалов. Рискованные перспективы и духовное развитие отрицаются в пользу тяжелой социальной пропаганды.`,
                    10: `<b>10 дом (Козерог) — Первая обитель. Осознанная рабочая ноша</b><br>Естественная и самая комфортная среда для аркана. Человек адекватно принимает давление внешнего мира и успешно тащит на себе коллективный или профессиональный груз. В этой позиции личность не смешивает свои эгоистичные потребности с чувством долга. В партнерстве это идеальное товарищество: супруги мужественно и сообща решают тяжелые жизненные задачи (например, выплата ипотеки, воспитание детей), видя в этом смысл и стабильность своего будущего.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель. Принудительное социальное согласие</b><br>Зона форс-мажоров и непредсказуемого коллективного будущего, где Сатурн выступает вторым управителем. Человек смиряется с давлением толпы и полностью теряет собственную инициативу. Он «хоронит» свои творческие идеи и мысли, боясь их высказать, чтобы не спровоцировать конфликт. В контексте Манары это тягостное ощущение вакуума и принуждения: женщина отдает свое тело как повинность, испытывая отвращение к сексуальному процессу.`,
                    12: `<b>12 дом (Рыбы). Тайный кармический крест</b><br>В зоне изоляции, скрытых итогов и кармы бремя социальной и семейной ответственности загоняется глубоко в подсознание. Человек молчаливо и покорно несет тяжелый кармический груз, воспринимая свои мучения как фатальную неизбежность. Это состояние тотального внутреннего одиночества под тяжестью обязательств, о которых невозможно рассказать миру.`
                }
            },
            37: {
                name: "Туз Кубков",
                general: `В системе астрологического Таро Юрия Хана младший аркан <b>Туз Кубков (Туз Воды)</b> относится к корневой зоне первого дома гороскопа (Овен, стихия Огня, планета Марс), отвечая за первичный жизненный импульс, но описывает его через призму водной стихии. Это самая гибкая, восприимчивая и трансформирующаяся часть нашего базового инстинкта.<br><br>Чтобы составить глубокий натальный портрет личности (рассматривая Туз Кубков как базовую прошивку, аналог Асцендента), необходимо синтезировать три ключевых проявления этого аркана:<br><b>1. Абсолютная готовность к глобальным изменениям:</b> Эта карта символизирует изначальную, потенциальную готовность человека принять те трансформации, которые произойдут с ним в результате любого начатого действия или контакта. В отличие от частичных изменений, здесь меняется вся энергетика человека целиком. Человек внутренне согласен на то, что новый опыт сделает его другим, и его это совершенно не пугает.<br><b>2. Безусловное принятие чужого влияния (Стирание границ):</b> В отношениях это способность естественно и без страха впускать в себя энергию партнера. Человек не боится последствий связи, он открыт и готов «надеть на себя» качества другого. Это изначальная гибкость, при которой «торг уместен» — человек не упирается жестко в одну форму, а позволяет ситуации лепить из него нечто новое.<br><b>3. Эмоциональное отторжение и «кислая мина» (в негативе):</b> Если эта базовая способность подавлена (перевернутый аркан), человек демонстрирует тотальное неприятие любых изменений, которые не соответствуют его идеальной картинке. Это принципиальная неготовность подстраиваться, страх перед трансформацией и хронически недовольное, кислое выражение лица, сигнализирующее о том, что происходящее нарушает его изначальное равновесие.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> В фундаменте психики такого человека гармонично слиты два образа: <b>рука из облака, предлагающая кубок, полный живой воды (по Уэйту)</b>, и <b>женщина, надевшая мужской костюм, абсолютно расслабленно принимающая в себя мужскую энергию (по Манаре)</b>. Суперсила такого человека — феноменальная пластичность на старте любого дела. Он начинает проекты или отношения, будучи кристально чистым сосудом, готовым наполниться новым содержимым. Его не пугает неизвестность, он инстинктивно доверяет потоку. Главная уязвимость (особенно при перевернутой карте) — риск полного паралича воли из-за несовпадения реальности с его ожиданиями, когда малейшее отклонение от идеала вызывает глубокое фоновое разочарование в себе и в мире, заставляя человека брезгливо отказываться от любого взаимодействия.<br><br>Ниже представлен детальный разбор проявления этой энергетики во всех 12 домах гороскопа (Тузы подчиняются Марсу и Плутону, поэтому их особые положения связаны с достоинствами этих планет).`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель</b><br>** Идеальное, максимально естественное состояние. Человек вступает в новые жизненные этапы или отношения с абсолютной психологической готовностью к последствиям. ** Стартуя в любом деле, человек не испытывает страха перед тем, как это на него повлияет. Он открыт миру (предлагает свой кубок) и легко адаптируется к предлагаемым обстоятельствам, словно примеряя на себя новую одежду (Манара). Его базовая потребность — это потребность в глубоком, трансформирующем слиянии, которое принимается им как естественный ход вещей.`,
                    2: `<b>2 дом (Телец) — Второе изгнание</b><br>** Блокировка естественной эмоциональной восприимчивости жесткими материальными формами или физическими комплексами. ** Потребность в комфорте и материальной стабильности вступает в конфликт с необходимостью меняться. Человек хочет получить блага или партнера, но категорически не готов при этом менять свои привычки или впускать кого-то в свою душу. Он может использовать свою внешнюю привлекательность (женщина в костюме), но внутренне остается холодным и отстраненным, так как боится, что слияние нарушит его материальную безопасность.`,
                    3: `<b>3 дом (Близнецы) — Эмоциональная открытость общению</b><br>** В повседневных контактах и обучении человек демонстрирует абсолютную восприимчивость. Он впитывает информацию, как губка (кубок Уэйта), и легко перенимает манеры общения своих собеседников (надевает чужой костюм по Манаре). Его рутинные связи строятся на интуитивном, эмпатичном доверии, где он не боится менять свое мнение под влиянием момента.`,
                    4: `<b>4 дом (Рак) — Падение</b><br>** Полная парализация способности к изменениям из-за гипертрофированной потребности в базовой безопасности. ** Изначальная готовность впитывать новое разбивается о страх потерять свою «нору» и интимную зону комфорта. Сталкиваясь с необходимостью пустить кого-то в свою душу или дом, человек впадает в ступор. Он захлопывает свой кубок, отказываясь от любых трансформаций, предпочитая оставаться в привычном, пусть даже инфантильном состоянии, лишь бы не столкнуться с пугающей неизвестностью внешних влияний.`,
                    5: `<b>5 дом (Лев) — Искренняя любовная адаптация</b><br>** В сфере игры, творчества и влюбленности человек отдается страсти без остатка. Влюбляясь, он готов полностью перекроить свою личность ради объекта симпатии. Это чистый, незамутненный восторг от процесса слияния, когда творческий или любовный импульс воспринимается как божественный дар (рука с небес), ради которого не жалко пожертвовать старым эго.`,
                    6: `<b>6 дом (Дева) — Принятие рутинных перемен</b><br>** В вопросах здоровья, быта и служения человек проявляет гибкость. Он не сопротивляется необходимости сесть на диету, сменить режим дня или подчиниться рабочему графику. Он воспринимает эти требования не как насилие, а как естественные изменения, легко адаптируя свое физическое и эмоциональное состояние под нужды текущей работы или лечения.`,
                    7: `<b>7 дом (Весы) — Первое изгнание</b><br>** Отказ от равноправного диалога ради сохранения собственного комфортного (или дискомфортного) эмоционального состояния. ** Вступая в партнерство, человек перестает учитывать реального собеседника. Вместо поиска компромисса, он опирается только на свою личную готовность (или неготовность) меняться. Если он не хочет подстраиваться (перевернутая карта), он будет демонстрировать партнеру капризный отказ и эмоциональную закрытость, ожидая, что другой человек сам должен делать шаги навстречу. Это подмена партнерства личным эмоциональным эгоизмом.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель</b><br>** Использование изначальной гибкости как мощного резервного ресурса для выживания в кризисе. ** Сталкиваясь с экстримом, болью или глубокими сексуальными трансформациями, человек спасается тем, что полностью отдается процессу изменения. Он не сопротивляется разрушению старой формы, а позволяет кризису или партнеру перелепить себя. Это способность выжать максимум жизненной энергии (рука Уэйта) из самых тяжелых и темных ситуаций, принимая их без отторжения.`,
                    9: `<b>9 дом (Стрелец) — Идеологическая восприимчивость</b><br>** В столкновении с чужими культурами, религиями или авторитетами человек не проявляет ортодоксальной упертости. Он с готовностью пьет из «кубка новых знаний», позволяя иностранному влиянию или философским концепциям полностью трансформировать его мировоззрение. Он легко примеряет на себя чужие идеологические «костюмы», искренне веря в их истинность.`,
                    10: `<b>10 дом (Козерог) — Экзальтация</b><br>** Высшая цель изначальной восприимчивости — достижение абсолютного социального или профессионального совершенства через самоотречение. ** Человек понимает, что для достижения вершины карьеры или выполнения долга ему необходимо полностью, без остатка изменить себя под требования системы. Он добровольно становится идеальным «сосудом» для выполнения поставленной социальной задачи, принимая на себя любые лишения и трансформации ради высшей цели. Это объективное понимание того, на что ты реально способен ради статуса.`,
                    11: `<b>11 дом (Водолей) — Свобода через слияние</b><br>** В неформальных объединениях, кругу друзей или при планировании будущего человек отказывается от жестких рамок. Он воспринимает непредсказуемость будущего как шанс на чудесное обновление. Ради сохранения свободы и дружеских связей он готов обнулиться и принять совершенно новые, нестандартные формы взаимодействия, спокойно отдаваясь воле коллективного потока.`,
                    12: `<b>12 дом (Рыбы) — Кармическое растворение</b><br>** Оказавшись в социальной изоляции или сталкиваясь со скрытыми последствиями прошлого, человек инстинктивно выбирает путь полного растворения в ситуации. Он не борется с фатумом, а позволяет кармическим обстоятельствам влиться в него, трансформируя его душу на самом глубоком, мистическом уровне. Это состояние абсолютного принятия своей судьбы без страха и упрека.`
                }
            },
            42: {
                name: "6 Кубков",
                general: `В астрологической системе Таро Юрия Хана числовые карты-шестерки соответствуют второй, сознательной зоне гороскопа (шестой дом, знак Девы) и управляются планетой <b>Прозерпина</b> (и внутренне Меркурием). Они символизируют процесс сознательного выбора формы для реализации своих желаний, трезвый самоанализ и создание личного образа жизни. Младший аркан <b>6 кубков (Шестерка Воды)</b> описывает эмоциональную, водную сторону этого процесса — выбор комфортных психологических состояний и оценку результатов своих действий.<br><br>Для формирования глубокого натального портрета личности (если рассматривать 6 кубков как базовую прошивку, аналог Асцендента), необходимо синтезировать <b>три различных проявления этого аркана</b>, выделяемых в лекциях:<br><b>1. Создание искусственных "тепличных" условий и забота о внутреннем ребенке (по Уэйту):</b> Человек производит тонкий подбор максимально комфортных, безопасных и ресурсных состояний для своей психики. Это процесс «выращивания» и исцеления той части своей личности, которая когда-то замерла или травмировалась в детстве. Он окружает себя искусственным позитивом, сознательно поощряя себя за любые, даже мелкие достижения, чтобы не останавливаться в развитии.<br><b>2. Эмоциональное доминирование и взаимный экстаз (по Манаре):</b> В отношениях человек стремится к полному управлению эмоциями партнера. На карте изображена женщина, по первому зову которой к ней в воду приплывает огромный носорог (или бегемот). Это абсолютное подчинение партнера своим желаниям, но в позитивном ключе это способность достигать тотального совместного экстаза, когда оба партнера в одинаковой степени погружаются в сексуальность и эмоции, идеально синхронизируясь друг с другом.<br><b>3. Корыстная опека и скрытая неискренность (в негативе):</b> При искажении энергетики забота превращается в «дешевую подачку», чтобы заглушить муки совести или просто успокоить партнера (дать конфетку, чтобы ребенок перестал плакать и мешать). Это искусственное создание позитивных эмоций, за которым скрывается расчетливость и «камень за пазухой». В отношениях человек может относиться к партнеру как к послушному животному, используемому лишь для личного эмоционального обслуживания.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 6 кубков — это личность, чьим главным мотивом является создание абсолютно безопасного, управляемого и эмоционально комфортного пространства. В его психике сливаются два архетипа: <b>дети, обменивающиеся цветами в защищенном саду (по Уэйту)</b>, что символизирует дозированную заботу, сознательное сглаживание конфликтов и искусственный позитив, и <b>женщина, уверенно призывающая к себе дикого зверя в водоем (по Манаре)</b>, отражающая потребность в том, чтобы мир и партнеры беспрекословно, как загипнотизированные, погружались в ее эмоциональный ритм. Его суперсила — гениальная способность исцелять чужие и свои душевные травмы, создавать атмосферу уюта и достигать идеального эмоционального резонанса с партнером. Его главная уязвимость (при перевернутой карте) — риск скатиться в лицемерную манипуляцию, когда за маской заботы скрывается холодный расчет, а партнер обесценивается до уровня «ручного питомца», обязанного обслуживать эгоистичные капризы владельца.<br><br>Шестерки подчиняются Прозерпине, поэтому их особые положения распределены по её специфическим астрологическим достоинствам (Обитель в Деве и Близнецах, Изгнание в Рыбах и Стрельце, Экзальтация в Стрельце, Падение в Близнецах).`,
                houses: {
                    1: `<b>1 дом (Овен) — Искусственный эмоциональный старт</b><br>** Базовая инициатива человека лишена природной агрессии Марса. Он начинает любые проекты или отношения с осторожного «прощупывания» почвы, предлагая безопасные знаки внимания (Уэйт). На старте он ожидает, что мир или партнер немедленно откликнутся на его призыв и покорно приплывут к нему в руки (Манара), отказываясь действовать, если не чувствует полного эмоционального контроля над ситуацией.`,
                    2: `<b>2 дом (Телец) — Тепличный комфорт ресурсов</b><br>** Человек относится к своим деньгам, телу и ресурсам исключительно как к средствам для поддержания своего психологического покоя. Он тратит средства на создание уютной, защищенной среды (Уэйт), где может безопасно восстанавливать силы. Физиологические отношения с партнером рассматриваются как потребительский ритуал, где партнер обязан поставлять эмоциональный и телесный комфорт по первому требованию (Манара).`,
                    3: `<b>3 дом (Близнецы) — Вторая обитель и Падение</b><br>** Сфера повседневной рутины, общения и первичного обучения. <i>Как Вторая обитель:</i> Человек сознательно внедряет свою искусственную доброту и эмпатию в каждый рутинный контакт. Он раздает «цветы» комплиментов окружающим, сглаживая любые бытовые шероховатости (Уэйт). <i>Как Падение:</i> Естественное, простое общение (свойственное 3 дому) разрушается чрезмерной подозрительностью и попыткой контролировать собеседника. Человек не может просто разговаривать — он требует, чтобы собеседник немедленно эмоционально подчинился ему (Манара), что превращает легкий треп в тяжелую психологическую манипуляцию с «камнем за пазухой».`,
                    4: `<b>4 дом (Рак) — Защищенный семейный оазис</b><br>** В стенах родного дома человек выстраивает идеальную лабораторию для исцеления своих детских травм. Семья для него — это закрытый сад, где все обмениваются подчеркнуто ласковыми жестами, скрывая реальные проблемы за фасадом благополучия (Уэйт). Он требует от домочадцев абсолютного эмоционального слияния и послушания, выступая в роли невидимого дрессировщика, которому все подчиняются беспрекословно (Манара).`,
                    5: `<b>5 дом (Лев) — Дозированная любовная игра</b><br>** В сфере любви, радости и эгоизма человек избегает неконтролируемых страстей. Его влюбленность — это искусственно срежиссированный спектакль, где он дозирует свои чувства, чтобы не обжечься (Уэйт). Он играет в любовь только с теми, кто готов полностью раствориться в его сценарии и покорно «зайти в воду» его эмоций, подтверждая его власть и привлекательность (Манара).`,
                    6: `<b>6 дом (Дева) — Первая обитель</b><br>** Здесь базовая прошивка находится в своей идеальной, естественной среде. Человек гениально анализирует свои эмоциональные потребности и создает для себя идеальный образ жизни, свободный от стрессов. Он заботливо выращивает свои таланты в «тепличных условиях» (Уэйт). В отношениях он выбирает только тех партнеров, с которыми возможен абсолютный резонанс и совместный экстаз, где партнер с радостью погружается в предложенную эмоциональную глубину (Манара). В перевернутом (негативном) варианте человек замыкается в зоне комфорта, перехваливает себя за несуществующие заслуги и манипулирует близкими через показную, искусственную заботу.`,
                    7: `<b>7 дом (Весы) — Взаимовыгодный эмоциональный симбиоз</b><br>** Брак и открытое партнерство строятся на взаимном психологическом поглаживании и сглаживании острых углов. Партнеры обмениваются «дешевыми подачками» в виде формальной заботы, чтобы избежать реальных конфликтов (Уэйт). В идеале это союз, где оба достигли глубокого понимания инстинктов друг друга и способны на совместный, контролируемый экстаз без потери личных границ (Манара).`,
                    8: `<b>8 дом (Скорпион) — Сглаживание трансформационных кризисов</b><br>** Сталкиваясь с экстримом, болью или глубокими сексуальными трансформациями, человек пытается подсластить пилюлю. Вместо того чтобы пройти через катарсис, он искусственно успокаивает себя (Уэйт), применяя полумеры. В сексе он ищет абсолютной власти над подсознательными реакциями партнера, заставляя его животную природу (носорога) полностью подчиняться своим эмоциональным ритмам (Манара).`,
                    9: `<b>9 дом (Стрелец) — Второе изгнание и Экзальтация</b><br>** Сфера высших идеалов, мировоззрения, дальних целей и социального авторитета. <i>Как Второе изгнание:</i> Полный отказ от духовного расширения ради сохранения личного «парника». Человек игнорирует глобальные смыслы, предпочитая сидеть в своей уютной эмоциональной луже. <i>Как Экзальтация:</i> Гиперкомпенсация. Человек пытается навязать свои методы эмоционального контроля (Манара) всему социуму или авторитетным фигурам. Его «тепличные условия» (Уэйт) возводятся в ранг абсолютной идеологии: он насильно причиняет добро и насаждает свою заботу в макромасштабах, требуя от мира полного послушания своим правилам игры.`,
                    10: `<b>10 дом (Козерог) — Имитация социальной заботы</b><br>** В карьере, достижении статуса и общении с начальством человек использует маску добродушного, послушного ребенка или заботливого опекуна (Уэйт). Он пробивает себе путь наверх не жесткой борьбой, а тонкими эмоциональными манипуляциями, приручая руководство или систему так же виртуозно, как женщина приручает дикого зверя в водоеме (Манара), заставляя объективную реальность работать на свой личный комфорт.`,
                    11: `<b>11 дом (Водолей) — Кружок эмоциональных единомышленников</b><br>** В поисках независимости и при планировании будущего человек окружает себя людьми, с которыми не нужно напрягаться. Друзья выбираются по принципу эмоционального удобства: это клуб по интересам, где все хвалят друг друга и дарят «цветы» иллюзорной поддержки (Уэйт). В ситуациях форс-мажора он ожидает, что коллектив мгновенно придет ему на помощь, покорно откликаясь на его зов, как прирученное животное (Манара).`,
                    12: `<b>12 дом (Рыбы) — Первое изгнание</b><br>** Сфера глобальных кармических итогов и разрушения иллюзий. Для шестерок это катастрофа, так как их мелкий, дозированный контроль здесь не работает. Столкнувшись с неизбежными последствиями прошлого или социальным дном, человек пытается откупиться «дешевыми подачками» (кубками с цветами по Уэйту), что выглядит нелепо перед лицом кармы. Его привычка повелевать эмоциями партнера (Манара) разбивается о хаос 12 дома: «носорог» больше не слушается команд, и человек тонет в неконтролируемых последствиях собственных манипуляций.`
                }
            },
            43: {
                name: "7 Кубков",
                general: `В системе астрологического Таро Юрия Хана числовые карты-семерки относятся к началу социальной, верхней полусферы — <b>седьмому дому гороскопа (знак Весов)</b>, стихии Воздуха второй зоны, и управляются планетой <b>Хирон</b> (и внутренне Венерой). Они описывают сознательное поведение человека во взаимодействии с партнером, поиск компромиссов, выстраивание договорных отношений и умение фильтровать свои реакции ради сохранения связи. Младший аркан <b>7 кубков (Семерка Воды)</b> описывает водную, эмоциональную сторону этого процесса — психологическую подстройку, деликатность и готовность принимать чужие недостатки.<br><br>Для создания детального натального портрета (рассматривая 7 кубков как базовую прошивку личности, аналог Асцендента), необходимо синтезировать проявления этого аркана из колод Уэйта и Манары:<br><b>1. Дипломатия, деликатность и фильтрация негатива (по Уэйту):</b> На карте человек смотрит на семь кубков, символизирующих семь смертных грехов или миражи. В позитивном ключе это означает осознание того, что может разрушить отношения. Человек тщательно скрывает свои «теневые» стороны и животные импульсы, демонстрируя партнеру только то, что тот способен принять. Это гениальная тактичность, умение обходить острые углы и не провоцировать конфликты.<br><b>2. Тотальное принятие и подстройка под состояние (по Манаре):</b> На карте изображена женщина в ванной, к которой забралось жуткое чудовище. Эта метафора описывает готовность принять партнера таким, какой он есть, со всеми его изъянами и странностями. Человек впускает партнера в свое интимное пространство, интуитивно адаптируясь под его эмоциональный фон.<br><b>3. Союз от безысходности и рассогласованность (в негативе):</b> При искажении энергии принятие превращается во всеядность от страха одиночества («пусть чудовище, лишь бы кто-то живой ходил по дому»). Также это может проявляться как тотальное несовпадение состояний, когда один партнер готов к близости, а другой истощен или не настроен на нее, но человек этого в упор не замечает.<br><b>Общая трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 7 кубков — это прирожденный дипломат и эмпат. Его суперсила заключается в феноменальной способности сглаживать любые конфликты, проявлять предельную толерантность и любить людей вопреки их недостаткам. Однако его главная уязвимость — риск потерять собственное «я» в попытках угодить другому, склонность впадать в иллюзии относительно качества отношений и готовность годами терпеть рядом с собой токсичного партнера («монстра») из страха разорвать связь.<br><br>Поскольку семерки подчиняются Хирону, их особые положения распределены по его астрологическим достоинствам (Обитель в Весах и Тельце, Изгнание в Овне и Скорпионе, Экзальтация в Близнецах, Падение в Стрельце).`,
                houses: {
                    1: `<b>1 дом (Овен) — Первое изгнание</b><br>** Острый конфликт между личной природной инициативой и необходимостью оглядываться на партнера. ** Человек пытается применить дипломатию там, где нужен прямой стартовый импульс. Вместо того чтобы смело заявить о своих желаниях, он постоянно оглядывается («что он подумает?»), и его инициатива тонет в иллюзиях и страхах (Уэйт). В другом варианте он эгоистично навязывает свою эмоциональную близость, совершенно не учитывая реальное состояние партнера (Манара) — например, требует романтики от уставшего человека, создавая жесткий диссонанс.`,
                    2: `<b>2 дом (Телец) — Вторая обитель</b><br>** Использование эмоциональной подстройки для получения материального или физиологического комфорта. ** Человек готов терпеть рядом с собой весьма специфического персонажа («чудовище» по Манаре), если этот союз обеспечивает ему стабильность и безопасность. Он искусственно создает иллюзию идеальных отношений, пряча свои претензии (Уэйт), чтобы сохранить ресурсы пары. Это отношения, где дипломатия становится инструментом удержания жизненных благ.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация</b><br>** Гипертрофированная, избыточная деликатность в повседневном общении. ** В рутинных контактах человек ведет себя так, будто каждый прохожий — его супруг. Он тщательно фильтрует свои слова, панически боясь кого-то обидеть (Уэйт). Он готов распахнуть свою душу (впустить в свою "ванную") совершенно случайным знакомым, демонстрируя неуместную открытость и принимая чужие проблемы слишком близко к сердцу (Манара).`,
                    4: `<b>4 дом (Рак)</b><br><i>Семейный эмоциональный компромисс.</i> В стенах родного дома человек изо всех сил поддерживает атмосферу покоя. Он намеренно закрывает глаза на недостатки своих домочадцев и прячет свое раздражение (Уэйт). Дом для него — это место, где он готов принять и обогреть любого члена семьи, каким бы "чудовищем" тот ни казался социуму (Манара).`,
                    5: `<b>5 дом (Лев)</b><br><i>Отфильтрованная любовная игра.</i> В романтических увлечениях и творчестве отсутствует спонтанный эгоизм. Влюбляясь, человек показывает только самую социально приемлемую, красивую версию себя, скрывая истинные животные инстинкты (Уэйт). Он с готовностью и любопытством погружается в эмоциональный мир объекта симпатии, принимая его правила игры (Манара).`,
                    6: `<b>6 дом (Дева)</b><br><i>Деликатность в рутине.</i> В вопросах быта, работы и служения человек проявляет максимальную уживчивость. Он подстраивает свой рабочий график или бытовые привычки так, чтобы не мешать окружающим (Уэйт). Он спокойно выполняет свои обязанности бок о бок с тяжелыми или странными коллегами, не пытаясь их переделать (Манара).`,
                    7: `<b>7 дом (Весы) — Первая обитель</b><br>** Идеальная среда для карты. Человек демонстрирует высший пилотаж в выстраивании гармоничных эмоциональных связей. ** Он виртуозно обходит острые углы, пряча свои «семь грехов», чтобы не ранить партнера (Уэйт). Он абсолютно искренне принимает супруга со всеми его бытовыми или психологическими недостатками, позволяя ему быть собой в их общем пространстве (Манара). Брак держится на глубоком понимании того, что идеальных людей не бывает, и на готовности беречь эмоциональный комфорт пары.`,
                    8: `<b>8 дом (Скорпион) — Второе изгнание</b><br>** Зависание в процессе подстройки. Отказ от необходимой трансформации из-за страха разорвать болезненную связь. ** Столкнувшись с тяжелым кризисом, человек не делает волевых выводов. Он предпочитает оставаться в иллюзиях, надеясь, что проблема рассосется сама собой (Уэйт). Он будет до последнего терпеть разрушительное поведение партнера, принимая его внутренние травмы как крест, барахтаясь с этим "монстром" в одном эмоциональном болоте (Манара), лишь бы не остаться в одиночестве.`,
                    9: `<b>9 дом (Стрелец) — Падение</b><br>** Крах партнерской дипломатии при столкновении с вопросами идеологии, веры и глобальных планов на будущее. ** Человек понимает, что никакая деликатность не спасет союз, если у пары разные жизненные ценности. Иллюзии рушатся: он ясно видит все «смертные грехи» партнера (Уэйт) и категорически отказывается брать это «чудовище» с собой в светлое будущее (Манара). Либо, в негативе, он слепо идеализирует партнера, надеясь построить воздушные замки с человеком, который объективно для этого не предназначен.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Социально-карьерная адаптивность.</i> В стремлении к статусу и в общении с руководством человек использует тактику соглашательства. Он никогда не продемонстрирует начальнику свои истинные мотивы или амбиции, если они могут ему навредить (Уэйт). Он готов покорно сосуществовать с самой суровой или "монструозной" системой ради сохранения своего рабочего места (Манара).`,
                    11: `<b>11 дом (Водолей)</b><br><i>Дружеская всеядная толерантность.</i> В кругу друзей и коллективе единомышленников человек выступает миротворцем. Он лояльно относится к любым причудам и странностям своих товарищей, принимая их в свою "стаю" (Манара). Он сознательно избегает конфликтных тем, поддерживая иллюзию идеального, ни к чему не обязывающего братства (Уэйт).`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармическое эмоциональное смирение.</i> Столкнувшись с тайными страхами, изоляцией или последствиями прошлых ошибок, человек не сопротивляется судьбе. Он уходит в мир иллюзий и снов (Уэйт), находя утешение в полном растворении в своих переживаниях. Он мистическим образом принимает свою участь, даже если она принимает форму пугающего кармического наказания или зависимости (Манара).`
                }
            },
            44: {
                name: "8 Кубков",
                general: `В астрологической системе Таро Юрия Хана числовые карты-восьмерки соответствуют восьмому дому гороскопа (знак Скорпиона) и управляются планетой Плутон (а также внутренним Марсом). Восьмой дом символизирует реальный, промежуточный результат сознательных действий человека во второй зоне (с 5 по 8 дома) и его способность воспринимать эти результаты, глубоко трансформироваться и двигаться дальше, не останавливаясь на достигнутом. Младший аркан <b>8 кубков (Восьмерка Воды)</b> описывает именно водную, эмоциональную сторону этого процесса — психологическую реакцию на полученный опыт и внутреннее обновление.<br><br>Для составления объемного детального отчета по проявлению 8 кубков как базовой натальной прошивки (аналога Асцендента), необходимо синтезировать проявления этого аркана из колод Уэйта и Манары:<br><b>1. Бесстрашное движение вперед и решение проблем (по Уэйту):</b> На карте изображен человек, уходящий в ночь от восьми выстроенных кубков, в которых как бы недостает одного элемента. В позитивном ключе эта карта символизирует отказ зацикливаться на прошлых результатах или эмоциональных разочарованиях. Человек не комплексует и не впадает в ступор. Это спиралевидное движение вперед: он возвращается к своим нерешенным проблемам (идет в болото/в ночь) не от отчаяния, а совершенно бесстрашно, чтобы доделать их и выйти на новый уровень. Это осознанный, интеллектуальный отказ от эмоций ради объективной оценки ситуации.<br><b>2. Моментальная реакция на импульс (по Манаре):</b> На карте Восьмерка Воды изображена женщина, заметившая прилетевшую стрелу. Этот образ означает моментальную, инстинктивную реакцию на внешнее внимание, раздражитель или результат действий. В контексте отношений это способность женщины мгновенно оценить реакцию мужчины на ее поведение или даже физиологическая реакция организма (например, на зачатие).<br><b>3. Проявления в раскладах (Манипуляция страданиями):</b> Если энергетика карты искажена (перевернута), то в раскладах это часто проигрывается как застревание в апатии, нежелание делать выводы из кризиса, либо использование своей "разбитости" и страданий для того, чтобы пассивно манипулировать партнером и вызывать у него чувство вины.<br><b>Общий синтез:</b> Человек с базовой прошивкой 8 кубков обладает феноменальной выживаемостью и умением адаптироваться. Его суперсила — способность извлекать реальный опыт из любых ситуаций, быстро реагировать на новые «стрелы» судьбы (Манара) и без сожалений оставлять позади отжившие эмоциональные привязанности (Уэйт). Его уязвимость — риск впасть в бесконечное саморазрушение, эмоциональную тупость или манипуляцию через страдания.<br><br>Ниже представлен детальный разбор проявления 8 кубков во всех 12 домах гороскопа. Поскольку восьмерки управляются Плутоном, их особые положения распределены по его астрологическим достоинствам.`,
                houses: {
                    1: `<b>1 дом (Овен) — Вторая обитель</b><br>** Сфера базовой энергетики и личной инициативы, где Плутон (и Марс) играют роль управителей. Энергия восьмерок здесь вовлекается в самый стартовый импульс человека. Человек не проявляет прямую агрессивную инициативу, а находится в состоянии тотальной восприимчивости. Он инстинктивно ловит «стрелу» партнера (Манара) и ждет, что внешний мир даст ему повод для реакции. Уходящий человек (Уэйт) в данном случае означает: если встречного импульса, внимания или готовности от мира не последует, личность просто развернется и без сожалений уйдет еще до начала реальных действий, не тратя свои силы впустую.`,
                    2: `<b>2 дом (Телец) — Первое изгнание</b><br>** Сфера личных ресурсов, материального и физиологического комфорта. Плутон и восьмерки здесь находятся в слабом положении первого изгнания. Возникает жесткий конфликт между необходимостью трансформироваться и желанием удержать свою материальную стабильность. Вместо того чтобы идти вперед и развиваться (Уэйт), человек фиксируется на потерях или использует свои травмы для потребления ресурсов партнера. В самом негативном варианте (в раскладах) это позиция энергетического вампиризма и склонности к саморазрушению: человек использует прилетевшую "стрелу" как повод, чтобы партнер превратился в "страшного волка" и поглотил его (Манара), перекладывая ответственность за свои кризисы на окружающих.`,
                    3: `<b>3 дом (Близнецы) — Трансформация в общении</b><br>** В повседневных контактах, переписках и при обучении человек проявляет гибкость и легко меняет свое окружение. Он без малейшего сожаления и эмоциональных привязанностей уходит от скучных собеседников или исчерпавшей себя информации (Уэйт). В диалоге он мгновенно реагирует на любые новые сплетни, новости или словесные «стрелы» окружающих, быстро адаптируя свой стиль общения под новые реалии и извлекая из контактов промежуточный информационный результат (Манара).`,
                    4: `<b>4 дом (Рак) — Эмоциональное обновление семьи</b><br>** В вопросах родного дома, интимного психологического пространства и базовой безопасности человек категорически не терпит застоя. Если домашняя обстановка перестает давать ему энергию и превращается в болото, он готов покинуть зону комфорта ради поиска новых решений и исправления родовых ошибок (Уэйт). В быту он инстинктивно и очень остро улавливает тончайшие изменения психологической атмосферы или «стрелы» скрытого напряжения внутри семьи (Манара), трансформируя домашнее пространство.`,
                    5: `<b>5 дом (Лев) — Экзальтация</b><br>** Сфера радости, любви, сознательного творчества и чистого эгоизма, где Плутон достигает своей экзальтации. Человек ставит перед собой сверхнапряженную цель — достичь абсолютного личного счастья и любви через тотальную глубокую трансформацию. Он фанатично верит в свой путь и идет вперед без оглядки на старые разочарования, черпая колоссальный оптимизм в процессе постоянного обновления (Уэйт). Он жадно и ярко реагирует на любые признаки страсти и новые «стрелы» романтического внимания (Манара). В раскладах перевернутое положение означает отчаяние от того, что его уникальность не находит отклика, а попытки изменить свою личную жизнь зашли в тупик.`,
                    6: `<b>6 дом (Дева) — Прагматичная смена рутины</b><br>** В повседневном труде, исполнении обязанностей и заботе о собственном здоровье человек постоянно ориентирован на результат. Если инструмент, диета или метод лечения перестают работать, он хладнокровно оставляет их в прошлом, не жалея о потраченном времени (Уэйт). Он моментально перестраивает свой график и привычки, когда замечает «стрелу» нового профессионального вызова, рабочей критики или физиологического симптома своего организма (Манара).`,
