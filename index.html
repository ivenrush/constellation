. Человек становится авторитарным начальником или домашним тираном, который подавляет волю окружающих, прикрываясь чувством долга, или использует чужие ресурсы в корыстных целях.<br>Поскольку Король пентаклей управляется Сатурном, его особые положения распределяются по астрологическим достоинствам этой планеты в зодиакальном круге.<br><br>### Особые положения Короля пентаклей<br><br><b>10 дом (Козерог) — Первая обитель. Идеальная внешняя ответственность.</b> Естественная, родная среда для этой роли. Человек находится на своем месте, гениально выполняя функции руководителя, профессионала или главы семейства. Он адекватно оценивает угрозы внешнего мира и принимает самостоятельные решения, гарантируя выживание тем, за кого взял ответственность. В партнерстве это надежный, взрослый союз, где мужчина полностью обеспечивает социальный статус и материальную безопасность пары.<br><br><b>11 дом (Водолей) — Вторая обитель. Социальное подчинение системе.</b> Сфера непредсказуемого будущего и коллективной свободы, где Сатурн выступает вторым управителем. Человек добровольно усмиряет свой индивидуализм (и бунтарство Водолея), встраиваясь в жесткую структуру социума или корпорации. В этой роли он признает, что его жизнь и ресурсы принадлежат не только ему, но и более глобальной системе, выполняя долг перед коллективом как надежный винтик механизма.<br><br><b>4 дом (Рак) — Первое изгнание. Вторжение реальности в дом.</b> Зона интимности, эмоций и семьи, где Сатурн изгоняется. Суровая социальная реальность и рабочие обязанности вторгаются в личное, безопасное пространство человека. В этой роли личность не может расслабиться дома: она ведет себя не как мягкий, эмпатичный родитель, а как строгий комендант или начальник, регламентируя жизнь домочадцев по жестким правилам. Дом превращается в филиал рабочего офиса.<br><br><b>5 дом (Лев) — Второе изгнание. Деловой подход к любви.</b> Сфера радости, эгоизма, творчества и влюбленности. Здесь роль Короля пентаклей полностью уничтожает спонтанность и праздник. Сталкиваясь с романтическими чувствами, человек отключает эмоции и подходит к любовнику или творческому проекту исключительно с позиции прагматичного планирования и инвестиций. Влюбленность лишается легкости, так как человек сразу оценивает партнера как кандидата на совместную ипотеку.<br><br><b>7 дом (Весы) — Экзальтация. Жесткие брачные обязательства.</b> Сфера брака и открытых договоренностей, где Сатурн достигает высшего напряжения. Партнерство здесь сохраняется не благодаря романтике или легкости, а за счет колоссального давления внешних обстоятельств. Король пентаклей указывает на то, что супругов намертво связывают общие долги, имущество или социальный долг, лишая их права на личную независимость. Это брак, превратившийся в тяжелую, но неразрывную упряжку.<br><br><b>1 дом (Овен) — Падение. Потеря личной свободы.</b> Зона базового старта и личной энергии, где Сатурн падает. Инициатива и индивидуальные желания человека полностью раздавлены необходимостью служить чужим (или корпоративным) задачам. При перевернутой карте человек настолько «оброс» профессиональными обязанностями, что у него физически нет времени и сил на решение собственных, личных проблем. При прямой карте — это спасительное прямое падение: социум или начальник официально освобождает человека от обязанностей (например, дает декретный отпуск), позволяя заняться собой без потери статуса.`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение. Потеря личной свободы</b><br>Зона базового старта и личной энергии, где Сатурн падает. Инициатива и индивидуальные желания человека полностью раздавлены необходимостью служить чужим (или корпоративным) задачам. При перевернутой карте человек настолько «оброс» профессиональными обязанностями, что у него физически нет времени и сил на решение собственных, личных проблем. При прямой карте — это спасительное прямое падение: социум или начальник официально освобождает человека от обязанностей (например, дает декретный отпуск), позволяя заняться собой без потери статуса.`,
                    2: `<b>2 дом. Прагматичный финансовый диктат</b><br>В сфере личных накоплений, формы и физиологии навыки руководителя используются для тотального контроля над ресурсами. Человек относится к своему телу и кошельку как к предприятию, требующему сурового администрирования. В отношениях партнер оценивается через призму его материальной состоятельности, а потребление благ подчинено жесткой экономии ради накопления капитала.`,
                    3: `<b>3 дом. Сухая деловая коммуникация</b><br>В зоне повседневного общения и поверхностных контактов человек выстраивает непробиваемую субординацию. Общение ведется строго по делу, без эмоций и лишней лирики. Личность выступает как авторитетный администратор, требуя от собеседников четких фактов и соблюдения регламента, полностью исключая пустую болтовню.`,
                    4: `<b>4 дом (Рак) — Первое изгнание. Вторжение реальности в дом</b><br>Зона интимности, эмоций и семьи, где Сатурн изгоняется. Суровая социальная реальность и рабочие обязанности вторгаются в личное, безопасное пространство человека. В этой роли личность не может расслабиться дома: она ведет себя не как мягкий, эмпатичный родитель, а как строгий комендант или начальник, регламентируя жизнь домочадцев по жестким правилам. Дом превращается в филиал рабочего офиса.`,
                    5: `<b>5 дом (Лев) — Второе изгнание. Деловой подход к любви</b><br>Сфера радости, эгоизма, творчества и влюбленности. Здесь роль Короля пентаклей полностью уничтожает спонтанность и праздник. Сталкиваясь с романтическими чувствами, человек отключает эмоции и подходит к любовнику или творческому проекту исключительно с позиции прагматичного планирования и инвестиций. Влюбленность лишается легкости, так как человек сразу оценивает партнера как кандидата на совместную ипотеку.`,
                    6: `<b>6 дом. Механический профессионализм</b><br>В сфере ежедневной рутины, служения и быта человек действует как идеальный, но бездушный механизм. Он берет на себя колоссальный объем работы и несет ответственность за порядок до мельчайших деталей. Однако труд здесь лишен творческой искры — это тяжелое исполнение долга ради выживания структуры, где человек может буквально «сгореть» на работе.`,
                    7: `<b>7 дом (Весы) — Экзальтация. Жесткие брачные обязательства</b><br>Сфера брака и открытых договоренностей, где Сатурн достигает высшего напряжения. Партнерство здесь сохраняется не благодаря романтике или легкости, а за счет колоссального давления внешних обстоятельств. Король пентаклей указывает на то, что супругов намертво связывают общие долги, имущество или социальный долг, лишая их права на личную независимость. Это брак, превратившийся в тяжелую, но неразрывную упряжку.`,
                    8: `<b>8 дом. Антикризисное жесткое управление</b><br>Столкнувшись с глубокими трансформациями, экстримом или чужими деньгами, личность берет на себя ответственность кризис-менеджера. Человек способен хладнокровно управлять бюджетом в период дефолта, брать тяжелейшие кредиты или рисковать имуществом ради спасения коллектива или семьи, взваливая все последствия на свои плечи.`,
                    9: `<b>9 дом. Авторитет консервативной реальности</b><br>В сфере мировоззрения, идеологии и далекого будущего амбиции кристаллизуются в непоколебимый догматизм. Человек становится носителем суровой, материальной правды жизни, отвергая любые непрактичные идеалы или духовные иллюзии. Он требует от социума подчинения проверенным, консервативным правилам игры, основывая свой авторитет на реальном жизненном опыте.`,
                    10: `<b>10 дом (Козерог) — Первая обитель. Идеальная внешняя ответственность</b><br>Естественная, родная среда для этой роли. Человек находится на своем месте, гениально выполняя функции руководителя, профессионала или главы семейства. Он адекватно оценивает угрозы внешнего мира и принимает самостоятельные решения, гарантируя выживание тем, за кого взял ответственность. В партнерстве это надежный, взрослый союз, где мужчина полностью обеспечивает социальный статус и материальную безопасность пары.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель. Социальное подчинение системе</b><br>Сфера непредсказуемого будущего и коллективной свободы, где Сатурн выступает вторым управителем. Человек добровольно усмиряет свой индивидуализм (и бунтарство Водолея), встраиваясь в жесткую структуру социума или корпорации. В этой роли он признает, что его жизнь и ресурсы принадлежат не только ему, но и более глобальной системе, выполняя долг перед коллективом как надежный винтик механизма.`,
                    12: `<b>12 дом. Кармическая тяжесть долга</b><br>В зоне изоляции, скрытых итогов и тайн человек сталкивается с сухим остатком своей материальной и социальной жизни. Это глубокое одиночество начальника или «отца семейства», который осознает, что всю жизнь работал ради долга и упустил личное счастье. В негативном ключе — это столкновение с неотвратимыми последствиями своего прагматизма, от которых не спасут ни деньги, ни высокий статус.`
                }
            }
        };



        function getArcanaInfo(id, house) {
            // Попробовать найти данные напрямую по id
            let data = ARCANA_DATA[id];
            // Если данных нет — проверить, может это ЭП номер, и найти по обратному маппингу
            let resolvedSpId = id;
            if (!data && EP_TO_SP[id]) {
                resolvedSpId = EP_TO_SP[id];
                data = ARCANA_DATA[resolvedSpId];
            }
            if (!data) return { name: ARCANA_NAMES[id] || `Аркан #${id}`, text: "Описание пока не добавлено", seq: null };
            let text = data.houses[house] || data.general || "Описание для этого дома отсутствует";
            // Convert MD bold to HTML bold
            text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            const seq = ARCANA_SEQ[resolvedSpId] || null;
            return { name: data.name, text: text, seq: seq };
        }

        let showHouses = 6;

        function setHouses(n) {
            showHouses = n;
            document.querySelectorAll('.toggle-btn').forEach(b => {
                const is6 = b.getAttribute('onclick').includes('(6)');
                b.classList.toggle('active', (is6 && n === 6) || (!is6 && n === 12));
            });
            document.querySelectorAll('.result-row').forEach(row => {
                const idx = parseInt(row.dataset.idx);
                row.classList.toggle('hidden-row', idx > showHouses);
            });
        }

        function digitSum(n) {
            return Math.abs(n).toString().split('').reduce((s, d) => s + parseInt(d), 0);
        }

        function formatOriginal(n) {
            const s = n.toString();
            return s.length >= 3 ? s.substring(0, 2) + '.' + s.substring(2) : s;
        }

        function reduce88(n) {
            if (n <= 88) return { value: n, original: null };
            const orig = formatOriginal(n);
            while (n > 88) {
                const s = n.toString();
                n = s.length >= 3 ? parseInt(s.substring(0, 2)) + parseInt(s.substring(2)) : digitSum(n);
            }
            return { value: n, original: orig };
        }

        function val(r) { return r.value; }

        function compute12(day, part1Sum, part2Sum) {
            const N = new Array(13);
            N[1] = reduce88(part1Sum + part2Sum);
            N[2] = reduce88(digitSum(val(N[1])));
            N[3] = reduce88(val(N[1]) - day * 2);
            N[4] = reduce88(digitSum(Math.abs(val(N[3]))));
            N[5]  = reduce88(val(N[1]) + val(N[3]));
            N[6]  = reduce88(val(N[2]) + val(N[4]));
            N[7]  = reduce88(val(N[3]) + val(N[5]));
            N[8]  = reduce88(val(N[4]) + val(N[6]));
            N[9]  = reduce88(val(N[5]) + val(N[7]));
            N[10] = reduce88(val(N[6]) + val(N[8]));
            N[11] = reduce88(val(N[7]) + val(N[9]));
            N[12] = reduce88(val(N[8]) + val(N[10]));
            return N;
        }

        function renderResults(nums, listEl, cardEl, individualSets) {
            listEl.innerHTML = '';
            listEl.dataset.values = '';
            var vals = [];
            for (var i = 1; i <= 12; i++) {
                vals.push(nums[i].value);
                var row = document.createElement('div');
                row.className = 'result-row' + (i > showHouses ? ' hidden-row' : '');
                row.dataset.idx = i;
                row.style.animationDelay = (i - 1) * 0.04 + 's';
                var cols = '';
                if (individualSets && individualSets.length > 0) {
                    for (var j = 0; j < individualSets.length; j++) {
                        var iv = individualSets[j][i];
                        var io = iv.original ? '<span class="orig-individual">(' + iv.original + ')</span>' : '';
                        cols += '<span class="col-individual">' + iv.value + io + '</span>';
                        if (j < individualSets.length - 1) cols += '<span class="col-sep">+</span>';
                    }
                    cols += '<span class="col-sep">=</span>';
                }
                var orig = nums[i].original ? '<span class="result-original">(' + nums[i].original + ')</span>' : '';
                row.innerHTML = '<div class="result-num badge-' + i + '">' + i + '</div>' + cols + '<span class="result-value" onclick="showTip(this,' + nums[i].value + ')">' + nums[i].value + '</span>' + orig + '<div class="planet-sums-container"></div><div class="constellation-tip"></div>';
                listEl.appendChild(row);
            }
            listEl.dataset.values = vals.join(' ');
            cardEl.classList.add('visible');
            if (planetsOn) applyPlanetsToAll();
        }

        function copyResults(listId) {
            var el = document.getElementById(listId);
            var text = el.dataset.values || '';
            if (!text) return;
            var btn = el.parentElement.querySelector('.btn-copy');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function() {
                    btn.textContent = '✓ Скопировано';
                    btn.classList.add('copied');
                    setTimeout(function() { btn.textContent = '📋 Копировать'; btn.classList.remove('copied'); }, 1500);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✓ Скопировано';
                btn.classList.add('copied');
                setTimeout(function() { btn.textContent = '📋 Копировать'; btn.classList.remove('copied'); }, 1500);
            }
        }

        function showTip(el, num) {
            const row = el.closest('.result-row');
            const tip = row.querySelector('.constellation-tip');
            const house = parseInt(row.dataset.idx);
            
            if (tip.classList.contains('open')) { tip.classList.remove('open'); return; }
            document.querySelectorAll('.constellation-tip.open').forEach(t => t.classList.remove('open'));
            
            const c = getConstellation(num);
            
            // Старший Аркан (всегда через редукцию к 22)
            const majorId = ((num - 1) % 22) + 1;
            const majorArc = getArcanaInfo(majorId, house);
            
            // Младший Аркан по СП (только если число в диапазоне 23-78)
            let spArc = null;
            if (num >= 23 && num <= 78) {
                const spData = ARCANA_DATA[num];
                if (spData) {
                    spArc = { name: spData.name, text: (spData.houses[house] || spData.general || 'Описание отсутствует').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') };
                }
            }

            // Младший Аркан по ЭП (если число является ЭП-номером другого аркана)
            let epArc = null;
            if (num >= 23 && num <= 78) {
                const epSpId = EP_TO_SP[num];
                if (epSpId && epSpId !== num) {
                    const epData = ARCANA_DATA[epSpId];
                    if (epData) {
                        epArc = { name: epData.name, spId: epSpId, text: (epData.houses[house] || epData.general || 'Описание отсутствует').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') };
                    }
                }
            }

            let html = '';
            if (c) html += `<div style="margin-bottom:8px"><span class="cname">★ Созвездие: ${c[0]}</span><span class="cdesc"> — ${c[1]}</span></div>`;
            
            html += `<div style="margin-bottom:4px"><span class="cname" style="color:var(--a1)">◈ Старший Аркан: ${majorArc.name} (${majorId}, дом ${house})</span><span class="cdesc"> — ${majorArc.text}</span></div>`;
            
            if (spArc) {
                html += `<div style="margin-top:8px"><span class="cname" style="color:var(--a3)">✧ СП-Аркан: ${spArc.name} (СП ${num}, дом ${house})</span><span class="cdesc"> — ${spArc.text}</span></div>`;
            }

            if (epArc) {
                html += `<div style="margin-top:8px"><span class="cname" style="color:var(--a4)">✧ ЭП-Аркан: ${epArc.name} (ЭП ${num}, дом ${house})</span><span class="cdesc"> — ${epArc.text}</span></div>`;
            }

            if (!spArc && !epArc && num >= 23 && num <= 78) {
                // Фоллбэк — старое поведение
                const fallback = getArcanaInfo(num, house);
                html += `<div style="margin-top:8px"><span class="cname" style="color:var(--a3)">✧ Младший Аркан: ${fallback.name} (${num}, дом ${house})</span><span class="cdesc"> — ${fallback.text}</span></div>`;
            }
            
            tip.innerHTML = html;
            tip.classList.add('open');
        }

        // Search logic
        function setupSearch() {
            // Constellation Search
            document.getElementById('search-input').addEventListener('input', function() {
                var v = parseInt(this.value.trim());
                var res = document.getElementById('search-result');
                if (!v || v < 1 || v > 88) { res.classList.remove('visible'); return; }
                var c = getConstellation(v);
                if (c) {
                    res.innerHTML = '<span class="sr-num">' + v + '.</span><span class="sr-name">' + c[0] + '</span><div class="sr-desc">' + c[1] + '</div>';
                } else {
                    res.innerHTML = '<span class="sr-num">' + v + '.</span><span class="sr-empty">Данные пока не добавлены</span>';
                }
                res.classList.add('visible');
            });

            // Arcana Search
            const arcInput = document.getElementById('arcana-search-input');
            const arcHouse = document.getElementById('arcana-house-select');
            const arcRes = document.getElementById('arcana-search-result');
            const arcSuggestions = document.getElementById('arcana-name-suggestions');

            // Поиск аркана по имени — возвращает массив {id, name}
            function findArcanaByName(query) {
                const q = query.toLowerCase().trim();
                if (!q) return [];
                const results = [];
                for (const [id, name] of Object.entries(ARCANA_NAMES)) {
                    if (name.toLowerCase().includes(q)) {
                        results.push({ id: parseInt(id), name: name });
                    }
                }
                return results;
            }

            // Формирование строки с последовательностями СП/ЭП
            function getSeqLabel(id) {
                const seq = ARCANA_SEQ[id];
                if (!seq) {
                    // Может это ЭП номер?
                    const spId = EP_TO_SP[id];
                    if (spId && ARCANA_SEQ[spId]) {
                        const s = ARCANA_SEQ[spId];
                        return `<span style="font-size:.7rem;color:var(--a2);margin-left:6px">СП: ${s.sp} | ЭП: ${s.ep}</span>`;
                    }
                    return '';
                }
                return `<span style="font-size:.7rem;color:var(--a2);margin-left:6px">СП: ${seq.sp} | ЭП: ${seq.ep}</span>`;
            }

            // Строит HTML одной сворачиваемой карточки аркана
            function buildArcanaCard(spId, arcData, house, tagType, displayNum) {
                const seq = ARCANA_SEQ[spId];
                const seqStr = seq ? `СП:${seq.sp} ЭП:${seq.ep}` : '';
                const tagClass = tagType === 'СП' ? 'tag-sp' : 'tag-ep';
                const houseLabel = house > 0 ? `Дом ${house}` : 'Общее';
                const text = house > 0 ? (arcData.houses[house] || arcData.general || 'Описание для этого дома отсутствует') : arcData.general;
                const cleanText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                const uid = 'arc_' + spId + '_' + tagType + '_' + Date.now();
                return `<div class="arcana-card">
                    <div class="arcana-card-header" onclick="var b=document.getElementById('${uid}');var h=this;if(b.classList.contains('open')){b.classList.remove('open');h.classList.remove('open')}else{b.classList.add('open');h.classList.add('open')}">
                        <span class="arc-arrow">▸</span>
                        <span class="arc-tag ${tagClass}">${tagType}</span>
                        <span class="arc-num">${displayNum}.</span>
                        <span class="arc-name">${arcData.name}</span>
                        <span class="arc-seq">${seqStr}</span>
                    </div>
                    <div class="arcana-card-body" id="${uid}">
                        <div style="margin-bottom:4px;font-size:.7rem;color:var(--txt2);opacity:.7">${houseLabel}</div>
                        ${cleanText}
                    </div>
                </div>`;
            }

            const performArcSearch = (selectedId) => {
                const raw = arcInput.value.trim();
                const h = parseInt(arcHouse.value);
                let v = selectedId || parseInt(raw);

                // Если введено не число — пробуем найти по имени
                if (!v || isNaN(v)) {
                    const matches = findArcanaByName(raw);
                    if (matches.length === 0) {
                        arcRes.classList.remove('visible');
                        arcSuggestions.style.display = 'none';
                        return;
                    }
                    if (matches.length === 1) {
                        v = matches[0].id;
                        arcSuggestions.style.display = 'none';
                    } else {
                        // Показать варианты
                        arcSuggestions.innerHTML = matches.map(m => {
                            const seqLabel = getSeqLabel(m.id);
                            return `<div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(108,92,231,.1);transition:background .2s;font-size:.85rem" onmouseenter="this.style.background='rgba(108,92,231,.15)'" onmouseleave="this.style.background='transparent'" onclick="document.getElementById('arcana-search-input').value='${m.id}';document.getElementById('arcana-name-suggestions').style.display='none';performArcSearchById(${m.id})">
                                <span style="color:var(--a2);font-weight:600">${m.id}.</span> <span style="color:var(--txt)">${m.name}</span>${seqLabel}
                            </div>`;
                        }).join('');
                        arcSuggestions.style.display = 'block';
                        arcRes.classList.remove('visible');
                        return;
                    }
                } else {
                    arcSuggestions.style.display = 'none';
                }

                if (v < 1 || v > 78) { arcRes.classList.remove('visible'); return; }

                // Собираем все арканы, которым принадлежит число v
                let cards = '';

                // 1) SP-аркан: данные хранятся напрямую под ключом v
                const spData = ARCANA_DATA[v];
                if (spData) {
                    cards += buildArcanaCard(v, spData, h, 'СП', v);
                }

                // 2) EP-аркан: число v может быть ЭП-номером другого аркана
                const epSpId = EP_TO_SP[v];
                if (epSpId && epSpId !== v) {
                    const epData = ARCANA_DATA[epSpId];
                    if (epData) {
                        cards += buildArcanaCard(epSpId, epData, h, 'ЭП', v);
                    }
                }

                if (!cards) {
                    // Нет данных — показать заглушку
                    const name = ARCANA_NAMES[v] || `Аркан #${v}`;
                    cards = `<div style="padding:8px;font-size:.85rem;color:var(--txt2)"><span class="sr-num">${v}.</span> <span class="sr-name">${name}</span><div class="sr-desc" style="margin-top:4px">Описание пока не добавлено</div></div>`;
                }

                arcRes.innerHTML = cards;
                arcRes.classList.add('visible');
            };

            // Глобальная функция для вызова из onclick в подсказках
            window.performArcSearchById = function(id) {
                performArcSearch(id);
            };

            arcInput.addEventListener('input', () => performArcSearch());
            arcHouse.addEventListener('change', () => performArcSearch());
        }

        try { setupSearch(); } catch(e) { console.error('Search init error:', e); }

        // Parsers
        function parseBirthDate(input) {
            const m = input.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (!m) return null;
            const day = parseInt(m[1]), month = parseInt(m[2]), year = parseInt(m[3]);
            if (day < 1 || day > 31 || month < 1 || month > 12) return null;
            return { day: parseInt(day.toString()[0]), datePart: digitSum(day) + digitSum(month), extraPart: digitSum(year) };
        }

        function parseDateTime(input) {
            const m = input.trim().match(/^(\d{1,2})\.(\d{1,2})\s+(\d{1,2}):(\d{2})$/);
            if (!m) return null;
            const day = parseInt(m[1]), month = parseInt(m[2]), hour = parseInt(m[3]), min = parseInt(m[4]);
            if (day < 1 || day > 31 || month < 1 || month > 12 || hour > 23 || min > 59) return null;
            return { day: parseInt(day.toString()[0]), datePart: digitSum(day) + digitSum(month), extraPart: digitSum(hour) + digitSum(min) };
        }

        // Calculator: Date
        function calculateDate() {
            const errEl = document.getElementById('error-date');
            const resCard = document.getElementById('results-date');
            const resList = document.getElementById('results-list-date');
            errEl.classList.remove('visible'); resCard.classList.remove('visible');
            const parsed = parseBirthDate(document.getElementById('date-input').value);
            if (!parsed) { errEl.textContent = 'Формат: ДД.ММ.ГГГГ'; errEl.classList.add('visible'); return; }
            renderResults(compute12(parsed.day, parsed.datePart, parsed.extraPart), resList, resCard);
        }

        // Calculator: DateTime
        function calculateDateTime() {
            const errEl = document.getElementById('error-datetime');
            const resCard = document.getElementById('results-datetime');
            const resList = document.getElementById('results-list-datetime');
            errEl.classList.remove('visible'); resCard.classList.remove('visible');
            const parsed = parseDateTime(document.getElementById('datetime-input').value);
            if (!parsed) { errEl.textContent = 'Формат: ДД.ММ ЧЧ:ММ'; errEl.classList.add('visible'); return; }
            renderResults(compute12(parsed.day, parsed.datePart, parsed.extraPart), resList, resCard);
        }

        // Constructor
        let entryId = 0;

        function setupInputMask(input, type) {
            if (input.getAttribute('inputmode') === 'text') {
                input.setAttribute('inputmode', 'numeric');
            }
            input.addEventListener('input', function(e) {
                if (e.inputType && e.inputType.startsWith('deleteContent')) return;
                let v = this.value.replace(/[^\d]/g, '');
                if (type === 'birth') {
                    if (v.length > 8) v = v.slice(0, 8);
                    if (v.length >= 5) this.value = v.slice(0,2) + '.' + v.slice(2,4) + '.' + v.slice(4);
                    else if (v.length >= 3) this.value = v.slice(0,2) + '.' + v.slice(2);
                    else this.value = v;
                } else {
                    if (v.length > 8) v = v.slice(0, 8);
                    if (v.length >= 7) this.value = v.slice(0,2) + '.' + v.slice(2,4) + ' ' + v.slice(4,6) + ':' + v.slice(6);
                    else if (v.length >= 5) this.value = v.slice(0,2) + '.' + v.slice(2,4) + ' ' + v.slice(4);
                    else if (v.length >= 3) this.value = v.slice(0,2) + '.' + v.slice(2);
                    else this.value = v;
                }
            });
        }

        function addEntry(type) {
            entryId++;
            const container = document.getElementById('constructor-entries');
            const div = document.createElement('div');
            div.className = 'constructor-entry';
            div.id = `entry-${entryId}`;
            const isBirth = type === 'birth';
            div.innerHTML = `
                <span class="entry-type-badge ${isBirth ? 'type-birth' : 'type-question'}">${isBirth ? 'ДР' : 'ВВ'}</span>
                <input type="text" class="input-field" data-type="${type}" placeholder="${isBirth ? '07.05.1984' : '06.05 12:44'}" inputmode="numeric" autocomplete="off">
                <button class="btn-remove" onclick="removeEntry('entry-${entryId}')">×</button>`;
            const inputField = div.querySelector('.input-field');
            inputField.addEventListener('keydown', e => { if (e.key === 'Enter') calculateConstructor(); });
            setupInputMask(inputField, type);
            container.appendChild(div);
        }

        function removeEntry(id) {
            const el = document.getElementById(id);
            if (el) { el.style.animation = 'fadeIn .2s ease reverse'; setTimeout(() => el.remove(), 180); }
        }

        function calculateConstructor() {
            const errEl = document.getElementById('error-constructor');
            const resCard = document.getElementById('results-constructor');
            const resList = document.getElementById('results-list-constructor');
            errEl.classList.remove('visible'); resCard.classList.remove('visible');

            const entries = document.querySelectorAll('#constructor-entries .constructor-entry');
            if (entries.length < 2) { errEl.textContent = 'Добавьте минимум 2 записи'; errEl.classList.add('visible'); return; }

            const allNums = [];
            for (const entry of entries) {
                const input = entry.querySelector('.input-field');
                const type = input.dataset.type;
                const parsed = type === 'birth' ? parseBirthDate(input.value) : parseDateTime(input.value);
                if (!parsed) {
                    errEl.textContent = `Ошибка: проверьте формат (${type === 'birth' ? 'ДД.ММ.ГГГГ' : 'ДД.ММ ЧЧ:ММ'})`;
                    errEl.classList.add('visible'); input.focus(); return;
                }
                allNums.push(compute12(parsed.day, parsed.datePart, parsed.extraPart));
            }

            // Combine: sum reduced values position-by-position
            const C = new Array(13);
            for (let i = 1; i <= 12; i++) {
                let sum = 0;
                for (const nums of allNums) sum += val(nums[i]);
                C[i] = reduce88(sum);
            }

            renderResults(C, resList, resCard, allNums);
        }

        // Enter and Mask handlers
        try {
            const dtInput = document.getElementById('datetime-input');
            const dInput = document.getElementById('date-input');
            dtInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') calculateDateTime(); });
            dInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') calculateDate(); });
            setupInputMask(dtInput, 'question');
            setupInputMask(dInput, 'birth');
        } catch(e) { console.error('Handlers error:', e); }

        // Default 2 birth dates
        try {
            addEntry('birth');
            addEntry('birth');
        } catch(e) { console.error('Init error:', e); }
    </script>
