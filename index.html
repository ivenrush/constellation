<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Созвездий</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0e1a;--bg-card:rgba(15,20,40,0.85);--bg-input:rgba(20,28,58,0.9);--a1:#6c5ce7;--a2:#a29bfe;--a3:#00cec9;--a4:#fd79a8;--txt:#e8e8f0;--txt2:#8b8ba8;--brd:rgba(108,92,231,0.3);--glow:rgba(108,92,231,0.4)}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative;-webkit-tap-highlight-color:transparent}
        button,input{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 30% 65%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 50% 10%,rgba(162,155,254,.9),transparent),radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 85% 75%,rgba(0,206,201,.7),transparent),radial-gradient(1px 1px at 15% 85%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 92% 15%,rgba(253,121,168,.6),transparent),radial-gradient(1px 1px at 45% 50%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 60% 90%,rgba(162,155,254,.5),transparent),radial-gradient(1px 1px at 5% 55%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 78% 58%,rgba(255,255,255,.4),transparent),radial-gradient(1.2px 1.2px at 22% 42%,rgba(0,206,201,.5),transparent);pointer-events:none;z-index:0}
        .container{position:relative;z-index:1;width:100%;max-width:420px;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
        .header{text-align:center;padding:8px 0}
        .header h1{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--a2),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;text-transform:uppercase}
        .header p{font-size:.75rem;color:var(--txt2);margin-top:4px;letter-spacing:1px}
        /* Toggle 6/12 */
        .toggle-row{display:flex;justify-content:center;gap:0}
        .toggle-btn{padding:8px 14px;font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;border:1px solid var(--brd);background:transparent;color:var(--txt2);cursor:pointer;transition:all .2s;letter-spacing:1px;touch-action:manipulation}
        .toggle-btn:first-child{border-radius:8px 0 0 8px}
        .toggle-btn:last-child{border-radius:0 8px 8px 0}
        .toggle-btn.active{background:linear-gradient(135deg,var(--a1),#8b5cf6);color:#fff;border-color:var(--a1)}
        /* Cards */
        .card{background:var(--bg-card);border:1px solid var(--brd);border-radius:16px;padding:20px;box-shadow:0 4px 30px rgba(0,0,0,.3)}
        .card-title{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--a3);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;text-align:center}
        .input-label{display:block;font-size:.8rem;color:var(--txt2);margin-bottom:10px;letter-spacing:.5px}
        .input-row{display:flex;gap:10px}
        .input-field{flex:1;background:var(--bg-input);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;color:var(--txt);font-family:'Orbitron',sans-serif;font-size:1.1rem;text-align:center;letter-spacing:3px;outline:none;transition:border-color .3s,box-shadow .3s}
        .input-field::placeholder{color:rgba(139,139,168,.5);font-size:.85rem;letter-spacing:1px}
        .input-field:focus{border-color:var(--a1);box-shadow:0 0 20px var(--glow)}
        .btn-calc{background:linear-gradient(135deg,var(--a1),#8b5cf6);border:none;border-radius:12px;padding:14px 24px;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap}
        .btn-calc:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--glow)}
        .btn-calc:active{transform:scale(.97)}
        /* Results */
        .results-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:16px;padding:16px;box-shadow:0 4px 30px rgba(0,0,0,.3);display:none}
        .results-card.visible{display:block;animation:fadeIn .4s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .results-title{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--a3);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;text-align:center}
        .results-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
        .result-row{display:flex;align-items:center;padding:8px 10px;border-radius:10px;transition:background .2s;animation:slideIn .3s ease backwards;flex-wrap:wrap;position:relative}
        .result-row:nth-child(even){background:rgba(108,92,231,.06)}
        .result-row:hover{background:rgba(108,92,231,.12)}
        .result-row.hidden-row{display:none}
        @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
        .result-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;margin-right:8px;flex-shrink:0;color:#fff}
        .badge-1{background:linear-gradient(135deg,#6c5ce7,#8b5cf6)}.badge-2{background:linear-gradient(135deg,#4c6ef5,#5c7cfa)}.badge-3{background:linear-gradient(135deg,#0ca678,#20c997)}.badge-4{background:linear-gradient(135deg,#0891b2,#22d3ee)}.badge-5{background:linear-gradient(135deg,#e67700,#fab005)}.badge-6{background:linear-gradient(135deg,#d63939,#ff6b6b)}.badge-7{background:linear-gradient(135deg,#ae3ec9,#cc5de8)}.badge-8{background:linear-gradient(135deg,#2b8a3e,#51cf66)}.badge-9{background:linear-gradient(135deg,#e8590c,#ff922b)}.badge-10{background:linear-gradient(135deg,#d6336c,#f06595)}.badge-11{background:linear-gradient(135deg,#1971c2,#4dabf7)}.badge-12{background:linear-gradient(135deg,#5f3dc4,#9775fa)}
        /* Individual columns in constructor */
        .col-individual{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:400;color:rgba(139,139,168,.45);min-width:32px;text-align:center;flex-shrink:0}
        .col-sep{color:rgba(139,139,168,.25);font-size:.7rem;margin:0 2px;flex-shrink:0}
        .result-value{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:var(--txt);flex:1;text-align:right;cursor:pointer;transition:color .2s}
        .result-value:hover{color:var(--a3)}
        .result-original{font-family:'Inter',sans-serif;font-size:.65rem;font-weight:400;color:var(--txt2);margin-left:5px;opacity:.7;flex-shrink:0}
        .orig-individual{font-size:.55rem;color:rgba(139,139,168,.35)}
        /* Constellation tooltip */
        .constellation-tip{width:100%;padding:6px 0 4px 34px;font-family:'Inter',sans-serif;font-size:.75rem;color:var(--txt);line-height:1.4;display:none;animation:fadeIn .25s ease;order:10}
        .constellation-tip.open{display:block}
        .constellation-tip .cname{font-weight:600;color:var(--a2)}
        .constellation-tip .cdesc{color:var(--txt2);margin-left:4px}
        /* Search */
        .search-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:16px;padding:16px;backdrop-filter:blur(12px);box-shadow:0 4px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
        .search-input{width:100%;background:var(--bg-input);border:1px solid var(--brd);border-radius:12px;padding:12px 16px;color:var(--txt);font-family:'Orbitron',sans-serif;font-size:1rem;text-align:center;letter-spacing:3px;outline:none;transition:border-color .3s,box-shadow .3s}
        .search-input:focus{border-color:var(--a1);box-shadow:0 0 20px var(--glow)}
        .search-input::placeholder{color:rgba(139,139,168,.5);font-size:.8rem;letter-spacing:1px;font-family:'Inter',sans-serif}
        .search-result{margin-top:12px;padding:12px;border-radius:10px;background:rgba(108,92,231,.08);display:none;animation:fadeIn .3s ease}
        .search-result.visible{display:block}
        .search-result .sr-num{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--a2)}
        .search-result .sr-name{font-family:'Inter',sans-serif;font-size:1rem;font-weight:600;color:var(--a3);margin-left:8px}
        .search-result .sr-desc{font-family:'Inter',sans-serif;font-size:.85rem;color:var(--txt2);margin-top:6px;line-height:1.5}
        .search-result .sr-empty{font-family:'Inter',sans-serif;font-size:.85rem;color:rgba(139,139,168,.5);font-style:italic}
        /* Copy button */
        .btn-copy{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 16px;border-radius:8px;border:1px solid var(--brd);background:transparent;color:var(--txt2);font-family:'Inter',sans-serif;font-size:.7rem;cursor:pointer;transition:all .25s}

        .btn-copy:hover{border-color:var(--a3);color:var(--a3);background:rgba(0,206,201,.08)}
        .btn-copy.copied{border-color:var(--a3);color:var(--a3);background:rgba(0,206,201,.15)}
        /* Planet styles */
        .planet-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
        .planet-row .input-field{flex:none;width:130px;font-size:.85rem;padding:10px 8px;letter-spacing:1px}
        .btn-planet{padding:8px 14px;border-radius:8px;border:1px solid rgba(253,121,168,.3);background:rgba(253,121,168,.1);color:var(--a4);font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px;white-space:nowrap}
        .btn-planet:hover{background:rgba(253,121,168,.25)}
        .btn-planet.active{background:linear-gradient(135deg,#e84393,#fd79a8);color:#fff;border-color:#e84393}
        .planet-tag{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;color:#ff4757;background:rgba(255,71,87,.05);border:1px solid #ff4757;border-radius:5px;padding:2px 6px;margin-left:5px;flex-shrink:0;white-space:nowrap}
        .planet-tag.internal{color:#2ed573;background:rgba(46,213,115,.05);border-color:#2ed573}
        .planet-sums-container{display:flex;gap:8px;margin-left:12px;align-items:center}
        .planet-sum{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;flex-shrink:0;white-space:nowrap}
        .planet-sum.main-sum{color:#ff4757}
        .planet-sum.internal-sum{color:#2ed573}
        .planet-info{width:100%;text-align:center;padding:4px 0;font-size:.6rem;color:var(--txt2);font-family:'Inter',sans-serif;opacity:.7}


        /* Error */
        .error-msg{color:var(--a4);font-size:.8rem;text-align:center;margin-top:8px;display:none}
        .error-msg.visible{display:block;animation:shake .4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        .divider{height:1px;background:linear-gradient(90deg,transparent,var(--brd),transparent);margin:4px 0}
        /* Constructor */
        .constructor-entry{display:flex;gap:8px;align-items:center;margin-bottom:10px;animation:fadeIn .3s ease}
        .constructor-entry .input-field{font-size:.95rem;padding:12px 10px;letter-spacing:2px}
        .entry-type-badge{font-family:'Orbitron',sans-serif;font-size:.55rem;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;letter-spacing:1px}
        .entry-type-badge.type-birth{background:rgba(0,206,201,.2);color:var(--a3);border:1px solid rgba(0,206,201,.3)}
        .entry-type-badge.type-question{background:rgba(253,121,168,.2);color:var(--a4);border:1px solid rgba(253,121,168,.3)}
        .btn-remove{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,100,100,.3);background:rgba(255,50,50,.1);color:#ff6b6b;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
        .btn-remove:hover{background:rgba(255,50,50,.25)}
        .add-buttons{display:flex;gap:8px;margin-top:4px;margin-bottom:12px}
        .btn-add{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:10px;border:1px dashed var(--brd);background:transparent;color:var(--txt2);font-family:'Inter',sans-serif;font-size:.75rem;cursor:pointer;transition:all .2s}
        .btn-add:hover{border-color:var(--a2);color:var(--a2);background:rgba(108,92,231,.08)}
        .btn-add .plus{font-size:1rem;font-weight:700;line-height:1}
        .footer{text-align:center;padding:12px;font-size:.65rem;color:rgba(139,139,168,.4);letter-spacing:1px}
        /* Arcana collapsible cards */
        .arcana-card{border:1px solid var(--brd);border-radius:10px;margin-bottom:8px;overflow:hidden;animation:fadeIn .3s ease}
        .arcana-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;transition:background .2s;user-select:none}
        .arcana-card-header:hover{background:rgba(108,92,231,.12)}
        .arcana-card-header .arc-arrow{font-size:.7rem;color:var(--a2);transition:transform .2s;flex-shrink:0}
        .arcana-card-header.open .arc-arrow{transform:rotate(90deg)}
        .arcana-card-header .arc-num{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--a2);flex-shrink:0}
        .arcana-card-header .arc-name{font-weight:600;color:var(--a3);font-size:.9rem}
        .arcana-card-header .arc-seq{font-size:.65rem;color:var(--txt2);margin-left:auto;flex-shrink:0}
        .arcana-card-header .arc-tag{font-family:'Orbitron',sans-serif;font-size:.5rem;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:1px;flex-shrink:0}
        .arc-tag.tag-sp{background:rgba(108,92,231,.2);color:var(--a2);border:1px solid rgba(108,92,231,.3)}
        .arc-tag.tag-ep{background:rgba(0,206,201,.2);color:var(--a3);border:1px solid rgba(0,206,201,.3)}
        .arcana-card-body{padding:0 12px 12px;font-size:.85rem;color:var(--txt2);line-height:1.5;display:none}
        .arcana-card-body.open{display:block;animation:fadeIn .25s ease}
        .arcana-card-house{font-size:.75rem;color:var(--txt2);opacity:.6;margin-left:auto}
        @media(max-width:380px){.container{padding:12px 10px}.input-field{font-size:.9rem!important;padding:10px 8px!important}.header h1{font-size:1.1rem}.entry-type-badge{font-size:.5rem;padding:3px 6px}.col-individual{font-size:.7rem;min-width:26px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✦ Созвездия ✦</h1>
            <p>Калькулятор созвездий</p>
            <div class="planet-row">
                <input type="text" id="planet-datetime" class="input-field" placeholder="сейчас" inputmode="text" autocomplete="off" title="ДД.ММ.ГГГГ ЧЧ:ММ или пусто=сейчас">
                <button class="btn-planet" id="btn-planets" onclick="togglePlanets()">♃ Планеты</button>
            </div>
        </div>

        <!-- Поиск созвездия -->
        <div class="search-card">
            <div class="card-title">🔭 Справочник созвездий</div>
            <input type="text" id="search-input" class="search-input" placeholder="Введите номер (1–88)" inputmode="numeric" autocomplete="off">
            <div class="search-result" id="search-result"></div>
        </div>

        <!-- Справочник Арканов -->
        <div class="search-card">
            <div class="card-title">◈ Справочник Арканов</div>
            <div style="display:flex;gap:8px;margin-bottom:10px">
                <input type="text" id="arcana-search-input" class="search-input" style="flex:1" placeholder="Номер или название аркана" autocomplete="off">
                <select id="arcana-house-select" class="input-field" style="flex:none;width:90px;font-size:.7rem;padding:0;letter-spacing:0">
                    <option value="0">Общее</option>
                    <option value="1">1 дом</option>
                    <option value="2">2 дом</option>
                    <option value="3">3 дом</option>
                    <option value="4">4 дом</option>
                    <option value="5">5 дом</option>
                    <option value="6">6 дом</option>
                    <option value="7">7 дом</option>
                    <option value="8">8 дом</option>
                    <option value="9">9 дом</option>
                    <option value="10">10 дом</option>
                    <option value="11">11 дом</option>
                    <option value="12">12 дом</option>
                </select>
            </div>
            <div id="arcana-name-suggestions" style="display:none;max-height:180px;overflow-y:auto;margin-bottom:8px;border-radius:10px;background:rgba(108,92,231,.08)"></div>
            <div class="search-result" id="arcana-search-result"></div>
        </div>

        <div class="divider"></div>

        <!-- Конструктор -->
        <div class="card">
            <div class="card-title">Конструктор</div>
            <div id="constructor-entries"></div>
            <div class="add-buttons">
                <button class="btn-add" onclick="addEntry('birth')"><span class="plus">+</span> Дата рождения</button>
                <button class="btn-add" onclick="addEntry('question')"><span class="plus">+</span> Время вопроса</button>
            </div>
            <button class="btn-calc" style="width:100%" onclick="calculateConstructor()">✦ Рассчитать</button>
            <div class="error-msg" id="error-constructor"></div>
        </div>
        <div class="results-card" id="results-constructor">
            <div class="results-title">Конструктор</div>
            <div id="results-list-constructor"></div>
            <div class="results-controls">
                <div class="toggle-row">
                    <button class="toggle-btn active" onclick="setHouses(6)">6 домов</button>
                    <button class="toggle-btn" onclick="setHouses(12)">12 домов</button>
                </div>
                <button class="btn-copy" onclick="copyResults('results-list-constructor')">📋 Копировать</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Дата рождения -->
        <div class="card">
            <div class="card-title">Дата рождения</div>
            <label class="input-label" for="date-input">Формат: ДД.ММ.ГГГГ</label>
            <div class="input-row">
                <input type="text" id="date-input" class="input-field" placeholder="07.05.1984" inputmode="text" autocomplete="off">
                <button class="btn-calc" onclick="calculateDate()">✦</button>
            </div>
            <div class="error-msg" id="error-date"></div>
        </div>
        <div class="results-card" id="results-date">
            <div class="results-title">Дата рождения</div>
            <div id="results-list-date"></div>
            <div class="results-controls">
                <div class="toggle-row">
                    <button class="toggle-btn active" onclick="setHouses(6)">6 домов</button>
                    <button class="toggle-btn" onclick="setHouses(12)">12 домов</button>
                </div>
                <button class="btn-copy" onclick="copyResults('results-list-date')">📋 Копировать</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Время вопроса -->
        <div class="card">
            <div class="card-title">Дата и время вопроса</div>
            <label class="input-label" for="datetime-input">Формат: ДД.ММ ЧЧ:ММ</label>
            <div class="input-row">
                <input type="text" id="datetime-input" class="input-field" placeholder="06.05 12:44" inputmode="text" autocomplete="off">
                <button class="btn-calc" onclick="calculateDateTime()">✦</button>
            </div>
            <div class="error-msg" id="error-datetime"></div>
        </div>
        <div class="results-card" id="results-datetime">
            <div class="results-title">Время вопроса</div>
            <div id="results-list-datetime"></div>
            <div class="results-controls">
                <div class="toggle-row">
                    <button class="toggle-btn active" onclick="setHouses(6)">6 домов</button>
                    <button class="toggle-btn" onclick="setHouses(12)">12 домов</button>
                </div>
                <button class="btn-copy" onclick="copyResults('results-list-datetime')">📋 Копировать</button>
            </div>
        </div>

        <div class="footer">CONSTELLATION CALCULATOR v1.0</div>
    </div>

    <script>
        "use strict";

        // ═══ Планеты ═══
        var PLANET_MAP = {
            1: { name: 'Солнце', symbol: '☉', main: 8, internal: null },
            2: { name: 'Луна', symbol: '☽', main: 7, internal: null },
            3: { name: 'Марс', symbol: '♂', main: 1, internal: 14 },
            4: { name: 'Меркурий', symbol: '☿', main: 5, internal: 9 },
            5: { name: 'Юпитер', symbol: '♃', main: 15, internal: 19 },
            6: { name: 'Венера', symbol: '♀', main: 3, internal: 11 },
            7: { name: 'Сатурн', symbol: '♄', main: 16, internal: 18 },
            8: { name: 'Уран', symbol: '♅', main: 17, internal: 16 },
            9: { name: 'Нептун', symbol: '♆', main: 20, internal: 15 },
            10: { name: 'Плутон', symbol: '♇', main: 13, internal: 2 }
        };
        var ZODIAC_NAMES = ['','Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'];
        // Mapping: astronomy-engine body names → our planet numbers
        var ASTRO_BODIES = [
            ['Sun',1],['Moon',2],['Mars',3],['Mercury',4],['Jupiter',5],
            ['Venus',6],['Saturn',7],['Uranus',8],['Neptune',9],['Pluto',10]
        ];
        var planetData = null; // {1:[planets], 2:[planets], ...}
        var transitRanges = {}; // pNum: {start: Date, end: Date}
        var planetsOn = false;

        function findSignChange(bodyName, startDate, direction) {
            const date = new Date(startDate);
            let lon = getLon(bodyName, date);
            let sign = Math.floor(lon / 30);
            
            // Tiered step and iteration strategy for different speeds
            let stepDays = 1, iterations = 300;
            if (bodyName === 'Moon') { 
                stepDays = 0.05; iterations = 100; // ~5 days total
            } else if (['Sun','Mercury','Venus','Mars'].includes(bodyName)) { 
                stepDays = 0.5; iterations = 200; // ~100 days total
            } else if (['Jupiter', 'Saturn'].includes(bodyName)) { 
                stepDays = 15; iterations = 300; // ~12 years total
            } else { 
                // Uranus, Neptune, Pluto
                stepDays = 60; iterations = 400; // ~65 years total
            }
            
            let current = new Date(date);
            for (let i = 0; i < iterations; i++) {
                current.setTime(current.getTime() + direction * stepDays * 24 * 60 * 60 * 1000);
                let newLon = getLon(bodyName, current);
                let newSign = Math.floor(newLon / 30);
                if (newSign !== sign) {
                    // Binary search to find precise moment
                    let t1 = new Date(current.getTime() - direction * stepDays * 24 * 60 * 60 * 1000);
                    let t2 = new Date(current);
                    for (let j = 0; j < 8; j++) {
                        let mid = new Date((t1.getTime() + t2.getTime()) / 2);
                        if (Math.floor(getLon(bodyName, mid) / 30) === sign) t1 = mid; else t2 = mid;
                    }
                    return direction > 0 ? t2 : t1;
                }
            }
            return null;
        }

        function getLon(bodyName, date) {
            try {
                var ecl = Astronomy.EclipticGeoMoon ? 
                    (bodyName === 'Moon' ? Astronomy.EclipticGeoMoon(date) : Astronomy.Ecliptic(Astronomy.GeoVector(bodyName, date, true))) :
                    Astronomy.Ecliptic(Astronomy.GeoVector(bodyName, date, true));
                return ecl.elon !== undefined ? ecl.elon : ecl.lon;
            } catch(e) { return 0; }
        }

        function formatDateRange(pNum, start, end) {
            if (!start || !end) return '';
            
            // Offset to Moscow (UTC+3)
            const msc = (d) => {
                const nd = new Date(d.getTime() + (3 * 60 * 60 * 1000) + d.getTimezoneOffset() * 60000);
                return nd;
            };
            
            const s = msc(start), e = msc(end);
            const pad = (n) => n.toString().padStart(2, '0');
            
            // Slow planets: Jupiter (5), Saturn (7), Uranus (8), Neptune (9), Pluto (10)
            const slow = [5, 7, 8, 9, 10].includes(pNum);
            
            if (slow) {
                const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
                return ` (${months[s.getMonth()]} ${s.getFullYear()} — ${months[e.getMonth()]} ${e.getFullYear()})`;
            } else {
                return ` (${pad(s.getDate())}.${pad(s.getMonth()+1)} — ${pad(e.getDate())}.${pad(e.getMonth()+1)}.${e.getFullYear()})`;
            }
        }

        function calcPlanets(dateObj) {
            if (typeof Astronomy === 'undefined') { alert('Библиотека астрономии не загружена. Нужен интернет.'); return null; }
            var result = {};
            transitRanges = {};
            for (var h = 1; h <= 12; h++) result[h] = [];
            for (var i = 0; i < ASTRO_BODIES.length; i++) {
                var bodyName = ASTRO_BODIES[i][0];
                var pNum = ASTRO_BODIES[i][1];
                try {
                    let lon = getLon(bodyName, dateObj);
                    var sign = Math.floor(lon / 30) + 1;
                    if (sign > 12) sign = 12; if (sign < 1) sign = 1;
                    result[sign].push(pNum);
                    
                    // Calculate range
                    transitRanges[pNum] = {
                        start: findSignChange(bodyName, dateObj, -1),
                        end: findSignChange(bodyName, dateObj, 1)
                    };
                } catch(e) { console.error('Planet calc error:', bodyName, e); }
            }
            return result;
        }

        function parsePlanetDate() {
            var inp = document.getElementById('planet-datetime').value.trim();
            if (!inp) return new Date();
            // Format: DD.MM.YYYY HH:MM or DD.MM.YYYY
            var m = inp.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/);
            if (!m) return null;
            var d = parseInt(m[1]), mo = parseInt(m[2]), y = parseInt(m[3]);
            var h = m[4] ? parseInt(m[4]) : 12, mi = m[5] ? parseInt(m[5]) : 0;
            return new Date(y, mo - 1, d, h, mi);
        }

        function togglePlanets() {
            var btn = document.getElementById('btn-planets');
            if (planetsOn) {
                planetsOn = false; planetData = null;
                btn.classList.remove('active');
                document.querySelectorAll('.planet-tag').forEach(function(e){e.remove();});
                document.querySelectorAll('.planet-sum').forEach(function(e){e.remove();});
                document.querySelectorAll('.planet-info').forEach(function(e){e.remove();});
                return;
            }
            var dt = parsePlanetDate();
            if (!dt) { alert('Формат: ДД.ММ.ГГГГ ЧЧ:ММ или оставьте пустым'); return; }
            planetData = calcPlanets(dt);
            if (!planetData) return;
            planetsOn = true;
            btn.classList.add('active');
            applyPlanetsToAll();
        }

        function applyPlanetsToAll() {
            if (!planetData) return;
            document.querySelectorAll('.planet-tag').forEach(function(e){e.remove();});
            document.querySelectorAll('.planet-sum').forEach(function(e){e.remove();});
            document.querySelectorAll('.planet-info').forEach(function(e){e.remove();});
            document.querySelectorAll('.result-row').forEach(function(row) {
                var idx = parseInt(row.dataset.idx);
                var planets = planetData[idx];
                if (planets && planets.length > 0) {
                    var valEl = row.querySelector('.result-value');
                    var sumsContainer = row.querySelector('.planet-sums-container');
                    var mainVal = parseInt(valEl.textContent) || 0;
                    var mainSum = mainVal;
                    var internalSum = mainVal;
                    
                    // Render in reverse to maintain order when using insertAfter
                    for (var i = planets.length - 1; i >= 0; i--) {
                        var pNum = planets[i];
                        var pInfo = PLANET_MAP[pNum];
                        
                        mainSum += pInfo.main;
                        if (pInfo.internal !== null) {
                            internalSum += pInfo.internal;
                            // Internal tags are hidden from display as requested, but added to sum
                        }
                        
                        var tag = document.createElement('span');
                        tag.className = 'planet-tag';
                        tag.textContent = pInfo.main;
                        
                        const range = transitRanges[pNum];
                        const rangeStr = formatDateRange(pNum, range.start, range.end);
                        tag.title = pInfo.name + ' (' + pInfo.symbol + ') в ' + ZODIAC_NAMES[idx] + rangeStr;
                        
                        valEl.insertAdjacentElement('afterend', tag);
                    }
                    
                    // Append sums to container
                    if (sumsContainer) {
                        var isumEl = document.createElement('span');
                        isumEl.className = 'planet-sum internal-sum';
                        isumEl.textContent = internalSum;
                        sumsContainer.appendChild(isumEl);

                        var msumEl = document.createElement('span');
                        msumEl.className = 'planet-sum main-sum';
                        msumEl.textContent = mainSum;
                        sumsContainer.appendChild(msumEl);
                    }
                }
            });
            // Add info line in each visible results card
            var dt = parsePlanetDate();
            var dtStr = dt ? dt.toLocaleString('ru-RU') : 'сейчас';
            document.querySelectorAll('.results-card.visible').forEach(function(card) {
                if (!card.querySelector('.planet-info')) {
                    var info = document.createElement('div');
                    info.className = 'planet-info';
                    info.textContent = '♃ Планеты на: ' + dtStr;
                    card.querySelector('.results-title').insertAdjacentElement('afterend', info);
                }
            });
        }

            24: {
                name: "2 Жезлов",
                general: `В системе астрологического Таро Юрия Хана числовые карты-двойки относятся к зоне формирования материальных потребностей и форм (второй дом, знак Тельца) и управляются планетой Венера. Младший аркан 2 жезлов описывает огненную сторону этого процесса — энергетическое ожидание, выбор направления и первичную демонстрацию своего потенциала без прямого агрессивного действия.<br><br><b>1. Активное ожидание и выбор («быть или не быть»):</b> Это состояние готовности к действию, нахождение «на низком старте», когда изначальная огненная идея удерживается до полной готовности. Человек не бросается вперед вслепую; он крепко держится за свою позицию (опирается на жезл) и делает осознанный выбор направления, абстрактно оценивая перспективы через «глобус».<br><b>2. Безопасная и откровенная демонстрация своей природы:</b> В состоянии абсолютной безопасности человек способен демонстрировать окружающим все нюансы своей (в том числе женской/сексуальной) натуры, не боясь быть отвергнутым. Он не суетится, а просто предлагает себя, призывая партнера или мир отреагировать на этот венерианский импульс (женщина в расслабленной позе по Манаре).<br><b>3. Блокировка желаний и удержание в напряжении (в негативе):</b> В ущемленном состоянии (перевернутая карта) возникает парализующий страх или банальная нехватка физических сил организма для старта. Столкнувшись с комплексами или чужим давлением, человек запрещает себе желать того, что ему объективно необходимо. В отношениях личность лишается права на самостоятельный выбор и вынуждена просто «быть в тонусе», ожидая, когда ее позовут, чтобы исполнить нужную функцию.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание</b><br>Сфера базовой животной инициативы. Для Венеры это самое слабое положение — второе изгнание. Естественный спонтанный старт парализуется. Вместо того чтобы действовать напролом, человек начинает колебаться и оценивать, морально ли он готов к последствиям. Спровоцировав партнера откровенной демонстрацией, он пугается ответной реакции и может дать задний ход, так как не способен выдержать ту энергию, которую сам пассивно возбудил.`,
                    2: `<b>2 дом (Телец) — Первая обитель</b><br>Здесь базовая прошивка находится в своей идеальной, родной среде, гармонично формируя физические потребности. Человек абсолютно естественно чувствует свои желания и транслирует привлекательность, держа мир под контролем. Он притягивает блага одним своим присутствием, не совершая агрессивных марсианских действий. В негативе он теряет связь со своими истинными потребностями, обесценивает себя или страдает от физического истощения.`,
                    3: `<b>3 дом (Близнецы)</b><br>Запрет на инициативу. В сфере повседневного общения и контактов на человека накладывается ограничение на собственный выбор. Его огненный импульс заморожен: он не смеет сделать самостоятельный «шаг за порог». Поведение сводится к тому, чтобы быть в тонусе и готовности услужить, ожидая, когда партнер или внешняя среда позовут его для выполнения конкретной коммуникативной функции.`,
                    4: `<b>4 дом (Рак)</b><br>Напряженная домашняя алертность. В зоне семьи и базовой безопасности человек не вмешивается в дела близких с активной гиперопекой. Вместо этого он концентрирует энергию и безопасно присутствует рядом, не отрывая взгляда от своего «жезла». Он находится в состоянии алертности: пока его не позовут (например, ребенок), он не вторгается в чужое пространство, но в нужный момент моментально приходит на помощь.`,
                    5: `<b>5 дом (Лев)</b><br>Сдерживание любовного порыва. В сфере влюбленности, игры и творчества спонтанный эгоистичный импульс ставится на паузу. Человек демонстрирует миру свою привлекательность, но останавливается перед выбором «быть или не быть» роману. Он аккумулирует внутренний огонь, не бросаясь в страсть агрессивно, а пассивно провоцируя объект любви сделать первый шаг навстречу.`,
                    6: `<b>6 дом (Дева) — Падение</b><br>Сфера рутины, служения, здоровья и методичного труда, где Венера падает. Природная созерцательность и абстрактная демонстрация энергии полностью ломаются о суровые требования конкретной реальности. В работе или быту невозможно просто красиво разлечься или философски смотреть вдаль. Условия вынуждают человека отказаться от пассивного ожидания и адаптировать свою уникальную энергию под мелкие, скучные нужды социума, что дается ему с колоссальным трудом.`,
                    7: `<b>7 дом (Весы) — Вторая обитель</b><br>Сфера социального партнерства и договоров, где Венера находится во второй обители. В парных отношениях человек использует свою энергию не для развития общей линии, а как удерживающий фактор. В конфликтах он может уперто настаивать на своем: «мне нужно именно это и ничего другого». Одновременно он может применять свою безопасность и привлекательность как инструмент сглаживания углов, предлагая себя партнеру в качестве извинения для сохранения связи.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание</b><br>Сфера кризиса, экстрима и глубоких трансформаций. Венера и двойки здесь в изгнании. Сталкиваясь с необходимостью кардинально меняться в отношениях, человек категорически сопротивляется. Вместо экстремальной трансформации он пытается удержать старую форму: «принимай меня таким, какой я есть». Он замирает в ожидании или продолжает пассивно демонстрировать себя, повторяя одни и те же старые трюки и отказываясь от анализа причин кризиса.`,
                    9: `<b>9 дом (Стрелец)</b><br>Фиксация мировоззренческого выбора. Сталкиваясь с идеологией, долгосрочным планированием или социальными авторитетами, человек твердо упирается в одну-единственную идею (жезл). Он жестко концентрирует свою огненную энергию на одной мысли и категорически отказывается рассматривать альтернативные варианты будущего, игнорируя мнения других.`,
                    10: `<b>10 дом (Козерог)</b><br>Пассивное ожидание статуса. В сфере карьеры и столкновения с объективной реальностью человек надеется на признание своего потенциала без изматывающей борьбы. Он открыто демонстрирует свою профессиональную готовность, накапливая энергию, и ждет, когда социум сам оценит его возможности и предложит повышение или статус. В негативе — физическая неготовность нести карьерный крест.`,
                    11: `<b>11 дом (Водолей)</b><br>Миролюбивое ожидание. В кругу единомышленников, неформальных связях или при возникновении внезапных форс-мажоров человек может не понимать, как правильно действовать, но подсознательно ищет примирения. Он находится в энергетическом тонусе, но использует этот потенциал не для бунта или разрыва шаблонов, а для того, чтобы сгладить конфликт и миролюбиво отреагировать на непредвиденные сложности.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация</b><br>Сфера скрытых итогов, кармы и тайн. Венера здесь экзальтирует. Находясь в социальной изоляции или наедине со скрытыми последствиями прошлого, человек аккумулирует невероятный уровень алертности (напряжения). Внешне он может казаться абсолютно беззащитным и расслабленным, но внутренне он жестко держит руку на пульсе мира, готовый вспыхнуть и отреагировать в ту самую секунду, когда его призовут из этой изоляции.`
                }

            38: {
                name: "2 Кубков",
                general: `В системе астрологического Таро Юрия Хана числовые карты-двойки относятся ко второму дому гороскопа (знак Тельца) и управляются планетой Венера. Младший аркан <b>2 кубков (Двойка Воды)</b> описывает результат формирования этой потребности — водную, эмоциональную сторону поиска партнера, достижение симпатии и процесс слияния.<br><br>Если рассматривать 2 кубков как базовую, натальную прошивку личности (аналог Асцендента), необходимо синтезировать три ключевых проявления этого аркана, опираясь на классику Уэйта, психологизм Манары и практику раскладов:<br><br><b>1. Создание эгрегора пары и синергия (по Уэйту):</b> Это состояние, когда при столкновении с подходящим объектом возникает мощный позитивный выхлоп. Над парой изображен жезл Гермеса (кадуцей) — символ того, что при правильном взаимодействии вырабатывается больше энергии, чем было затрачено изначально. Человек умеет находить тех, с кем возникает взаимная подпитка и абсолютная симпатия.<br><b>2. Тотальное эмоциональное погружение (по Манаре):</b> На карте изображена женщина, находящаяся по пояс в воде, в которую она затащила мужчину (или он пытается ее спасти). Это одержимость своим эмоциональным состоянием. Человек с такой прошивкой не просто симпатизирует — он пытается затащить партнера в свою глубину, вынуждая его жить по правилу: «ты меня пойми, и ты меня почувствуй». Правильно найденный партнер сам «полезет в воду», чтобы спасти и слиться с обладателем аркана.<br><b>3. Истеричность, капризы и отторжение (в негативе/раскладах):</b> Если механизм сломан (перевернутая карта), человек сам провоцирует партнера, но как только тот отвечает взаимностью — дает задний ход и капризничает. В крайних проявлениях это подсознательный страх физического или эмоционального контакта, брезгливость (страх, что партнер будет «неприятно пахнуть» или окажется «невкусным»).<br><br><b>Общая трактовка натальной базы:</b> Человек с базовой прошивкой 2 кубков живет ради нахождения идеального эмоционального резонанса. В его психике слиты образы гармоничной пары, обменивающейся кубками под покровительством высших сил (Уэйт), и женщины, которая эмоционально тонет в своих чувствах, отчаянно нуждаясь в том, чтобы партнер разделил с ней эту глубину (Манара). Главная сила такого человека — феноменальный магнетизм и способность создавать союзы, где оба партнера исцеляют и энергетически питают друг друга. Главная уязвимость — риск впасть в эмоциональную зависимость, устроить истерику на пустом месте и утопить партнера в своих обидах, либо полностью заблокировать свою венерианскую природу из-за страха неидеального контакта.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание</b><br>Сфера агрессивной инициативы (Марс), где венерианская природа 2 кубков максимально неуместна (второе изгнание). Базовый импульс действовать подменяется пассивным ожиданием и эмоциональными фантазиями. Вместо того чтобы прямо заявить о своих желаниях, человек впадает в состояние слепого, неконтролируемого влечения. Он эмоционально «проваливается» в партнера еще до начала реальных действий. Оказавшись в ситуации, требующей лидерства, он ведет себя как утопающий (Манара), надеясь, что ситуация сама породит чудесную синергию (Уэйт). В итоге он теряет контроль над собой и своими поступками, попадая в полную зависимость от чужой реакции.`,
                    2: `<b>2 дом (Телец) — Первая обитель</b><br>Здесь энергетика карты находится в своей естественной, природной среде. Человек идеально чувствует, кто для него «съедобен» и подходящ. Он формирует свои потребности абсолютно адекватно и легко притягивает партнеров, готовых разделить с ним эмоциональный комфорт. Слияние (кадуцей Уэйта) происходит естественно. Партнер сам стремится погрузиться в его внутренний мир (вода Манары) и «спасти» его, предоставляя защиту и заботу. В негативном варианте — это капризный отказ от предложенной помощи, когда человек сам привлек внимание, но в последний момент испугался близости.`,
                    3: `<b>3 дом (Близнецы)</b><br>Естественная душевная коммуникация. В сфере повседневного общения и контактов человек ведет себя подчеркнуто мягко и обаятельно. Он выстраивает диалог так, чтобы собеседник почувствовал мгновенную симпатию (кубки Уэйта). Он интуитивно подстраивается под эмоциональный фон окружения (вода Манары), избегая резких слов, превращая даже случайное знакомство в приятный, хотя и ни к чему не обязывающий энергетический обмен.`,
                    4: `<b>4 дом (Рак)</b><br>Безопасное эмоциональное слияние. В семье и в стенах родного дома человек ищет абсолютную защиту от внешнего мира через слияние с близкими. Его дом — это тот самый безопасный водоем (Манара), где он может расслабиться, обнажить свои слабости и получить энергетическую подпитку от домочадцев (кадуцей Уэйта). Здесь симпатия и любовь являются базовым фундаментом для чувства безопасности.`,
                    5: `<b>5 дом (Лев)</b><br>Демонстративное любовное погружение. В сфере влюбленности, творчества и эгоизма потребность в слиянии выставляется напоказ. Человек играет в любовь, превращая свои эмоции в яркий спектакль. Он жаждет, чтобы объект его страсти полностью включился в игру, обменялся с ним кубками (Уэйт) и бросился спасать его из пучины театральных страстей (Манара), подтверждая тем самым свою абсолютную преданность.`,
                    6: `<b>6 дом (Дева) — Падение</b><br>Сфера рутины, служения, здоровья и трезвого расчета, где Венера (и двойки) падает. Катастрофа для романтики и глубоких погружений. Потребность человека в постоянной эмоциональной синергии (Уэйт) и страстном погружении в омут чувств (Манара) разбивается о суровые будни. Жизнь требует конкретных действий, мытья посуды и зарабатывания денег, а человек хочет лежать в водоеме своих эмоций и ждать «спасателя». Отношения разрушаются из-за неспособности интегрировать свою чувственность в повседневную, скучную реальность.`,
                    7: `<b>7 дом (Весы) — Вторая обитель</b><br>Сфера партнерства, где Венера находится во второй обители, требующей учитывать интересы другого. В отношениях человек использует свою эмпатию и эмоциональную глубину (Манара) как инструмент для сглаживания любых конфликтов. Столкнувшись со ссорой, он не идет на разрыв, а предлагает мир, нежность и симпатию (кубки Уэйта) в качестве извинения или компромисса. Он готов поступиться своей индивидуальностью ради того, чтобы сохранить эгрегор пары. В негативе — использование эмоционального шантажа или обвинение партнера в том, что «ты меня не чувствуешь», ради удержания контроля над союзом.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание</b><br>Зона глубоких кризисов и трансформаций, где Венера и двойки находятся в изгнании. Столкнувшись с необходимостью кардинально меняться в отношениях, человек сопротивляется. Вместо того чтобы пройти через трансформацию Скорпиона, он фиксируется на том, чем обладал изначально — на чувстве первичной симпатии. Он плачет о «разбитой любви» (перевернутые кубки) и пытается удержать старую форму отношений, затягивая партнера в болото своих переживаний (Манара) со словами: «Принимай меня таким, какой я есть». Он не способен извлечь пользу из кризиса, так как боится потерять свой эмоциональный комфорт.`,
                    9: `<b>9 дом (Стрелец)</b><br>Идеализация взаимного резонанса. Идеология и планы на будущее строятся вокруг поиска идеальной «второй половинки». Человек свято верит, что где-то существует партнер для совершенного слияния (Уэйт), с которым можно будет без оглядки утонуть в эмоциях (Манара). Эта вера в абсолютную гармонию может делать его слепым к реальным недостаткам людей, с которыми он планирует строить долгосрочное будущее.`,
                    10: `<b>10 дом (Козерог)</b><br>Поиск эмоциональной опоры. В сфере карьеры, амбиций и жестких социальных рамок человек чувствует себя неуютно, если там нет человеческого тепла. Он пытается выстроить с коллегами или начальством отношения, основанные на личной симпатии и эмпатии (Уэйт), часто путая профессиональные границы с личными. Столкнувшись с холодностью системы, он может чувствовать себя утопающим, которому никто не протягивает руку помощи (Манара).`,
                    11: `<b>11 дом (Водолей)</b><br>Дружеский эмоциональный симбиоз. В коллективе единомышленников и при столкновении с внезапными переменами человек выступает в роли миротворца. Он использует свой дар эмпатии (Манара), чтобы гасить коллективные конфликты и создавать атмосферу взаимного принятия (Уэйт). Свобода для него не означает одиночества; он ищет неформальные связи, где люди могут обмениваться энергией без жестких обязательств, оставаясь на одной эмоциональной волне.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация</b><br>Сфера подведения итогов, изоляции и кармы, где Венера достигает экзальтации. Высшая точка развития эмоционального слияния. Человек способен на абсолютную, телепатическую эмпатию. Попадая в ситуации кризиса или одиночества, он не ломается, а находит в себе колоссальный ресурс для того, чтобы раствориться в другом человеке или в мире, не теряя при этом своей сути. Здесь водная природа Манары достигает масштабов океана, а обмен кубками по Уэйту превращается в божественную, мистическую связь, стирающую любые границы между «я» и «ты».`
                }
            },
            31: {
                name: "9 Жезлов",
                general: "Дипломатичная инициатива, защита своих идей, проверка на устойчивость.",
                houses: {
                    1: `<b>1 дом (Овен) — Статус: Первая экстравертная обитель</b> Здесь Девятка жезлов проявляется как «дипломатичная инициатива». - <b>Суть:</b> Человек заявляет о себе, предварительно «прощупывая» почву. Он предупреждает мир о своих действиях, даже если это не требуется («Извините, я пройду»). - <b>Психология:</b> Сильная зависимость от внешнего авторитета и понятия «как правильно». Человек склонен придерживаться высоких моральных принципов, боясь нарушить негласные запреты. - <b>Негатив:</b> Уязвимость перед манипуляторами. Человек выходит в мир с нерешенной проблемой, надеясь, что кто-то «умный» (Гуру, секта) ее решит за него.`,
                    2: `<b>2 дом (Телец) — Статус: Первое экстравертное изгнание</b> Энергия жезлов (идей) сталкивается с материей Второго дома. - <b>Суть:</b> Потребности продиктованы желанием соответствовать высокому социальному статусу («казаться, а не быть»). - <b>Проявление:</b> Траты на «имидж» и рекламу себя. В Манаре — тестирование партнера на материальную надежность перед принятием решения о совместном будущем. Зацикленность на конкретной форме богатства или конкретных физических параметрах партнера. Человек держится за свой ресурс, боясь, что социум его отнимет.`,
                    3: `<b>3 дом (Близнецы) — Статус: Первое изгнание / Экстравертное падение</b> Конфликт между естественным поведением и социальными шаблонами. - <b>Суть:</b> Поведение становится «вычурным» и иносказательным. Вместо простого «да» или «нет» человек использует цитаты и сложные термины. Он не способен просто общаться, так как им руководит социальный страх или глубоко внедренная в подсознание идея (например, религиозная догма или комплекс). - <b>Позитив:</b> Умение защитить свою правильную мысль в окружении, которое с ней не согласно. - <b>Негатив:</b> «Идея фикс», которая искажает восприятие реальности и делает речь бескультурной или жаргонной.`,
                    4: `<b>4 дом (Рак) — Статус: Экзальтация</b> Точка высшего напряжения между домом (базой) и внешним миром. - <b>Суть:</b> Состояние «на чемоданах». Накопление сил в семье необходимо для «вылета из гнезда» в большой мир. - <b>Психология:</b> Проверка психики на устойчивость при выходе из зоны комфорта. Хорошие Девятки дают уверенность перед соблазнами внешнего мира. - <b>Негатив:</b> Психоз или депрессия из-за неспособности совместить домашние обязанности с социальными амбициями. - <b>Прямое положение:</b> Человек аккумулирует энергию в своей зоне комфорта не для того, чтобы там остаться, а ради великой цели — выхода в социум. Это состояние «присел на дорожку». Он готов оторваться от корней ради будущего. - <b>Перевернутое положение:</b> Искусственное перенапряжение в семье. Человек тащит социальные амбиции и «идеи фикс» в свой дом. Вместо того чтобы отдыхать, он накручивает себя и близких идеями о будущем, для которых у него пока нет ни базы, ни реальных сил`,
                    5: `<b>5 дом (Лев) — Статус: Первая обитель (родственная стихия Огня)</b> Здесь Девятка жезлов заменяет искренность «проповедью» своего пути. - <b>Суть:</b> Человек представляет свое творчество или чувства как некую «миссию». - <b>Проявление:</b> Желание быть признанным авторитетом в любви или хобби. В Манаре — пробуждение «ведьмовской» силы, когда женщина испытывает мужчину, чтобы понять, можно ли им управлять. В любви это проявляется как стремление подчинить партнера своей идеологии, заставить его фанатеть от себя. Радость приносят не естественные чувства, а осознание своей власти и того, что партнер играет по твоим правилам.`,
                    6: `<b>6 дом (Дева) — Статус: Вское изгнание / Экзальтация Прозерпины</b> - <b>Суть:</b> Анализ социальных ролей. Работа над собой не ради процесса, а ради статуса. - <b>Позитив:</b> Защита своих методов и идей перед «ученым советом» или коллегами. - <b>Негатив:</b> Готовность действовать по чужой указке, отсутствие самостоятельности. Человек ищет «готовые рецепты» у гадалок или авторитетов вместо того, чтобы думать самому. Человек делает выбор (как ему жить, как лечиться, как работать) не на основе собственного анализа, а по наущению извне.`,
                    7: `<b>7 дом (Весы) — Статус: Падение (по Хирону)</b> Конфликт между личной идеологией и необходимостью договора. - <b>Суть:</b> Попытка навязать партнеру свой «устав» вместо поиска компромисса. - <b>Проявление:</b> Сомнения в партнере: «А не козел ли он?». Отношения воспринимаются как «скользкие» и ненадежные. - <b>Манара:</b> Жесткое тестирование мужчины перед вступлением в брак или зачатием ребенка.`,
                    8: `<b>8 дом (Скорпион) — Статус: Вторая обитель</b> - <b>Суть:</b> «Оплодотворение» ситуации своей идеей. Экстремальная концентрация воли для получения результата. - <b>Проявление:</b> Умение «оседлать» кризис. В Манаре — сексуальная магия и управление энергией партнера в своих целях. - <b>В негативе.</b> Хватается за свой «жезл» (например, старые принципы или религию), боясь, что изменения его разрушат.`,
                    9: `<b>9 дом (Стрелец) — Статус: Первая интровертная обитель</b> Самое естественное положение для карты. - <b>Суть:</b> Формирование мировоззрения, высшее образование, заграница. - <b>Позитив:</b> Умение сохранять свое мнение, находясь в коллективе. Трезвый расчет вариантов будущего. - <b>Негатив:</b> Фанатизм, одержимость идеей, слепое следование за «пастухом».`,
                    10: `<b>10 дом (Козерог) — Статус: Падение</b> Идеология сталкивается с суровой реальностью. - <b>Суть:</b> «Лицо Дьявола проявилось» — все иллюзии Девятого дома разбиваются о стену фактов. - <b>Проявление:</b> Крах необоснованных амбиций. Позиция «Золушки», которая в полночь понимает, что она не принцесса, а тыква — это лишь декорация. - <b>Позитив:</b> Подтверждение того, что ваши методы (из 9-го дома) сработали и привели к реальному результату.`,
                    11: `<b>11 дом (Водолей) — Статус: Первое изгнание</b> Интеллектуальная свобода против социальной догмы. - <b>Суть:</b> «Холодный душ» для амбиций. Групповые планы заставляют человека отказаться от своей «идеи фикс». - <b>Проявление:</b> Дистанцирование от старых социальных связей ради будущего. - <b>В негативе.</b> Панический страх перед непредсказуемостью. Человек пытается втиснуть свободные, водолейские отношения в рамки своей узкой идеологии, что ведет к разрушению коллектива.`,
                    12: `<b>12 дом (Рыбы) — Статус: Вторая экстравертная обитель</b> - <b>Суть:</b> Карма социальных манипуляций. Человек сталкивается с последствиями того, во что он «вляпался» в 9-м доме. - <b>Проявление:</b> Принятие чужих проблем как своих. Ожидание «чуда» или расплата за самообман. Или фанатичное цепляние за одну «спасительную соломинку». Человек болезненно держится за одну идею (религиозную, мистическую или иллюзорную), панически боясь ее отпустить. Он предпочитает верить в своего иллюзорного «царя в голове», игнорируя реальность и отказываясь от нормального обучения или компромиссов`
                }
            },
            52: {
                name: "2 Мечей",
                general: `Младший аркан <b>2 мечей (Двойка воздуха в колоде Манара)</b> относится к стихии Земли (второй дом гороскопа, знак Тельца) и управляется планетой <b>Венера</b> (и внутренне Хироном). Двойки символизируют первичную материализацию желаний, поиск подходящей формы, базовые инстинкты и мораль. Воздушная масть (мечи) придает этому земному этапу характер конкретного, автоматического и зачастую холодного действия.<br><br>Для создания детального натального портрета (если рассматривать 2 мечей как базовую прошивку личности или Асцендент), мы синтезируем <b>четыре ключевые версии</b> проявления этого аркана из колод Уэйта и Манары:<br><br><b>1. Слепое автоматическое действие и игнорирование партнера (по Уэйту):</b> На карте изображен человек с завязанными глазами. Это означает, что личность действует исходя из своих внутренних привычек и инстинктов, абсолютно не глядя на партнера и не оценивая объективную реальность. Это бессознательные, выученные до автоматизма действия, когда человек уверен, что его стандартный подход сработает, и не желает видеть индивидуальные особенности того, с кем имеет дело.<br><b>2. Отношение к партнеру как к предмету или трофею (по Манаре):</b> На карте Двойка воздуха женщина держит в руках статуэтку Оскара. Это психологическое «расчеловечивание» партнера. Человек не видит в партнере живую личность с эмоциями, а воспринимает его исключительно как функцию, вещь или трофей (например, только как сексуальный объект или источник статуса).<br><b>3. Холодная естественность и базовая уверенность (позитив Манары):</b> В гармоничном варианте это абсолютная естественность и отсутствие внутренних зажимов. Женщина на карте не сомневается в своей привлекательности, она транслирует уверенность «я — приз» и готова принять внимание без высокомерия и ложной скромности, но при этом сохраняет эмоциональную дистанцию.<br><b>4. Удержание внутренних границ и чувство меры (по Уэйту):</b> Скрещенные мечи символизируют внутренний предел и способность вовремя сказать «хватит». Это умение защитить свою зону комфорта и остановить внешнее воздействие (например, напор партнера), закрыв глаза и выставив блокирующие руки: «не трогайте меня, мне достаточно».`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание</b><br>В сфере базовой инициативы и стартового импульса наступает полный паралич. Человек лезет в новую ситуацию или отношения по собственной воле, но при этом совершенно не понимает, что делает. Он выставляет вперед скрещенные мечи и закрывает глаза: «я ничего не знаю, не трогайте меня». Это потеря контроля над происходящим, когда вместо естественной агрессии Марса включается холодная, пугливая отстраненность и превращение себя в статичную, неживую куклу.`,
                    2: `<b>2 дом (Телец) — Первая обитель</b><br>Это абсолютно родная, естественная среда для аркана. Здесь человек идеально понимает свои базовые потребности и то, какая именно форма отношений ему нужна. Он выбирает партнера исключительно исходя из физиологического и материального комфорта, абсолютно трезво и инстинктивно тестируя его пригодность. Он чувствует себя полноправным «Оскаром» и ищет такого же статусного партнера, не испытывая потребности в глубоких душевных метаниях. Эмоции отключены ради природной целесообразности.`,
                    3: `<b>3 дом (Близнецы)</b><br>Формальное, автоматическое общение. В сфере повседневных контактов и рутинной коммуникации человек общается механически. Он не вовлекается в разговор эмоционально, держит дистанцию и воспринимает собеседников как говорящие манекены. Он говорит правильные слова, но делает это «с закрытыми глазами», не пытаясь по-настоящему услышать оппонента или вникнуть в его индивидуальные проблемы.`,
                    4: `<b>4 дом (Рак)</b><br>Изолированная зона комфорта. В интимном пространстве, дома и в семье человек выстраивает глухую ментальную оборону. Чтобы почувствовать себя в безопасности, ему необходимо абстрагироваться от эмоций домочадцев. Он надевает повязку на глаза, требуя, чтобы родственники выполняли свои функции (как Оскары), но не лезли к нему в душу. Дом воспринимается как место, где можно сказать «хватит» любым переживаниям.`,
                    5: `<b>5 дом (Лев)</b><br>Холодная демонстрация чувств. В зоне любви, творчества и эгоизма истинная страсть подменяется демонстрацией статуса. Влюбленность для такого человека — это возможность выставить партнера напоказ как красивый трофей. Сам он при этом остается внутренне холодным и невовлеченным, наслаждаясь лишь формальной, внешней стороной романтической игры, слепо игнорируя реальные живые чувства поклонника.`,
                    6: `<b>6 дом (Дева) — Падение</b><br>Сфера рутины, служения, здоровья и конкретных деталей. Земная Венера здесь падает. Человек пытается применить стандартные, привычные, слепые алгоритмы там, где требуется тонкий, индивидуальный анализ ситуации. Его автоматическое, холодное отношение к повседневным обязанностям или к телу партнера приводит к краху. Отказ видеть живые детали и индивидуальность супруга в ежедневном быту делает такие отношения невыносимо скучными и механистичными.`,
                    7: `<b>7 дом (Весы) — Вторая обитель</b><br>В зоне партнерства и брака человек действует так, словно партнер — это его безусловная собственность, часть его самого. Он действует «вслепую», не спрашивая мнения супруга, уверенный, что тот автоматически последует за ним (бросает через седло и везет в горы). В негативном варианте это эгоистичное использование партнера как трофея без учета его мыслей. В позитивном (сознательном) ключе — это способность человека самостоятельно, молча и технично исправлять свои ошибки в отношениях, совершая «действенное извинение», чтобы сгладить конфликт, не прибегая к долгим разговорам.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание</b><br>Зона кризиса, глубокой трансформации и чужих ресурсов. Сталкиваясь с экстремальной ситуацией или необходимостью меняться ради партнера, человек категорически отказывается это делать. Он закрывает глаза (Уэйт) на назревший кризис, требуя: «Принимай меня таким, какой я есть». У него просто нет внутреннего ресурса на трансформацию, поэтому он пытается заморозить ситуацию, искусственно удерживая партнера в роли удобной функции (Оскара), даже когда отношения уже откровенно рушатся.`,
                    9: `<b>9 дом (Стрелец)</b><br>Идеологическая слепота. При планировании совместного будущего или столкновении с чужим мировоззрением, человек упорно держится за свои старые, привычные шаблоны. Он не желает расширять горизонты и рассматривать другие варианты развития событий. Партнер должен вписываться в жестко заданную форму будущего, а любые идеологические разногласия человек просто игнорирует, закрывая глаза на расхождение ценностей.`,
                    10: `<b>10 дом (Козерог)</b><br>Механическое выполнение обязательств. В вопросах карьеры, социального статуса и обязанностей человек действует строго по регламенту. Он воспринимает коллег, начальников или социальную систему как бездушный механизм. Выполняя свой долг, он делает ровно то, что положено, на автомате, выставляя жесткие границы («вот это я делаю, а больше не трогайте меня»), полностью исключая инициативу или гибкость.`,
                    11: `<b>11 дом (Водолей)</b><br>Отстраненность в коллективе. Сталкиваясь с непредсказуемым будущим, форс-мажорами или находясь в кругу друзей, человек блокирует панику холодной отстраненностью. Он дистанцируется от коллектива, присутствует в нем лишь формально (как статуэтка) и предпочитает пережидать непредсказуемые перемены с закрытыми глазами, полагаясь на свои старые, проверенные инстинкты вместо того, чтобы искать новые водолейские инсайты.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация</b><br>Сфера иллюзий, тайн, кармы и подведения итогов. Здесь Венера достигает высшего напряжения. Человек гипертрофированно зацикливается на формальной, мертвой стороне отношений. Он выстраивает в своей голове идеальный, но абсолютно искусственный образ партнера (Оскар) и поклоняется ему, полностью оторвавшись от реальности. Слепота (по Уэйту) здесь становится абсолютной: человек готов принести себя в жертву ради иллюзорного, холодного идола, игнорируя любые тревожные сигналы извне.`
                }
            },
            66: {
                name: "2 Пентаклей",
                general: `Младший аркан <b>2 пентаклей (Двойка земли в колоде Манара)</b> относится к стихии Земли, базово соответствует второму дому гороскопа (знак Тельца) и управляется планетой <b>Венера</b> (и внутренне Хироном). В системе астрологического Таро эта карта символизирует первичную материализацию желаний, форму, физиологические потребности и базовое животное инстинктивное восприятие мира.<br><br>Общая трактовка базовой прошивки личности (или реакции на ситуацию) по 2 пентаклей синтезирует <b>четыре ключевые версии</b>, объединяющие философский символизм Уэйта и физиологию Манары:<br><br><b>1. Естественная провокация и демонстрация формы (по Манаре):</b> На карте Двойка Земли женщина осознанно и естественно демонстрирует себя, раздвинув ноги, выступая активной, управляющей стороной. Это абсолютное принятие своей женской (или мужской животной) природы, где человек ведет себя натурально, инстинктивно и показывает себя с нужной, притягательной стороны, чтобы партнер сам захотел его "спасать" или взаимодействовать.<br><b>2. Бессознательное тестирование и расчеловечивание (Синтез):</b> В отношениях человек оценивает партнера не как уникальную личность, а как материальный ресурс или "кусок мяса", пригодный для удовлетворения базовых потребностей. Мир жестко делится на "съедобное" и "несъедобное", на "то, что мне надо" и "то, чего не надо".<br><b>3. Удержание баланса в нестабильности (по Уэйту):</b> Символизм жонглера с двумя пентаклями означает способность человека удерживать равновесие в неравновесной системе, маневрировать в сложных обстоятельствах, опираясь только на базовый минимум средств.<br><b>4. Примитивный дуализм и фатализм (Негативный полюс):</b> В перевернутом или искаженном виде карта транслирует позицию "хрен редьки не слаще". Человек бездумно меняет один вариант на другой, не анализируя ошибок, будучи уверенным, что все партнеры или ситуации одинаковы, и слепо плывет по течению своих инстинктов.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание. Неуместная самопрезентация</b><br>В зоне базовой марсианской инициативы и стартового импульса возникает острый конфликт энергий. Человек не способен проявить здоровую, прямую инициативу (по Тузам), потому что его энергия уходит на "сохранение формы". Вместо активных действий на старте отношений он лишь пассивно демонстрирует себя (как женщина на карте Манары), ожидая, что его "потребят" или завоюют. В негативном варианте это глубокий комплекс неполноценности, когда человек считает, что у него просто нет нужных физических или материальных ресурсов, чтобы вообще начинать какое-либо дело.`,
                    2: `<b>2 дом (Телец) — Первая обитель. Идеальное природное чутье</b><br>Самое естественное и гармоничное положение для аркана. Человек абсолютно адекватно воспринимает свою физическую форму и материальные потребности. Он безошибочно на животном уровне определяет, какой партнер ему подходит ("съедобен"), а какой нет. Женщина (или мужчина) в этой позиции не сомневается в своей привлекательности, ведет себя натурально и использует свои данные для комфортного и стабильного потребления ресурсов партнера. В негативе — тупое потребительство и сведение любых отношений исключительно к физиологии.`,
                    3: `<b>3 дом (Близнецы)</b><br>Прагматичный повседневный контакт. В сфере повседневного общения, братьев/сестер и передачи информации человек использует связи исключительно для обмена материальными благами или удовлетворения простейших нужд. Коммуникация лишена глубокого интеллектуального подтекста — это простой торг ("ты мне, я тебе"), где люди оценивают друг друга по критерию полезности в быту.`,
                    4: `<b>4 дом (Рак)</b><br>Инстинктивная зона комфорта. В интимном пространстве дома и семьи личность выстраивает свой фундамент на базовом телесном комфорте. Дом воспринимается как физическое укрытие и место для насыщения. Отношение к родственникам может носить потребительский характер: они рассматриваются как ресурсная база, обеспечивающая безопасность и выживание организма.`,
                    5: `<b>5 дом (Лев)</b><br>Демонстрация своей сексуальности. В зоне радости, творчества, эгоизма и влюбленности человек не ищет глубокого духовного слияния. Романтическая игра и флирт сводятся к яркой демонстрации своих физических достоинств. Влюбленность носит ярко выраженный животный, физиологический характер, где партнер воспринимается как "приз" или "трофей", льстящий эго.`,
                    6: `<b>6 дом (Дева) — Падение. Крах шаблонного потребления</b><br>Сфера рутины, служения, здоровья и конкретных деталей. Здесь Венера падает. В шестом доме необходимо применять индивидуальный подход к каждому процессу или партнеру, учитывая все детали. Двойка пентаклей же пытается использовать универсальные, шаблонные животные инстинкты. Попытка отнестись к конкретному, живому партнеру со своими слабостями как к стандартному "куску мяса" или объекту потребления терпит полный крах, так как общие схемы здесь не работают.`,
                    7: `<b>7 дом (Весы) — Вторая обитель. Потребительское партнерство</b><br>В зоне открытых договоренностей и брака человек использует венерианские инстинкты для удержания партнера. Вместо того чтобы строить равноправный дипломатичный союз (по Семеркам), личность относится к партнеру как к своей собственности, считая, что вправе менять его представления под себя. В негативном (примитивном) варианте это фатализм и отсутствие развития в паре: человек живет по принципу "все мужики/бабы одинаковы", не видит разницы между партнерами и готов тупо потреблять то, что есть, лишь бы не остаться одному.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание. Отказ от трансформации</b><br>Сфера экстремальных кризисов, трансформации и чужих ресурсов. Сталкиваясь с необходимостью кардинально меняться ради партнера или выживания, человек категорически отказывается это делать. Он выставляет вперед свою неизменную форму: "Принимай меня таким, какой я есть". Это страх потерять свою базу в экстремальной ситуации. В негативе (перевернутая карта) — бессмысленное повторение одних и тех же действий без анализа ("выиграл в казино — иду играть снова"), что ведет к потере ресурсов и саморазрушению.`,
                    9: `<b>9 дом (Стрелец)</b><br>Материальная идеология. Сталкиваясь с далекими перспективами, социальными авторитетами или духовными учениями, человек оценивает их строго через призму материальной выгоды. "Моя религия — это то, что приносит мне ресурсы". Будущее планируется исключительно с позиции накопления и физиологического комфорта, а абстрактные идеалы отбрасываются как "несъедобные".`,
                    10: `<b>10 дом (Козерог)</b><br>Балансирование в профессии. В сфере карьеры, социального статуса и обязанностей человек действует как жонглер. Он не стремится к великим амбициям или профессиональному призванию, а просто механически выполняет работу ради зарплаты, ловко маневрируя между начальством и обязательствами, чтобы сохранить свой минимальный материальный уровень стабильности.`,
                    11: `<b>11 дом (Водолей)</b><br>Выживание в хаосе. В зоне форс-мажоров, коллективов и непредсказуемого будущего человек сталкивается с нестабильностью. Здесь навыки 2 пентаклей используются для того, чтобы удержать равновесие на шатающейся палубе. Личность дистанцируется от идейных волнений коллектива, концентрируя все усилия на сохранении своего физического тела и личного кошелька посреди социальных бурь.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация. Идеализация материального</b><br>В сфере тайн, кармы и подведения итогов земная Венера достигает высшего напряжения (экзальтации). Это парадоксальное состояние, когда физиологическая потребность или материальная привязанность к партнеру возводится в ранг мистического, кармического слияния. Человек готов пожертвовать всем ради сохранения физической формы отношений, или же слепо поклоняется материальному/телесному аспекту связи, полностью игнорируя духовную или объективную реальность, растворяясь в партнере на животном уровне.`
                }
            },
            25: {
                name: "3 Жезлов",
                general: `В системе астрологического Таро Юрия Хана числовые карты-тройки относятся к зоне естественного, врожденного поведения (третий дом, знак Близнецов). Младший аркан <b>3 жезлов</b> (Тройка Огня) описывает огненную сторону этого процесса — наши базовые, природные потребности, инициативу и желания, не искаженные социальными рамками или сложными рефлексиями.<br><br>Чтобы составить объемный натальный портрет личности (рассматривая 3 жезлов как базовую прошивку, аналог Асцендента), необходимо синтезировать <b>три различных проявления этого аркана</b>, выделяемых в лекциях:<br><br><b>1. Естественное целеполагание и простота действий.</b> Это выбор самого оптимального, понятного и прямого пути для удовлетворения своих нужд. Человек делает то, что велит ему природа и здоровый инстинкт, не усложняя ситуацию.<br><b>2. Искренняя прямолинейность без учета «сложности» партнера.</b> Это поведение по принципу «мы все люди, и наши потребности одинаковы». Человек не подстраивается под уникальную индивидуальность другого, ожидая, что его естественный порыв будет так же естественно принят.<br><b>3. Откровенная демонстрация желаний (Отсутствие двойного дна).</b> В позитиве это абсолютная открытость своих намерений, а в негативе (при перекосе) — риск показаться вульгарным или бестактным из-за нежелания соблюдать сложные светские ритуалы.<br><br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 3 жезлов — это личность, чья жизнь строится на здоровых, понятных инстинктах и железобетонной уверенности в своем праве на их удовлетворение. В его психике сливаются два архетипа. С одной стороны, это <b>человек, спокойно опирающийся на свой жезл и смотрящий вдаль (по Уэйту)</b> — он сделал свой оптимальный выбор, он уверен в своей правоте и просто ждет естественных результатов. С другой стороны, это <b>женщина, без стеснения запрыгивающая на мужчину (по Манаре)</b>, символизирующая чистый, откровенный порыв к удовлетворения своей потребности без романтической мишуры и лишних разговоров. Его суперсила — гениальная простота, отсутствие интриг и комплексов. Он действует напрямую: «захотел — взял». Его уязвимость — неспособность (или нежелание) понимать сложные социальные игры, из-за чего его искренность может восприниматься как бескультурье, а его прямолинейность часто ранит тех, кто ждет деликатности и компромиссов.`,
                houses: {
                    1: `<b>1 дом (Овен) — Естественный стартовый импульс</b><br>В любых новых начинаниях человек лишен задних мыслей. Он стартует спокойно, опираясь на свой потенциал (Уэйт), и сразу берет быка за рога, проявляя прямую инициативу (Манара). Его старт — это всегда простое действие ради удовлетворения понятной потребности, без масок и интриг.`,
                    2: `<b>2 дом (Телец) — Прямолинейное потребление ресурсов</b><br>Отношение к деньгам и комфорту лишено пафоса. Человек потребляет ресурсы исключительно для поддержания своей жизнедеятельности. Он уверенно опирается на свой заработок (Уэйт) и берет от партнера или мира ровно то материальное благо, которое ему необходимо прямо сейчас (Манара), не требуя роскоши.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель</b><br>Здесь базовая прошивка находится в своей абсолютно естественной среде. Человек идеально синхронизирован со своими природными желаниями. Его действия максимально точны и понятны. Он не тратит энергию на выдумывание сложных схем. Захотел общаться — подошел и заговорил; захотел близости — откровенно предложил. Он твердо стоит на ногах, опираясь на свои убеждения (Уэйт), и с природной грацией берет инициативу в свои руки (Манара). Окружающие считывают его простоту не как наглость, а как подкупающую искренность. В общении и сексе это самый понятный партнер, у которого нет камня за пазухой и скрытых мотивов.`,
                    4: `<b>4 дом (Рак) — Простая базовая безопасность</b><br>Семья и дом воспринимаются как место, где можно не притворяться. Здесь не нужны сложные психологические игры. Человек отдыхает, опираясь на фундамент традиций (Уэйт), и реализует свои домашние или сексуальные потребности открыто, по-простому, наслаждаясь естественным контактом с близкими (Манара).`,
                    5: `<b>5 дом (Лев) — Искренняя прямая влюбленность</b><br>Катастрофа для сложных романтических игр и театральности. Если человек влюблен, он не пишет стихов и не поет серенад — он прямо заявляет о своих желаниях (Манара). Он уверенно ждет взаимности (Уэйт), полагая, что его искреннего порыва вполне достаточно для того, чтобы праздник жизни состоялся.`,
                    6: `<b>6 дом (Дева) — Вторая обитель</b><br>Сфера рутины, служения, здоровья и методичного анализа. Использование своих природных инстинктов для выстраивания четкого рабочего или бытового процесса. Человек превращает свои желания в отлаженный механизм. Он опирается на свою интуитивную базу (Уэйт), чтобы методично и без лишних эмоций делать свое дело. В отношениях он использует свою энергию (прыжок Манары) строго по графику и в рамках установленных правил. Это практичное применение своей страсти, когда человек работает или заботится о здоровье так же естественно, как дышит.`,
                    7: `<b>7 дом (Весы) — Бескомпромиссная открытость партнеру</b><br>В брак человек не использует тонкую дипломатию. Он переносит свои привычки на партнера, свято веря, что «что хорошо мне, то хорошо и тебе». Он крепко держится за свою позицию (Уэйт) и может прямолинейно навязывать партнеру свой ритм жизни (Манара), игнорируя его тонкую индивидуальность.`,
                    8: `<b>8 дом (Скорпион) — Естественное преодоление кризиса</b><br>Столкнувшись с экстримом или тяжелой трансформацией, человек выживает за счет своих базовых, животных инстинктов. Он не философствует над болью, а упирается ногами в землю (Уэйт) и использует всю свою необузданную жизненную энергию (Манара), чтобы просто проскочить опасный участок по самой короткой траектории.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание</b><br>Сфера социальной идеологии, долгосрочного партнерства и компромиссов. Естественная простота вступает в жесткий конфликт с необходимостью договариваться и учитывать сложные взгляды партнера. Человек упорно не желает менять свои привычки ради «общего будущего». Пытаясь отстоять свою правоту, человек просто отворачивается от сложностей, упираясь в свой единственный жезл (Уэйт), или пытается взять партнера нахрапом, запрыгивая на него со своими примитивными желаниями (Манара) там, где от него ждут высокой философии или дипломатии. Социум воспринимает это как грубость, вульгарность и нежелание развиваться.`,
                    10: `<b>10 дом (Козерог) — Очевидная социальная ответственность</b><br>В карьере и социуме человек не плетет интриг. Он выполняет поставленную перед ним задачу самым стандартным и понятным способом. Он надежен как скала (Уэйт) и готов вкладывать свою личную энергию в работу (Манара), ожидая, что его оценят за конкретный труд, а не за социальные манипуляции.`,
