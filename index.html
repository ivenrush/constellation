                general: `В астрологической системе Таро Юрия Хана старший аркан <b>Жрица</b> является внутренней картой первого дома (знака Овна) и управляется планетой Плутон. Если внешняя карта этого дома (Маг) символизирует саму жизненную энергию, активное действие и природную потенцию, то Жрица выполняет роль <b>внутренней «меры» или «вентиля»</b>, который строго регулирует количество поступающей жизненной силы.<br><br>Жрица — это абсолютная, бессознательная животная и физиологическая природа (особенно женская), которая управляет жизненными циклами организма. В своей глубинной сути Жрица является «слепым» исполнителем генетической программы: ее невозможно уговорить, подкупить или разжалобить, она выполнит заложенную в нее биологическую задачу (например, зачатие, роды или гормональную перестройку) любой ценой, подобно «шахидке».<br><br><b>Если рассматривать Жрицу как натальное положение (базовую психологическую «прошивку» личности, аналог Асцендента)</b>, то мы получаем человека, чье поведение и мотивы продиктованы исключительно мощными, но скрытыми физиологическими и бессознательными импульсами. Такой человек не генерирует инициативу искусственно; он начинает действовать только тогда, когда внутри него «открывается вентиль» энергии. Он представляет собой тайну для окружающих, а зачастую и для самого себя, живя в глубоком слиянии с природными ритмами.<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Жрицы во всех 12 домах гороскопа (жизненных сферах).<br><br>### Особые положения Жрицы (Астрологические достоинства)<br><br><b>1 дом (Овен) — Первая обитель (Естественная среда)</b> Здесь Жрица находится на своем законном месте.<br><br><b>Натальная суть:</b> Человек находится в идеальном контакте со своей животной природой и телесными инстинктами. Его инициатива рождается не из головы, а из глубокой внутренней готовности организма. Это абсолютная, не требующая доказательств уверенность в своей скрытой силе. Женщина с такой базой обладает невероятным внутренним магнетизмом, который не нуждается во внешней демонстрации.<br><br><b>2 дом (Телец) — Второе изгнание (Отрыв от формы и понимания себя)</b> Второй дом требует четкого понимания своих желаний, формы и материи, но Жрица приносит сюда полную бессознательность.<br><br><b>Натальная суть:</b> Человек становится сюрпризом и тайной для самого себя. Это классическое состояние периода полового созревания: тело меняется, гормоны диктуют новые желания, но сознание не может их расшифровать. В жизни это дает личность, которой крайне сложно выбрать подходящую форму отношений или предмет потребления, потому что она не осознает, что именно сейчас происходит внутри нее самой.<br><br><b>7 дом (Весы) — Первое изгнание (Потеря контроля в партнерстве)</b> Седьмой дом — сфера дипломатии и взаимодействия с конкретным человеком.<br><br><b>Натальная суть:</b> Вступая в отношения, такой человек совершенно не знает, на что он способен, так как в нем просыпается стихия, которой он сам не владеет.<br><br><b>Специфика:</b> В негативном варианте партнер может эгоистично использовать эту бессознательность, воспринимая такого человека как удобный инструмент для своего удовлетворения. В позитивном (осознанном) варианте партнер с глубоким уважением относится к скрытым внутренним состояниям Жрицы — например, не задает лишних вопросов и не обижается, если человек без видимых причин закрывается или отказывает в близости, понимая, что на это есть веские физиологические или энергетические основания.<br><br><b>8 дом (Скорпион) — Вторая обитель (Магическая трансформация)</b> Сфера кризиса, экстрима и окончательных результатов взаимодействия.<br><br><b>Натальная суть:</b> Здесь Жрица обретает высший уровень владения собой. Человек способен довести себя до пикового результата (катарсиса, трансформации, оргазма) исключительно за счет собственных глубоких резервов.<br><br><b>Специфика:</b> Внешний партнер здесь становится лишь декорацией. Все процессы бурлят внутри: «из тебя вылезло что-то, что довело тебя до оргазма, а партнер тут ни при чем». На эзотерическом уровне это дает человеку магический допуск к управлению своей жизненной силой, возможность сознательно «подкручивать вентиль» собственной энергетики.<br><br><b>11 дом (Водолей) — Платонические иллюзии будущего</b> Одиннадцатый дом — это планы, свобода и будущее, оторванное от прошлого.<br><br><b>Натальная суть:</b> Положение Жрицы здесь является очень ранним, необоснованным и платоническим.<br><br><b>Специфика:</b> Возникает серьезная неадекватность: человек еще не прожил реальную ситуацию в настоящем, но уже строит далеко идущие, ничем не подкрепленные планы. Например, едва познакомившись с партнером (или проведя с ним лишь одну ночь), женщина с такой прошивкой уже начинает фантазировать о том, как они будут жить в старости и где будут учиться их дети. Это забегание вперед паровоза, лишенное энергетической базы.<br><br><b>12 дом (Рыбы) — Зона кармы и скрытых истоков</b> Двенадцатый дом символизирует то, что скрыто за пределами нашего осознания, результаты кармы и изоляцию.<br><br><b>Натальная суть:</b> Энергия Жрицы в 12 доме возвращает человека к самым истокам — к его пренатальному периоду (жизни в утробе матери).<br><br><b>Специфика:</b> Глубинные психические сдвиги, комплексы или скрытые страхи такого человека проистекают из периода до его рождения. Это может быть отражением проблем или болезней материнского организма во время беременности. В натальном портрете это дает личность с невероятно глубокой бессознательной памятью, склонную впитывать карму рода еще до своего появления на свет.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель (Естественная среда)</b><br>Здесь Жрица находится на своем законном месте. <b>Натальная суть:</b> Человек находится в идеальном контакте со своей животной природой и телесными инстинктами. Его инициатива рождается не из головы, а из глубокой внутренней готовности организма. Это абсолютная, не требующая доказательств уверенность в своей скрытой силе. Женщина с такой базой обладает невероятным внутренним магнетизмом, который не нуждается во внешней демонстрации.`,
                    2: `<b>2 дом (Телец) — Второе изгнание (Отрыв от формы и понимания себя)</b><br>Второй дом требует четкого понимания своих желаний, формы и материи, но Жрица приносит сюда полную бессознательность. <b>Натальная суть:</b> Человек становится сюрпризом и тайной для самого себя. Это классическое состояние периода полового созревания: тело меняется, гормоны диктуют новые желания, но сознание не может их расшифровать. В жизни это дает личность, которой крайне сложно выбрать подходящую форму отношений или предмет потребления, потому что она не осознает, что именно сейчас происходит внутри нее самой.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации и повседневного общения</b><br><b>Суть:</b> Энергия Жрицы конфликтует с необходимостью вербального и легкого общения. Такой человек в повседневных контактах крайне скрытен. Вместо слов он транслирует свое отношение через внутренние, неуловимые состояния. Коммуникация строится не на логике, а на глубоком интуитивном считывании партнера: он скорее "почувствует" собеседника телом, чем станет слушать его аргументы.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и психики</b><br><b>Суть:</b> В негативном (перевернутом) варианте Жрица здесь указывает на тяжелую родовую карму, передающуюся исключительно по женской линии, или на предрасположенность к наследственным заболеваниям. В позитивном ключе дом становится местом глубочайшего физиологического ретрита, где человек, подобно животному в норе, восстанавливает свои инстинкты в полной изоляции.`,
                    5: `<b>5 дом (Лев) — Сфера сознательных желаний, творчества и игры</b><br><b>Суть:</b> Природная, бессознательная программа Жрицы вступает в диссонанс с ярким, сознательным Солнцем (эго) пятого дома. Человек не умеет открыто флиртовать или играть роль "на публику". Его привлекательность глубоко магнетична и включается только тогда, когда срабатывает внутренний биологический цикл, а не тогда, когда он сознательно "захотел" произвести впечатление.`,
                    6: `<b>6 дом (Дева) — Сфера рутины, здоровья и служения</b><br><b>Суть:</b> Здоровье, работоспособность и быт такого человека полностью подчинены его внутренним биологическим ритмам. Если "вентиль" Жрицы перекрыт из-за усталости организма, никакие логические доводы о долге или карьерной необходимости не заставят человека действовать. Физиология здесь управляет рабочим расписанием безоговорочно.`,
                    7: `<b>7 дом (Весы) — Первое изгнание (Потеря контроля в партнерстве)</b><br>Седьмой дом — сфера дипломатии и взаимодействия с конкретным человеком. <b>Натальная суть:</b> Вступая в отношения, такой человек совершенно не знает, на что он способен, так как в нем просыпается стихия, которой он сам не владеет. <b>Специфика:</b> В негативном варианте партнер может эгоистично использовать эту бессознательность, воспринимая такого человека как удобный инструмент для своего удовлетворения. В позитивном (осознанном) варианте партнер с глубоким уважением относится к скрытым внутренним состояниям Жрицы — например, не задает лишних вопросов и не обижается, если человек без видимых причин закрывается или отказывает в близости, понимая, что на это есть веские физиологические или энергетические основания.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель (Магическая трансформация)</b><br>Сфера кризиса, экстрима и окончательных результатов взаимодействия. <b>Натальная суть:</b> Здесь Жрица обретает высший уровень владения собой. Человек способен довести себя до пикового результата (катарсиса, трансформации, оргазма) исключительно за счет собственных глубоких резервов. <b>Специфика:</b> Внешний партнер здесь становится лишь декорацией. Все процессы бурлят внутри: «из тебя вылезло что-то, что довело тебя до оргазма, а партнер тут ни при чем». На эзотерическом уровне это дает человеку магический допуск к управлению своей жизненной силой, возможность сознательно «подкручивать вентиль» собственной энергетики.`,
                    9: `<b>9 дом (Стрелец) — Сфера идеологии, социума и будущего</b><br><b>Суть:</b> Подсознательная, молчаливая программа Жрицы сталкивается с необходимостью социальной экспансии и формирования мировоззрения. У такого человека формируются фанатичные, глубинные убеждения, которые невозможно поколебать логикой или внешними доводами (та самая решимость "шахидки"). Его вера базируется исключительно на телесном и мистическом проживании реальности.`,
                    10: `<b>10 дом (Козерог) — Сфера статуса, реальности и долга</b><br><b>Суть:</b> В достижении социальных целей человек опирается не на агрессивную борьбу, а на инстинктивное чутье процессов. Он может выполнять свою профессиональную миссию как слепой, но безошибочный инструмент высших сил или природы. Часто это указывает на реализацию в профессиях, связанных с тайнами физиологии, гинекологией, эзотерикой или спасением жизней на базовом уровне.`,
                    11: `<b>11 дом (Водолей) — Платонические иллюзии будущего</b><br>Одиннадцатый дом — это планы, свобода и будущее, оторванное от прошлого. <b>Натальная суть:</b> Положение Жрицы здесь является очень ранним, необоснованным и платоническим. <b>Специфика:</b> Возникает серьезная неадекватность: человек еще не прожил реальную ситуацию в настоящем, но уже строит далеко идущие, ничем не подкрепленные планы. Например, едва познакомившись с партнером (или проведя с ним лишь одну ночь), женщина с такой прошивкой уже начинает фантазировать о том, как они будут жить в старости и где будут учиться их дети. Это забегание вперед паровоза, лишенное энергетической базы.`,
                    12: `<b>12 дом (Рыбы) — Зона кармы и скрытых истоков</b><br>Двенадцатый дом символизирует то, что скрыто за пределами нашего осознания, результаты кармы и изоляцию. <b>Натальная суть:</b> Энергия Жрицы в 12 доме возвращает человека к самым истокам — к его пренатальному периоду (жизни в утробе матери). <b>Специфика:</b> Глубинные психические сдвиги, комплексы или скрытые страхи такого человека проистекают из периода до его рождения. Это может быть отражением проблем или болезней материнского организма во время беременности. В натальном портрете это дает личность с невероятно глубокой бессознательной памятью, склонную впитывать карму рода еще до своего появления на свет.`
                }
            },
            3: {
                name: "Императрица",
                general: `В астрологической системе Таро Юрия Хана старший аркан <b>Императрица</b> (в некоторых колодах Хозяйка, планета Венера, знак Тельца) является главной картой <b>второго дома</b> гороскопа. Эта энергия символизирует абсолютную материальную природу, форму, физическое тело, земное изобилие, женское магнетическое начало и главный принцип — <b>потребление ради поддержания формы</b>.<br><br>В отличие от Мага (инициатива) или Императора (управление и власть), Императрица ничего не ищет и ни за кем не бегает. Ее природа — <b>пассивное притяжение</b>: она обладает настолько мощной физической и материальной формой, что ресурсы, блага и партнеры притягиваются к ней сами, просто потому, что она существует.<br><br>Если рассматривать Императрицу как <b>натальное положение (базовую психологическую прошивку личности, аналог Асцендента)</b>, то перед нами человек (независимо от пола, хотя для женщин это более естественно), чья жизнь строится вокруг телесного комфорта, обладания материальными ценностями и способности получать желаемое без агрессивной борьбы. Главный мотив такого человека: «Я — ценность, мир должен обеспечивать мою форму и удовлетворять мои физические запросы».<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Императрицы во всех 12 домах гороскопа (жизненных сферах), где логика ситуативных раскладов перенесена на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание (Инициатива через потребление)</b><br>Первый дом — зона самостоятельной марсианской инициативы, природного старта (Маг). <b>Натальная суть:</b> Базовая прошивка личности лишена бескорыстного старта. Человек с Императрицей на Асценденте не начнет действовать, пока не получит материальный стимул, бонус или подтверждение своей привлекательности. <b>Специфика:</b> Сначала «покормите», сделайте комплимент, подарите подарок — и только потом у такого человека проснется импульс к действию или сексуальное желание. Вся природная энергия (Маг) закована в материальную форму. Человек оценивает не свое желание «хочу ли я», а внешнюю форму «какую выгоду мне это даст».`,
                    2: `<b>2 дом (Телец) — Первая обитель (Естественная среда)</b><br>Здесь Императрица находится у себя дома, это идеальное совпадение архетипа и сферы. <b>Натальная суть:</b> Человек находится в абсолютной гармонии со своим телом, вкусами и материальными потребностями. Он интуитивно знает, что ему нужно для комфорта, и умеет получать это от природы и социума. У него всегда есть необходимые ресурсы («запасной аэродром», деньги, вещи), назначение которых может быть пока неизвестно, но они готовы к использованию. <b>Специфика в отношениях:</b> (по колоде Манара) Женщина с такой базой обладает мощным животным магнетизмом. Она легко принимает поклонение мужчин, не видя в них сложной личности, а воспринимая их инстинктивный отклик как должное. Мужчина для нее — природный инструмент для обеспечения ее комфорта или плодородия. <b>Теневая сторона (Перевернутая карта):</b> Разрушение формы. Человек потребляет, но не может сохранить или усвоить это. Отсюда проблемы с лишним весом (еда уходит в целлюлит), захламление дома испорченными вещами, неспособность получать радость от материального, искаженное представление о своей привлекательности.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации, общения и повседневности</b><br><b>Суть:</b> Человек выстраивает повседневные связи исключительно на основе материальной симпатии и тактильного комфорта. Его коммуникация лишена глубокого интеллекта, зато наполнена разговорами о вещах, еде, покупках и телесности. Он общается только с теми, с кем ему физически уютно и выгодно находиться рядом.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и базовой психики</b><br><b>Суть:</b> Ощущение психологической безопасности у такого человека намертво привязано к материальной базе родительского дома или собственной недвижимости. Мать в его восприятии (или он сам как родитель) — это прежде всего фигура, которая кормит, одевает и обеспечивает физический уют. Если холодильник пуст — наступает паника и потеря базовой опоры.`,
                    5: `<b>5 дом (Лев) — Сфера игры, творчества, любви и эгоизма</b><br><b>Суть:</b> Любовь и творчество воспринимаются через призму роскоши и демонстрации своей привлекательности. Человек «играет» в отношения, ожидая дорогих ухаживаний, подарков и восхищения своими физическими данными. Его творчество всегда должно иметь осязаемую, красивую, монетизируемую материальную форму (дизайн, кулинария, создание физической красоты).`,
                    6: `<b>6 дом (Дева) — Падение (Подмена процесса формой)</b><br>Шестой дом — сфера рутинного труда, методологии, работы инструментами и заботы о здоровье. <b>Натальная суть:</b> Человек пытается заменить необходимый тяжелый труд или процесс выбора <b>просто фактом своего существования</b>. <b>Специфика:</b> Психология «я красивая женщина (или статусный мужчина), поэтому я не должна ничего делать, мир сам должен мне все дать». Человек выезжает на своих внешних данных там, где требуется реальный профессионализм или детальный анализ. В негативе это приводит к тому, что человек вообще не понимает, что ему нужно выбрать, и ждет, пока нужный предмет или партнер «сам придет», а в итоге получает то, что просто валялось под ногами.`,
                    7: `<b>7 дом (Весы) — Вторая обитель (Партнерство как обслуживание)</b><br>В сфере брака, договоренностей и социального партнерства Императрица чувствует себя прекрасно (так как Весами тоже управляет Венера), но проявляет себя специфически. <b>Натальная суть:</b> Человек выстраивает любые партнерские отношения (особенно брак) на основе <b>материального и телесного комфорта</b>. Для него идеальный союз — это когда партнер добровольно и с радостью обслуживает его нужды. <b>Специфика в отношениях:</b> В браке такой человек позволяет себя любить. Он не воюет с партнером, а благосклонно принимает его служение. Девиз такого натального положения: «У нас идеальная семья, если холодильник полон, а в постели мне физически хорошо». <b>Теневая сторона:</b> Меркантильность и потребительство. Партнер воспринимается исключительно как функция (банкомат или вибратор). Если ресурсы иссякают, отношения моментально обесцениваются.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание (Страх трансформации)</b><br>Восьмой дом — зона экстрима, кризиса, отдачи энергии и трансформации (Смерть). Императрица (форма) здесь изгоняется, так как любая трансформация угрожает стабильной материи. <b>Натальная суть:</b> Личность панически боится меняться, терять накопленное имущество или свою физическую привлекательность. Вместо того чтобы в кризисе переродиться и получить новый опыт, человек ожидает, что кризис принесет ему <b>то же самое старое, привычное удовольствие</b>, которое он любил всегда. <b>Специфика:</b> В результатах (секса, бизнеса, работы) человек ищет подтверждения своих старых вкусов («нравится - не нравится»). Если результат не соответствует его личным материальным ожиданиям, он обесценивает весь процесс. В негативе это энергетический вампиризм: высасывание ресурсов из партнера ради сохранения своей иллюзорной молодости или стабильности.`,
                    9: `<b>9 дом (Стрелец) — Сфера социума, идеологии, мировоззрения</b><br><b>Суть:</b> Идеология потребления. Человек искренне верит, что смысл жизни и духовное развитие заключаются в расширении материального благополучия. В социуме он выступает как проповедник комфорта. Он готов вписываться только в те социальные или образовательные проекты, которые гарантируют ему статус обеспеченного, красивого человека.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и долга</b><br><b>Суть:</b> Карьера строится на умении нравиться начальству или на эксплуатации своей внешности и обаяния. Ответственность и долг перед миром такой человек понимает как необходимость быть «матерью/хозяйкой» для подчиненных: накормить, обеспечить комфортный офис. В негативе — восприятие работодателя исключительно как ресурса («дойной коровы») без желания нести реальную рабочую нагрузку.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы, друзей и коллектива</b><br><b>Суть:</b> Человек ищет такую свободу, которая обеспечит ему бесконечный физический комфорт без обязательств. В коллективе он выступает центром притяжения благодаря своей харизме и щедрости (или, наоборот, ожидает, что друзья будут скидываться ему на роскошную жизнь). Его планы на будущее всегда предельно материальны: он мечтает не о спасении мира, а о яхте, вилле и бесконечном ресурсе. <b>Резюме:</b> Натальная Императрица описывает человека, который оценивает мир через призму эстетики, материи и телесных ощущений. Его суперсила — это способность материализовывать желаемое через пассивное притяжение и магнетизм. Его главная проблема — риск превратиться в ненасытную «черную дыру», которая требует все больше ресурсов, забывая о духовном развитии, трансформации и необходимости отдавать энергию взамен.`,
                    12: `<b>12 дом (Рыбы) — Экзальтация (Результаты налицо)</b><br>Двенадцатый дом — сфера скрытой кармы, окончательных итогов и жертвенности. Венера здесь экзальтирует. <b>Натальная суть:</b> Внешняя форма человека, его тело и материальное положение являются прямой, гипертрофированной демонстрацией того, как он прожил свою жизнь (свою карму). Все его тайные поступки отражаются на его здоровье и кошельке. <b>Специфика:</b> В позитиве — это чудесное, почти магическое обретение идеальной формы и богатства в конце пути (как вознаграждение свыше за правильную жизнь). В негативе — синдром «старухи у разбитого корыта». Человек остается буквально ни с чем, старым и нищим, потому что его эгоизм и жадность в социуме (11 дом) привели к тотальному кармическому краху формы.`
                }
            },
            4: {
                name: "Император",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Император</b> является внутренней (скрытой) картой <b>второго дома</b> гороскопа (знак Тельца). В отличие от своей внешней пары — Императрицы (Венеры), которая символизирует саму материю, природу и процесс потребления, Император управляется не открытой планетой <b>Хирон</b> и выполняет функцию <b>внутренней меры, структуры, контроля и власти</b>.<br><br>Император не имеет реальных материальных благ (у него нет мешков с едой или чемоданов с платьями, он сидит на каменном троне), но он обладает <b>властью и правом</b> распоряжаться этими благами. Если Императрица — это продукты, то Император — это деньги (эквивалент ценности) и статус.<br><br>Если рассматривать Императора как <b>натальное положение</b> (базовую психологическую прошивку личности, аналог Асцендента), перед нами предстает человек, чья жизнь строится вокруг понятий контроля, порядка, установления личных границ и хозяйского отношения к ресурсам. Его базовый мотив — «Я владею, я устанавливаю правила, я определяю меру допустимого».<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Императора во всех 12 домах гороскопа (жизненных сферах), где логика особых положений перенесена на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Второе изгнание (Отсутствие животной инициативы)</b><br>Первый дом — зона самостоятельного, природного старта (Маг). <b>Натальная суть:</b> Человек лишен естественного животного импульса входить в отношения или начинать дела просто из желания «я хочу». Его инициатива всегда вторична и расчетлива. <b>Специфика:</b> Чтобы такой человек начал действовать, он должен сначала оценить «годность» внешнего объекта. Решение принимается не из внутреннего горения, а из холодной оценки: «Потяну ли я этого партнера/проект? Достаточно ли он качественный для меня?». В негативе это дает хроническое недовольство тем, что человек имеет. Вместо того чтобы решать проблему, он постоянно жалуется на недостаток ресурсов («у меня нет денег, нет возможностей»).`,
                    2: `<b>2 дом (Телец) — Первая внутренняя обитель (Естественная среда)</b><br>Здесь базовая прошивка Императора абсолютно гармонична. <b>Натальная суть:</b> Идеальный и разумный хозяин. Человек с такой прошивкой не просто бездумно потребляет ресурсы (как это делала бы неуравновешенная Императрица), он экологично и бережно относится ко всему, с чем имеет дело: к деньгам, вещам, природе и партнерам. <b>Специфика:</b> Главный принцип здесь — «не рубить сук, на котором сидишь». Человек интуитивно знает меру: сколько можно потратить, сколько можно съесть, сколько энергии можно взять от партнера, чтобы ресурс успел восстановиться. Он обслуживает свои предметы потребления, ухаживает за ними, чтобы они приносили стабильный результат. <b>Теневая сторона:</b> Если Император перевернут, человек не умеет распоряжаться тем, что имеет. Урожай гниет, ресурсы растрачиваются впустую или, наоборот, возникает жесткая скупость из-за непонимания истинной ценности вещей.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация (Напряжение из-за статуса)</b><br>Третий дом — это повседневное общение, коммуникация, приятели. Хирон (Император) здесь экзальтирует. <b>Натальная суть:</b> Повседневное общение для человека не бывает легким и естественным. Его сковывают вопросы личного статуса, власти или материального обеспечения. <b>Специфика:</b> Человек в бытовом контакте напряжен. Например, он не может свободно расслабиться в компании друзей, потому что его грызет мысль о том, что у него нет денег скинуться на общий счет, или он слишком зациклен на том, какое место за столом ему должны предоставить по статусу. Его повседневная речь и поведение пропитаны диктатом или оценкой чужого положения.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и базовой психики</b><br><b>Суть:</b> Родительский дом и собственная семья воспринимаются как личная империя. Базовое спокойствие достигается только тогда, когда человек полностью контролирует свое жилище и домочадцев. Это фиксация своих достижений: «Я молодец, я всех победил». В негативе (перевернутый Император) — это жесткий домашний тиран, раздающий безапелляционные приказы: «Обувь снять, сюда не ходить, я здесь хозяин».`,
                    5: `<b>5 дом (Лев) — Сфера сознания, творчества, влюбленности</b><br><b>Суть:</b> Любовь и творчество лишаются спонтанности. Радость приходит не от безумной страсти, а от осознания своей власти над объектом любви или своим творением. Человек хочет, чтобы им восхищались как непререкаемым авторитетом.`,
                    6: `<b>6 дом (Дева) — Сфера служения, рутины и здоровья</b><br><b>Суть:</b> Человек не умеет и не хочет быть подчиненным. В любой рутинной работе он стремится занять место управленца, пусть даже маленького, но хозяина. К своему здоровью он относится как к механизму, который нужно жестко контролировать диетами и режимом (аскеза ради поддержания формы).`,
                    7: `<b>7 дом (Весы) — Сфера социального партнерства и брака</b><br><b>Суть:</b> Брак воспринимается исключительно как формальный, жесткий договор. Это союз, где роли прописаны от и до. Романтики здесь нет, есть четкое распределение обязанностей и прав. Партнер уважается только в том случае, если он соблюдает установленные Императором законы семьи.`,
                    8: `<b>8 дом (Скорпион) — Первое изгнание (Кризис результата и нежелание трансформации)</b><br>Восьмой дом (Скорпион) — это зона трансформации, экстрима и совместной энергии. <b>Натальная суть:</b> Попадая в зону кризиса, человек с базой Императора пытается удержать статус-кво. Его главный итог во взаимодействии с миром: «Я остался при своем». <b>Специфика:</b> Входя в сложные, трансформирующие отношения или бизнес, такой человек не хочет меняться сам. Процесс проходит впустую: сколько он потратил сил и средств, столько к нему и вернулось, без какой-либо качественной прибыли или развития. <b>Теневая сторона (Синдром выжженной земли):</b> Император в 8-м доме должен быть обязательно уравновешен картой Умеренность. Если этого контроля нет, человек превращается в безжалостного диктатора и захватчика. Ради своего выживания он готов отнять чужой ресурс целиком («вырвать гриб с грибницей»), полностью уничтожая партнера или бизнес, оставляя после себя выжженную землю.`,
                    9: `<b>9 дом (Стрелец) — Падение (Отказ от объединения и патриархат)</b><br>Девятый дом требует создания общего будущего (мы), согласования мнений и компромисса. Император здесь (как планета Хирон) находится в падении. <b>Натальная суть:</b> Личность категорически не способна или не желает объединять свои интересы с интересами партнера. Это психология жесткого патриархата или шовинизма: человек делит мир на «мое» и «твое» (или на мужские и женские обязанности), не допуская ничего общего. <b>Специфика:</b> При попытке выстроить совместное будущее, человек диктует свои условия. Он не приемлет чужого мнения: «Молчи, тебе слова не давали». <b>Позитивный вариант:</b> Прямой Император в 9-м доме дает честное и открытое признание своей неготовности к браку или совместному бизнесу. Человек трезво оценивает свои силы и честно говорит: «Я не способен на совместную жизнь, где всё общее», что является обоснованным поводом для мирного расставания.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, реальности и социальной цели</b><br><b>Суть:</b> Идеальное сочетание для социальной реализации. Человек ставит своей жизненной целью достижение непререкаемого статуса и абсолютной самостоятельности. Он готов брать на себя ответственность, но взамен требует полного подчинения от внешнего мира.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы и неформальных связей</b><br><b>Суть:</b> Иллюзорное представление о своем будущем. Человек наивно полагает, что в будущем все успокоится, он займет свой трон и будет править своей жизнью, никому не подчиняясь. «В будущем каждый занимает свое место, каждый становится императором в своей области». Жизнь, однако, часто ломает эту иллюзию по карте Влюбленные.`,
                    12: `<b>12 дом (Рыбы) — Сфера кармы, итогов и подсознательных страхов</b><br><b>Суть:</b> Тайный страх потерять власть и контроль. В одиночестве или изоляции человек может страдать от паранойи, что его империя рушится, а подданные (или обстоятельства) выходят из-под контроля. Его кармическая задача — понять, что истинная власть (Император) невозможна без внутреннего ангельского смирения (Умеренность). <b>Резюме:</b> Натальный Император описывает личность, чьим главным ресурсом является структурирующее сознание. Этот человек не живет эмоциями или слепыми инстинктами; он оценивает мир через призму эффективности, иерархии и целесообразности. Его главная сила — умение навести порядок и защитить свои границы, а главная проблема — риск превратиться в сухого, эгоистичного диктатора, не способного на компромиссы, совместность и духовную трансформацию.`
                }
            },
            5: {
                name: "Иерофант",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Иерофант</b> (в некоторых колодах Священник или Папа) является главной (внешней) картой <b>третьего дома</b> гороскопа (знак Близнецов, стихия Воздуха, планета Меркурий).<br><br>В отличие от Мага (первобытный инстинкт) или Влюбленных (личный, эмпирический опыт), Иерофант символизирует <b>норму, стандарт, правила, культуру и образование</b>. За этой картой стоит не индивидуальная личность, а социальная или природная программа, передаваемая «сверху» (от родителей, школы, социума).<br><br>Если мы рассматриваем Иерофанта как <b>натальное положение (базовую психологическую прошивку личности, аналог Асцендента)</b>, то перед нами человек-«отличник», консерватор и транслятор правил. Его базовый мотив — поступать «как положено», действовать по инструкции и вписываться в принятые нормы. Для него не существует спонтанного животного порыва; его инициатива всегда профильтрована через призму приличий и стандартов.<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Иерофанта во всех 12 домах гороскопа (жизненных сферах), где логика ситуативных раскладов перенесена на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой энергии и инициативы</b><br><b>Суть:</b> У человека отсутствует спонтанный животный импульс (Маг). Прежде чем проявить инициативу или заявить о своих желаниях, он обращается к внутреннему «своду правил». Его старт всегда обусловлен тем, «как положено» начинать дела. Это лишает его естественной пробивной силы, но страхует от грубых, необдуманных ошибок. Инициатива проявляется только тогда, когда на нее есть социальная или культурная санкция.`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов, комфорта и формы</b><br><b>Суть:</b> Человек выбирает материальные блага, форму тела и партнеров не по принципу природного влечения (Императрица), а по принципу соответствия стандартам. Он купит ту машину или выберет ту жену, которая считается «правильной» и «престижной» в его кругу. Его комфорт зависит от того, насколько его жизнь соответствует общепринятому шаблону успеха.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель (Своя среда)</b><br>Здесь базовая прошивка Иерофанта абсолютно гармонична и находится на своем месте. <b>Натальная суть:</b> Человек является идеальным носителем и транслятором правил своего социума. Он ведет себя абсолютно адекватно, культурно и понятно для окружающих. Его жизнь строится на усвоенных аксиомах. Он умеет грамотно применять на практике знания, которые ему дали. <b>Специфика:</b> В общении он лишен выпендрежа, он просто играет социальную роль (ученика, работника, родителя), строго соблюдая ее границы. <b>Теневая сторона (Перевернутая карта):</b> Если этот стержень искажен, человек становится носителем «ложных аксиом». Он впитывает искаженные социальные программы (например, воспитание улицы или секты) и выдает их за истину. В тяжелых случаях — это патологическая неспособность обучаться и усваивать нормы поведения.`,
                    4: `<b>4 дом (Рак) — Сфера семьи, корней и безопасности</b><br><b>Суть:</b> В интимной, домашней сфере человек не умеет расслабляться до конца. Его дом — это филиал школы или церкви. Эмоциональная близость подменяется соблюдением семейных традиций и ритуалов. Чувство безопасности достигается только тогда, когда все домочадцы ведут себя предсказуемо и «правильно». В негативе — это деспотичный родитель, который подавляет психику ребенка жесткими моральными догмами.`,
                    5: `<b>5 дом (Лев) — Сфера творчества, любви и эгоизма</b><br><b>Суть:</b> «Просвещенный актер». В любви и флирте такой человек не умеет быть непосредственно искренним (Сила). Он ухаживает по учебнику, старается блеснуть эрудицией и часто занимает позицию «учителя» по отношению к объекту влюбленности. Его творчество всегда академично и строго следует канонам жанра; он не создаст авангарда, но напишет идеальную классическую картину.`,
                    6: `<b>6 дом (Дева) — Вторая обитель (Подмена самоанализа шаблоном)</b><br>Шестой дом (Дева) также управляется Меркурием. Это зона детального анализа, повседневного труда и выбора образа жизни. Естественная внутренняя карта здесь — Отшельник (опора на себя). <b>Натальная суть:</b> Имея базу Иерофанта, человек в сфере рутины и здоровья руководствуется не собственным самочувствием или индивидуальным ритмом (Отшельник), а <b>внешними справочниками и авторитетами</b>. <b>Специфика:</b> Он будет лечиться строго по энциклопедии, выстраивать свой быт так, «как пишут в умных журналах». С одной стороны, это делает его прекрасным, методичным исполнителем. С другой — лишает его уникального жизненного пути, превращая его в биоробота, живущего по чужому расписанию.`,
                    7: `<b>7 дом (Весы) — Сфера брака и социального партнерства</b><br><b>Суть:</b> Брак воспринимается как строгий социальный институт. Романтика здесь вторична; первично — соблюдение ролей (жена должна варить борщ, муж должен приносить зарплату). Человек надежен, потому что чтит брачный договор, но с ним может быть невероятно скучно, так как любые отклонения от нормы в партнерстве жестко пресекаются.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, трансформации и сексуального результата</b><br><b>Суть:</b> В моменты экстремальных жизненных кризисов или в глубоком сексуальном контакте человек пытается опереться на инструкцию. Он боится потери контроля (которая неизбежна в 8-м доме) и пытается «зарегламентировать» экстрим. В сексуальной сфере это может давать зажатость, когда человек способен только на стандартные действия и паникует перед любым выходом за рамки «Камасутры».`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание (Неспособность к компромиссу)</b><br>Девятый дом требует расширения горизонтов, соблазна (Дьявол) и согласования своих интересов с интересами партнера. Иерофант здесь изгнан. <b>Натальная суть:</b> Вступая в отношения или сталкиваясь с чужой культурой, человек с прошивкой Иерофанта категорически <b>отказывается подстраиваться</b>. Вместо того чтобы искать общий язык (Дьявол), он начинает поучать партнера и навязывать ему свои стандарты. <b>Специфика:</b> Его логика: «Я нормальный, а если ты делаешь по-другому, значит, ты ненормальный». Он воспринимает любые отклонения от привычного ему сценария как патологию. Жить в браке с таким человеком тяжело, так как он постоянно выдвигает претензии от имени «морали» и «нормы», не учитывая индивидуальность супруга.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и ответственности</b><br><b>Суть:</b> Идеальное поле для Иерофанта. Человек строит карьеру, становясь непререкаемым экспертом, профессором, чиновником или классическим преподавателем. Он легко вписывается в любую бюрократическую или иерархическую систему, так как уважает субординацию и закон. Его цель — стать тем самым Авторитетом, который пишет правила для других.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы и неформальных связей</b><br><b>Суть:</b> В сфере непредсказуемого будущего и свободы Иерофант чувствует себя неуютно. Человек боится форс-мажоров и пытается планировать завтрашний день, опираясь исключительно на опыт прошлого. В компаниях друзей он часто берет на себя роль зануды-моралиста, который одергивает окружающих, призывая их к порядку, когда те пытаются выйти за рамки условностей. <b>Резюме:</b> Натальный Иерофант описывает личность, чьим главным ресурсом является знание алгоритмов и правил выживания в социуме. Этот человек — хранитель традиций и порядка. Его сильная сторона — надежность, предсказуемость и способность передавать знания. Его главная слабость — узость мышления, страх перед неизвестным, отсутствие животной спонтанности и склонность оценивать сложный, многогранный мир через примитивную черно-белую шкалу школьных оценок.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание и Падение (Игнорирование кармы и мистики)</b><br>Двенадцатый дом — сфера скрытых итогов, кармических последствий и невидимых результатов. Иерофант (Меркурий) здесь находится и в изгнании, и в падении. <b>Натальная суть (Изгнание):</b> Человек наивно и упрямо полагает, что если он совершает <b>стандартные действия</b>, то получит предсказуемый, <b>стандартный результат</b>. Он совершенно не чувствует мистики жизни, не понимает, что на него могут воздействовать скрытые кармические или психологические факторы. Он не видит уникальности ситуации, пытаясь измерить океан (Рыбы) школьной линейкой (Иерофант). <b>Натальная суть (Падение):</b> Падение Иерофанта в 12-м доме означает <b>отказ фиксировать конец процесса</b>. Человек не может осознать, что некий жизненный этап (или отношения) завершился. Для него «все продолжается как всегда», он живет в рутине, отрицая наступившие глобальные последствия. В негативе — это человек, который в ответ на ваши глубокие душевные порывы смотрит на вас «как врач или учитель», с абсолютным эмоциональным равнодушием, выдавая лишь дежурные инструкции.`
                }
            },
            6: {
                name: "Влюбленные",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Влюбленные</b> является внутренней (количественной и скрытой) картой <b>третьего дома</b> гороскопа (знак Близнецов, стихия Воздуха), которая управляется неоткрытой планетой <b>Прозерпиной</b>.<br><br>В отличие от внешней карты этого дома — Иерофанта, который символизирует стандартное, культурное поведение, заложенное воспитанием или обществом, <b>Влюбленные — это ваш собственный, уникальный эмпирический опыт и личная точка зрения</b>. Архетип этой карты связан с грехопадением и изгнанием из рая: человек отказывается от слепого послушания природным или социальным догмам ради самостоятельного познания. В колоде Манара эта карта изображает обнаженную женщину, позирующую художнику, что символизирует предельную откровенность и ожидание того, как партнер (художник) поймет вашу истинную суть.<br><br>Если рассматривать Влюбленных как <b>натальное положение (базовую психологическую прошивку личности, аналог Асцендента)</b>, то перед нами человек, чей главный жизненный мотив — абсолютная естественность, отсутствие навязанных комплексов и стремление проявлять себя таким, какой он есть. Его поведение диктуется не тем, «как положено», а тем, как он сам чувствует и понимает этот мир. Часто такой человек действует через демонстрацию своей уязвимости или «слабости», ожидая, что мир примет его без масок.<br><br>Ниже представлен детальный отчет о том, как базовая психология аркана Влюбленные проявляется во всех 12 домах гороскопа (сферах жизни).`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой энергии и инициативы</b><br><b>Суть:</b> Стартовый импульс такого человека лишен марсианской агрессии. Его главное оружие — демонстрация своей слабости или невозможности поступить иначе. Человек инициирует процессы, открыто заявляя о своих несовершенствах или дефицитах («я этого не могу», «у меня этого нет»), и именно эта обезоруживающая искренность заставляет внешний мир или партнера идти ему навстречу.`,
                    2: `<b>2 дом (Телец) — Сфера формы, ресурсов и комфорта</b><br><b>Суть:</b> Материальное потребление и выбор формы происходят не по общепринятым стандартам красоты или престижа (как у Иерофанта), а на основе сугубо личного, уникального вкуса. Человек формирует свое тело, стиль и материальный быт так, чтобы они отражали его внутреннее «Я». В негативе это может давать физиологические сбои, если человек пытается искусственно подогнать свою природу под чужие ожидания.`,
                    3: `<b>3 дом (Близнецы) — Первая обитель и Падение (Естественная среда)</b><br>Здесь Влюбленные находятся у себя дома. <b>Натальная суть (Обитель):</b> Человек обладает уникальной, только ему свойственной манерой общения и поведения, которую он ни у кого не заимствовал. Это предельная откровенность и обнаженность перед миром (как Адам и Ева). Он не развратен, он просто не имеет комплексов по поводу своей природы. <b>Специфика (Падение):</b> Прозерпина в 3-м доме вызывает падение. В позитивном (прямом) варианте это дает феноменальную способность действовать «с места в карьер» — человеку не нужна предварительная подготовка или долгое знакомство, он сразу может перейти к сути отношений. В негативном (перевернутом) варианте его нестандартность социум не принимает, его буквально «выгоняют из рая» (буллинг, отвержение коллективом) за то, что он слишком отличается от других.`,
                    4: `<b>4 дом (Рак) — Сфера семьи, корней и безопасности</b><br><b>Суть:</b> Дом и семья воспринимаются как единственное место, где можно снять все социальные маски и быть абсолютно «голым» и беззащитным. Если в родительской семье или в браке не принимают его личных особенностей, человек чувствует себя изгнанным. Его чувство базовой безопасности зависит от того, понята ли его истинная натура самыми близкими людьми.`,
                    5: `<b>5 дом (Лев) — Сфера любви, творчества и эгоизма</b><br><b>Суть:</b> В любви такой человек предельно искренен и не использует манипуляций. Он влюбляется «без кожи», демонстрируя объекту симпатии себя настоящего. Творчество для него — это акт самообнажения. В негативном варианте это может привести к чрезмерной уязвимости: показав себя настоящего и не получив отклика, человек получает тяжелейшую травму самолюбия.`,
                    6: `<b>6 дом (Дева) — Вторая обитель (Прагматичный самоанализ)</b><br>Дом рутины, служения, здоровья и детального выбора. <b>Натальная суть:</b> Поскольку Прозерпина (управитель Влюбленных) является хозяйкой Девы, здесь человек проявляет себя как идеальный аналитик самого себя. Прежде чем вступить в отношения, он детально изучает свою «обнаженную» суть: что он из себя представляет, каковы его истинные возможности и дефекты. Он выбирает партнера или образ жизни исключительно на основе своих глубоко личных, часто нестандартных предпочтений.`,
                    7: `<b>7 дом (Весы) — Сфера партнерства и открытых врагов</b><br><b>Суть:</b> Брак или партнерство воспринимается как зеркало (отсылка к Манаре). Партнер нужен такому человеку прежде всего для того, чтобы «нарисовать» его портрет — то есть понять, оценить и подтвердить его уникальность. Если партнер (художник) не способен увидеть и принять его истинную натуру, союз теряет смысл. Человек ждет от партнера не столько ресурсов, сколько глубокого понимания своей откровенности.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, трансформации и сексуального результата</b><br><b>Суть:</b> В кризисных, экстремальных или сексуальных ситуациях человек полностью отказывается от любых табу. Трансформация (Смерть) происходит через болезненный опыт столкновения своего «голого Я» с жесткими реалиями чужой энергетики. Сексуальный результат достигается только при условии абсолютной эмоциональной и физической откровенности; любая фальшь блокирует энергообмен.`,
                    9: `<b>9 дом (Стрелец) — Первое изгнание и Экзальтация (Проблема компромисса)</b><br>Девятый дом — сфера совместного будущего, компромиссов и идеологии пары (там властвует Дьявол/Юпитер). <b>Натальная суть (Изгнание):</b> Вступая в отношения, человек с прошивкой Влюбленных категорически не желает отказываться от своего субъективного мнения. Он отстаивает свою точку зрения («я так считаю», «это мой опыт»), игнорируя то, что для построения пары нужно подстраиваться под партнера. Это может привести к жестким идейным конфликтам. <b>Специфика (Экзальтация):</b> Экзальтация заставляет дом развиваться через кризис. Человек испытывает острую необходимость периодически поднимать в отношениях острые, конфликтные темы, в которых партнеры не согласны друг с другом. Он не может замалчивать разногласия, ему жизненно важно вытаскивать их на свет, иначе отношения потеряют для него смысл.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и долга</b><br><b>Суть:</b> Социальная реализация строится на личной уникальности. Человек не способен быть просто «винтиком» в корпоративной машине (как требует Козерог). Он достигает успеха только в том случае, если социум принимает его авторский, нестандартный подход. Если же система требует жесткого подчинения правилам, человек становится изгоем, так как не умеет носить социальные маски.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы и друзей</b><br><b>Суть:</b> Дружба для него — это высшая форма принятия его истинной природы. В планах на будущее человек ориентируется не на логику или расчет, а на свой эмпирический опыт. Он окружает себя людьми, перед которыми не нужно притворяться. Свобода для него — это право совершать свои собственные ошибки и нести за них ответственность, не оглядываясь на чужие советы. <b>Резюме:</b> Натальное положение аркана Влюбленные формирует личность, для которой высшей ценностью является право на собственную природу и собственный опыт. Это люди, которые не могут и не хотят жить по инструкциям. Их главная сила — обезоруживающая искренность и готовность быть уязвимыми. Их главная проблема — риск быть непонятыми и отвергнутыми обществом или партнером («изгнанными из рая») за то, что их естественность не вписывается в общепринятые рамки.`,
                    12: `<b>12 дом (Рыбы) — Второе изгнание (Удар по самооценке)</b><br>Сфера скрытых последствий, кармы и глубокой эмпатии. <b>Натальная суть:</b> Последствия действий окружающего мира человек воспринимает как удар по собственной природе. В отношениях, если партнер проявляет к нему холодность или безразличие (смотрит «как врач или гинеколог»), человек воспринимает это как глобальный приговор: «Во мне нет сексуальности, я дефектный, я не создан для этих отношений». <b>Специфика:</b> Любой негатив со стороны воспринимается не как вина партнера, а как собственная глубокая ущербность. Человек склонен брать вину на себя, считая, что он «в принципе не так все делает».`
                }
            },
            7: {
                name: "Колесница",
                general: `В астрологической системе Таро Юрия Хана старший аркан <b>Колесница</b> (знак Рака, стихия Воды, планета Луна) коренным образом отличается от классических трактовок, где ей приписывают стремительное движение и агрессивное завоевание. В этой системе Колесница — это самая пассивная, иньская карта, символизирующая <b>подсознание, базовую психическую безопасность, память, материнскую фигуру и защитный «панцирь»</b>. Возничий на карте вмурован в повозку, он не управляет движением напрямую; колесницу везут сфинксы (природные инстинкты). Главная метафора карты — это кинопроектор, прокручивающий заложенные в памяти старые, устойчивые программы.<br><br>Если рассматривать Колесницу как <b>натальное положение</b> (базовую «прошивку» личности, аналог Асцендента), перед нами человек, чей главный жизненный мотив — это <b>поиск абсолютной безопасности, сохранение своей интимной зоны комфорта и опора на прошлый опыт</b>. Это личность, которая действует на «автопилоте» подсознательных программ, панически боится новшеств, способных разрушить ее фундамент, и ожидает, что внешний мир (или партнер) возьмет на себя функцию опекающего родителя.<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Колесницы во всех 12 домах гороскопа, где логика ситуативных раскладов перенесена на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой инициативы и импульса</b><br><b>Суть:</b> Человек лишен естественного марсианского старта. Он не действует по принципу «я хочу и беру». Его инициатива полностью подчинена подсознательным страхам или инстинктам. Он ждет, когда внешние «сфинксы» (обстоятельства или другие люди) потянут его за собой. Действовать он начинает только тогда, когда чувствует угрозу своей безопасности, и его действие сводится к тому, чтобы спрятаться в панцирь.`,
                    2: `<b>2 дом (Телец) — Экзальтация (Жесткое моделирование формы)</b><br>Второй дом — это материя, ресурсы, форма отношений. Планета Луна здесь экзальтирует. <b>Натальная суть:</b> В отличие от расслабленной Звезды (которая принимает то, что дают), человек с экзальтированной Колесницей <b>жестко и сознательно моделирует образ того, что ему нужно для комфорта и безопасности</b>. У него есть железобетонная, заложенная в подсознание программа того, как должна выглядеть его жизнь, сколько у него должно быть денег и как должен вести себя партнер. <b>Теневая сторона:</b> Смертельная упертость. Человек не приемлет ничего, кроме своего выдуманного шаблона. Если реальность не совпадает с его ожиданиями, он отвергает ее полностью. Это классический сценарий старой девы, которая ждала идеального принца, прописанного в ее подсознании, и в итоге осталась ни с чем, так как переделать такую «консерву» невозможно.`,
                    3: `<b>3 дом (Близнецы) — Сфера общения, информации и обучения</b><br><b>Суть:</b> Крайне избирательный и интимный круг общения. Такой человек не любит поверхностных светских бесед. Он допускает к общению только тех, кто прошел проверку на безопасность. Любая новая информация фильтруется через призму прошлого опыта: человек усваивает только то, что не противоречит его устоявшимся внутренним программам.`,
                    4: `<b>4 дом (Рак) — Первая обитель (Естественная среда)</b><br>Здесь психология Колесницы находится в своей идеальной, родной среде. <b>Натальная суть:</b> Идеальное психическое здоровье и глубокая укорененность. Человек имеет устойчивый внутренний стержень, надежный тыл и крепкую связь с родом. Для него понятие «мой дом — моя крепость» абсолютно буквально. Он инстинктивно знает, что ему нужно для восстановления сил, и умеет вовремя «спрятаться в домик», чтобы отдохнуть и не тратить энергию. <b>Теневая сторона (Перевернутая карта):</b> Фундаментальные психические травмы, полученные в детстве. Искаженная реакция на мир, фобии, синдром «гадкого утенка» или изгнанника в собственной семье. Человек застрял в негативных родовых сценариях и не имеет внутреннего покоя.`,
                    5: `<b>5 дом (Лев) — Сфера творчества, игры и любви</b><br><b>Суть:</b> В сфере любви и страсти человек ищет успокоения. Столкнувшись с яркими эмоциями или новой влюбленностью, его психика пугается этого «пожара» и требует снизить градус напряжения. Человек бессознательно переводит любовника в статус «родственника» или сбегает в привычную домашнюю обстановку, чтобы успокоиться и переварить случившееся. Творчество такого человека глубоко интимно и часто питается воспоминаниями.`,
                    6: `<b>6 дом (Дева) — Сфера рутины, служения и здоровья</b><br><b>Суть:</b> Работа и быт воспринимаются как механизм обеспечения безопасности. Человек не ищет карьерных высот, ему важна стабильность рабочего места, где все предсказуемо и знакомо. В медицинском смысле здоровье такого человека тотально зависит от его психического состояния: любой выход из зоны комфорта моментально бьет по желудку, поджелудочной железе или женским органам (психосоматика).`,
                    7: `<b>7 дом (Весы) — Сфера партнерства и брака</b><br><b>Суть:</b> Человек ищет в браке не равноправного партнера, а фигуру «родителя» (чаще всего материнскую, опекающую). Брак воспринимается как способ залезть в защищенный танк, где за тебя будут принимать решения. Если партнер не обеспечивает абсолютной эмоциональной и физической безопасности, человек закрывается и отгораживается от него стеной непробиваемого молчания.`,
                    8: `<b>8 дом (Скорпион) — Падение (Отказ от трансформации)</b><br>Восьмой дом — сфера кризиса, экстрима, разрушения старого ради нового и сексуальных результатов. Луна (Колесница) здесь падает. <b>Натальная суть:</b> Попадая в зону, где нужно меняться и рисковать, человек включает мощнейшие механизмы защиты. Его главная жизненная цель в кризисе — <b>не приобрести что-то новое, а во что бы то ни стало сохранить старое и укрепить свой фундамент</b>. Человек категорически не склонен к переменам. Его логика: «пусть муж пьяница, зато свой, не буду разводиться, лишь бы не потерять то, что есть». <b>Теневая сторона:</b> Синдром «продажи души». Ради сохранения своего привычного болота и безопасности человек готов на деструктивные, самоубийственные шаги. Он использует неприкосновенный запас своей энергетики, лишь бы не трансформироваться, что в итоге приводит к полному внутреннему разрушению.`,
                    9: `<b>9 дом (Стрелец) — Сфера мировоззрения, идеологии и будущего</b><br><b>Суть:</b> Идеология человека глубоко традиционна, патриархальна или матриархальна. Он опирается на мудрость предков и родовые корни. При попытке спланировать будущее, он просто проецирует в него кадры из своего прошлого. Построение совместных планов с партнером упирается в то, что человек не готов рисковать ничем из своего настоящего ради иллюзорных перспектив.`,
                    10: `<b>10 дом (Козерог) — Первое изгнание (Столкновение с реальностью)</b><br>Десятый дом — сфера сурового социума, карьеры, объективной реальности и статуса. Луна здесь изгоняется Сатурном (Башня). <b>Натальная суть:</b> Человек пытается принести свои домашние, интимные привычки в суровый социальный мир. Его психика ригидна: сталкиваясь с внешними требованиями или необходимостью подстраиваться под партнера, он испытывает колоссальный стресс. В отношениях такой человек фиксируется на одной форме и не способен перестроиться (например, сравнивая всех новых партнеров со своим прошлым опытом). <b>Теневая сторона:</b> Полная неадекватность во внешнем мире. Человек настолько зажат в своих комплексах или прошлых воспоминаниях, что не способен выполнять социальные задачи. Страх перед социумом парализует его, заставляя уходить в глухую оборону.`,
                    11: `<b>11 дом (Водолей) — Сфера свободы, форс-мажоров и неформальных связей</b><br><b>Суть:</b> Столкнувшись с непредсказуемым будущим или свободой, человек фиксируется на привычном паттерне поведения. Это жесткая «фиксация позы», нежелание подстраиваться под новые изменчивые обстоятельства. В отношениях это может проигрываться как создание «запасного аэродрома»: человек может формально шагнуть в новую жизнь, но психологически отказывается выписываться из старой квартиры, сохраняя пути к отступлению.`,
                    12: `<b>12 дом (Рыбы) — Сфера кармы, тайн и скрытых итогов</b><br><b>Суть:</b> Результатом жизни такого человека становится глубокое погружение в свой внутренний мир. В позитиве — это обретение мощного дзен-буддийского спокойствия и защищенности, когда внешние бури больше не могут задеть психику. В негативе — это тяжелейшая психосоматика (вплоть до онкологии), которая является результатом того, что человек всю жизнь подавлял свои истинные импульсы ради сохранения иллюзорной безопасности, и эта нерешенная проблема в итоге съедает его изнутри. <b>Резюме:</b> Натальная энергетика Колесницы формирует личность-«консерватора», чья главная суперсила — это способность выживать за счет мощной связи со своими инстинктами и корнями. Это человек глубокой души, но чтобы до нее добраться, партнеру нужно преодолеть толстую броню недоверия. Главная ловушка такого положения — риск прожить всю жизнь в страхе перед миром, прокручивая в голове одни и те же старые фильмы, так и не решившись взять управление судьбой в свои руки.`
                }
            },
            8: {
                name: "Сила",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Сила</b> неразрывно связан с <b>пятым домом</b> гороскопа (знак Льва), управляется планетой <b>Солнце</b> и является символом перехода от бессознательного (животного) существования к формированию истинного человеческого Сознания и Личности,. Во многих других школах Сила идет под 11-м номером, но Юрий Хан, опираясь на астрологическую логику, жестко привязывает ее ко Льву (5-й дом).<br><br>В колоде Манара (и классическом Уэйте) эта карта изображает женщину, которая без агрессии, но с абсолютной уверенностью управляет могучим львом. Лев — это животная природа, страсть и инстинкты, а женщина — это пробудившееся сознание, которое берет эту природу под свой контроль, не подавляя ее, а направляя,.<br><br><b>Если мы рассматриваем Силу как натальное положение (базовую психологическую прошивку, аналог Асцендента во Льве или доминирующего архетипа)</b>, то перед нами человек, чьим главным жизненным мотивом является <b>«жажда жизни», творчество, игра, искренняя любовь и абсолютно естественное, бесстрашное проявление своего истинного «Я»</b>,. Это человек, который не прячет свою природу, не стесняется своих желаний и обладает колоссальным внутренним оптимизмом и харизмой.<br><br>Ниже представлен детальный отчет о том, как базовая энергетика натальной Силы (Солнца) проявляется во всех 12 домах гороскопа (сферах жизни), если перенести логику ситуативных раскладов на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Экзальтация (Истеричный импульс)</b><br>Первый дом — сфера базовой инициативы и энергии (Маг). Солнце здесь экзальтирует,. <b>Натальная суть:</b> Когда человеку нужно проявить стартовую инициативу или решить проблему, он делает это не через спокойный расчет (как Маг), а <b>на максимальном эмоциональном подъеме, на страсти, на азарте</b>,. <b>Специфика:</b> Человек врывается в любую новую ситуацию как суперзвезда. Для него начало любого дела — это вопрос личных амбиций и демонстрации своей смелости. <b>Теневая сторона:</b> Если энергии или уверенности не хватает (перевернутая экзальтация), человек вместо того, чтобы просто сделать дело, впадает в истерику: «У меня не получается, меня не ценят, я ничего не могу!». Вместо конструктивного решения проблемы происходит эмоциональный срыв, надрыв сил,.`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов и формы</b><br><b>Суть:</b> Отношение к деньгам и материи как к топливу для радости. Человек с натальной Силой легко расстается с деньгами («сила вытащить деньги из кошелька»), потому что с собой на тот свет их не заберешь. Он покупает вещи не для накопления, а для того, чтобы подчеркнуть свою яркость и статус. Любит роскошь и щедрые жесты.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации и повседневного общения</b><br><b>Суть:</b> В общении человек хочет блистать. Его коммуникация — это всегда немного театр. Он не просто передает информацию, он выражает через неё <i>себя</i>. Ему важно, чтобы его слушали с восхищением. В негативе — склонность перетягивать одеяло на себя в любом диалоге, хвастовство.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и базовой психики</b><br><b>Суть:</b> Мой дом — мой дворец. Чувство внутренней безопасности достигается только тогда, когда человек является непререкаемым авторитетом и центром внимания в собственной семье. Дети воспринимаются как продолжение собственного эго. Если дома его не ценят (не дают «солнечного» внимания), психика дает сбой, он становится истеричным тираном,.`,
                    5: `<b>5 дом (Лев) — Первая обитель (Естественная среда)</b><br>Здесь базовая прошивка Силы находится у себя дома. <b>Натальная суть:</b> Идеальная гармония между природными желаниями и сознанием. Человек живет по принципу: «Я делаю это, потому что мне это искренне нравится и приносит радость». Он умеет быть счастливым просто по факту своего существования,. Это творческая личность (в широком смысле слова), способная зажигать других своим внутренним светом и оптимизмом. <b>Специфика:</b> В любви такой человек предельно откровенен. Он принимает партнера целиком, со всеми его достоинствами и недостатками, потому что его чувство любви исходит изнутри, от избытка собственных душевных сил, а не из корысти. <b>Теневая сторона:</b> Эгоцентризм. При перекосе (перевернутая карта) человек превращается в эгоиста, который требует, чтобы мир вращался только вокруг него. Он потакает всем своим страстям, забывая об окружающих, что может привести к эмоциональному выгоранию или конфликтам с социумом.`,
                    6: `<b>6 дом (Дева) — Второе изгнание (Отторжение рутины)</b><br>Шестой дом — сфера методичного труда, здоровья и служения. <b>Натальная суть:</b> Скучная, детальная, повседневная работа воспринимается как убийство жизненной силы,. <b>Специфика:</b> Человек органически не переносит состояния «винтика в механизме». Если он не может проявить в работе свое творчество (5-й дом), он начинает болеть (психосоматика бьет по сердцу или спине). Чтобы нормально трудиться, ему нужно превратить работу в праздник или игру.`,
                    7: `<b>7 дом (Весы) — Падение (Отказ от своего "Я" ради партнера)</b><br>Седьмой дом — сфера брака, договоров и дипломатии. Солнце здесь падает,. <b>Натальная суть:</b> Вступая в парные отношения, человек вынужден <b>подавить свой эгоизм и свою самость</b>. В браке нельзя жить только по принципу «я хочу»; здесь нужно учитывать партнера (Справедливость). <b>Специфика:</b> Для человека с базой Силы это тяжелейшее испытание. Ему кажется, что партнерство стирает его уникальную личность. <b>Теневая сторона:</b> Полная потеря радости жизни в браке. Человек растворяется в партнере, забывает о своих талантах и интересах, превращаясь в бледную тень. Либо, наоборот, начинает отчаянно воевать с мужем/женой за право оставаться главным, разрушая союз.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, трансформации и секса</b><br><b>Суть:</b> Экстремальные ситуации человек пытается преодолеть за счет невероятной личной воли и жизненной силы. В сексе (8 дом) это страстный, доминирующий партнер, которому важен не только сам процесс, но и осознание своей магнетической власти над партнером. Риск здесь: неспособность глубоко трансформироваться (Смерть), потому что Эго (Солнце) сопротивляется изменениям, желая всегда оставаться «в белом пальто»,.`,
                    9: `<b>9 дом (Стрелец) — Сфера мировоззрения, идеологии и расширения</b><br><b>Суть:</b> Человек искренне верит, что его личная философия и есть истина в последней инстанции. Он становится харизматичным учителем, гуру, который заражает других своими идеями (Юпитер и Солнце родственны). В отношениях это ожидание того, что партнер будет относиться к нему как к царю/царице, боготворить его.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и долга</b><br><b>Суть:</b> Карьера строится исключительно на личной харизме и талантах. Такой человек не может быть серым исполнителем; он должен быть руководителем, режиссером, солистом. Социальный долг он воспринимает как почетную обязанность «светить» людям и опекать их, как великодушный монарх. При провале — тяжелейший удар по самолюбию, который может сломать личность. <b>Резюме:</b> Натальная прошивка по аркану Сила формирует человека, чьим главным ресурсом является <b>неиссякаемый божественный оптимизм, смелость быть собой и творческий потенциал</b>. Это «солнечные» люди, удерживающие своего внутреннего зверя в гармонии. Их главная задача — научиться светить не только для себя, но и для других, а их главная уязвимость — страх потерять свою исключительность при столкновении с суровой, обезличенной реальностью или в равноправном партнерстве.`,
                    11: `<b>11 дом (Водолей) — Первое изгнание (Потеря индивидуальности)</b><br>Одиннадцатый дом — это сфера коллектива, неформальных связей (друзей) и независимости. Солнце здесь изгоняется Ураном (Звездой). <b>Натальная суть:</b> Попадая в коллектив, человек с солнечной базой чувствует себя ущемленным. Ему жизненно важно быть «единственным и неповторимым» (Царем зверей), а одиннадцатый дом требует равенства, отстраненности и холодного дружеского взаимодействия,. <b>Специфика:</b> Приходится искусственно «гасить» свое сияние, чтобы не раздражать коллектив. Естественная эмоциональность и спонтанность Льва здесь неуместны; нужно включать интеллект и держать дистанцию,. <b>Теневая сторона (Снежная королева / Бунтарь):</b> Либо человек полностью замораживает свое сердце, превращаясь в циничного манипулятора, либо, протестуя против уравниловки, начинает вести себя асоциально, эпатажно, устраивая бунт ради бунта, лишь бы на него обратили внимание,.`,
                    12: `<b>12 дом (Рыбы) — Вторая обитель (Внутреннее Солнце)</b><br>Двенадцатый дом — сфера скрытых итогов, изоляции и кармы. Внутренняя карта 12-го дома — Солнце (управитель Юпитер),. <b>Натальная суть:</b> Глубокая, скрытая способность видеть смысл и позитив даже в самых тяжелых, кармических испытаниях. Это человек, который в изоляции (или в старости) сохраняет невероятный внутренний свет и способность радоваться мелочам,. <b>Специфика:</b> Если внешняя реальность рушится, этот человек черпает жизненную силу изнутри себя. Для него тайные, невидимые миру творческие процессы становятся главным ресурсом. <b>Теневая сторона (Самообман):</b> В негативе это уход в алкоголизм, зависимости, сектантство или мир иллюзий. Человек придумывает себе "солнечную" реальность там, где на самом деле мрак, и отказывается видеть объективные проблемы,.`
                }
            },
            9: {
                name: "Отшельник",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Отшельник</b> является внутренней (скрытой, качественной) картой <b>шестого дома</b> гороскопа (знак Девы, стихия Земли). Он управляется планетой Меркурий и выступает парой для внешней карты этого дома — Зеркала (Колеса Фортуны, планета Прозерпина).<br><br>Если рассматривать Отшельника как <b>натальное положение (базовую психологическую прошивку личности, аналог Асцендента)</b>, то перед нами человек, чьим главным жизненным мотивом является глубокий, прагматичный самоанализ, абсолютная самодостаточность, умение довольствоваться необходимым и жесткий контроль над своей животной природой,.<br><br>Объединенный образ этой карты из колод Уэйта (старец с фонарем на горе) и Манары (волк-оборотень, сидящий в одиночестве на берегу) дает сложный психологический портрет. В базе своей такой человек всегда держит дистанцию. Он освещает фонарем своего разума лишь узкую, практически полезную для него зону, отсекая все лишнее, и одновременно обладает колоссальной способностью к воздержанию — он умеет терпеть, выжидать и прятать своего внутреннего «зверя» (свои темные или агрессивные инстинкты) подальше от окружающих, чтобы не причинять им вреда и не нарушать собственный покой,.<br><br>Ниже представлен детальный отчет о проявлении натальной энергетики Отшельника во всех 12 домах гороскопа (жизненных сферах), где логика особых положений перенесена на глубинную структуру личности.`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой инициативы и жизненной силы</b><br><b>Суть:</b> Врожденный природный импульс (Маг) подавлен или строго фильтруется. Человек с Отшельником на Асценденте никогда не действует спонтанно. Прежде чем сделать первый шаг, он долго сидит в засаде, наблюдая за объектом своего интереса. Его инициатива рождается не из страсти, а из глубокого понимания: «Без этого действия я сейчас объективно не смогу обойтись».`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов, комфорта и формы</b><br><b>Суть:</b> Абсолютный аскетизм в потреблении. Человек выбирает материальные блага, форму тела и партнеров по принципу «необходимо и достаточно». Ему не нужна роскошь Императрицы; он возьмет ровно столько ресурсов (денег, еды, энергии партнера), сколько нужно для поддержания жизни, жестко подавляя в себе жадность или потребительский инстинкт.`,
                    3: `<b>3 дом (Близнецы) — Вторая обитель (Скрытность в общении)</b><br>Третий дом — сфера повседневного общения, информации и контактов. <b>Натальная суть:</b> Поскольку Близнецами также управляет Меркурий, Отшельник здесь чувствует себя уверенно, но специфически. Человек в повседневном общении никогда не раскрывается до конца. <b>Специфика:</b> Его коммуникация строго дозирована. Он использует свой внутренний фонарь, чтобы показать собеседнику только свои социально приемлемые, светлые стороны, тщательно скрывая в темноте свои недостатки или своего внутреннего «оборотня». В негативном варианте это дает угрюмого интроверта, который настолько погружен в свои мысли, что с ним просто невозможно разговаривать — он физически присутствует в толпе, но энергетически сидит один на горе,.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и психики</b><br><b>Суть:</b> Базовое чувство безопасности достигается только в условиях тотальной изоляции. Мой дом — это не просто крепость, это глухой лес или высокая гора, куда нет доступа никому. В семье такой человек часто выполняет роль молчаливого наблюдателя, который прячет свои истинные эмоции от домочадцев, чтобы не пугать их своими внутренними демонами.`,
                    5: `<b>5 дом (Лев) — Сфера любви, творчества и эгоизма</b><br><b>Суть:</b> В зоне влюбленности и игры (где должно сиять Солнце и бушевать Сила) Отшельник выступает как жесточайший цензор. Человек искусственно гасит свои эмоции. Столкнувшись с объектом страсти (купающимися женщинами), он не бросается в пучину романа, а остается на берегу, сублимируя свою животную тягу в философию, творчество или молчаливое наблюдение. Он боится, что его «солнце» обожжет других.`,
                    6: `<b>6 дом (Дева) — Первая внутренняя обитель (Естественная среда)</b><br>Здесь базовая прошивка Отшельника находится на своем законном месте и проявляется максимально гармонично. <b>Натальная суть:</b> Человек обладает идеальным механизмом самоанализа. Он трезво оценивает себя: свои сильные стороны, свои недостатки и свои реальные потребности. Он точно знает, что ему необходимо и достаточно для жизни, отсекая всю «шелуху». <b>Специфика:</b> В отношениях такой человек действует по принципу здоровой самодостаточности и терпения. Если его что-то не устраивает, он не бросается в истерику, а способен включить внутреннее воздержание, «загнать своего волка» подальше в лес и перетерпеть дискомфорт, не разрушая жизнь партнера,. Он работает над собой, освещая фонарем именно те свои качества, которые нужно исправить.`,
                    7: `<b>7 дом (Весы) — Сфера партнерства и договоренностей</b><br><b>Суть:</b> В браке человек выстраивает отношения на основе четкого дистанцирования. Для него идеальный союз — это когда партнеры не лезут в душу друг другу. Он готов нести ответственность, но требует неприкосновенности своей личной территории. Если партнер пытается нарушить границы и вывести его «волка» на свет, Отшельник просто замолкает и уходит в себя.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, трансформации и результатов</b><br><b>Суть:</b> Столкновение с экстримом или глубокой сексуальной трансформацией происходит в одиночку. Человек не умеет и не хочет просить помощи в кризисе. Свою внутреннюю боль, трансформацию или оргазмические переживания он проживает изолированно, направляя луч фонаря в самые темные уголки своей психики. Он выживает за счет невероятной способности к воздержанию и терпению боли,.`,
                    9: `<b>9 дом (Стрелец) — Второе изгнание (Отказ от совместного будущего)</b><br>Девятый дом требует расширения горизонтов, компромисса и создания совместного эгрегора пары (Дьявол). Отшельник здесь изгнан. <b>Натальная суть:</b> Личность категорически не способна на слияние целей с партнером. Базовая установка звучит так: «У меня свой путь, у тебя свой»,. <b>Специфика:</b> Человек отказывается выходить из своей зоны комфорта ради совместного будущего. При попытке обсудить перспективы брака или рождения детей, он включает жесткое воздержание и говорит: «Мне одному лучше, я не хочу нести совместную ответственность»,. Его внутренний зверь отказывается идти в упряжке с кем-либо, предпочитая одинокое созерцание берега.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и социальной ответственности</b><br><b>Суть:</b> Человек реализует свои социальные амбиции как одинокий специалист, уникальный мастер своего дела. Он не командный игрок и не карьерист в классическом смысле. Он достигает высот благодаря узкой, но невероятно глубокой специализации. Его статус в обществе — это статус мудреца, советника или исследователя, чья работа требует изоляции и сосредоточенности.`,
                    11: `<b>11 дом (Водолей) — Сфера будущего, свободы и друзей</b><br><b>Суть:</b> В зоне коллективов и неформальных связей человек выступает в роли стороннего наблюдателя. Его видение будущего строго индивидуально. Среди друзей он может присутствовать физически, но всегда остается вещью в себе. Его свобода заключается в праве в любой момент зажечь свой фонарь и уйти в ночь, ни перед кем не отчитываясь и не разделяя коллективных иллюзий. <b>Резюме:</b> Натальный Отшельник формирует личность со старым, мудрым, но крайне осторожным сознанием. Это человек, который боится навредить миру своей животной природой и поэтому выбирает путь самоконтроля, дистанции и точечного анализа. Его величайшая сила — это самодостаточность и умение довольствоваться малым. Его главная уязвимость — риск превратиться в оторванного от реальности мизантропа, не способного на полноценное слияние, сопереживание и совместное созидание с другими людьми.`,
                    12: `<b>12 дом (Рыбы) — Первое изгнание и Падение (Слепота к последствиям и эгоизм)</b><br>Двенадцатый дом — сфера скрытых кармических последствий, подведения итогов и растворения границ. Внутренний Меркурий (Отшельник) здесь изгнан и находится в падении. <b>Натальная суть:</b> Аналитический, точечный луч фонаря Отшельника не способен осветить бескрайний океан Рыб. Человек с такой базой страдает «туннельным зрением»: сталкиваясь с глобальными последствиями своих действий, он выхватывает из темноты только то, что выгодно ему, в упор игнорируя общую картину и реакцию окружающего мира. <b>Специфика:</b> В отношениях это проявляется как абсолютная глухота к партнеру. Человек сам все за себя решил, сам себя удовлетворил (как волк, которому никто не нужен), и ему совершенно не важна обратная связь от партнера,. Он отрицает необходимость совместного кармического опыта, заявляя: «Я и без тебя обойдусь, мне ничего от тебя не надо».`
                }
            },
            10: {
                name: "Колесо Фортуны",
