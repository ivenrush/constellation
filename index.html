                    7: `<b>7 дом (Весы) — Экзальтация (Гиперконтроль и комплексы в отношениях)</b><br>Седьмой дом — сфера брака и дипломатии. Сатурн (Луна) здесь экзальтирует. ** Вступая в парные отношения, человек испытывает колоссальное внутреннее напряжение. Партнерство воспринимается как минное поле, где нужно постоянно отслеживать каждое свое движение. ** Человек панически боится разоблачения своих недостатков перед партнером. Это комплексы по поводу своей внешности, поведения или сексуальности (метафора: «нельзя заниматься сексом при свете» или «страх, что кровать скрипит»). Женщина постоянно смотрится в зеркало партнера, мучительно решая, достаточно ли она хороша. Вся энергия уходит не на процесс любви, а на контроль над тем, как этот процесс выглядит со стороны.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, экстрима и трансформации</b><br>** Попадая в кризисные или экстремальные сексуальные ситуации, человек не теряет голову. Его «умный страх» спасает ему жизнь. Он импровизирует в экстриме, используя энергию стресса для выживания. В сексе он может использовать ролевые игры (карнавальный костюм), чтобы скрыть свои истинные комплексы, трансформируя свой страх близости в отрепетированное театральное действо.`,
                    9: `<b>9 дом (Стрелец) — Сфера мировоззрения, идеалов и совместного будущего</b><br>** При построении долгосрочных планов с партнером человек проявляет крайний скептицизм. Он не верит в безоблачные горизонты (Солнце еще не взошло). Его идеология: «надейся на лучшее, но готовься к худшему». Он постоянно взвешивает, насколько идеология партнера безопасна для его психики, и готов в любой момент отступить (сдать назад, как рак), если почувствует угрозу своим убеждениям.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и объективной реальности</b><br>** Социальная реализация строится на осторожном, пошаговом продвижении. Человек не лезет на рожон. Он делает карьеру, тонко улавливая политику начальства (импровизация). Он боится потерять свой социальный статус больше смерти, поэтому часто носит на работе жесткую «маску» (карнавальный наряд, неуместный для его мягкой души, но необходимый для выживания в корпоративном замке).`,
                    11: `<b>11 дом (Водолей) — Первая внутренняя обитель (Естественная среда)</b><br>Здесь базовая прошивка находится на своем законном месте. ** Человек идеально подготовлен к встрече с будущим. Столкнувшись с форс-мажором или необходимостью полностью изменить жизнь, он не впадает в истерику, а включает «умный страх». Он трезво оценивает: хватит ли у него сил дойти до «башен»? Сможет ли он пройти между «волком и собакой»? ** Он смотрится в зеркало своих возможностей и честно признается себе в своих дефицитах. В отношениях это идеальный, эмпатичный друг, который чувствует чужие границы и импровизирует на ходу, подстраиваясь под нужды партнера, не нарушая при этом свою собственную автономию.`,
                    12: `<b>12 дом (Рыбы) — Сфера скрытых итогов, кармы и тайн</b><br>** Сталкиваясь с неизбежными кармическими последствиями своих действий, человек погружается в глубокую рефлексию. Это время подведения итогов в одиночестве. Опасность здесь кроется в уходе в депрессию, меланхолию или мистицизм (страх перед «ведьминским часом»). В позитиве — это мощнейшая интуиция, способность предвидеть опасности и исцелять чужие душевные раны, используя свой собственный опыт преодоления мрака. <b>Резюме:</b> Натальная прошивка аркана Луна формирует личность со сложным, многоуровневым интеллектом, который постоянно борется с животными инстинктами. Это люди, чьим главным оружием является феноменальная способность к адаптации и «умная» осторожность. Их жизненная задача — не позволить внутренним комплексам, страху старения или социальному осуждению парализовать их волю, и научиться бесстрашно смотреть в зеркало своей души, проходя через самые темные жизненные сумерки к собственному рассвету.`
                }
            },
            20: {
                name: "Суд",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Суд</b> является главной, внешней (событийной) картой <b>двенадцатого дома</b> гороскопа (знак Рыб, стихия Воды) и управляется планетой <b>Нептун</b>,. Это одна из самых сложных и фатальных карт колоды, символизирующая завершение цикла и столкновение с необратимыми последствиями.<br><br>Для составления глубокого натального портрета (если рассматривать Суд как аналог Асцендента, базовую прошивку личности) необходимо синтезировать <b>три различных проявления этого аркана</b>, описанных в лекциях:<br><b>1. Избавление, кармический итог и смерть старого:</b> Суд отвечает на вопрос, от чего человек избавится, что безвозвратно уйдет из его жизни. В позитивном ключе это чудесное спасение, реанимация после глубокого кризиса, когда человек очищается от всего лишнего и переходит на новый виток спирали. В негативном — это абсолютный тупик, смерть (как метафорическая, так и буквальная) и полная потеря ресурсов,.<br><b>2. Остановка неадекватности и отрезвляющий блок:</b> Эта энергия выступает как жесткий предохранитель. Она блокирует заигравшегося в эгоизм человека, останавливая его действия из-за неотвратимых последствий для окружающих,. Это принудительное охлаждение, заставляющее осознать, что продолжение прежнего поведения смерти подобно.<br><b>3. Абсолютная пассивность, транс и слияние:</b> На поведенческом уровне (особенно в партнерстве) это полное растворение границ и воли. Человек входит в измененное состояние сознания, абсолютно пассивно принимая все, что с ним делают другие люди или обстоятельства, не сопротивляясь и отдаваясь потоку,,.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> В фундаменте психики такого человека неразрывно сплетены два архетипических образа: <b>восставшие из гробов люди, внимающие зову Ангела с небесной трубой (по Уэйту)</b>, и <b>абсолютно расслабленная, безвольно лежащая с раздвинутыми ногами женщина, принимающая любые действия партнера (по Манаре)</b>,.<br><br>Человек с такой базовой прошивкой живет в состоянии постоянной готовности к концу света или кармическому приговору. Его величайшая сила — это способность полностью отпустить контроль, довериться высшим силам (услышать трубу Ангела) и принять неизбежное, возродившись даже после самого тяжелого кризиса. В отношениях или социуме он не воюет и не доказывает свою правоту; он ложится в позу абсолютного принятия, позволяя внешнему миру или партнеру делать с ним все, что угодно, становясь идеальным зеркалом для чужой кармы,. Однако его главная уязвимость — риск превратиться в хроническую жертву, впасть в транс, алкогольную или психологическую кому, ожидая, что кто-то другой решит его проблемы, и принимая свою ментальную или социальную «смерть» как норму,,.<br><br>Ниже представлен детальный разбор проявления натальной энергетики Суда во всех 12 домах гороскопа (сферах жизни).`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой инициативы и жизненной силы</b><br>** Паралич автономной инициативы. Человек не способен начать дело просто потому, что «захотел». Его старт всегда обусловлен внешней, часто катастрофической необходимостью. Он начинает действовать только тогда, когда звучит труба Архангела — когда ситуация доведена до предела и старый образ действий окончательно умер. При этом в самом действии он пассивен (Манара), позволяя внешней силе вести себя через кризис.`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов, комфорта и формы</b><br>** Материальные блага и собственное тело воспринимаются как временная, кармически обусловленная оболочка. Человек не привязан к комфорту, он всегда внутренне готов всё потерять. Его ресурсы формируются по остаточному принципу: он принимает от мира то, что ему дают (поза абсолютной пассивности), не требуя большего. В негативе — тотальная нищета, жизнь в долгах и ощущение своего тела как «гроба», требующего постоянного исцеления.`,
                    3: `<b>3 дом (Близнецы) — Второе изгнание (Психология жертвы в общении)</b><br>Сфера коммуникации, обучения и повседневного окружения. ** В повседневном общении человек транслирует окружающим свою ущербность. Он всегда общается из позиции того, кто всё потерял. ** Он выступает в роли «восставшего из мертвых», который постоянно жалуется на тяжелую карму, прошлые лишения и невозможность нормальной жизни,. В позитивном ключе (прямая карта) это человек, который научился «фильтровать базар»: он вовремя замолкает (впадает в пассивность Манары), понимая, что лишнее слово может привести к фатальным последствиям, или общается как мудрец, переживший страшный кризис,.`,
                    4: `<b>4 дом (Рак) — Сфера корней, безопасности и психики</b><br>** Базовое чувство безопасности связано с темой изоляции, мистики или жертвенности. Дом для такого человека — это монастырь, больница или склеп, где он прячется от внешнего мира. Психика крайне восприимчива к родовым травмам; человек несет на себе груз кармы предков. Истинный покой он находит только в состоянии полного эмоционального растворения и отключения от реальности (медитация, сон или измененные состояния сознания).`,
                    5: `<b>5 дом (Лев) — Падение (Блокировка эго и транс в любви)</b><br>Сфера радости, сознательного эгоизма, творчества и влюбленности. Нептун здесь падает. ** Базовый инстинкт человека — блокировать свою спонтанную львиную радость и эгоизм. Столкнувшись с объектом любви, он теряет контроль над собой,,. ** Вместо того чтобы активно добиваться партнера, он впадает в измененное состояние (опьянение, транс) и позволяет делать с собой всё что угодно (Манара),. Это приводит к неконтролируемым последствиям (случайные залеты, связи «по пьяни»), когда человек не хотел начинать отношения, но просто сопереживал чужому желанию, сдавшись под давлением чужой воли (услышав чужую трубу).`,
                    6: `<b>6 дом (Дева) — Первое изгнание (Отказ от аналитики и рутины)</b><br>Сфера быта, здоровья, труда и методичного выбора. Нептун здесь изгнан. ** Базовая фаталистичность убивает способность к повседневному труду. Человек принципиально не хочет решать мелкие проблемы. ** Столкнувшись с болезнью или бытовым кризисом, он не идет к врачу и не чинит поломку, а ложится в позу жертвы (Манара), ожидая чудесного исцеления свыше (Уэйт). Его логика: «Если суждено умереть — умру, если Ангел спасет — выживу». Это катастрофический отказ от личной ответственности за свое здоровье и работу,.`,
                    7: `<b>7 дом (Весы) — Сфера партнерства и открытых договоров</b><br>** В браке или деловом союзе человек полностью стирает свои границы. Он не договаривается, он капитулирует. Это позиция тотальной жертвы, отдающей себя на милость партнера (Манара). Брак воспринимается как крест, кармическое отпевание личной свободы (Уэйт). Если партнер оказывается тираном, обладатель Суда будет безвольно терпеть, считая это заслуженным наказанием за прошлые жизни.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризиса, экстрима и трансформации</b><br>** Сталкиваясь со стрессом, болью или сексуальным взаимодействием, человек не борется. Экстрим для него — естественная среда обитания. В сексе он достигает катарсиса через полное исчезновение своего Эго, буквально умирая в процессе и перерождаясь. Он позволяет чужой энергии (Плутону) полностью разрушить его старые психологические блоки, воскресая после трансформации очищенным.`,
                    9: `<b>9 дом (Стрелец) — Вторая внутренняя обитель (Избавление через идеологию)</b><br>Сфера идеологии, авторитетов и совместного будущего. Нептун здесь второй (внутренний) управитель. ** Вступая в долгосрочные социальные или брачные отношения, человек ищет не приобретений, а избавления от старых страданий. ** Его привлекают идеологии или партнеры, обещающие спасение (труба Ангела). Он готов безропотно лечь под влияние гуру, религии или сильного супруга (покорность Манары), надеясь, что этот союз освободит его от прошлых грехов и нищеты. В негативе это слепое доверие, ведущее к тотальной потере себя в секте или деструктивном браке.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и объективной реальности</b><br>** Социальная реализация и карьера воспринимаются как тяжелый, кармический долг. Человек не строит амбициозных планов; его продвижение по службе часто связано с жертвенными профессиями (медицина, хосписы, секретные или режимные объекты). Его статус в обществе — это статус «воскресшего» или «отшельника», который служит миру, не требуя наград, пассивно принимая те должности и те удары судьбы, которые ниспосланы сверху.`,
                    11: `<b>11 дом (Водолей) — Экзальтация (Радикальное и неизбежное обновление)</b><br>Сфера свободы, будущего, форс-мажоров и интеллекта. Нептун здесь экзальтирует. ** Человек воспринимает свое будущее только через призму радикальных, кризисных обновлений. Для него шаг вперед возможен, только если старая жизнь разрушена до основания. ** Он сам провоцирует ситуации, где «промедление смерти подобно». Он сбрасывает с себя все старые социальные связи (выходит из гроба Уэйта голым) и отдается непредсказуемому потоку будущего (Манара). Это революционер собственной жизни, который понимает, что только через отсечение гниющего прошлого можно обрести истинную свободу.`,
                    12: `<b>12 дом (Рыбы) — Первая внешняя обитель (Естественная среда)</b><br>Здесь базовая прошивка находится на своем законном месте. ** Человек идеально понимает и принимает результаты своих кармических поступков. Столкнувшись с неизбежным итогом (крахом отношений или глубоким одиночеством), он не строит иллюзий. ** Он лежит в своем «гробу» старой жизни (Уэйт) и смиренно, без претензий, позволяет миру закончить этот этап (Манара). Для него это не катастрофа, а необходимая чистка перед началом нового цикла. Он умеет делать трезвые выводы из своих потерь, осознавая, что отжившее должно быть похоронено,.`
                }
            },
            21: {
                name: "Мир",
                general: `В системе астрологического Таро Юрия Хана старший аркан <b>Мир</b> занимает совершенно уникальное положение: он не входит в стандартный круг двадцати арканов, а вместе с Дураком образует кармическую ось, превращая плоский жизненный круг в развивающуюся спираль. Астрологически эта карта соответствует Восходящему лунному узлу, символизируя вектор будущего и предназначение.<br><br>Для формирования глубокого натального портрета (при рассмотрении Мира как базовой «прошивки» личности или аналога Асцендента) необходимо синтезировать <b>три фундаментальных проявления этого аркана</b>, выделяемых в лекциях:<br><b>1. Будущая карма и портал на новый уровень:</b> Мир символизирует ситуации, причина которых лежит не в прошлом опыте, а в будущем предназначении. Это «вступительный экзамен» на новый виток эволюции, когда обстоятельства сами открывают перед человеком двери, словно затягивая его в воронку новых возможностей.<br><b>2. Выход за пределы биологической программы (Самодостаточность):</b> Мир описывает сбой в стандартной животной матрице «родиться, размножиться, умереть». Человек учится обходиться без партнера в его классической функции, используя ресурсы всего мира для достижения своих целей, что делает его абсолютно независимым от социальных и гендерных стереотипов.<br><b>3. Абсолютное слияние и получение «карт-бланша» от Вселенной:</b> На высшем уровне это состояние «зеленого светофора», когда социум и природа дают полное одобрение на действия человека, потому что он смог гармонично вписаться в экосистему, не нарушая чужих границ. Это стадия формирования «андрогина» — идеального синтеза противоположностей, когда исчезают внутренние противоречия.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой Мира — это личность, рожденная с ощущением глобальной перспективы и внутренней целостности. В его фундаменте неразрывно сливаются образы <b>танцующей фигуры-андрогина с двумя жезлами, обрамленной космическим венком из четырех стихий (Уэйт)</b>, и <b>абсолютно свободной, раскованной женщины, использующей всю планету для своего полета (Манара)</b>. Этот человек не нуждается во внешнем дополнении для ощущения своей полноценности, он сам по себе — целая Вселенная. Он не борется с миром, а танцует с ним, интуитивно находя открытые порталы в будущее. Его сексуальность и социальная реализация оторваны от примитивных инстинктов: он строит отношения и карьеру не ради выживания, а ради перехода на новый уровень сознания. Главная сила такого человека — способность получать поддержку от Вселенной и быть самодостаточным творцом, а главная уязвимость (в перевернутом варианте) — страх перед будущим, цепляние за старые кармические долги и невозможность слиться с реальностью из-за ложного эгоизма.<br><br>Ниже представлен детальный анализ проявления этой космической натальной энергетики во всех 12 домах гороскопа (сферах жизни).`,
                houses: {
                    1: `<b>1 дом (Овен) — Естественная среда (Второй виток спирали)</b><br>Карта Мир исторически и символически располагается над первым домом, открывая новый круг зодиака. ** Базовая инициатива и личность человека не являются продуктом слепого марсианского инстинкта, они продиктованы зовом будущего. Человек буквально воспринимается окружающими как «привет из будущей жизни», гость из другого измерения, который сам по себе является порталом для новых возможностей. ** Вступая в любое начинание, он действует как совершенный андрогин, гармонично управляющий энергиями Вселенной (жезлы Уэйта) и не нуждающийся в чьей-либо опеке (самодостаточность Манары). Его старт в любом деле — это всегда прыжок на новый уровень, который приветствуется окружающим миром как нечто необходимое для глобальной эволюции. В негативе (перевернутый Мир) человек испытывает тотальный блок на проявление себя, так как закрытые кармические двери не пускают его в будущее. ### Логическая экстраполяция на остальные дома гороскопа Поскольку Мир — карта кармическая и внезодиакальная, ее появление в любой сфере жизни переводит эту сферу на уровень фатального, эволюционного развития.`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов, комфорта и потребления</b><br>** Материальные блага и собственное тело воспринимаются не как инструмент накопления, а как космический ресурс, принадлежащий Вселенной. Человек не испытывает нехватки в средствах, так как мир сам предоставляет ему всё необходимое (зеленый свет на материальное обеспечение). ** Он потребляет ресурсы с легкостью танцора, не привязываясь к вещам. Его физическая форма (тело) свободна от гендерных комплексов; он принимает свою природу целиком, используя свою сексуальность и материальный статус как трамплин для глобальных свершений, заменяя биологическую нужду в партнере способностью самостоятельно генерировать комфорт.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации, общения и повседневности</b><br>** В повседневных контактах этот человек — универсальный коммуникатор. Его слова и повседневные действия несут в себе заряд будущей кармы, они способны открывать двери для других людей. ** Он общается со всеми на равных, не разделяя собеседников по полу или статусу (андрогинность). Любая банальная беседа с ним может стать для собеседника «порталом» в новое понимание реальности (Уэйт). Он берет информацию из окружающего пространства (Манара), легко интегрируя чужой опыт в свою жизнь без конфликтов и споров.`,
                    4: `<b>4 дом (Рак) — Сфера семьи, корней и базовой безопасности</b><br>** Родной дом и семья для него — это не замкнутая капсула для защиты от врагов, а открытая экосистема. Его базовое чувство безопасности зиждется на абсолютном доверии к Вселенной. ** В родительской или собственной семье он стирает традиционные патриархальные или матриархальные границы, выполняя функции «и за папу, и за маму» без надрыва и усталости. Его внутренний мир — это венок стихий, в котором царит идеальный баланс. Если карта работает в негативе, человек чувствует себя чужим в собственном роду, так как его тянет в будущее, а семья пытается удержать его в кармическом прошлом.`,
                    5: `<b>5 дом (Лев) — Сфера любви, творчества, игры и эгоизма</b><br>** В сфере влюбленности и самовыражения человек достигает стадии божественного творца. Любовь для него — это не страсть и не потребление партнера, а процесс создания нового мира. ** Влюбляясь, он не теряет своей целостности. Он парит над условностями (Манара), предлагая партнеру войти вместе с ним в портал безусловного принятия (Уэйт). Его творчество всегда гениально и опережает время, так как продиктовано вектором Восходящего узла. Однако он может легко обойтись и без романтического партнера, так как его эгоизм сублимирован в глобальную любовь ко всему сущему.`,
                    6: `<b>6 дом (Дева) — Сфера рутины, служения, труда и здоровья</b><br>** Рутинная работа воспринимается как священнодействие и служение эволюции. Человек не делит труд на «свой» и «чужой», он трудится на благо всей системы. ** Выполняя повседневные обязанности, он гармонизирует пространство вокруг себя (венок Уэйта). К своему здоровью он относится целостно, понимая связи психосоматики. В работе он самодостаточен (Манара) и способен заменить собой целый коллектив, выполняя функции разных специалистов с абсолютной виртуозностью и получая за это поддержку социума.`,
                    7: `<b>7 дом (Весы) — Сфера партнерства, брака и открытых врагов</b><br>** Брак для такого человека возможен только как союз двух абсолютно целостных, сформировавшихся личностей. Здесь нет созависимости, страха одиночества или попыток переделать друг друга. ** Партнерство — это слияние в единого андрогина (Уэйт), где каждый берет на себя любые роли без гендерных предрассудков. Пара получает «карт-бланш» от общества (зеленый светофор), их союз считается идеальным и открывает перед ними новые горизонты. Если же отношения изжили себя, человек (как на карте Манара) легко и с благодарностью выходит из них, используя полученный опыт для дальнейшего полета.`,
                    8: `<b>8 дом (Скорпион) — Сфера кризисов, трансформаций и чужих ресурсов</b><br>** Уникальное отношение к кризисам и смерти. Человек воспринимает любую трансформацию не как катастрофу, а как необходимый вступительный экзамен в новую жизнь. ** В экстремальных ситуациях или в глубоком сексуальном слиянии он способен достичь полного катарсиса, проходя сквозь страхи как сквозь открытые ворота (портал Уэйта). Сексуальная энергия используется им (Манара) не для поглощения партнера, а для космического расширения сознания. Универсальность его психики позволяет ему выживать и адаптироваться в любых катастрофах.`,
                    9: `<b>9 дом (Стрелец) — Сфера мировоззрения, идеалов и совместного будущего</b><br>** Идеология человека носит глобальный, космополитичный характер. Он не признает узких религиозных или социальных догм, его религия — это законы самой Вселенной. ** При планировании будущего он не строит иллюзий (Дьявол), а ясно видит открытые пути, по которым его ведет судьба. Он выступает в роли просветителя, который своим танцем (Уэйт) и своей внутренней свободой (Манара) показывает другим людям, как можно жить вне матричных ограничений, опираясь на чистую духовную целостность.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и объективной реальности</b><br>** Достижение целей и карьерный рост происходят без насилия над собой и миром. Социум сам предлагает человеку высочайшие посты, так как его действия объективно необходимы для развития общества. ** В профессиональной сфере он становится абсолютным мастером. Он покоряет объективную реальность, используя весь мировой арсенал средств (Манара), и при этом мир не рушится (Башня), а наоборот, поддерживает его. Его статус — это статус человека, который перерос узкопрофессиональные рамки и стал фигурой глобального масштаба.`,
                    11: `<b>11 дом (Водолей) — Сфера свободы, друзей и форс-мажоров</b><br>** Абсолютная свобода как естественное состояние. Будущее не пугает человека, потому что он сам является его архитектором. Форс-мажоры воспринимаются как попутный ветер. ** В кругу друзей и единомышленников он не растворяется, а выступает катализатором эволюции. Он свободен от кармических долгов (прошлого), поэтому легко рвет отжившие связи и входит в порталы новых неформальных сообществ (Уэйт). Его эксцентричность и независимость (Манара) принимаются обществом как проявление гениальности, а не как сумасшествие.`,
                    12: `<b>12 дом (Рыбы) — Сфера тайн, итогов, скрытой кармы и изоляции</b><br>** Одиночество и изоляция для такого человека — это высшая форма наполненности. Он не чувствует себя брошенным, так как ощущает непрерывную связь с мирозданием. ** Подводя итоги жизни, он не испытывает сожалений. Все кармические экзамены сданы (суд пройден), и он стоит на пороге абсолютного освобождения (Уэйт). Вдали от социальной суеты он черпает силы из единого энергоинформационного поля планеты (Манара), осознавая, что финал любого процесса — это лишь подготовка к новому, еще более совершенному танцу на следующем витке спирали.`
                }
            },
            22: {
                name: "Шут",
                general: `В астрологической системе Таро Юрия Хана старший аркан <b>Шут (или Дурак)</b> занимает совершенно особое, внезодиакальное положение. Он не входит в стандартный круг двадцати арканов, а располагается «под» двенадцатым домом, символизируя переход между циклами и образуя вместе с арканом Мир кармическую спираль развития. Астрологически этот аркан соответствует <b>Заходящему лунному узлу</b> — вектору прошлой кармы и накопленного багажа.<br><br>Чтобы сформировать глубокий натальный портрет личности (если рассматривать Шута как базовую прошивку, аналог Асцендента), необходимо синтезировать <b>три фундаментальных проявления этого аркана</b>, которые выделяются в текстах:<br><b>1. Прошлая карма и неосознанный багаж (Причинно-следственная пустота):</b> Шут символизирует ситуации, причина которых скрыта в прошлом (возможно, в прошлых жизнях или забытом опыте). Человек действует вслепую, опираясь на автоматические, неосознанные паттерны. В негативе это «провал» и пустота, когда человек лезет туда, чего не знает, не предполагая последствий.<br><b>2. Животная матрица и роль марионетки (Слепое подчинение):</b> На уровне природных инстинктов это абсолютная покорность физиологической программе. Человек выступает как биоробот или инструмент в чужих руках, которым манипулируют ради выживания или размножения, лишая его собственной воли.<br><b>3. Самость, сознательное смирение и шаг в неизвестность:</b> На высшем уровне происходит разделение понятий: «Дурак» — это слепое, фатальное неведение, а «Шут» — это высшая Самость. Это способность осознанно принять свою ограниченность, добровольно шагнуть в пропасть (отказаться от старого) и довериться Высшим силам для перехода на новый виток развития.<br><b>Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой Шута — это личность, чья жизнь управляется глубокими, часто неосознаваемыми кармическими течениями. В его фундаменте сливаются два неразделимых образа: <b>юноша, беззаботно шагающий в пропасть под лай собаки (по Уэйту)</b>, и <b>деревянная кукла Буратино, которой полностью управляет Мальвина (по Манаре)</b>. Такой человек не опирается на трезвый расчет. Его суперсила — это колоссальное доверие к потоку жизни и способность обнуляться, совершая квантовые скачки развития через добровольное смирение (Самость). Его главная уязвимость — риск превратиться в безвольную марионетку, которая слепо обслуживает чужие инстинкты (природы или партнера), повторяет одни и те же роковые ошибки и падает в кармическую пропасть из-за банального неведения и инфантилизма.<br><br>Любое попадание Шута в дом делает эту сферу жизни <b>кармической, лишенной стандартных астрологических достоинств (обителей или изгнаний)</b>, но требующей максимального внимания, так как здесь нет страховки. Ниже представлен детальный разбор проявления этой энергетики во всех 12 домах гороскопа (жизненных сферах).`,
                houses: {
                    1: `<b>1 дом (Овен) — Сфера базовой инициативы и импульса</b><br>** Инициатива человека лишена эгоистичной агрессии Мага. Он начинает новые дела абсолютно непредвзято, словно с чистого листа. Его стартовый импульс продиктован древними кармическими накоплениями. Он не задумывается о последствиях, шагая в новые проекты с улыбкой на лице (Уэйт), часто позволяя обстоятельствам или сильным партнерам руководить своим стартом (Манара). В негативе это старт, обреченный на провал из-за полного отсутствия фундамента.`,
                    2: `<b>2 дом (Телец) — Сфера ресурсов, формы и комфорта</b><br>** Абсолютное отсутствие привязанности к материи. Деньги и ресурсы приходят и уходят кармическими путями. Человек не умеет копить; его финансовая жизнь — это хождение по краю пропасти (Уэйт). Свое тело и ресурсы он может бездумно отдавать в пользование другим людям, позволяя им дергать за ниточки своего комфорта (Манара). В позитиве — это феноменальное доверие Вселенной, которая всегда обеспечивает его пропитанием в самый последний момент.`,
                    3: `<b>3 дом (Близнецы) — Сфера информации, общения и повседневности</b><br>** В общении это классический архетип Трикстера (Шута). Человек говорит правду, которая не фильтруется социальными нормами, часто выступая рупором бессознательного. Его повседневная жизнь хаотична. Он вступает в контакты без задней мысли, легкомысленно доверяясь собеседникам (Манара), из-за чего часто сбалтывает лишнее и попадает в коммуникативные «пропасти» (Уэйт).`,
                    4: `<b>4 дом (Рак) — Точка фатальности для социального человека</b><br>** В круге социальной жизни (начинающемся со Стрельца) Шут попадает в 4 дом. Это бунт против системы, нарушение уставов и родительских (или государственных) предписаний ради сиюминутного желания. ** Это метафорическая «самоволка» солдата, который влюбился и бросил пост. Человек отрывается от безопасного фундамента, отрезает ниточки, за которые его держит общество (Мальвина из Манары), и шагает в социальную пропасть (Уэйт). Базовое чувство безопасности для него — это иллюзия, так как его корни всегда находятся над пустотой.`,
                    5: `<b>5 дом (Лев) — Сфера любви, творчества и эгоизма</b><br>** Влюбленность для такого человека — это всегда кармическое наваждение, падение в омут с головой. Он не способен трезво оценивать объект страсти. В любви он становится послушной деревянной куклой в руках возлюбленного (Манара), отказываясь от собственного Эго. Его творчество гениально, но не принадлежит ему — он лишь канал для высших сил, шагающий за пределы логики (Уэйт).`,
                    6: `<b>6 дом (Дева) — Сфера рутины, служения и здоровья</b><br>** Неспособность к методичному, скучному труду. Человек выполняет свои обязанности либо по наитию, либо абсолютно механически, как запрограммированный биоробот (Манара). К своему здоровью относится с фатальной беспечностью (собака лает, а он идет к обрыву по Уэйту). В работе он часто совершает непредсказуемые поступки, из-за чего может внезапно потерять место, если не научится слушать «предупреждения» организма и коллег.`,
                    7: `<b>7 дом (Весы) — Сфера партнерства и договоров</b><br>** Брак и партнерство строятся на тотальной зависимости и кармических долгах. Человек не выбирает партнера сознательно; его судьба сводит с теми, кому он должен отдать долг из прошлого. В союзе он занимает абсолютно ведомую позицию, отдавая управление своей жизнью супругу (Мальвине из Манары). Если аркан перевернут, любой заключенный договор ведет в пустоту, а отношения заранее обречены на провал, так как у них нет объективного фундамента (Уэйт).`,
                    8: `<b>8 дом (Скорпион) — Точка фатальности для сознательной личности</b><br>** Если человек живет осознанно (круг начинается со Льва), Шут смещается в 8 дом. Максимальная опасность исходит не извне, а от его собственных, сознательных, но ошибочных решений. ** Человек сам, по доброй воле, шагает в пропасть кризиса (Уэйт), понимая, что его туда никто не толкал. Он осознает, что позволил кому-то манипулировать собой (Манара) из-за собственной самонадеянности. В этой сфере он несет полную ответственность за свой «прыжок», и именно здесь он может совершить величайшую трансформацию, если признает свою ошибку.`,
                    9: `<b>9 дом (Стрелец) — Сфера мировоззрения, идеалов и совместного будущего</b><br>** Мировоззрение такого человека формируется не книгами, а слепой верой в предначертанное. При планировании будущего он не опирается на опыт. Он готов идти за любым идеологом, который потянет его за ниточки (Манара). Это слепой фанатизм или, напротив, истинное духовное паломничество, когда человек делает шаг веры в невидимое будущее (Уэйт), отвергая все догмы ради чистого духовного опыта.`,
                    10: `<b>10 дом (Козерог) — Сфера карьеры, статуса и объективной реальности</b><br>** Социальная реализация не поддается логике. Карьерный рост происходит случайно, по воле кармы. Человек может взлететь на вершину, будучи марионеткой в руках могущественных покровителей (Манара), и точно так же внезапно рухнуть вниз, если потеряет связь с реальностью и шагнет с карьерного обрыва (Уэйт). Статус для него — пустой звук, он относится к объективной реальности с шутовской иронией.`,
                    11: `<b>11 дом (Водолей) — Сфера свободы, неформальных связей и форс-мажоров</b><br>** Понятие свободы доведено до абсолюта, граничащего с безумием. В поисках независимости человек отрывается от всех земных привязанностей, шагая в полную пустоту (Уэйт). В кругу друзей он играет роль юродивого, чьи поступки шокируют, но вскрывают истину. Риск здесь заключается в том, что, пытаясь избежать любых обязательств, он становится рабом собственной непредсказуемости, превращаясь в куклу, дергаемую хаосом (Манара). <b>Резюме:</b> Натальная прошивка Шута наделяет человека удивительной способностью жить вне рамок и шаблонов. Его главная миссия — научиться отличать слепую марионеточную покорность животным или социальным инстинктам (Дурак) от высшего состояния Самости (Шут), при котором шаг в неизвестность становится не актом глупости, а актом величайшего космического доверия и инструментом перехода на новый эволюционный уровень.`,
                    12: `<b>12 дом (Рыбы) — Точка фатальности для биологического человека</b><br>** Для обывателя, живущего инстинктами, Шут находится под 12 домом. Это сфера тотальной зависимости от внешнего мира и последствий, которые человек не контролирует. ** Встречаясь с неизбежностью, человек действует как Буратино, которым управляет невидимый рок (Манара). Он делает шаг в пропасть (Уэйт), искренне веря, что в его бедах виновата «злая карма» или окружающие. Жизненные итоги воспринимаются как внешняя данность. Если аркан проработан, человек принимает этот финал как необходимую очистку перед новым рождением.`
                }
            },
            33: {
                name: "Паж Жезлов",
                general: `### Общее<br><br>В системе астрологического Таро Юрия Хана <b>Паж жезлов</b> (в колоде Манара — Паж огня) олицетворяет социальную роль, основанную на демонстрации личной силы, потенции и готовности к действию. Это образ человека, у которого, кроме собственной энергии, пока ничего нет — ни материальной базы, ни сложного социального статуса.<br><br>### 1 дом (Овен) — Статус: Первая интровертная обитель<br><br>Это самое естественное и гармоничное положение для данной карты.<br><br><b>Суть:</b> Заявление «Я могу». Человек открыто демонстрирует свою готовность включиться в процесс, как только у него появятся силы. Он поглощен собственной задачей и не оглядывается на окружающих.<br><br><b>Внутренний круг:</b> Субъективная готовность клиента действовать; наличие энергии для реализации планов.<br><br><b>Внешний круг:</b> Ситуация требует от клиента роли лидера или первопроходца; всё зависит исключительно от его инициативы.<br><br><b>Негатив (Перевернутая):</b> Усвоенная роль беспомощности («я не могу»), часто навязанная воспитанием. Также может означать несвоевременное начало действий без должной подготовки.<br><br><b>Манара (Паж огня):</b> Статус «одиночки». Человек позиционирует себя как личность, не задействованную в отношениях, даже если состоит в браке.<br><br>### 2 дом (Телец) — Статус: Второе изгнание<br><br>Здесь энергия жезлов (идей) заменяет пассивную форму земли.<br><br><b>Суть:</b> Ситуация, когда материальное обеспечение напрямую зависит от личной активности («как потопаешь, так и полопаешь»). Это состояние «кредита»: чтобы что-то получить, нужно вложить свою энергию.<br><br><b>Проявление:</b> Готовность потратить свои ресурсы (время, силы) для решения проблем.<br><br><b>Негатив:</b> У человека нет средств или качеств, необходимых для того, чтобы «мочь». Отказ от активного участия из-за ощущения материальной или физической недостаточности.<br><br>### 3 дом (Близнецы) — Статус: Проявление культуры поведения<br><br><b>Суть:</b> Демонстрация своей «нормальности» и естественного поведения.<br><br><b>Проявление:</b> Прямое и простое общение. Человек ведет себя как «ученик», собирающий информацию, прежде чем начать действовать.<br><br><b>Негатив:</b> Неумение соизмерять свои силы в контактах. По поговорке Ю. Хана: «руки из жопы» — полная неспособность к обучению или адекватному действию из-за фанатичной зацикленности на своих идеях.<br><br>### 4 дом (Рак) — Статус: Переходная роль<br><br>Здесь Паж жезлов выступает как «младенец», нуждающийся в защите.<br><br><b>Суть:</b> Поиск безопасности и «крыши».<br><br><b>Проявление:</b> Роль открытости и доверия к тому, кого впустили в свой дом. Человек может играть роль «гостя» или защищаемого.<br><br><b>Негатив:</b> Инфантилизм, нахлебничество. Человек нашел покровителя и перестал заботиться о собственной защите.<br><br>### 5 дом (Лев) — Статус: Творческий импульс<br><br><b>Суть:</b> Желание творить и развлекаться по собственному усмотрению.<br><br><b>Проявление:</b> Подростковое поведение, азарт, искреннее «хочу». В вопросах деторождения — сознательное желание иметь детей (не просто инстинкт).<br><br><b>Негатив:</b> Бессмысленная трата энергии, «валяние дурака» без результата. Эгоцентризм, игнорирование интересов других ради своей игры.<br><br>### 6 дом (Дева) — Статус: Роль работника<br><br><b>Суть:</b> Демонстрация навыков и специализации.<br><br><b>Проявление:</b> Роль помощника или младшего специалиста.<br><br><b>Негатив:</b> Плохой работник, отсутствие навыков, за которые готовы платить. В вопросах здоровья — игнорирование проблем организма из-за иллюзии, что «тело еще молодое и всё выдержит».<br><br>### 7 дом (Весы) — Статус: Первое изгнание.<br><br>Активность 1-го дома здесь подавляется необходимостью партнерства.<br><br><b>Суть:</b> Ограничение своей инициативы ради связи с другим. <b>Я могу за двоих / Игнорирование партнера</b><br><br><b>Проявление:</b> Признание того, что «один в поле не воин». Человек заявляет партнеру: «я могу сделать только то, что могу» (например, отмена встречи из-за усталости).<br><br><b>Негатив:</b> Демонстрация того, что партнер не важен. «Я сам по себе», отказ от обязательств.<br><br>### 8 дом (Скорпион) — Статус: Вторая обитель<br><br>Направление личной силы на нужды партнера.<br><br><b>Суть:</b> Получение результата через экстремальное напряжение или секс.<br><br><b>Проявление:</b> Способность «оплодотворить» ситуацию (или буквально женщину) и сразу быть готовым к новому циклу.<br><br><b>Негатив:</b> В деструктивном варианте — «черная дыра», когда энергия тратится на разрушение себя или отношений.<br><br>### 9 дом (Стрелец) — Статус: Социальное миссионерство<br><br><b>Суть:</b> Демонстрация своего авторитета и взглядов во внешнем мире.<br><br><b>Проявление:</b> Роль «проповедника» своих идей, поиск последователей.<br><br><b>Негатив:</b> Навязывание своего мнения без учета реальности. Либо роль «социального барана», который слепо следует за чужой идеологией, не имея своей.<br><br>### 10 дом (Козерог) — Статус: Экзальтация<br><br>Объективная необходимость продемонстрировать свои силы коллективу.<br><br><b>Суть:</b> Ситуация «пятнадцатилетнего капитана» — молодая энергия в условиях жесткой ответственности.<br><br><b>Проявление:</b> Честное заявление о наличии (или отсутствии) ресурсов для выполнения задачи.<br><br><b>Негатив:</b> Имитация деятельности или фальшивая демонстрация усталости («сачкование»), чтобы избежать ответственности.<br><br>### 11 дом (Водолей) — Статус: Интеллектуальная свобода<br><br><b>Суть:</b> Планирование будущего на основе личных, нестандартных решений.<br><br><b>Проявление:</b> Роль друга или независимой личности.<br><br><b>Негатив:</b> Асоциальное поведение, бунт ради бунта.<br><br>### 12 дом (Рыбы) — Статус: Жертвенность или Карма<br><br><b>Суть:</b> Последствия проявленной ранее инициативы.<br><br><b>Проявление:</b> Принятие своей миссии или «кармического долга» без лишних вопросов.<br><br><b>Негатив:</b> Ощущение себя «пушечным мясом», которое использовали и выбросили. Полная потеря индивидуальности под давлением обстоятельств.<br><br><b>Резюме:</b> Паж жезлов — это всегда <b>энергетический маркер</b>. В домах Обители (1, 8) он дает силу, в домах Изгнания (2, 7) — требует вложений или ограничивает, в доме Экзальтации (10) — создает напряжение ответственности, а в домах Падения (4) — указывает на уязвимость.`,

            34: {
                name: "Рыцарь Жезлов",
                general: `В астрологической системе Таро Юрия Хана фигурные карты описывают социальные роли и шаблоны поведения, которые человек принимает в ответ на требования среды или собственных амбиций. Младший аркан <b>Рыцарь жезлов (Всадница Огня в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, жестко привязан к пятому дому (знак Льва) и управляется планетой <b>Солнце</b>.<br><br>Эта карта символизирует важнейший жизненный этап — юность, половое созревание, сепарацию от родительского дома и выход в самостоятельную жизнь, где начинают формироваться индивидуальное сознание и личные, ни от кого не зависящие желания.<br><br>Общая трактовка базовой социальной роли Рыцаря жезлов объединяет <b>четыре ключевые версии</b>, синтезирующие подходы Уэйта и Манары:<br><b>1. Искренний и неповторимый романтик (по Уэйту):</b> Роль любовника или ухажера, который делает что-то нестандартное, непрактичное, но исключительно свое. Его действия продиктованы личным порывом, а не социальными шаблонами. Главная ценность этого персонажа — искренность; он хочет чего-то индивидуального и действует по велению сердца, стремясь удивить партнера.<br><b>2. Безудержный подростковый бунт (в негативе):</b> Это инфантильное состояние, когда человек не хочет взрослеть, капризничает, валяет дурака и протестует против любых правил. Эгоизм, переполняющий личность, толкает ее скакать в любую сторону без раздумий о последствиях, что часто выливается в «ошибки молодости».<br><b>3. Тестирование мужской силы и страсти (по Манаре):</b> На карте Всадница Огня изображена женщина, оседлавшая вставшего на дыбы коня. В партнерских отношениях это период «обкатки» — медовый месяц, когда женщина (или партнер) страстно и без тормозов проверяет энергетический и сексуальный потенциал мужчины, выжимая из него всё, чтобы узнать, на что он способен, прежде чем переходить к серьезному быту.<br><b>4. Осознанное творческое самовыражение (Синтез):</b> В профессиональном и социальном плане это роль творца. Человеку платят не за рутинное выполнение инструкций, а за его уникальный креатив, за то, что он привносит в мир искру своей солнечной энергии, не похожую на действия других.<br>Поскольку Рыцарь жезлов управляется Солнцем, его особые положения распределены по астрологическим достоинствам этой планеты (Обитель во Льве и Раке, Изгнание в Водолее и Козероге, Экзальтация в Овне, Падение в Весах).`,
                houses: {
                    1: `<b>1 дом — Экзальтация. Форсированное желание смочь</b><br>Высшая точка напряжения для Солнца в зоне базовой инициативы (Овен). Здесь возникает гипертрофированное желание доказать свою состоятельность. Человек действует на надрыве, он не просто хочет что-то сделать, он обязан немедленно реализовать свой импульс. Это состояние дикого ажиотажа, когда личность вскакивает на коня, еще не зная точного направления, но сжигаемая нетерпением заявить о себе и решить проблему на голом энтузиазме.`,
                    2: `<b>2 дом — Спонтанное эгоистичное потребление</b><br>В сфере материальных накоплений, формы и тела энергия Рыцаря жезлов направляется на удовлетворение личных капризов. Ресурсы, деньги и физиологический потенциал партнера воспринимаются как игрушка или инструмент для получения ярких эмоций и удовольствий, без мыслей о практической выгоде или сохранении бюджета.`,
                    3: `<b>3 дом — Демонстративная яркая коммуникация</b><br>В повседневном общении человек использует слова для самовыражения и флирта. Это пылкие речи, серенады под окном и попытки поразить собеседника своей уникальностью. Контакт завязывается не ради обмена полезной информацией, а ради того, чтобы покрасоваться и вызвать восхищение публики.`,
                    4: `<b>4 дом — Вторая обитель. Инфантильная домашняя игра</b><br>Зона семьи, родителей и базовой безопасности. В позитивном ключе человек привносит в интимное домашнее пространство элементы праздника и игры, развлекая близких. В негативном варианте (перевернутая карта) — это безответственный подросток, который развлекается на своей территории, не осознавая опасностей. Человек превращает дом в место для легкомысленных тусовок, лишая его статуса надежной крепости.`,
                    5: `<b>5 дом — Первая обитель. Естественная творческая искренность</b><br>Естественная и самая гармоничная среда для карты. Человек находится в полном контакте со своим эго и желаниями. В отношениях это период яркой влюбленности и праздника, когда партнеры искренне наслаждаются собой и друг другом. По Манаре — женщина радостно и с восторгом тестирует мужскую энергию, и этот страстный драйв является основой для зарождения глубокого взаимного интереса.`,
                    6: `<b>6 дом — Творческая игра в рутине</b><br>Столкнувшись с бытовыми задачами, служением или вопросами здоровья, личность отказывается быть сухим механизмом. Человек выполняет повседневную работу только тогда, когда у него есть вдохновение. Попытка навязать ему жесткий график встречает сопротивление, так как он стремится превратить даже скучный труд в творческий процесс.`,
                    7: `<b>7 дом — Падение. Провал эгоистичной романтики</b><br>Сфера брака, договоров и Весов. Искренний эгоизм Рыцаря жезлов здесь полностью проваливается. В серьезном партнерстве нельзя действовать только по личному хотению. Попытка остаться независимым, непредсказуемым любовником в рамках официального союза ведет к параличу действий. Человек либо не способен учитывать партнера, либо вообще теряет способность совершать поступки, так как романтическая игра неуместна там, где требуются зрелые обязательства.`,
                    8: `<b>8 дом — Поиск экстремальных страстей</b><br>В зоне кризисов, глубоких трансформаций и чужих ресурсов человек ищет адреналин. Львиный азарт толкает личность тестировать отношения на грани фола. Сексуальные контакты и жизненные вызовы воспринимаются как увлекательный квест, где необходимо проверить себя на прочность в экстремальных условиях.`,
                    9: `<b>9 дом — Искренний идеологический энтузиазм</b><br>Сталкиваясь с далекими перспективами, мировоззрением и авторитетами, человек загорается новыми идеями с пылкостью неофита. Он готов искренне проповедовать свои взгляды и выступать в роли творческого лидера, однако его философия часто наивна и продиктована скорее желанием выделиться, чем глубоким пониманием социальных процессов.`,
                    10: `<b>10 дом — Второе изгнание. Профессиональный каприз</b><br>Зона жесткой реальности, ответственности и карьеры (Козерог). Роль влюбленного или творца сталкивается с суровыми обязанностями. В негативе это взбалмошный работник или партнер, действующий по принципу: «хочу — копаю, хочу — не копаю», который своими капризами разрушает общее дело. В позитиве — это гениальный, творческий импровизатор, который своей солнечной энергией вдохновляет скучный коллектив, не разрушая при этом рабочий процесс.`,
                    11: `<b>11 дом — Первое изгнание. Подавление личного эгоизма</b><br>Сфера свободы, независимых коллективов и друзей (Водолей). Естественный эгоцентризм и спонтанные страсти Рыцаря жезлов здесь вынужденно блокируются ради сохранения дружеской синхронности. Человек должен усмирить свое пылкое «хочу» и научиться учитывать действия окружающих. В негативе это попытка привлечь к себе внимание эпатажным, непредсказуемым поведением, разрушающим коллективные связи.`,
                    12: `<b>12 дом — Изолированный творческий импульс</b><br>В сфере мистики, кармы и скрытых итогов личный энтузиазм оказывается запертым. Это может быть тайная влюбленность, которую человек переживает исключительно внутри себя, или творческий потенциал, не находящий выхода наружу. В негативе — психологическое истощение от того, что мир не заметил и не оценил искренние порывы человека.`
                }
            },
            35: {
                name: "Королева Жезлов",
                general: `I зона: Подсознание и инстинкты<br><br><b>1 дом (Овен) — Статус: Первая экстравертная обитель.</b> Человек заявляет о себе через социальный статус или принадлежность к авторитетной группе. Он транслирует уверенность: «Я — Королева, я имею право действовать». В отношениях это может быть женщина, которая сразу ставит себя на пьедестал.<br><br><b>2 дом (Телец) — Статус: Первое экстравертное изгнание.</b> Потребности и траты продиктованы желанием соответствовать высокому социальному образу («казаться, а не быть»). Ресурсы тратятся на поддержание имиджа, «рекламу» себя.<br><br><b>3 дом (Близнецы) — Статус: Экстравертное падение.</b> Проявляется как заносчивость и высокомерие в повседневном общении. Человек ведет себя как «фифа», считая окружающих ниже себя по уровню. В обучении — навязывание своего мнения как единственно верного.<br><br><b>4 дом (Рак).</b> В интимном пространстве или семье человек может вести себя как «принцесса в башне» или незваный гость, требующий поклонения. Это роль хозяйки, которая правит домом не через заботу, а через идеологический диктат. В вопросах материнства — архетип «Снежной королевы», воспитывающей ребенка как проект.<br><br>II зона: Личное сознание и выбор<br><br><b>5 дом (Лев) — Статус: Родственная стихия (Огонь).</b> Здесь Королева жезлов заменяет искренние чувства игрой в «царицу». В любви это демонстративная страсть, желание, чтобы партнер боготворил ее как ведьму. В Манаре — это пробуждение «внутренней ведьмы», испытывающей мужчину на прочность.<br><br><b>6 дом (Дева) — Статус: Второе экстравертное изгнание.</b> Снобизм в быту и на работе. Человек считает выполнение рутинных обязанностей (например, мытье посуды) ниже своего достоинства: «Я для этого не создана». В позитиве — грациозное выполнение чужой работы как жест «королевской» милости.<br><br><b>7 дом (Весы) — Статус: Первое экстравертное изгнание.</b> В партнерстве это сознательное принуждение себя к роли «верной жены» по договору, а не по любви («я отдана и буду верна»). Человек жестко держит дистанцию и навязывает партнеру свои правила игры.<br><br><b>8 дом (Скорпион) — Статус: Вторая обитель.</b> Использование своей харизмы и «ведьмовской» силы для получения экстремального результата или контроля над ресурсами партнера. Это «спецназ» в юбке, принимающий окончательные и бесповоротные решения.<br><br>III зона: Социум и карма<br><br><b>9 дом (Стрелец) — Статус: Первая обитель.</b> Самое естественное положение. Роль проповедника, лидера, за которым идут массы. Человек обладает огромной социальной властью, но освобожден от личной ответственности, так как исполняет чужую идею. Прямая карта — обоснованное доверие, перевернутая — утрата авторитета и «сбрасывание с горы».<br><br><b>10 дом (Козерог) — Статус: Падение.</b> «Воздушные замки» вместо реального планирования. Пустые мечты и слепая вера заслоняют суровую реальность и препятствия. Человек может метить на место начальника, не имея на то реальных оснований, кроме амбиций.<br><br><b>11 дом (Водолей) — Статус: Первое изгнание.</b> Интеллектуальная манипуляция и холодный расчет. Архетип «Снежной королевы» с замороженным сердцем, которая строит далеко идущие планы мести или социального переустройства. Дружба здесь возможна только с теми, кто признает ее превосходство.<br><br><b>12 дом (Рыбы) — Статус: Вторая экстравертная обитель.</b> Кармическая необходимость зарабатывать авторитет своим трудом. Человек может оказаться в ситуации «тайного управления» или нести последствия своих прошлых социальных манипуляций`,
                houses: {
                    1: `<b>1 дом (Овен) — Статус: Первая экстравертная обитель</b><br>Человек заявляет о себе через социальный статус или принадлежность к авторитетной группе. Он транслирует уверенность: «Я — Королева, я имею право действовать». В отношениях это может быть женщина, которая сразу ставит себя на пьедестал.`,
                    2: `<b>2 дом (Телец) — Статус: Первое экстравертное изгнание</b><br>Потребности и траты продиктованы желанием соответствовать высокому социальному образу («казаться, а не быть»). Ресурсы тратятся на поддержание имиджа, «рекламу» себя.`,
                    3: `<b>3 дом (Близнецы) — Статус: Экстравертное падение</b><br>Проявляется как заносчивость и высокомерие в повседневном общении. Человек ведет себя как «фифа», считая окружающих ниже себя по уровню. В обучении — навязывание своего мнения как единственно верного.`,
                    4: `<b>4 дом (Рак)</b><br>В интимном пространстве или семье человек может вести себя как «принцесса в башне» или незваный гость, требующий поклонения. Это роль хозяйки, которая правит домом не через заботу, а через идеологический диктат. В вопросах материнства — архетип «Снежной королевы», воспитывающей ребенка как проект.`,
                    5: `<b>5 дом (Лев) — Статус: Родственная стихия (Огонь)</b><br>Здесь Королева жезлов заменяет искренние чувства игрой в «царицу». В любви это демонстративная страсть, желание, чтобы партнер боготворил ее как ведьму. В Манаре — это пробуждение «внутренней ведьмы», испытывающей мужчину на прочность.`,
                    6: `<b>6 дом (Дева) — Статус: Второе экстравертное изгнание</b><br>Снобизм в быту и на работе. Человек считает выполнение рутинных обязанностей (например, мытье посуды) ниже своего достоинства: «Я для этого не создана». В позитиве — грациозное выполнение чужой работы как жест «королевской» милости.`,
                    7: `<b>7 дом (Весы) — Статус: Первое экстравертное изгнание</b><br>В партнерстве это сознательное принуждение себя к роли «верной жены» по договору, а не по любви («я отдана и буду верна»). Человек жестко держит дистанцию и навязывает партнеру свои правила игры.`,
                    8: `<b>8 дом (Скорпион) — Статус: Вторая обитель</b><br>Использование своей харизмы и «ведьмовской» силы для получения экстремального результата или контроля над ресурсами партнера. Это «спецназ» в юбке, принимающий окончательные и бесповоротные решения.`,
                    9: `<b>9 дом (Стрелец) — Статус: Первая обитель</b><br>Самое естественное положение. Роль проповедника, лидера, за которым идут массы. Человек обладает огромной социальной властью, но освобожден от личной ответственности, так как исполняет чужую идею. Прямая карта — обоснованное доверие, перевернутая — утрата авторитета и «сбрасывание с горы».`,
                    10: `<b>10 дом (Козерог) — Статус: Падение</b><br>«Воздушные замки» вместо реального планирования. Пустые мечты и слепая вера заслоняют суровую реальность и препятствия. Человек может метить на место начальника, не имея на то реальных оснований, кроме амбиций.`,
                    11: `<b>11 дом (Водолей) — Статус: Первое изгнание</b><br>Интеллектуальная манипуляция и холодный расчет. Архетип «Снежной королевы» с замороженным сердцем, которая строит далеко идущие планы мести или социального переустройства. Дружба здесь возможна только с теми, кто признает ее превосходство.`,
                    12: `<b>12 дом (Рыбы) — Статус: Вторая экстравертная обитель</b><br>Кармическая необходимость зарабатывать авторитет своим трудом. Человек может оказаться в ситуации «тайного управления» или нести последствия своих прошлых социальных манипуляций`
                }
            },
            36: {
                name: "Король Жезлов",
                general: `Младший аркан <b>Король жезлов (Король Огня в колоде Манара)</b> относится к первой зоне гороскопа (знак Овна, первый дом) и символизирует собой абсолютную мужскую энергию, инициативу и переход на совершенно новый виток спирали развития. Управляемый Марсом (и внутренне Плутоном), этот персонаж представляет собой высшую стадию огненной стихии, где личная воля уже не подчиняется социальным ограничениям.<br><br>Общая трактовка базовой прошивки личности (или реакции на ситуацию) по Королю жезлов синтезирует <b>четыре ключевые версии</b>:<br><b>1. Харизматичный лидер и первопроходец (по Уэйту):</b> Это человек, который выходит за рамки привычных социальных правил, принимая самостоятельные, единоличные решения, способные повлиять на судьбы многих. Он ведет за собой людей благодаря своей мощной харизме, не оглядываясь на чужие авторитеты и действуя на опережение.<br><b>2. Бремя харизмы и отсутствие личной жизни (Синтез):</b> Власть и авторитет Короля жезлов настолько велики, что общество лишает его права на простую человеческую жизнь. Его личные желания воспринимаются окружающими как руководство к действию, из-за чего он становится заложником своей ответственности: «все могут короли, кроме пожить у себя».<br><b>3. Провокатор чужого желания (по Манаре):</b> В интимных отношениях Король Огня выступает не как агрессивный потребитель, а как искусный стимулятор. Он целенаправленно провоцирует женщину (или партнера), чтобы пробудить в ней уснувшие инстинкты и заставить ее саму начать активно «раскручивать» ситуацию и проявлять инициативу.<br><b>4. Авторитарный эгоист и диктатор (Негатив):</b> При искажении энергии человек превращается в самодура, который грубо навязывает свою волю, не считаясь с возможностями и желаниями окружающих. Позиция «я здесь всё решаю» приводит к разрушению партнерства и полному энергетическому истощению.<br>Особые положения Короля жезлов жестко привязаны к астрологическим достоинствам Марса (Обитель в Овне и Скорпионе, Изгнание в Весах и Тельце, Экзальтация в Козероге, Падение в Раке).`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель. Абсолютная личная власть</b><br>Самая естественная среда для аркана. Человек заявляет: «я не только могу, но я это точно буду делать», и его решение не терпит никаких возражений. В отличие от Пажа, который только щупает свои возможности, Король жезлов обладает реальной силой и авторитетом, чтобы отодвинуть все внешние дела и сказать: «пошли все вон, я займусь своими проблемами». Он берет тотальную ответственность за свою жизнь в свои руки, и помешать ему невозможно.`,
                    2: `<b>2 дом (Телец) — Второе изгнание. Диктат над ресурсами</b><br>Сфера физиологической формы, накоплений и потребления. Человек пытается подчинить материальный мир и ресурсы (свои или партнера) голой воле и харизме. Возникает конфликт: вместо того чтобы накапливать и оберегать форму, Король жезлов агрессивно ее эксплуатирует. В негативе это продавливание партнера на физическом уровне, игнорирование его телесных или материальных границ ради удовлетворения собственных сиюминутных энергетических всплесков.`,
                    3: `<b>3 дом (Близнецы). Авторитарная повседневная коммуникация</b><br>В сфере поверхностных контактов, братьев/сестер и обучения человек не способен вести диалог на равных. Он общается приказами и манифестами, транслируя свою волю собеседникам. Его слова всегда звучат безапелляционно; он не слушает чужих аргументов, ожидая лишь немедленного признания своего авторитета и правоты в любой бытовой беседе.`,
                    4: `<b>4 дом (Рак) — Падение. Разрушение семейного покоя</b><br>Сфера фундаментальной безопасности, интимности и отдыха. Огненная, авторитарная энергия Короля жезлов здесь падает, так как дома нужно расслабляться, а не воевать. Человек либо переносит свой диктаторский стиль управления в семью, лишая домочадцев покоя и требуя беспрекословного подчинения, либо, наоборот, полностью теряет свою харизму и лидерские качества, как только переступает порог собственного дома.`,
                    5: `<b>5 дом (Лев). Эгоцентричная демонстрация страсти</b><br>Зона радости, эгоизма, творчества и влюбленности. Человек ведет себя в любви как абсолютный монарх. Он требует тотального восхищения и подчинения от своего любовника. В негативном аспекте эта неспособность к искренней парной игре и чрезмерный эгоизм приводят к краху отношений, оставляя человека в полном одиночестве наедине с собственной гордыней.`,
                    6: `<b>6 дом (Дева). Подчинение рабочей рутины</b><br>Сталкиваясь с повседневными обязанностями, служением и рутинным трудом, личность отказывается действовать по указке. Человек привносит в работу свою агрессивную индивидуальность, ломая скучные графики. Даже будучи подчиненным, он ведет себя как независимый хозяин положения, навязывая коллегам свой собственный огненный ритм работы.`,
                    7: `<b>7 дом (Весы) — Первое изгнание. Неравноправное партнерство</b><br>Зона брака и открытых договоренностей, где эгоизм Марса изгоняется. В прямом, позитивном положении мужчина берет на себя всю ответственность за пару, прикрывая партнера своей силой. Однако в негативном варианте это жесткий диктат, где человек заявляет: «я здесь всё решаю, и равноправного партнерства быть не может». Для женщины выпадение этой роли в партнерстве является опасным симптомом: она перехватывает мужские функции, смещая свою природную женскую роль в сторону жесткого управления.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель. Стимуляция чужого результата</b><br>Сфера глубоких трансформаций, экстрима и секса. На высоком уровне человек блестяще управляет чужой энергией: его действия стимулируются самим партнером, и он виртуозно доводит ситуацию до результата. В негативном (перевернутом) варианте на человека ложится непомерная королевская ответственность за чужой результат (например, он чувствует себя обязанным любой ценой удовлетворить партнершу). Попытка «выжать» из себя то, чего нет, ведет к тотальному энергетическому краху и выгоранию.`,
                    9: `<b>9 дом (Стрелец). Непререкаемый идеологический диктат</b><br>В сфере формирования мировоззрения, далеких перспектив и социальных идеалов человек становится харизматичным, но бескомпромиссным гуру. Он агрессивно проповедует свои убеждения, требуя от окружения слепой веры в свои идеи. Его философия продиктована не объективным поиском истины, а желанием утвердить свою личную картину мира как единственно верную.`,
                    10: `<b>10 дом (Козерог) — Экзальтация. Сверхнапряжение социальной миссии</b><br>Высшая точка напряжения марсианской энергии. В сфере карьеры, социального долга и объективной реальности человек действует на пределе возможностей. Он пробивает социальные преграды чистым энтузиазмом и личной харизмой, выступая единоличным тараном. Ему жизненно необходимо доказать миру свое первенство, ломая устоявшиеся корпоративные или государственные рамки, что чревато огромным перерасходом жизненных сил.`,
                    11: `<b>11 дом (Водолей). Единоличное управление будущим</b><br>Зона форс-мажоров, друзей и непредсказуемой коллективной свободы. Сталкиваясь с водолейским хаосом, человек пытается подчинить непредсказуемое будущее своей воле. Он игнорирует интересы коллектива, совершая резкие, независимые поступки, уверенный, что его личная харизма и энергия способны продавить любые преграды и изменить ход коллективной истории.`,
                    12: `<b>12 дом (Рыбы). Одиночество непризнанного первопроходца</b><br>В сфере скрытых итогов, тайн и кармы человек сталкивается с последствиями своего бескомпромиссного лидерства. Кармическая расплата для Короля жезлов — это предательство со стороны тех самых людей, которых он вел за собой. Его идеи опережают время, поэтому в конечном итоге он остается в полном, изолированном одиночестве, непонятый миром, который оказался не готов к его прорывам.`
                }
            },
            47: {
                name: "Паж Кубков",
                general: `В системе астрологического Таро Юрия Хана фигурная карта <b>Паж Кубков (Паж Воды)</b> символизирует специфическую социальную роль и этап психологического развития. Астрологически эта карта парадоксальна: являясь Пажом (первый квадрант, инстинкты и начало), она по своей стихии (Вода) относится к знаку Рака и четвертому дому, то есть попадает в квадрант Рыцарей (социальная адаптация),,. Из-за этого перехода Паж Кубков всегда описывает ситуацию, когда от человека требуется защищенность, а у него ее еще нет,.<br><br>Общая трактовка базовой прошивки личности (Асцендента) по Пажу Кубков синтезирует <b>четыре ключевые версии</b> проявления этого архетипа (по Уэйту и Манаре):<br><b>1. «Рак без панциря» и абсолютная беззащитность (по Уэйту).</b> Это человек-ребенок, который оказался в суровом мире без собственных механизмов защиты. У него еще не отрос свой «панцирь», поэтому он критически нуждается в покровителе, спонсоре или сильном партнере, за спиной которого можно спрятаться,.<br><b>2. Синдром «волшебной щуки» и заимствованная сила (по Манаре).</b> На карте Манары женщина держит щуку в стакане. Это психологическая позиция, при которой человек апеллирует не к собственным качествам, а к своим внешним защитникам («у меня папа депутат», «у меня брат бандит») или надеется на чудо, которое решит все проблемы за него,.<br><b>3. Предложение биологического потенциала (синтез).</b> Человек (чаще женщина) не обладает материальными или социальными ресурсами (как Паж Пентаклей или Мечей), поэтому предлагает партнеру единственное, что у нее есть — свою биологическую природу, способность к деторождению и созданию семьи, выступая исключительно в роли потенциальной матери,.<br><b>4. Выученная беспомощность и инфантилизм (в негативе).</b> Человек намертво застревает в детско-родительских сценариях. Он полностью зависим, инфантилен, лишен личных границ и позволяет другим (родителям или партнеру) управлять своей жизнью, снимая с себя любую ответственность,.<br>Ниже представлен детальный анализ проявления этой энергетики во всех 12 домах гороскопа.`,
                houses: {
                    1: `<b>1 дом</b><br><b>Поиск покровителя на старте</b> Базовый импульс человека лишен марсианской агрессии. Сталкиваясь с новыми обстоятельствами или входя в отношения, личность не проявляет взрослую инициативу, а демонстрирует свою уязвимость. Человек начинает общение с позиции ребенка, которому нужна опека, подсознательно надеясь, что партнер возьмет на себя роль сильного взрослого и обеспечит ему «крышу»,.`,
                    2: `<b>2 дом — Экзальтация</b><br><b>Демонстрация своей несостоятельности</b> В сфере финансов, ресурсов и физической формы Паж Кубков достигает экзальтации. Это напряженная, но рабочая позиция: человек открыто демонстрирует свою нехватку ресурсов («сами мы не местные, денег у нас нет»), используя свою слабость как инструмент. Это вымогательство заботы через трансляцию собственной материальной или физической беззащитности, чтобы партнер взял его на полное обеспечение.`,
                    3: `<b>3 дом</b><br><b>Наивное, ведомое общение</b> В сфере повседневных контактов, рутины и передачи информации человек демонстрирует абсолютную открытость и отсутствие критического фильтра. Он общается с окружающими из позиции наивного доверия, не умея выстраивать личные границы. В разговоре такой человек легко поддается чужому влиянию, верит обещаниям и ждет, что собеседник сам организует комфортное взаимодействие,.`,
                    4: `<b>4 дом — Первая Обитель</b><br><b>Абсолютное доверие и инфантильность</b> Это естественная среда для Пажа Кубков. В рамках своего интимного пространства или дома человек полностью отдает инициативу партнеру, говоря: «будь как дома, распоряжайся мной»,. В позитиве это абсолютная душевная близость и открытость. В перевернутом (негативном) варианте — это глубокая психологическая травма, «выученная беспомощность», когда человек превращается в «оголенный нерв» без кожи, позволяя близким полностью подавлять свою волю и управлять собой,.`,
                    5: `<b>5 дом</b><br><b>Искренняя, детская влюбленность</b> В сфере любви, радости и эгоизма человек проживает эмоции максимально инфантильно. Его влюбленность лишена трезвого расчета; он требует от партнера безусловного, родительского принятия. Это роль капризного ребенка, который ждет, что возлюбленный будет развлекать его, решать его проблемы и восхищаться им просто по факту его существования, как восхищаются младенцем,.`,
                    6: `<b>6 дом</b><br><b>Беспомощность перед рутиной</b> Сталкиваясь с необходимостью методично работать, заботиться о своем здоровье или организовывать быт, человек впадает в ступор. Он не способен нести взрослую рабочую нагрузку, так как его навыки находятся на уровне ученика детского сада. В этой сфере он будет постоянно надеяться на «волшебную щуку» — что кто-то более компетентный придет и сделает всю грязную работу за него,.`,
                    7: `<b>7 дом</b><br><b>Зависимое, неравноправное партнерство</b> Вступая в брак или открытые договоры, человек оказывается в крайне слабой позиции. Он не является равноправным партнером, а выступает в роли «дочери» или «сына» при своем супруге. Внешний мир и партнер воспринимают такого человека не как личность, а исключительно как мать/отца детей или домашнее приложение, которое не имеет права голоса и должно сидеть дома под полным контролем,.`,
                    8: `<b>8 дом — Падение</b><br><b>Бегство от трансформаций</b> В зоне кризисов, глубоких трансформаций и чужих ресурсов Паж Кубков находится в падении (так как это лунная карта, падающая в Скорпионе). Столкнувшись со стрессом или сексуальным напряжением, человек отказывается меняться. Вместо взрослого решения проблем, он пытается регрессировать в детство, ищет более слабого партнера или требует к себе жалости, чтобы избежать суровой реальности восьмого дома. Результат взаимодействия оказывается минимальным: человек получает лишь крохи, чтобы физически выжить, но теряет способность к самостоятельности.`,
                    9: `<b>9 дом</b><br><b>Поиск духовного покровителя</b> В вопросах идеологии, морали и долгосрочных планов на будущее человек не имеет собственного авторитетного мнения. Он ищет не партнера для совместного развития, а могущественного «папика», гуру или наставника, который обеспечит ему социальную защиту и расскажет, как правильно жить,. Личность слепо перенимает мировоззрение того, кто берет ее под свое крыло.`,
                    10: `<b>10 дом — Изгнание</b><br><b>Несостоятельность перед ответственностью</b> В сфере карьеры, статуса и объективной реальности это катастрофическое положение изгнания. Человек оказывается у руля (как «пятнадцатилетний капитан»), но его мозги и психика абсолютно не готовы к взрослой ответственности. В браке это описывает «маменькиного сынка» или инфантильную жену, которыми продолжают управлять их родители, разрушая самостоятельность молодой семьи. Человек не способен нести груз десятого дома из-за своего психологического несовершеннолетия.`,
                    11: `<b>11 дом</b><br><b>Иллюзия дружеской защиты</b> При столкновении с непредсказуемым будущим, свободой или коллективами человек ведет себя безответственно. Он апеллирует к друзьям или социуму как к своим «защитникам», ожидая, что коллектив будет нянчиться с ним, как с ребенком,. Личность не способна на водолейскую независимость и трезвый интеллект, подменяя их капризами и ожиданием чуда от окружающих.`,
                    12: `<b>12 дом</b><br><b>Растворение в чужой воле</b> Оказавшись в изоляции или сталкиваясь с кармическими последствиями, человек полностью сдается. Он чувствует себя абсолютно голым и лишенным панциря перед лицом фатума. У него нет сил для того, чтобы осознанно переработать свой опыт, поэтому он просто плывет по течению чужой воли или обстоятельств, уповая на то, что высшие силы сами вынесут его в безопасную гавань.`
                }
            },
            48: {
                name: "Рыцарь Кубков",
                general: `В системе астрологического Таро Юрия Хана фигурные карты (карты двора) описывают не врожденный характер человека, а социальные роли и шаблоны поведения, которые он вынужден принимать под давлением внешней ситуации или выбирает сам. Младший аркан <b>Рыцарь Кубков (Рыцарь Воды)</b> соответствует четвертому дому гороскопа (знак Рака) и управляется планетой Луна.<br><br>Общая трактовка базовой прошивки личности (или актуальной социальной роли) по Рыцарю Кубков синтезирует <b>четыре ключевые версии</b> проявления этого архетипа, опираясь на колоды Уэйта и Манары:<br><b>1. Охрана территории и консервация чувств (по Уэйту).</b> Это роль защитника своего интимного пространства, дома и семьи. Рыцарь Кубков ничего не меняет, не разрушает и не строит нового — он бережно охраняет то, что уже есть. В отношениях это романтический герой, который сохраняет статичную память о возлюбленной (любит ее «по фотографии») и оберегает ее покой, избегая реального, меняющегося взаимодействия.<br><b>2. Роль заботливой матери (по Манаре).</b> Архетип материнства и опеки. Человек берет на себя функцию «мамочки» (или «папочки»), предоставляя партнеру безусловную заботу, комфорт, питание и защиту. Это создание безопасного гнезда, где партнер может расслабиться, как ребенок.<br><b>3. Формальная забота и корпоративная «семья» (в негативе).</b> Внешнее, механическое выполнение опекающих функций без глубокой эмоциональной вовлеченности. В социальном плане это манипуляция по принципу «наша фирма — это одна семья», где под маской родительской заботы от человека требуют огромной самоотдачи за минимальное вознаграждение.<br><b>4. Инфантилизм и страх взросления.</b> Это стадия до полового созревания. Человек взял на себя базовую ответственность за себя (вырос из Пажа Кубков), но панически боится переходить в стадию взрослой, страстной сексуальности и социальной зрелости (Рыцарь Жезлов). В отношениях это «маменькин сынок» или незрелая девушка, избегающие реальной страсти и прячущиеся за маской заботы.<br>Ниже представлен детальный разбор проявления этой социальной роли во всех 12 домах гороскопа. Поскольку Рыцарь Кубков управляется Луной (Рак), его особые положения совпадают с астрологическими достоинствами Луны.`,
                houses: {
                    1: `<b>1 дом (Овен) — Пассивная защита</b><br>Человек начинает любые дела или знакомства не с активной марсианской инициативы, а с предложения комфорта. На старте отношений он сразу занимает позицию заботливого опекуна или, наоборот, демонстрирует свою готовность стать для партнера тихой гаванью. Его базовый импульс — не завоевать, а обогреть и накормить.`,
                    2: `<b>2 дом (Телец) — Экзальтация. Физиологическая гипер-опека</b><br>Луна экзальтирует в Тельце. Роль заботливого родителя реализуется на пределе сил и фокусируется исключительно на материи и физиологии. Человек маниакально стремится накормить, одеть и обеспечить партнера или детей физическим комфортом. Это гипертрофированная, удушающая забота о «теле» партнера, когда закармливание и бытовой уют становятся единственным, но очень напряженным способом выразить свою привязанность.`,
                    3: `<b>3 дом (Близнецы) — Родственная коммуникация</b><br>В сфере повседневного общения, рутины и передачи информации человек транслирует материнскую интонацию. Его разговоры наполнены бытовой заботой («ты поел?», «надень шапку»). Он общается со случайными собеседниками или соседями так, словно они члены его семьи, стирая дистанцию, но избегая острых углов.`,
                    4: `<b>4 дом (Рак) — Первая обитель. Идеальная гавань</b><br>Здесь роль находится в своей абсолютно естественной среде. Человек гениально выполняет функции матери или защитника домашнего очага. Он выстраивает непробиваемые границы своей интимной зоны, обеспечивая своим близким (или партнеру) тотальную безопасность, уют и душевный покой. В этой роли он не пытается переделать партнера, а принимает и сохраняет его таким, какой он есть.`,
                    5: `<b>5 дом (Лев) — Романтическая статика</b><br>В сфере любви, радости и игры человек застревает в образе романтического рыцаря. Он обожает ухаживать, хранить верность идеализированному образу партнера и писать стихи, но при этом панически боится реального сближения. Влюбленность превращается в музейную ценность, которую он охраняет, не позволяя ей развиться во взрослую страсть.`,
                    6: `<b>6 дом (Дева) — Синдром наседки</b><br>В повседневном труде и служении забота превращается в методичную, скучную работу. Человек выполняет роль опекуна как рутинную обязанность: стирает, убирает, лечит партнера без особых эмоций. Это формальное материнство, при котором все бытовые функции выполняются идеально, но душевное тепло может полностью отсутствовать.`,
                    7: `<b>7 дом (Весы) — Опекающее партнерство</b><br>В браке и открытых союзах человек отказывается быть равноправным супругом. Он выстраивает отношения по модели «родитель — ребенок». Жена становится мамочкой для своего мужа (или муж — мамочкой для жены), контролируя его быт и опекая его слабости. Из таких отношений уходит партнерская страсть, заменяясь уютной, но инфантильной зависимостью.`,
                    8: `<b>8 дом (Скорпион) — Падение. Паралич перед трансформацией</b><br>Луна падает в Скорпионе. Катастрофа для развития отношений. Сталкиваясь с кризисом, экстримом или необходимостью перехода к страстным, глубоким сексуальным отношениям, человек прячется в панцирь Рыцаря Кубков. Он категорически отказывается меняться и взрослеть. В сексе он довольствуется самым физиологическим минимумом, необходимым лишь для «поддержания здоровья» или снятия напряжения, полностью блокируя любую страсть, трансформацию и энергетический обмен.`,
                    9: `<b>9 дом (Стрелец) — Идеология безопасности</b><br>В вопросах мировоззрения, религии и планов на будущее человек делает ставку на консервацию. Его главный идеал — сохранение семейных традиций и патриархального (или матриархального) уклада. Он не стремится к социальным завоеваниям, его социальная стратегия — найти для своей семьи тихое, защищенное место и защитить его от тлетворного влияния большого мира.`,
                    10: `<b>10 дом (Козерог) — Первое изгнание. Неуместная опека</b><br>Луна находится в изгнании в Козероге. Человек переносит семейные, материнские паттерны поведения в суровую профессиональную или социальную среду. Вместо того чтобы быть строгим начальником или ответственным функционером, он начинает играть роль «мамочки» для своих подчиненных или коллег. Это попытка подменить объективные рабочие требования домашней заботой, что в итоге разрушает и карьеру, и рабочую дисциплину.`,
