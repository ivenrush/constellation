                    7: `<b>7 дом (Весы) — Второе изгнание</b><br>** Сфера партнерства, брака и открытых договоров. Здесь способность к трансформации искажается и используется как инструмент манипуляции. Человек не выстраивает равноправный компромисс, а выставляет себя пострадавшей стороной. Он демонстрирует свою депрессию, усталость или готовность уйти из отношений (Уэйт), применяя жалобы ("мне так плохо") как пассивный способ получить от партнера желаемое. Он делает вид, что поведение супруга («стрела» по Манаре) смертельно ранило его, заставляя партнера постоянно испытывать чувство вины и долга.`,
                    8: `<b>8 дом (Скорпион) — Первая обитель</b><br>** Это абсолютно родная, идеальная среда для аркана. Человек гениально считывает результаты своих действий и легко идет на глубинную трансформацию. Сталкиваясь с кризисом или завершением этапа, он не цепляется за старые эмоции, а спокойно оставляет их позади, чтобы доработать свои недостатки (Уэйт). В отношениях он моментально и без страха улавливает любой новый импульс или «стрелу» внимания от партнера, принимая этот результат как руководство к дальнейшему развитию (Манара). В раскладах прямое положение говорит о том, что человек успешно усваивает опыт, а в негативе (при перевернутой карте) — застревает в травмирующем состоянии и отказывается перешагнуть через проблему.`,
                    9: `<b>9 дом (Стрелец) — Идеологическое переосмысление перспектив</b><br>** Сталкиваясь с новыми социальными авторитетами, высшим образованием или чужими культурами, человек легко расстается со своими устаревшими идеалами. Поняв ограниченность старого мировоззрения, он отправляется в новый духовный или философский поиск без оглядки на догмы (Уэйт). Он способен мгновенно уловить суть чужой идеологии или философскую «стрелу» общества (Манара), интегрируя этот опыт в свою систему ценностей и выстраивая новую траекторию для будущего.`,
                    10: `<b>10 дом (Козерог) — Трансформация социального статуса</b><br>** В сфере объективной реальности, социальной иерархии и карьерных амбиций человек не позволяет себе эмоционально зацикливаться на достигнутом. Если профессия или занимаемая должность исчерпали свой потенциал, он абсолютно спокойно уходит с поста в поисках более эффективного применения своих сил (Уэйт). Он моментально и инстинктивно реагирует на жесткие требования социума, приказы руководства или «стрелы» новых карьерных возможностей (Манара), трансформируя свой социальный статус.`,
                    11: `<b>11 дом (Водолей) — Падение</b><br>** Сфера свободы, интеллектуальных инсайтов, коллективов и непредсказуемого будущего. Плутон здесь падает. Это катастрофа для планомерной трансформации и переваривания прошлого опыта. Столкнувшись с шокирующими форс-мажорами одиннадцатого дома, человек осознает, что его прежние эмоциональные кубки и результаты абсолютно бесполезны в новых реалиях. Чтобы выжить, ему приходится вслепую, без подготовки и гарантий шагнуть в пугающее будущее (Уэйт). При этом он вынужден инстинктивно и хаотично ловить случайные «стрелы» новых возможностей (Манара), находясь в состоянии полнейшего жизненного форс-мажора и разрыва старых шаблонов.`,
                    12: `<b>12 дом (Рыбы) — Глубинное кармическое освобождение</b><br>** Находясь в изоляции, на социальном дне или сталкиваясь с неизбежными кармическими последствиями прошлого, человек принимает решение расстаться с иллюзиями. Он бесстрашно и сознательно шагает в ночь своего бессознательного, чтобы разобраться с самыми тяжелыми скрытыми проблемами и закрыть старые гештальты (Уэйт). Он мистическим образом открыт потоку и улавливает тончайшие кармические знаки («стрелы» судьбы), прилетающие из внешней среды, позволяя карме трансформировать его до самого основания (Манара).`
                }
            },
            45: {
                name: "9 Кубков",
                general: `В системе астрологического Таро Юрия Хана младший аркан <b>9 кубков (Девятка Воды)</b> открывает третью, социальную зону гороскопа (девятый дом, знак Стрельца) и управляется планетой <b>Юпитер</b>. Эта карта описывает выход человека в социум, его ожидания от будущего, мечты и попытки согласовать свои желания с окружающим миром.<br><br>Для создания детального натального портрета (рассматривая 9 кубков как базовую прошивку личности, аналог Асцендента), необходимо синтезировать проявления этого аркана из классической колоды Уэйта и колоды Манара:<br><b>1. Показной триумф и пассивное ожидание (по Уэйту):</b> На карте изображен довольный человек, сидящий на фоне девяти кубков, выстроенных на полукруглой ширме. В позитиве это заслуженный триумф и радость. В негативе (что встречается чаще) — это демонстрация исключительно красивого фасада, за которым скрывается «кухня» и то, какими средствами был достигнут результат. Человек находится в иллюзорном ожидании немыслимого счастья, пассивно надеясь на чудо и отказываясь что-либо делать самостоятельно.<br><b>2. Статус госпожи и одностороннее потребление (по Манаре):</b> На карте Девятка Воды изображена женщина, получившая абсолютную свободу своих сексуальных и эмоциональных проявлений. В негативном ключе она выступает в роли «госпожи», позволяя себе всё что угодно по своему усмотрению, в то время как мужчина (партнер) низводится до роли обслуживающего персонала. Отношения строятся на одностороннем разврате и эгоцентризме, где партнер обязан принимать любые правила игры.<br><b>Общая трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 9 кубков — это личность, стремящаяся к идеальной картинке счастья и социального триумфа. Его суперсила заключается в умении искренне радоваться жизни, создавать атмосферу праздника и привлекать к себе блага силой уверенности. Однако его главная уязвимость — склонность впадать в глубокие иллюзии, выдавать желаемое за действительное и формировать потребительское отношение к партнерам. Он может сидеть сложа руки в ожидании, пока мир и окружающие принесут ему всё на блюдечке, прикрывая свою пустоту ширмой мнимого успеха.<br><br>Поскольку девятки управляются Юпитером, их особые положения распределены по его астрологическим достоинствам.`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br>В зоне 1 дома (Овен) базовый импульс к действию подменяется пассивным ожиданием. Человек начинает любые проекты или отношения с твердой уверенностью, что он уже достоин высшей награды. Он не прилагает стартовых усилий, а сразу садится в позу самодовольного потребителя, ожидая, что мир и партнер немедленно начнут его обслуживать и удовлетворять все его прихоти.`,
                    2: `<b>2 дом (Телец)</b><br>В сфере 2 дома (Телец) деньги, ресурсы и собственное тело воспринимаются как атрибуты для хвастовства. Человек выстраивает шикарную витрину своей обеспеченности, скрывая за ней реальные долги или физические комплексы. Он ищет партнера, который будет финансово или физиологически его обслуживать, поддерживая его иллюзию статуса «госпожи» или состоятельного сибарита.`,
                    3: `<b>3 дом (Близнецы) — Первое изгнание</b><br>** Острый конфликт между простым, повседневным общением и пафосом девяток. В бытовых контактах человек ведет себя крайне неестественно и высокомерно. Вместо естественной радости (по тройкам) он транслирует искусственные эмоции, пытается выглядеть «господином» в банальных ситуациях или скрывает свои истинные намерения за ширмой социальной порядочности и табу. Это неадекватное поведение в моменте, когда эмоции абсолютно не соответствуют реальности.`,
                    4: `<b>4 дом (Рак) — Экзальтация</b><br>** Сфера корней, семьи и базовой безопасности. Высшая точка напряжения для Юпитера. Человек пытается насильно внедрить свою иллюзорную картинку «идеального счастья» в интимное семейное пространство. Он выставляет напоказ свою семью как витрину (ширма с кубками), скрывая реальные внутренние проблемы. В случае краха этих иллюзий, неспособность выдержать столкновение с внешним миром оборачивается для него домашней депрессией, психозом и истерикой.`,
                    5: `<b>5 дом (Лев)</b><br>В зоне 5 дома (Лев) сфера творчества, любви и эгоизма превращается в показуху. Человек не проживает искренние чувства, а демонстрирует их публике. Его влюбленность — это театральный спектакль, в котором партнеру отведена роль безропотного слуги, обязанного обеспечивать аплодисменты и потакать любым эмоциональным капризам ради сохранения красивого фасада.`,
                    6: `<b>6 дом (Дева) — Второе изгнание</b><br>** Сфера рутины, служения и методичного выбора. Сталкиваясь с необходимостью реально работать, человек предпочитает верить сладким обещаниям. Вместо трезвого анализа он поддается соблазну «ничего не делать», веря рекламным лозунгам, что рутина сама по себе принесет ему чудо и счастье. В отношениях это попытка заставить партнера выполнять всю грязную работу, пока обладатель прошивки наслаждается ролью потребителя.`,
                    7: `<b>7 дом (Весы)</b><br>Вступая в договоры и брак (7 дом, Весы), человек предъявляет нереалистичные, завышенные требования к супругу. Он не готов к равноправному диалогу, а изначально настраивается на то, что партнер должен воплотить все его сокровенные мечты. Отношения строятся на иллюзиях о светлом будущем, которые маскируют абсолютное нежелание идти на реальные уступки.`,
                    8: `<b>8 дом (Скорпион)</b><br>В ситуациях 8 дома (Скорпион), связанных с кризисами, трансформацией и глубокой интимностью, человек использует свои иллюзии как психологическую защиту. Столкнувшись с болью, он прячется за ширму напускного благополучия. В сексе он стремится к тотальному доминированию, требуя от партнера обслуживания своих самых смелых или экстравагантных желаний, полностью игнорируя энергетический баланс пары.`,
                    9: `<b>9 дом (Стрелец) — Первая обитель</b><br>** Естественная среда для карты. В позитивном варианте человек достигает реального консенсуса с миром. Его мечты сбываются, и он открыто наслаждается заслуженным результатом, не скрывая его оборотной стороны. В отношениях это тотальная свобода проявлений, которую партнер принимает абсолютно добровольно и с радостью. В негативе — человек полностью уходит в иллюзии, играя роль «госпожи» или самодовольного манипулятора, используя партнера исключительно для личного удовольствия, прикрываясь обещаниями светлого будущего.`,
                    10: `<b>10 дом (Козерог) — Падение</b><br>** Сфера объективной реальности, социальной ответственности и карьеры. Мечты и иллюзии разбиваются о суровые факты. Человек ожидал, что мир будет служить ему по мановению волшебной палочки, но система ставит его на место. При прямой карте это редкое подтверждение того, что мечты действительно сбылись («хотела счастья — получила счастье»). При перевернутой карте — это жестокий крах надежд, увольнение, понижение в статусе и осознание того, что за красивой ширмой не было реального профессионального фундамента.`,
                    11: `<b>11 дом (Водолей)</b><br>В сфере 11 дома (Водолей), отвечающего за коллективы и непредсказуемое будущее, человек отказывается трезво смотреть вперед. Сталкиваясь с форс-мажорами, он надевает маску слепого оптимизма, свято веря, что «всё образуется само собой». Он пытается выделиться в кругу друзей показным счастьем, полностью игнорируя объективные законы и рискуя в один момент оказаться у разбитого корыта из-за своей оторванности от реальности.`,
                    12: `<b>12 дом (Рыбы) — Вторая обитель</b><br>** Сфера кармы, тайн и скрытых итогов (вторая обитель Юпитера). Человек тотально погружается в мир своих фантазий, слепо доверяясь ложным обещаниям. Он может приносить себя в жертву ради иллюзорной сказки или, наоборот, упиваться своим выдуманным всемогуществом в полной изоляции. Реальные результаты скрыты под глухой ширмой, и человек радостно живет в самообмане, игнорируя объективные кармические последствия своих действий.`
                }
            },
            46: {
                name: "10 Кубков",
                general: `В системе астрологического Таро Юрия Хана числовые карты-десятки относятся к третьей зоне зодиакального круга, соответствуют десятому дому гороскопа (знак Козерога, стихия Земли) и управляются планетой <b>Сатурн</b>. Они символизируют абсолютный предел, завершение внешнего процесса, столкновение с объективной реальностью и необходимость нести ответственность не только за себя, но и за окружающих. Младший аркан <b>10 кубков (Десятка Воды)</b> описывает окончательный эмоциональный результат этого процесса — предел желаний и коллективное восприятие счастья.<br><br>Для составления детального натального портрета личности (рассматривая 10 кубков как базовую прошивку, аналог Асцендента), необходимо синтезировать проявления этого аркана из колод Уэйта и Манары:<br><b>1. Коллективная радость и предел желаний (по Уэйту):</b> На карте изображена семья, радующаяся радуге из десяти кубков. В позитивном ключе это означает, что процесс завершен успешно, "мечты сбылись", и человек способен радоваться не эгоистично, а разделять эту радость с окружающими (семьей, социумом). В негативном (что бывает часто, так как Сатурн суров) — это осознание предела: большего желать нельзя. Это также формальная, навязанная радость («все радуются, и я должен»), когда за красивой ширмой скрывается крушение личных иллюзий, и человек радуется лишь тому, что плохие времена хотя бы закончились.<br><b>2. Эмоциональная изоляция и формальное сосуществование (по Манаре):</b> На карте Десятка Воды женщина находится в одиночестве, погруженная в водоем своих эмоций, в то время как мужчина (партнер) занимается где-то своими делами и на карте даже не присутствует. Это состояние, когда в рамках устоявшихся отношений люди живут параллельными жизнями. Человек тотально погружен в свои внутренние переживания и не контактирует с реальностью партнера. Отношения сохраняются формально, но подлинного эмоционального обмена нет.<br><b>3. Общая (синтезированная) трактовка натальной базы (Уэйт + Манара):</b> Человек с базовой прошивкой 10 кубков — это личность, чья психика ориентирована на создание "идеальной картинки" социально одобряемого счастья, за которой часто скрывается глубокое внутреннее одиночество. Его суперсила — умение адаптироваться к требованиям общества, сохранять семью и находить компромисс, принося в жертву свой личный эгоизм ради общего блага. Его уязвимость — склонность жить в формальных отношениях, заменяя подлинную близость демонстрацией "радуги" для окружающих, и тонуть в собственных невысказанных эмоциях, игнорируя реального партнера.<br>Поскольку десятки подчиняются Сатурну, их особые положения распределены по его астрологическим достоинствам (Обитель в Козероге и Водолее, Изгнание в Раке и Льве, Экзальтация в Весах, Падение в Овне).`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение</b><br><i>Блокировка личной инициативы.</i> Сфера базовой животной энергетики и старта. Сатурн здесь падает. Базовый порыв человека начать что-то новое или заявить о своих желаниях мгновенно гасится грузом ожиданий. Человек не может сделать ни шагу, потому что заранее знает: его инициатива должна соответствовать идеальной "радуге" социума (Уэйт). Эта неподъемная ответственность парализует волю. Вместо активных действий на старте отношений, человек впадает в ступор, отстраняется от партнера и уходит в свои изолированные переживания (Манара), демонстрируя полнейшую апатию и неспособность бороться за свои потребности.`,
                    2: `<b>2 дом (Телец)</b><br><i>Оценка материального идеала.</i> В сфере финансов, тела и ресурсов человек измеряет уровень своего эмоционального счастья количеством накопленных материальных благ. "Идеальная семья" (Уэйт) должна жить в идеальном доме. В отношениях он готов мириться с полным эмоциональным отчуждением партнера и одиночеством (Манара), если материальная сторона союза стабильна и обеспечивает ему красивый фасад, который можно продемонстрировать окружающим.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Демонстрация благополучия окружающим.</i> В повседневных контактах, переписках и рутинном общении человек транслирует образ абсолютного успеха. Он рассказывает соседям и знакомым о том, как у него всё прекрасно (радуга Уэйта), тщательно скрывая реальные проблемы. Однако за этой информационной ширмой скрывается глубокий вакуум: он ни с кем не делится своими подлинными чувствами, оставаясь эмоционально изолированным в своей "воде" (Манара).`,
                    4: `<b>4 дом (Рак) — Первое изгнание</b><br><i>Угроза интимному покою.</i> Сфера дома, корней и базовой безопасности. Сатурн (и десятки) здесь в первом изгнании. Это конфликт между необходимостью отдыхать и внешними эмоциональными нагрузками. Человек приносит все переживания внешнего мира (заботы о дальних родственниках, политические новости, проблемы на работе) в свой дом. Вместо того чтобы расслабиться, он постоянно тревожится о сохранении "радуги" (Уэйт). Он не может найти покоя, прячется в ванной своих эмоций (Манара), но внешний мир постоянно стучится в дверь, разрушая его базовую безопасность и вызывая бессонницу.`,
                    5: `<b>5 дом (Лев) — Второе изгнание</b><br><i>Потеря личной радости.</i> Сфера эгоизма, творчества, любви и личного счастья. Высшая точка напряжения. В норме пятый дом требует искренних, бурлящих эмоций, но десятка кубков их замораживает. Человек полностью отказывается от своей личной жизни и индивидуальной радости ради служения семье или обществу. Он заменяет свои подлинные желания формальной картинкой "как у всех" (Уэйт). Его личное творчество и сексуальность подавлены: он барахтается в своих эмоциях в полном одиночестве (Манара), убеждая себя, что его счастье теперь заключается исключительно в счастье его детей или партнера.`,
                    6: `<b>6 дом (Дева)</b><br><i>Рутинное эмоциональное обслуживание.</i> Поддержание семейной идиллии превращается в методичную работу. Человек воспринимает создание уюта и эмоционального комфорта (Уэйт) как тяжелую ежедневную обязанность, которую он выполняет механически. Он не ожидает от партнера отдачи или помощи, предпочитая выполнять свою работу в автономном режиме, полностью погружаясь в рутину и отгораживаясь от супруга стеной бытовых задач (Манара).`,
                    7: `<b>7 дом (Весы) — Экзальтация</b><br><i>Вынужденный брачный компромисс.</i> Сфера договоров и партнерства, где Сатурн экзальтирует. Десятка кубков здесь символизирует тотальное ограничение личной свободы рамками брака. Человек не может позволить себе индивидуальную радость: ему нужно ехать в отпуск с мужем и детьми, даже если он этого не хочет (Уэйт). Это суровая обязаловка, где пара связана не страстью, а долгом. Супруги живут вместе, сохраняя внешнее благополучие, но эмоционально находятся в совершенно разных комнатах, занимаясь каждый своими делами (Манара). При прямых картах человек принимает это как неизбежную и правильную плату за статус "в браке".`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Экстремальное испытание идеалов.</i> Столкнувшись с кризисом, экстримом или трансформацией, красивая иллюзия семейного счастья (Уэйт) подвергается жестокой проверке на прочность. Пытаясь спастись от боли, человек отказывается меняться, ныряя с головой в пучину своих изолированных переживаний (Манара). Он может использовать образ "идеальной семьи" как щит, игнорируя реальную катастрофу, происходящую в интимной или финансовой сфере пары.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Иллюзия абсолютного счастья.</i> В сфере мировоззрения, дальних целей и идеологии человек свято верит в социальные утопии. Он живет ожиданием "коммунизма" или рая на земле (Уэйт), где все будут счастливы по умолчанию. Ради этих абстрактных идеалов он готов принести в жертву реальные отношения. Его партнер становится лишь функцией на пути к этой великой цели, с которым не обязательно иметь эмоциональную связь (Манара).`,
                    10: `<b>10 дом (Козерог) — Первая обитель</b><br><i>Заслуженное совместное счастье.</i> Здесь энергия аркана максимально естественна. Человек достигает реального эмоционального консенсуса с миром. Он трезво оценивает, что его личные страсти должны быть подчинены интересам семьи или общего дела. Он искренне радуется коллективному результату (радуга Уэйта), принимая тот факт, что идеального счастья не бывает, но то, что есть — это надежный фундамент. В отношениях он позволяет партнеру иметь свое личное пространство, не нарушая его границ, и сам спокойно погружается в свой внутренний мир (Манара), понимая, что здоровое сосуществование важнее постоянного слияния. В негативе — жесткая фиксация на статусе "идеальной семьи", где оба глубоко несчастны, но фасад сохраняется.`,
                    11: `<b>11 дом (Водолей) — Вторая обитель</b><br><i>Формальное коллективное одобрение.</i> Сфера свободы, форс-мажоров и интеллекта, где Сатурн выступает вторым управителем. Здесь человек подменяет свою личную реакцию на жизнь чужой, социально-одобренной реакцией. Если все вокруг кричат "Ура!" и аплодируют лидеру, человек по перевернутой 10 кубков тоже вынужден формально радоваться, хотя внутренне его это никак не трогает. Он принимает коллективную эмоцию как свою (Уэйт), при этом его подлинное "я" находится в глухой изоляции, спрятанное под толщей воды (Манара). Это отношения, основанные на дружбе или социальном договоре, где эмоциональной близости нет вообще.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармическое эмоциональное одиночество.</i> В зоне социальной изоляции, подведения итогов и кармы человек полностью смиряется со своей судьбой. Он принимает тот факт, что абсолютного счастья (Уэйт) достичь не удалось, и находит утешение в глубоком мистическом одиночестве. Он отпускает все претензии к партнеру и внешнему миру, растворяясь в собственных фантазиях и водах бессознательного (Манара), где мирская суета больше не имеет над ним власти.`
                }
            },
            51: {
                name: "Туз Мечей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>Туз мечей (Туз воздуха)</b>, как и все тузы, относится к первому дому гороскопа (знак Овна) и управляется планетой <b>Марс</b>. Тузы символизируют самый чистый, базовый и первобытный импульс человека, его изначальную энергетику и животную потенцию, отвечающую на вопрос «что я могу». Воздушная масть (мечи) придает этому импульсу характер конкретного, интеллектуального или холодного технического действия.<br><br><b>Общая трактовка базовой прошивки (Туз мечей по Уэйту и Манаре) включает 4 ключевые версии:</b><br><b>1. Абсолютная инициатива и прямолинейность (по Уэйту):</b> Это мощный, ничем не ограниченный стартовый импульс. На карте изображена божественная рука, сжимающая увенчанный короной меч. Это означает способность человека принимать резкие, самостоятельные решения и наносить удар прямо в цель без колебаний. Личность действует исходя из внутренней уверенности «я могу», совершенно не нуждаясь в предварительной подготовке или сторонней помощи.<br><b>2. Техническое взаимодействие без понимания сути (по Манаре):</b> В Таро Манара Туз воздуха описывает техническую возможность контакта или половых отношений. Женщина здесь не обладает глубинным пониманием того, как именно нужно выстраивать процесс или зачем он нужен — она просто механически совершает действие, руководствуясь базовым инстинктом. Это состояние, когда человек «не заточен» под тонкое взаимодействие, но технически к нему готов.<br><b>3. Бескомпромиссное эгоистичное действие (синтез):</b> Энергия Туза мечей направлена исключительно на реализацию собственного импульса. Если человек хочет действовать, он просто делает это, не спрашивая согласия партнера, не ориентируясь на его чувства или готовность. Это метафора поведения, когда человека буквально «бросают через седло и увозят в горы», потому что инициатор так решил.<br><b>4. Холодная, безэмоциональная реализация:</b> Воздушная масть исключает водную эмпатию (кубки) или земной расчет (пентакли). Действие совершается ради самого действия. Человек просто применяет силу там, где видит преграду или цель, не вовлекаясь в процесс эмоционально.<br>Поскольку Тузы управляются Марсом, их особые положения распределяются строго по астрологическим достоинствам этой планеты в Зодиаке.`,
                houses: {
                    1: `<b>1 дом (Овен) — Первая обитель</b><br><i>Абсолютная личная инициатива.</i> Здесь карта находится в своей идеальной, родной среде. Человек обладает колоссальной решимостью и огромным запасом жизненных сил. Столкнувшись с любой жизненной задачей или вступая в отношения, он начинает действовать немедленно, без лишних рефлексий и долгих сборов. Он бьет точно в цель, демонстрируя абсолютную самостоятельность. В отношениях по Манаре — это чистая, ничем не замутненная сексуальная или коммуникативная потенция, готовность к контакту без социальных ограничений.`,
                    2: `<b>2 дом (Телец) — Второе изгнание</b><br><i>Разрушение зоны комфорта.</i> Сфера накопления, формы, физиологии и материальных ресурсов. Резкий и холодный воздух мечей разрушает земную стабильность Тельца. Вместо того чтобы планомерно накапливать ресурсы или наслаждаться чувственным, мягким контактом с партнером, человек действует механистично и грубо. Он пытается «вырубить топором» то, что требует бережного выращивания. Это ведет к потере комфорта и неадекватному растрачиванию своих базовых сил на совершенно неподходящие методы.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Прямолинейная жесткая коммуникация.</i> В сфере повседневного общения, обучения и рутинных контактов человек отказывается от тактичности. Он рубит правду-матку, общается резко и говорит именно то, что думает, без дипломатических фильтров. Как наводчик, который видит цель в прицел и бьет из пушки прямой наводкой. В ухаживаниях это проявляется как прямой и техничный «подкат» без лишней романтики.`,
                    4: `<b>4 дом (Рак) — Падение</b><br><i>Агрессия в интимной зоне.</i> Зона семьи, глубокой психики и безопасности, где необходим релакс и восстановление сил. Туз мечей (Марс) здесь падает. Вместо того чтобы отдыхать в своей «норе», человек приносит войну домой. Его распирает от неадекватной инициативы: он не способен остановиться, расслабиться и позволить партнеру или близким почувствовать себя в безопасности. Эта неконтролируемая, резкая активность внутри интимного пространства разрушает саму основу психического комфорта семьи.`,
                    5: `<b>5 дом (Лев)</b><br><i>Демонстративный волевой акт.</i> В зоне любви, эгоизма, творчества и игры человек проявляет свою волю крайне напористо. Влюбленность для него — это арена, где он должен продемонстрировать свою интеллектуальную или физическую силу. Он не склонен к мягким ухаживаниям; его творческие порывы резки, а романтические жесты похожи на вызов. Инициатива здесь — это способ потешить свое эго через действие.`,
                    6: `<b>6 дом (Дева)</b><br><i>Резкое решение рутины.</i> Столкнувшись с ежедневными обязанностями, бытом или вопросами здоровья, человек не склонен к планомерному и нудному труду. Он предпочитает «разрубать гордиевы узлы». Вместо методичного лечения он выберет хирургическую операцию; вместо планомерной уборки — радикальное выкидывание старых вещей. В отношениях он жестко пресекает бытовые дискуссии, диктуя свои правила.`,
                    7: `<b>7 дом (Весы) — Первое изгнание</b><br><i>Эгоистичное навязывание воли.</i> В зоне открытого партнерства и брака прямолинейность Туза мечей становится разрушительной. Вместо того чтобы искать компромисс и договариваться (что свойственно седьмому дому), человек включает диктат. Он действует в отношениях односторонне: «я могу это сделать, поэтому я это сделаю». Он не учитывает ни мнения, ни физической готовности партнера, относясь к нему не как к равной личности, а как к объекту для применения своей силы или удовлетворения своих инстинктов.`,
                    8: `<b>8 дом (Скорпион) — Вторая обитель</b><br><i>Экстремальный волевой прорыв.</i> Сфера кризисов, трансформации и сексуального экстрима. Вторая обитель Марса. Здесь жесткий, разрезающий импульс Туза мечей абсолютно оправдан. Столкнувшись с опасностью, давлением или находясь на пике страсти, человек способен сконцентрировать всю свою энергию в один мощный рывок. Это умение извлекать из себя скрытые резервы и совершать решительные действия (буквально «резать по живому») ради выживания или глубокого трансформационного оргазма.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Идеологический напор.</i> Выходя в широкий социум или сталкиваясь с чужими мировоззрениями, человек ведет себя как крестоносец. Он агрессивно насаждает свою идеологию, не пытаясь соблазнить или уговорить партнера. Его аргументы резки, как удары меча. Он требует быстрого и безоговорочного согласия со своими планами на будущее, не оставляя партнеру пространства для маневра.`,
                    10: `<b>10 дом (Козерог) — Экзальтация</b><br><i>Сверхнапряжение ради цели.</i> В сфере карьеры, высших достижений и социальной ответственности Туз мечей достигает точки максимального напряжения. Здесь человек действует ради глобальной самоидентификации, желая доказать миру и себе: «я могу абсолютно всё». Каждый взмах этого меча подчинен достижению конкретного статуса или преодолению мощнейших препятствий. Ради амбициозной цели личность готова работать на износ, демонстрируя феноменальную пробивную силу.`,
                    11: `<b>11 дом (Водолей)</b><br><i>Внезапный разрыв шаблонов.</i> В зоне свободы, независимости и непредсказуемого будущего человек использует Туз мечей для радикального отделения от прошлого. Столкнувшись с форс-мажором, он не паникует, а холодно и резко обрубает ненужные связи. Это способность интеллекта моментально принимать отстраненные решения, которые могут шокировать партнера своей внезапностью и хладнокровием.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Скрытый разрушительный импульс.</i> В сфере кармы, изоляции и подведения итогов человек пытается действовать там, где нужно принимать последствия. Вместо того чтобы смириться с неизбежным и переварить опыт, он начинает «махать мечом в тумане». Это слепая, подсознательная агрессия против невидимых сил или кармических обстоятельств, которая часто приводит к еще большему запутыванию ситуации и психологическим травмам.`
                }
            },
            55: {
                name: "5 Мечей",
                general: `В системе астрологического Таро Юрия Хана младший аркан <b>5 мечей (Пятерка Воздуха в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует пятому дому (знак Льва) и управляется планетой <b>Солнце</b>. Пятерки символизируют пробуждение личного сознания, свободы воли и сепарацию от родительских или общественных шаблонов. Масть мечей (воздух) указывает на конкретные действия человека, реализующие это осознанное эгоистичное желание.<br><br><b>Общая трактовка базовой прошивки (по Уэйту и Манаре) включает 4 ключевые версии:</b><br><b>1. Сепарация и отстаивание самости (по Уэйту):</b> На карте два человека уходят побежденными, а один забирает мечи. Это действие по принципу «я сам знаю, как мне жить». Человек отказывается от предложенных способов жизни и защищает собственные границы. Это бунт и отделение от родительского гнезда или социальных рамок, готовность действовать по-своему, даже если окружающие этого не одобряют.<br><b>2. Искренность без оглядки на такт (по Уэйту):</b> Действия и слова человека абсолютно искренни, но лишены дипломатии. Это высказывания, которые «срываются с языка» без злого умысла. Человек действует прямолинейно и бестактно, не думая о том, как это воспримут другие, поэтому его поведение часто воспринимается как эгоистичное и обидное.<br><b>3. Неуклюжая спонтанность (по Манаре):</b> На карте Пятерка Воздуха изображена женщина в разорванном платье, повернутая к партнеру спиной. Это описывает первое, спонтанное проявление своей влюбленности или эгоизма, когда человек не имеет опыта и действует крайне неаккуратно. Поведение парадоксальное и неуклюжее: личность делает то, что хочет, совершенно не отслеживая реакцию партнера.<br><b>4. Неоправданная агрессия и месть (в негативе):</b> В перевернутом положении или при сильном искажении аркана действия становятся намеренно резкими. Человек компенсирует свои комплексы или обиды, нанося партнеру осознанный удар или демонстрируя демонстративное пренебрежение.<br>Поскольку пятерки управляются Солнцем (и пятым домом), их особые положения распределены по астрологическим достоинствам Солнца.`,
                houses: {
                    1: `<b>1 дом (Овен) — Экзальтация</b><br>Высшая точка напряжения для Солнца. Столкнувшись с новыми обстоятельствами или на старте отношений, человек демонстрирует крайнюю решимость. Пятерка мечей здесь — это резкое, безапелляционное выказывание своего желания. Личность сразу заявляет: «я буду делать так, как считаю нужным», и готова пойти на открытый конфликт с первых же секунд контакта, отстаивая свою инициативу.`,
                    2: `<b>2 дом (Телец)</b><br><i>Своевольное расходование ресурсов.</i> В сфере финансов, тела и материальной базы человек ведет себя исключительно эгоистично. Он использует материальные ресурсы партнера или свои собственные деньги только для удовлетворения сиюминутных прихотей. Физиологический контакт происходит грубо и без оглядки на комфорт партнера, удовлетворяя лишь личный инстинкт.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Бестактная повседневная коммуникация.</i> В рутинном общении, поездках и передаче информации человек общается прямолинейно и бескомпромиссно. Он легко разрывает контакты с приятелями или соседями, если они ему не интересны. Высказывания остры, эгоцентричны и не фильтруются правилами вежливости.`,
                    4: `<b>4 дом (Рак) — Вторая обитель</b><br>Сфера дома, безопасности и подсознания (Солнце — внутренний управитель Рака). В интимном пространстве или в родительском доме человек начинает вести себя вызывающе и протестовать против устоявшихся законов семьи. Это склонность к домашним скандалам и подростковый бунт. Личность использует зону комфорта для того, чтобы безнаказанно проявлять свой эгоизм и капризы, разрушая семейный покой.`,
                    5: `<b>5 дом (Лев) — Первая обитель</b><br>Идеальная, естественная среда для аркана. Человек действует абсолютно независимо и свободно, опираясь только на свое «хочу». Он осознанно отбрасывает чужие стереотипы, находя свой уникальный, индивидуальный способ поведения. В отношениях это период игры, влюбленности и флирта, когда человек искренне демонстрирует себя, не беря на себя тяжелых обязательств.`,
                    6: `<b>6 дом (Дева)</b><br><i>Индивидуализм в рутине.</i> Выполняя повседневные рабочие обязанности или решая бытовые вопросы, человек наотрез отказывается следовать инструкциям. Он изобретает собственные, нестандартные и часто неудобные для окружающих методы работы, настаивая на том, что его личный способ служения является единственно верным.`,
                    7: `<b>7 дом (Весы) — Падение</b><br>Зона брака и официального партнерства, где Солнце и эгоизм падают. Применение Пятерки мечей здесь катастрофично для союза. Находясь в отношениях, человек ведет себя так, словно он абсолютно свободен и не имеет обязательств. Он демонстративно игнорирует интересы супруга, принимая решения единолично, что неизбежно ведет к разрыву связей и расторжению договора.`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Своеволие в экстриме.</i> Столкнувшись с кризисом, чужими ресурсами или глубокой сексуальной трансформацией, личность действует максимально резко и автономно. Человек может безжалостно обрубить кармические или финансовые узлы, чтобы спасти свое эго, проявляя в сексе парадоксальную, эгоцентричную агрессию без эмоционального вовлечения.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Идеологический бунт.</i> В сфере формирования планов на будущее, веры и авторитетов человек категорически отказывается принимать чужую систему ценностей. Он агрессивно отстаивает свое мировоззрение, не идет ни на какие компромиссы с социумом или партнером и грубо отвергает любые попытки выступить для него наставником.`,
                    10: `<b>10 дом (Козерог) — Второе изгнание</b><br>Сфера социальной реальности, статуса и профессии. Здесь эгоистичные, игровые действия пятерки вступают в конфликт с ответственностью. Человек отказывается выполнять свои социальные или карьерные обязанности всерьез, предпочитая баловаться или работать только тогда, когда у него есть настроение. Это позиция «хохмача» или безответственного сотрудника, который пытается применить творческую вольницу в жестких корпоративных рамках.`,
                    11: `<b>11 дом (Водолей) — Первое изгнание</b><br>Острый конфликт между личным эгоизмом и независимым будущим. В сфере свободы и коллективов водолейское поведение по 5 мечей кажется окружающим намеренно обидным и запутанным. Человек пытается быть независимым, но его резкие действия воспринимаются друзьями или партнером как издевательство или намеренное пудрение мозгов. Вместо того чтобы объединяться, он грубо отталкивает людей, вызывая непонимание и отчуждение.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Эгоистичная изоляция.</i> Столкнувшись с неизбежными последствиями или находясь в социальной изоляции, человек продолжает действовать по-своему, отказываясь смиряться с объективной реальностью. Он резко обрывает связи, уходя в своевольное одиночество, и тайно, без оглядки на кармические уроки, реализует свои личные прихоти.`
                }
            },
            56: {
                name: "6 Мечей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>6 мечей (Шестерка Воздуха в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует шестому дому (знак Девы) и управляется планетами Прозерпина и Меркурий. Шестерки символизируют конкретный, осознанный выбор формы своей жизни, умение анализировать детали и распределять ресурсы после хаоса пятого дома. Масть мечей (воздух) указывает на то, что этот выбор реализуется через отработанные, точные действия и рациональное мышление.<br><br>Общая трактовка базовой прошивки личности по 6 мечей включает 4 ключевые версии:<br><b>1. Отточенный навык и проторенный путь (по Уэйту):</b> Человек действует максимально выверенно, опираясь на те навыки, которые он уже довел до автоматизма. На карте изображен лодочник, везущий пассажиров: это символ того, что личность выбирает привычную, безопасную стратегию, чтобы без лишних эмоций и ошибок переплыть от проблем к стабильности.<br><b>2. Искусственный фасад и обман восприятия (по Манаре):</b> На карте Шестерка Воздуха показана колоссальная разница между реальным состоянием женщины и тем образом, который она демонстрирует окружающим. Это поведение, при котором человек сознательно выстраивает иллюзорный имидж, скрывая свою истинную суть или неблаговидные мотивы за привлекательной маской.<br><b>3. Холодная дистанция и манипуляция (синтез):</b> В отношениях человек не вовлекается глубоко и не теряет контроля. Он прагматично применяет свои отточенные коммуникативные навыки и искусственный фасад для управления ситуацией, оставаясь внутренне независимым исследователем, который просто «делает свою работу».<br><b>4. Унылая рутина и бегство от жизни (в негативе):</b> При искажении энергии страх совершить новую ошибку заставляет личность полностью отказаться от спонтанности. Жизнь превращается в унылое, механическое повторение одних и тех же действий (движение по проторенной дорожке на кладбище), где за мнимым спокойствием скрывается глубокая инфантильность и обреченность.<br>Поскольку шестерки мечей привязаны к шестому дому и его управителям, их особые положения распределены по астрологическим достоинствам Меркурия и Прозерпины.<br><br>### Особые положения 6 мечей<br><br><b>6 дом (Дева) — Первая обитель</b> <i>Отточенное мастерство</i> Идеальная и естественная среда для аркана. Человек гениально анализирует ситуацию и применяет свои доведенные до автоматизма навыки для создания комфортного образа жизни. По Уэйту, его действия точны и безошибочны: он уверенно управляет «лодкой» своей судьбы, грамотно распределяя роли. По Манаре, личность виртуозно контролирует свой имидж, сознательно подбирая ту «маску» или форму поведения, которая будет максимально выгодна и удобна в данный момент, полностью управляя восприятием партнера.<br><br><b>3 дом (Близнецы) — Вторая обитель</b> <i>Рациональная коммуникация</i> Сфера повседневного общения, обучения и рутинных контактов. Здесь действия человека направлены на установление формальных и безопасных связей. Он использует проверенные, шаблонные речевые конструкции и привычные методы взаимодействия (Уэйт). В диалоге такой человек демонстрирует лишь ту часть себя, которая ожидается собеседником, скрывая истинные мысли и эмоции за словесной ширмой или искусственно созданным образом (Манара).<br><br><b>12 дом (Рыбы) — Первое изгнание</b> <i>Крах иллюзий</i> Сфера изоляции, тайн, кармы и скрытых итогов. Катастрофическое положение, где отработанные методы и привычные жизненные маршруты абсолютно не работают. Попадая в мутную, неконтролируемую ситуацию, человек по привычке пытается спастись, надевая фальшивую маску (Манара), но этот обман мгновенно вскрывается мистическими обстоятельствами двенадцатого дома. Вместо тихого плавания к новому берегу личность рискует утонуть в последствиях собственного лицемерия и жестких кармических долгов.<br><br><b>9 дом (Стрелец) — Второе изгнание</b> <i>Столкновение идеалов</i> Сфера мировоззрения, социальных амбиций и согласования желаний. Возникает острый конфликт между узкими, повседневными навыками человека и масштабными требованиями будущего. Личность упорно пытается вписать чужие авторитетные идеи в свою маленькую, привычную «лодку» (Уэйт). Чтобы казаться более значимым в глазах партнера или социума, человек начинает использовать дешевую имиджевую манипуляцию, которая выглядит неуместно на фоне серьезных стратегических задач (Манара).<br><br><b>11 дом (Водолей) — Экзальтация</b> <i>Интеллектуальная отстраненность</i> Зона непредсказуемого будущего, друзей и свободы. Высшая точка напряжения для ментальной стихии. Сталкиваясь с форс-мажорами и водолейским хаосом, человек экстренно мобилизует весь свой интеллект и хладнокровие. Он гениально отсекает лишние эмоции, используя свой искусственный фасад как идеальный щит от непредсказуемого общества (Манара), и технично, без единой ошибки, выруливает свою лодку из любых кризисных обстоятельств (Уэйт).<br><br><b>5 дом (Лев) — Падение</b> <i>Провал холодной игры</i> Сфера радости, искренней влюбленности и чистого эгоизма. Полный провал для рациональной и расчетливой энергетики. Как только человек пытается искренне влюбиться, проявить естественное творчество или просто порадоваться жизни, его привычка действовать механически (Уэйт) и постоянно носить маски (Манара) всё портит. Фальшь, холодный расчет и неспособность к подлинной спонтанности становятся очевидными, превращая праздник в искусственное, фальшивое представление.`,
                houses: {
                    1: `<b>1 дом (Овен)</b><br><i>Продуманная инициатива</i> На самом старте новых отношений или проектов человек категорически избегает агрессивного марсианского напора. Его первый шаг — это расчетливое, уже знакомое ему действие (Уэйт). Он выходит к партнеру не с открытым забралом, а сразу демонстрируя тщательно подготовленный, иллюзорный фасад, чтобы с первых секунд задать нужную дистанцию и управлять впечатлением о себе (Манара).`,
                    2: `<b>2 дом (Телец)</b><br><i>Прагматичная выгода</i> В зоне финансов, тела и материального комфорта личность действует строго по проторенной дорожке. Человек использует свои отточенные практические навыки (Уэйт) и умение манипулировать внешним видом (Манара) исключительно для удержания финансовой стабильности. К партнеру он относится прагматично, как к пассажиру своей лодки, который должен оплачивать безопасное плавание.`,
                    3: `<b>3 дом (Близнецы) — Вторая обитель</b><br><i>Рациональная коммуникация</i> Сфера повседневного общения, обучения и рутинных контактов. Здесь действия человека направлены на установление формальных и безопасных связей. Он использует проверенные, шаблонные речевые конструкции и привычные методы взаимодействия (Уэйт). В диалоге такой человек демонстрирует лишь ту часть себя, которая ожидается собеседником, скрывая истинные мысли и эмоции за словесной ширмой или искусственно созданным образом (Манара).`,
                    4: `<b>4 дом (Рак)</b><br><i>Защитный фасад</i> В интимном пространстве семьи, рода и базовой безопасности человек избегает глубоких душевных привязанностей. Дом для него — это хорошо отлаженный механизм (Уэйт). Чтобы не обнажать свои уязвимости перед родственниками, он носит удобную психологическую маску, надежно скрывая свои реальные переживания за ширмой внешнего бытового благополучия (Манара).`,
                    5: `<b>5 дом (Лев) — Падение</b><br><i>Провал холодной игры</i> Сфера радости, искренней влюбленности и чистого эгоизма. Полный провал для рациональной и расчетливой энергетики. Как только человек пытается искренне влюбиться, проявить естественное творчество или просто порадоваться жизни, его привычка действовать механически (Уэйт) и постоянно носить маски (Манара) всё портит. Фальшь, холодный расчет и неспособность к подлинной спонтанности становятся очевидными, превращая праздник в искусственное, фальшивое представление.`,
                    6: `<b>6 дом (Дева) — Первая обитель</b><br><i>Отточенное мастерство</i> Идеальная и естественная среда для аркана. Человек гениально анализирует ситуацию и применяет свои доведенные до автоматизма навыки для создания комфортного образа жизни. По Уэйту, его действия точны и безошибочны: он уверенно управляет «лодкой» своей судьбы, грамотно распределяя роли. По Манаре, личность виртуозно контролирует свой имидж, сознательно подбирая ту «маску» или форму поведения, которая будет максимально выгодна и удобна в данный момент, полностью управляя восприятием партнера.`,
                    7: `<b>7 дом (Весы)</b><br><i>Договорное партнерство</i> Вступая в брак или открытые договоренности, человек строго придерживается распределенных ролей. В паре нет места бурным страстям; отношения строятся как слаженная работа лодочника и пассажира, где каждый выполняет свою функцию (Уэйт). Партнеры могут годами сохранять союз, поддерживая иллюзию идеальной семьи для социума, но оставаясь внутренне отстраненными манипуляторами (Манара).`,
                    8: `<b>8 дом (Скорпион)</b><br><i>Техничное выживание</i> Сталкиваясь с глубокими кризисами, экстримом или тяжелой сексуальной трансформацией, человек полностью отключает панику. Он преодолевает опасность выверенными, доведенными до автоматизма действиями (Уэйт). В сексуальной сфере он делает ставку на техничность и визуальную провокацию, оставаясь внутри абсолютно закрытым и сохраняя полный контроль над своими инстинктами (Манара).`,
                    9: `<b>9 дом (Стрелец) — Второе изгнание</b><br><i>Столкновение идеалов</i> Сфера мировоззрения, социальных амбиций и согласования желаний. Возникает острый конфликт между узкими, повседневными навыками человека и масштабными требованиями будущего. Личность упорно пытается вписать чужие авторитетные идеи в свою маленькую, привычную «лодку» (Уэйт). Чтобы казаться более значимым в глазах партнера или социума, человек начинает использовать дешевую имиджевую манипуляцию, которая выглядит неуместно на фоне серьезных стратегических задач (Манара).`,
                    10: `<b>10 дом (Козерог)</b><br><i>Профессиональный автоматизм</i> В сфере карьеры, социального статуса и жестких обязательств человек действует как идеальный винтик системы. Он методично и безошибочно выполняет свою рутинную работу, не пытаясь прыгнуть выше головы (Уэйт). Чтобы добиться расположения начальства, он гениально мимикрирует, транслируя социуму ровно ту картинку и тот профессиональный имидж, которые от него ожидают получить (Манара).`,
                    11: `<b>11 дом (Водолей) — Экзальтация</b><br><i>Интеллектуальная отстраненность</i> Зона непредсказуемого будущего, друзей и свободы. Высшая точка напряжения для ментальной стихии. Сталкиваясь с форс-мажорами и водолейским хаосом, человек экстренно мобилизует весь свой интеллект и хладнокровие. Он гениально отсекает лишние эмоции, используя свой искусственный фасад как идеальный щит от непредсказуемого общества (Манара), и технично, без единой ошибки, выруливает свою лодку из любых кризисных обстоятельств (Уэйт).`,
                    12: `<b>12 дом (Рыбы) — Первое изгнание</b><br><i>Крах иллюзий</i> Сфера изоляции, тайн, кармы и скрытых итогов. Катастрофическое положение, где отработанные методы и привычные жизненные маршруты абсолютно не работают. Попадая в мутную, неконтролируемую ситуацию, человек по привычке пытается спастись, надевая фальшивую маску (Манара), но этот обман мгновенно вскрывается мистическими обстоятельствами двенадцатого дома. Вместо тихого плавания к новому берегу личность рискует утонуть в последствиях собственного лицемерия и жестких кармических долгов.`
                }
            },
            57: {
                name: "7 Мечей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>7 мечей (Семерка Воздуха в колоде Манара)</b> относится ко второй (сознательной) зоне гороскопа, соответствует седьмому дому (знак Весов) и управляется планетой <b>Хирон</b> (а также Венерой). Семерки символизируют начало осознанного взаимодействия с другими людьми, где человек учится соизмерять свои действия с реакцией партнера. Масть мечей (воздух) указывает на конкретные, продуманные интеллектуальные действия и коммуникацию.<br><br>Общая трактовка базовой прошивки личности (или социальной роли) по 7 мечей включает <b>4 ключевые версии</b>:<br><b>1. Дипломатия и самоограничение (по Уэйту):</b> На карте человек уносит пять мечей и оставляет два, постоянно оглядываясь. Это означает осознанный отказ от своего гипертрофированного эгоизма (пятерки) ради установления связи с партнером. Человек действует деликатно, не вываливая на партнера все свои проблемы или особенности сразу, а дозированно тестирует, что будет принято, а что нет.<br><b>2. Избирательная открытость и скромность (по Манаре):</b> На карте изображена женщина в костюме невесты, прикрывающая свою половую сферу, но приподнимающая платье. Это поведение, при котором человек сохраняет свои личные границы закрытыми до момента подлинной близости, демонстрируя скромность и сдержанность, но при этом ожидая инициативы и подтверждения намерений от мужчины.<br><b>3. Постоянное тестирование партнера (Синтез):</b> Человек ни на секунду не забывает, что он не один. Любое его действие сопровождается "оглядкой" на то, как это воспринято. Это виртуозный поиск точек соприкосновения, вычисление тех, кто на вашей стороне, и отсеивание тех, с кем каши не сваришь.<br><b>4. Манипулятивная игра и фальшь (В негативе):</b> При искажении энергии (перевернутая карта) осторожность превращается в двуличие. Человек использует маску «невинной невесты» (Манара) или ведет тайную игру за спиной партнера (Уэйт), избегая прямых конфликтов, но действуя исключительно в своих тайных интересах, обманывая ожидания окружающих.<br>Поскольку Семерки мечей управляются Хироном (и Венерой), их особые положения распределены по астрологическим достоинствам этих планет в зодиакальном круге (Хирон: 1 обитель в Весах, 2 обитель в Тельце, 1 изгнание в Овне, 2 изгнание в Скорпионе, Экзальтация в Близнецах, Падение в Стрельце).`,
                houses: {
                    1: `<b>1 дом (Овен) — Первое изгнание</b><br><i>Оглядка на старте</i> Сфера базовой животной инициативы (Марс) конфликтует с необходимостью дипломатии (Хирон). Человек хочет проявить личную инициативу, "взять свое", но его природный порыв блокируется постоянной оглядкой на партнера. Из-за страха, что его действия будут не приняты (Семерка кубков), он действует неуклюже: бросает импульс, но постоянно тормозит себя, пытаясь согласовать каждый свой шаг, что в первом доме выглядит как потеря уверенности и мужской (или стартовой) силы.`,
                    2: `<b>2 дом (Телец) — Вторая обитель</b><br><i>Материальный компромисс</i> Здесь навыки дипломатии и сдерживания себя (Хирон) работают на обеспечение материальной или физиологической стабильности (Венера). Человек ведет себя крайне аккуратно и "правильно", чтобы не потерять ресурсы партнера или комфорт. В негативном варианте это скрытые манипуляции: личность делает вид, что во всем согласна с партнером, но втихаря, за его спиной, все равно делает то, что считает выгодным для себя лично.`,
                    3: `<b>3 дом (Близнецы) — Экзальтация</b><br><i>Виртуозная коммуникация</i> В сфере повседневного общения, информации и рутинных контактов Хирон достигает высшего напряжения. Здесь осторожность и умение тестировать реакцию партнера превращаются в блестящую словесную эквилибристику (например, пикап или НЛП). Человек мгновенно находит нужные слова, которые цепляют собеседника, при этом сам он остается внутренне закрытым, не раскрывая своих истинных мотивов, используя слова как инструмент для быстрой привязки партнера к себе.`,
                    4: `<b>4 дом (Рак)</b><br><i>Защитная скрытность</i> В сфере базовой безопасности, рода и интимного домашнего пространства человек не позволяет себе полностью расслабиться. Он ведет себя с домочадцами подчеркнуто корректно, скрывая часть своих истинных переживаний или проблем (оставляет мечи за дверью), чтобы не нарушить хрупкий семейный покой. Дом для него — это место, где нужно поддерживать фасад "правильных" отношений.`,
                    5: `<b>5 дом (Лев)</b><br><i>Осторожный флирт</i> В зоне любви, творчества и чистого эгоизма человек не способен на спонтанную, безумную страсть. Его влюбленность строго контролируется. Он играет роль скромника или "невесты" (Манара), постоянно отслеживая, какой эффект его творчество или флирт производит на объект воздыхания. Вся радость профильтровывается через страх быть отвергнутым.`,
                    6: `<b>6 дом (Дева)</b><br><i>Выверенная рутина</i> При выполнении повседневных трудовых обязанностей, в быту или в вопросах здоровья человек действует строго по регламенту. Он не берет на себя лишнюю ответственность (уносит только то, что может), дипломатично обходит конфликты с коллегами и начальством, идеально подстраивая свои рабочие навыки под требования тех, от кого он зависит.`,
                    7: `<b>7 дом (Весы) — Первая обитель</b><br><i>Идеальная дипломатия</i> Естественная и самая комфортная среда для аркана. Человек гениально выстраивает партнерские отношения, будь то брак или деловой союз. Он осознанно сдерживает свои эгоистичные порывы, демонстрирует порядочность, деликатность и абсолютную адекватность в общении. Партнер для него — это ценность, поэтому он действует только с оглядкой на его реакцию, не провоцируя конфликты, а находя идеальный компромисс и точки соприкосновения.`,
                    8: `<b>8 дом (Скорпион) — Второе изгнание</b><br><i>Сдерживание в трансформации</i> Сфера глубокого кризиса, трансформации и экстрима. Сталкиваясь с тяжелой ситуацией или глубоким сексуальным взаимодействием, человек пытается применять поверхностную дипломатию там, где нужно меняться полностью. Он «копошится» в процессе, придерживает свои истинные эмоции (оставляет мечи) и пытается регулировать то, что уже должно было стать общим результатом. Это намеренное торможение перемен ради сохранения хоть какого-то контроля.`,
                    9: `<b>9 дом (Стрелец) — Падение</b><br><i>Крах идеологического авторитета</i> Сфера глобального будущего, смыслов, религии и согласования желаний. Катастрофа для осторожных и локальных действий 7 мечей. Пытаясь построить глобальные планы или выступить в роли духовного наставника, человек использует мелкую дипломатию или "прикидывается невестой", что на масштабном уровне выглядит как дешевое лицемерие. Его попытки хитрить и скрывать свои истинные взгляды разбиваются об объективную реальность, лишая его авторитета и доверия со стороны партнера.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Карьерная дипломатия</i> В сфере социального статуса и столкновения с объективной государственной реальностью человек продвигается к цели крайне осторожно. Он не лезет на рожон, а аккуратно изучает расстановку сил в иерархии, скрывая свои истинные карьерные амбиции до тех пор, пока не поймет, что начальство готово их принять. Это поведение хитрого политика.`,
                    11: `<b>11 дом (Водолей)</b><br><i>Отстраненное наблюдение</i> Столкнувшись с форс-мажорами, коллективами или непредсказуемым будущим, человек использует 7 мечей для дистанцирования. Он находится в группе друзей, но держит "фигу в кармане", не раскрывая своих настоящих планов. Это способность умно и дипломатично выскользнуть из-под социального давления, сохранив независимость.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Тайные манипуляции</i> В зоне изоляции, скрытых кармических последствий и тайн человек действует абсолютно незаметно. Он плетет интриги или решает свои психологические проблемы так, чтобы внешний мир вообще ничего не заподозрил. Внешне он демонстрирует полное смирение, но тайно убирает из своей жизни те "мечи", которые приносят ему боль, не ставя партнера в известность.`
                }
            },
            58: {
                name: "8 Мечей",
                general: `В астрологической системе Таро Юрия Хана числовые карты-восьмерки относятся ко второй (сознательной) зоне гороскопа, соответствуют восьмому дому (знак Скорпиона, стихия Воды) и управляются планетой <b>Плутон</b> (и внутренне Марсом). Они символизируют реальный, промежуточный результат сознательных действий человека, трансформацию его личности и оценку того, что он получил от взаимодействия с партнером или миром. Воздушная масть (мечи) указывает на то, что эти изменения происходят не только на уровне физических действий, но и в сфере оформленных мыслей, интеллекта и коммуникации.<br><br>Общая базовая трактовка 8 мечей (Восьмерки Воздуха в колоде Манара) включает в себя <b>четыре ключевые версии</b>:<br><b>1. Хладнокровная «первая помощь» (по Уэйту):</b> На карте связанная женщина среди мечей символизирует ситуацию, когда необходимо срочно остановить негативный процесс или кровотечение (наложить жгут). Это не полноценное лечение, а экстренная мера, чтобы не допустить ухудшения ситуации (например, абсцесса или заражения), умение вовремя перевязать рану после конфликта седьмого дома.<br><b>2. Доверие собственному разуму без паники (по Уэйту):</b> Человек с завязанными глазами в окружении мечей не боится того, что его же собственные мысли или действия (мечи) нанесут ему вред. Это объемное, многостороннее решение проблемы, когда личность, попав в экстремальные условия, отключает панику и полностью доверяет своему интеллекту, понимая, какое действие необходимо совершить для спасения.<br><b>3. Провокация инстинкта охотника (по Манаре):</b> На карте изображена женщина, убегающая от монстра. В позитивном ключе это намеренная игра в «жертву и охотника», когда женщина убегает именно для того, чтобы мужчина ее догнал и поймал, пробуждая в нем первобытный инстинкт.<br><b>4. Пассивная манипуляция и жалобы (Синтез/Негатив):</b> Человек использует свою искусственную или реальную скованность (веревки) для манипуляции. Это выставление себя пострадавшим: «я из-за тебя сижу дома», «ты меня никуда не водишь», чтобы вызвать у партнера чувство вины и спровоцировать его на компенсацию. В негативе Манары это также может быть склонность к деструкции — потребность найти «страшного серого волка», который тебя сожрет.<br>Поскольку восьмерки управляются Плутоном, их особые положения распределены по его астрологическим достоинствам.`,
                houses: {
                    1: `<b>1 дом (Овен) — Вторая обитель</b><br><i>Скрытая провокация импульса</i> В сфере базовой инициативы и стартовой энергетики человеку не хватает собственных прямых сил (тузов), поэтому он использует восьмерки. Вместо прямой инициативы человек демонстрирует свою слабость, нерешительность или играет роль «убегающей жертвы» (Манара), чтобы спровоцировать партнера на первый шаг. В позитивном варианте это мудрое использование чужой энергии для запуска собственных процессов, в негативном — полная потеря контроля над ситуацией с первых же минут общения из-за искусственной закрытости (завязанных глаз).`,
                    2: `<b>2 дом (Телец) — Первое изгнание</b><br><i>Манипуляция ради комфорта</i> В сфере накопления и личных ресурсов человек отказывается трансформироваться. Сталкиваясь с необходимостью меняться ради отношений (восьмой дом), личность закрывает глаза и требует: «принимай меня таким, какой я есть». Свои жалобы на связанность или позицию убегающей жертвы (Манара) человек использует сугубо в корыстных целях — чтобы удержать материальную базу или получить физиологический комфорт, избегая подлинного энергетического обмена и болезненных трансформаций.`,
                    3: `<b>3 дом (Близнецы)</b><br><i>Продуманная словесная пауза</i> В сфере рутинных контактов и общения человек избегает открытых и прямолинейных высказываний. Оказавшись в сложной беседе, он берет паузу, искусственно ограничивая свой речевой поток (мечи), чтобы обдумать ситуацию. Он может играть роль человека, который «ничего не видит и не понимает», чтобы избежать лишней ответственности в информационном обмене.`,
                    4: `<b>4 дом (Рак)</b><br><i>Изоляция в убежище</i> В интимной сфере семьи и базовой безопасности человек использует механизмы восьмерки мечей для защиты своего покоя. Столкнувшись с домашним кризисом, он применяет «первую помощь» — изолируется, замораживает эмоции и обрубает панику, чтобы остановить развитие конфликта. В негативе это убегание от родственников и демонстрация своих душевных травм напоказ.`,
                    5: `<b>5 дом (Лев) — Экзальтация</b><br><i>Трансформация через любовь</i> Сфера радости, эгоизма, творчества и влюбленности, где Плутон (управитель восьмерок) экзальтирует. Здесь человек ставит перед собой высшую цель: он не просто хочет влюбиться, он хочет, чтобы эта любовь радикально и экстремально его изменила. Человек осознанно и бесстрашно погружается в романтическую зависимость или сложную игру, используя свой интеллект (мечи), чтобы выжать из отношений максимальный трансформирующий эффект для своей личности.`,
                    6: `<b>6 дом (Дева)</b><br><i>Экстремальная рутинная точность</i> В вопросах труда, быта и служения человек доверяет своим отточенным, машинным навыкам. Он способен выполнять работу буквально «с закрытыми глазами», хладнокровно решая мелкие кризисы на рабочем месте. В медицинском аспекте это может быть буквальное наложение повязок, гипса или работа хирургической медсестры.`,
                    7: `<b>7 дом (Весы) — Второе изгнание</b><br><i>Пассивные претензии партнеру</i> В сфере брака и открытых договоров человек не может действовать прямо, поэтому прибегает к манипуляциям. Вместо открытого диалога он выставляет себя пострадавшим. Это постоянные жалобы на то, что партнер лишает его свободы (связанная женщина Уэйта), цель которых — внушить партнеру чувство долга. Отношения превращаются в тягомотину, где один постоянно убегает (или жалуется), а другой вынужден его догонять и компенсировать мнимые страдания.`,
                    8: `<b>8 дом (Скорпион) — Первая обитель</b><br><i>Идеальное решение экстрима</i> Здесь карта находится в своей самой естественной среде. Человек идеально справляется с промежуточными результатами кризиса. Он не паникует, а технично оказывает «первую помощь» ситуации, останавливая негативные процессы. В отношениях это способность через игру в «жертву и охотника» (по Манаре) достичь мощной сексуальной или энергетической трансформации, когда экстремальная ситуация используется для укрепления связи и получения глубокого совместного результата без разрушения костяка личности.`,
                    9: `<b>9 дом (Стрелец)</b><br><i>Страх перед будущим</i> Выстраивая долгосрочные планы или философские мировоззрения, человек боится смотреть вперед. Он ощущает себя связанным текущим кризисом и не видит перспектив (завязанные глаза). В отношениях он может намеренно провоцировать партнера идеологическими спорами, отступая и жалуясь, чтобы проверить, насколько партнер готов бороться за их совместное будущее.`,
                    10: `<b>10 дом (Козерог)</b><br><i>Формальное ограничение инициативы</i> В сфере социальной карьеры и столкновения с государственной машиной человек вынужденно соглашается на жесткие ограничения. Он понимает, что система связала его по рукам и ногам правилами. Вместо того чтобы сопротивляться, он холодно и интеллектуально выжидает, не делая лишних движений, чтобы не навлечь на себя административный гнев (опасение попасть под удар собственных мечей).`,
                    11: `<b>11 дом (Водолей) — Падение</b><br><i>Паралич перед непредсказуемостью</i> Сфера форс-мажоров, чужой свободы и независимого будущего (где Плутон находится в падении). Столкнувшись с хаотичным поведением коллектива или водолейской отстраненностью партнера, отработанные методы манипуляции «жертвы» не срабатывают. Женщина бежит, ожидая, что ее догонят (Манара), а партнер-Водолей просто уходит в другую сторону. Это вызывает настоящий ступор и шок: завязанные глаза Уэйта становятся символом полной ментальной дезориентации и неспособности предвидеть последствия в неконтролируемой среде.`,
                    12: `<b>12 дом (Рыбы)</b><br><i>Кармическая покорность</i> Сталкиваясь со скрытыми итогами, тайными врагами или изоляцией, человек принимает позицию абсолютного невмешательства. Он понимает, что оказался в экстремальных условиях, которые от него не зависят. Доверяя ходу судьбы, он не делает резких движений, чтобы не усугубить свою карму, используя остановку действий как единственный способ выжить в тумане двенадцатого дома.`
                }
            },
            59: {
                name: "9 Мечей",
                general: `В астрологической системе Таро Юрия Хана младший аркан <b>9 мечей (Девятка Воздуха в колоде Манара)</b> открывает третью (социальную) зону гороскопа, соответствует девятому дому (знак Стрельца) и управляется планетой <b>Юпитер</b> (внутренний управитель — Нептун). Девятки символизируют начало осознанного взаимодействия с большим социумом, предвидение будущего, построение планов и согласование своих желаний с окружающим миром. Воздушная масть (мечи) придает этому процессу интеллектуальный характер: это мысли, идеи и отложенные или спланированные действия.<br><br>Общая трактовка этой базовой прошивки (по колодам Уэйта и Манара) включает <b>четыре ключевые версии</b>:<br><b>1. Трезвое моделирование и ожидание (по Уэйту):</b> Человек проснулся (сидит на кровати), но еще не действует. Он понимает, что для реальных действий время еще не пришло. Это адекватное осознание того, что ситуацию нужно сначала смоделировать в голове. Человек аккумулирует силы, выжидает и готовится к рывку, предвидя будущие многовариантные последствия своих шагов и сдерживая свою силу до поры до времени.<br><b>2. Пассивное выжидание и страх будущего (в негативе по Уэйту):</b> Человек прячется под одеяло от пугающей реальности. Вся его активность сводится к фантазиям, страхам и слепой вере, что «всё образуется само собой». Это отказ от реальных поступков, парализующая паника и позиция «ждать и верить, но не делать», надеясь, что другие люди или Высшие силы решат проблему за него.<br><b>3. Искусственный фасад и порционная выдача (по Манаре):</b> На карте Девятка Воздуха изображена маска (нарисованная картина женщины) и лишь одна настоящая нога. Человек не открывается партнеру полностью. Он использует искусственно созданный имидж, выдавая информацию и себя строго дозированно (порциями, как Шехерезада в «1001 ночи»), чтобы держать партнера в напряжении и интриговать, скрывая свою настоящую суть.<br><b>4. Манипуляция через загадочность (Синтез):</b> В отношениях человек действует как рыбак, использующий прикормку. Это игра, где показная пассивность или частичная откровенность заставляют партнера самого проявлять инициативу. Это тонкая социальная дрессировка через недосказанность и дистанцию, чтобы обеспечить себе власть в будущих отношениях.<br>Поскольку девятки управляются Юпитером, их особые положения строго распределены по астрологическим достоинствам этой планеты.`,
                houses: {
                    1: `<b>1 дом (Овен) — Искусственный старт</b><br>В зоне базового животного импульса и личной инициативы человек блокирует свою естественную, открытую марсианскую агрессию. Вместо того чтобы активно и честно добиваться желаемого, он надевает привлекательную маску и порционно выдает информацию о себе, выжидая, пока партнер или обстоятельства сделают первый шаг. Это подмена открытого действия хитрым, манипулятивным выжиданием.`,
                    2: `<b>2 дом (Телец) — Иллюзия ресурса</b><br>В сфере финансов, тела и накоплений человек создает видимость материального благополучия или физического здоровья. Он выставляет напоказ красивую «витрину» (как нарисованная женщина у Манары), демонстрируя мнимый достаток, тогда как за этой ширмой скрываются страхи, долги, дефициты или полное отсутствие реальных ресурсов для обеспечения долгосрочных отношений.`,
                    3: `<b>3 дом (Близнецы) — Первое изгнание</b><br><i>Рассеянность и неадекватность.</i> Возникает острый конфликт между необходимостью действовать естественно, просто и открыто (по третьему дому) и зависанием девяток. Человек ведет себя неадекватно, как будто только что проснулся (типичная рассеянность «с просонья» по Уэйту). Естественная коммуникация нарушается: вместо того чтобы сказать прямо, человек ходит вокруг да около, использует маски или просто впадает в ступор. Попытки применять сложную многоходовую манипуляцию в банальных бытовых вопросах выглядят нелепо и лишь запутывают собеседника.`,
                    4: `<b>4 дом (Рак) — Экзальтация</b><br><i>Тревожное пробуждение.</i> Сфера базовой безопасности, интимного пространства и дома. Высшая точка напряжения для энергии Юпитера. Вместо того чтобы отдыхать и восстанавливать силы в своей зоне комфорта (по лунным четверкам), человек испытывает острую тревогу за будущее. Он словно просыпается посреди ночи в холодном поту, предчувствуя, что ему предстоит сделать. В негативе это разрушение домашнего покоя надуманными страхами. В позитиве — это мгновенная мобилизация организма и готовность вскочить с кровати, чтобы действовать при малейшем изменении внешней ситуации (как мать, мгновенно просыпающаяся от крика ребенка).`,
                    5: `<b>5 дом (Лев) — Театральная отстраненность</b><br>В зоне любви, радости, эгоизма и творчества искренняя страсть подменяется продуманной игрой. Человек не вовлекается в романтику полностью; он находится в позиции холодного наблюдателя, который сидит «под одеялом» и лишь дразнит партнера кусочками внимания, наслаждаясь производимым эффектом. Это расчетливый флирт без подлинной душевной отдачи.`,
                    6: `<b>6 дом (Дева) — Второе изгнание</b><br><i>Паралич перед рутиной.</i> В сфере повседневного труда, служения, здоровья и методичного выбора человек наотрез отказывается действовать самостоятельно. Столкнувшись с необходимостью решать конкретные рутинные задачи, он впадает в панику или апатию. Он ожидает, что кто-то другой (авторитет, врач, гуру) придет и буквально «за ручку» проведет его через все проблемы или сделает всю работу за него. Реальный, планомерный труд подменяется сидением под одеялом и пассивным ожиданием чуда.`,
                    7: `<b>7 дом (Весы) — Дистанцированное партнерство</b><br>Вступая в брак или открытые договоры, человек отказывается от полного равноправия и искренности. Отношения изначально строятся на сокрытии истинных мотивов. Супругу демонстрируется только то, что выгодно показать. Человек живет в состоянии постоянного закрытого тестирования партнера, оставляя пути к отступлению и не снимая до конца свою маску.`,
                    8: `<b>8 дом (Скорпион) — Оцепенение перед трансформацией</b><br>Столкнувшись с реальным жизненным кризисом, экстримом или необходимостью глубокого сексуального и энергетического обмена, личность впадает в панический ступор. Страх перед необратимыми трансформациями заставляет человека прятаться за иллюзиями. В интимной сфере это проявляется как техничное дразнение партнера при полной внутренней замороженности и паническом страхе потерять контроль над ситуацией.`,
                    9: `<b>9 дом (Стрелец) — Первая обитель</b><br><i>Осознанная социальная подготовка.</i> Здесь энергия карты находится в своей идеальной, естественной среде. Человек гениально предвидит варианты будущего и не бросается в действия сломя голову. По Уэйту, это способность трезво оценить ситуацию: он выжидает момент, моделирует возможные сценарии в голове и готов действовать точно и выверенно, когда придет время. По Манаре, это виртуозное управление вниманием партнера: личность дозированно открывает себя, создавая идеальный интригующий образ (выставляет «красивую ногу»), чтобы обеспечить себе надежное социальное будущее и взять ситуацию под контроль, не прибегая к открытой агрессии.`,
                    10: `<b>10 дом (Козерог) — Падение</b><br><i>Крах искусственного имиджа.</i> Сфера объективной социальной реальности, карьеры, статуса и жестких обязательств. Здесь абстрактные ожидания и попытки манипулировать через недосказанность разбиваются вдребезги. Профессиональная государственная система требует конкретных результатов и ответственности, а человек пытается отсидеться «под одеялом» или выставить красивую, но фальшивую картинку-маску (Манара). Это ведет к неминуемому падению статуса, увольнению и жестокому столкновению с реальностью, где иллюзии и бездействие больше не спасают.`,
                    11: `<b>11 дом (Водолей) — Изоляция от коллектива</b><br>В сфере форс-мажоров, друзей, интеллектуальной свободы и непредсказуемого будущего человек испытывает панику перед водолейским хаосом. Вместо того чтобы действовать независимо и холодно, он прячется в раковину своих страхов. Это социальная паранойя, когда личность отгораживается от общества и коллектива иллюзорным фасадом, панически боясь перемен и пассивно ожидая худшего сценария.`,
                    12: `<b>12 дом (Рыбы) — Вторая обитель</b><br><i>Мистическое ожидание чуда.</i> В сфере кармы, тайн и скрытых итогов (где Юпитер выступает вторым управителем) карта проявляется как радикальный уход от реальности. Человек полностью прячется «под одеяло», игнорируя объективные последствия своих действий. Он свято верит, что карма или высшие силы всё решат за него. В отношениях это использование маски (Манара) для создания иллюзорного, мистического образа, за которым скрывается абсолютное нежелание брать на себя ответственность за реальные поступки и слепая надежда на чудесное избавление.`
                }
            },
            60: {
                name: "10 Мечей",
                general: `В астрологической системе Таро Юрия Хана числовые карты-десятки относятся к третьей (социальной) зоне гороскопа, соответствуют десятому дому (знак Козерога) и управляются планетой <b>Сатурн</b>. Они символизируют предел, окончательное столкновение с объективной реальностью и завершение процесса, после которого дальнейшее движение в прежнем виде невозможно. Воздушная масть (мечи) указывает на то, что это абсолютное прекращение конкретных действий.<br><br>Общая трактовка базовой прошивки (или реакции на ситуацию) по 10 мечей (Десятка Воздуха в Таро Манара) синтезирует <b>четыре ключевые версии</b>:<br><b>1. Оправданное прекращение действий (позитив Уэйта):</b> Человек абсолютно правильно останавливается, потому что работа выполнена. Он убирает все внутренние противоречия, «убивает» лишние направления и ставит точку. Это легитимное завершение процесса: «я сделал всё, что мог, до свидания».<br><b>2. Категорический разрыв (синтез Уэйта и Манары):</b> Жесткий и безапелляционный уход. Девиз этой карты: «уходя — уходи». Человек хлопает дверью и резко обрывает все связи, прыгая в «чужой мерседес» и уезжая навсегда.<br><b>3. Проверка партнера через побег (по Манаре):</b> На карте Манары может проигрываться сценарий «умыкания невесты» или потерянной туфельки Золушки. Женщина сбегает или позволяет себя украсть, чтобы протестировать партнера: побежит ли он за ней, захочет ли восстанавливать отношения? Туфелька остается как зацепка для 12-го дома (кармы), оставляя шанс на возобновление.<br><b>4. Сломленность и социальный крах (негатив Уэйта):</b> Человек полностью сломлен системой и обстоятельствами. Это «сломленный Водолей», который отказывается от любой индивидуальности, ложится на землю (пригвожденный мечами) и абсолютно пассивно принимает удары судьбы. Его буквально выбрасывают на берег жизни за ненадобностью.<br>Поскольку десятки подчиняются Сатурну, их особые положения строго распределены по астрологическим достоинствам этой планеты в Зодиаке.`,
                houses: {
                    1: `<b>1 дом (Овен) — Падение</b><br><i></i> Зона базовой марсианской инициативы, старта и животной энергетики, где Сатурн падает. Полный паралич воли прямо на старте. Вместо того чтобы проявить инициативу в новых отношениях или делах, человек заранее чувствует себя убитым и раздавленным. Его базовая энергетика обнуляется страхом перед ответственностью: он отказывается делать первый шаг, ложась на землю и позволяя партнеру или обстоятельствам делать с ним всё что угодно, лишь бы не действовать самому.`,
                    2: `<b>2 дом (Телец) — Материальный тупик</b><br><i></i> В сфере финансов, тела и ресурсов человек ставит жесткую границу. Это категорический отказ продолжать финансовые вливания или физиологический контакт. Личность обрубает доступ к своим ресурсам, прыгает в «чужой мерседес» или фиксирует убытки, понимая, что материальная база отношений полностью исчерпана и дальнейший энергообмен невозможен.`,
                    3: `<b>3 дом (Близнецы) — Обрыв коммуникации</b><br><i></i> В повседневных контактах, переписках и рутинном общении наступает холодный финал. Человек отказывается объяснять свои поступки, прекращает звонить и писать. Это прекращение любых информационных потоков и бытовых связей. Диалог закончен жестко и без возможности на апелляцию.`,
                    4: `<b>4 дом (Рак) — Первое изгнание</b><br><i></i> Сфера базовой безопасности, семьи и релакса. Суровый Сатурн здесь изгоняется. Остановка действий происходит не потому, что дело завершено, а по глубоко личным, физиологическим или психологическим причинам. Это вынужденный обрыв активности: человек «падает замертво» от усталости, болезни (ушел на больничный) или нервного срыва. Мир требует работы, но организм физически блокирует любые дальнейшие поступки, заставляя человека уйти в глухую изоляцию.`,
                    5: `<b>5 дом (Лев) — Второе изгнание</b><br><i></i> Сфера чистого эгоизма, радости, любви и творчества. Здесь 10 мечей уничтожает любую спонтанность. Человек категорически запрещает себе радоваться, флиртовать или проявлять индивидуальность. Столкнувшись с влюбленностью или праздником, он ведет себя как глубокий старец, холодно обрубая все творческие и романтические порывы, оправдывая это надуманной «ответственностью» и намертво блокируя своего внутреннего ребенка.`,
